# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/deny-subagent-vantan.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears
# unused") slår som falskt positiv. Disable är fil-nivå och avsiktlig — samma
# form som .mail-lock-policy.conf, .grind-exitkod-policy.conf,
# .heartbeat-svep-policy.conf, .ci-wait-policy.conf,
# .staging-semaphore-policy.conf, .checklist-policy.conf,
# .frontmatter-policy.conf och .lesson-policy.conf (Lesson #6, UNIVERSAL).

# .subagent-vantan-policy.conf
#
# Per-projekt config för scripts/deny-subagent-vantan.sh (TASK-148.2,
# ADR-096 § Beslut del 2 — "PreToolUse-spärren"). Skriptets LOGIK är
# universell (kan duplicera till andra spokes utan refactor); VÄRDENA här —
# vilka verktyg som nekas ovillkorligt i subagent-kontext, och vilka som bara
# nekas när deras `run_in_background`-fält är satt — är den delen som är
# öppen för framtida justering utan att skriptet rörs.
#
# VARFÖR FILEN FINNS: ADR-096 mekaniserar väntekontraktet ("en subagents jobb
# är att GÖRA, aldrig att VÄNTA") med samma medel Anthropic redan valt för
# fyra av fem async-vägar — strukturellt borttaget verktyg. `Monitor` är den
# enda vägen förstaparten lämnat kvar i subagentens verktygslista trots att
# dess leveranslöfte är mätt trasigt för subagent-kontext (L340). Se
# docs/decisions/ADR-096-subagentens-vantekontrakt.md § Beslut del 2 för hela
# resonemanget och docs/research/subagent-parkering-handoff-kontrakt-2026-08-05.md
# § 5 för mekaniseringsunderlaget.

# === Verktyg som NEKAS OVILLKORLIGT när agent_id är satt (subagent-kontext) ===
# Ingen ytterligare prövning görs — matchande tool_name i subagent-kontext
# nekas alltid, oavsett tool_input. Detta är den strukturella spärren för
# Monitor: dess callback levereras aldrig till en subagent (L340, mätt), så
# det finns inget legitimt fall att undanta.
SUBAGENT_VANTAN_ALLTID=(
    "Monitor"
)

# === Verktyg som NEKAS ENDAST när tool_input.run_in_background === true ===
# Subagentens VANLIGA synkrona anrop av dessa verktyg ska ALDRIG träffas —
# bara den explicita bakgrunds-formen, som skickar anropet ner i exakt samma
# väckningslösa hål som Monitor. Huvudsessionens (agent_id ej satt) egna
# bakgrundsmönster påverkas inte alls av denna hook — se § agent_id-kontrollet
# i scripts/deny-subagent-vantan.sh.
SUBAGENT_VANTAN_BAKGRUND=(
    "Bash"
)
