# shellcheck disable=SC2034
# Variables in this file are sourced and consumed by external
# scripts (scripts/check-*.sh). shellcheck cannot trace cross-file
# variable usage, so SC2034 ("appears unused") triggers as false
# positive. Disable is file-level and intentional.

# .checklist-policy.conf
#
# Per-projekt config för scripts/check-public-checklists.sh.
# Skriptets LOGIK är universell (kan duplicera till andra spokes utan
# refactor); värden här är PROJEKT-SPECIFIKA.
#
# Hubliftad-design: vid Session 6.7 lyfts skriptet till
# ~/Repon/marcus-system/ (eller claude-skills/). Denna config-fil
# förblir per-spoke. Spokes refererar då hub-skriptet via symlink/PATH.
#
# === Duplicera till nytt spoke (4 steg) ===
# 1. cp scripts/check-public-checklists.sh + denna fil till nytt repo
# 2. Anpassa CHECKLIST_FILES_PLAIN nedan till nytt repos publika docs
# 3. Anpassa CHECKLIST_FILE_WITH_EXCLUSION om annan fil har legitim
#    mall-zon (typ "## Definition of Done"-sektion)
# 4. CI-step finns redan i .github/workflows/ci.yml — ingen extra
#    konfiguration krävs (skriptet behåller samma anrop-signatur som
#    pre-refactor: `bash scripts/check-public-checklists.sh`)
#
# Källa: docs/decisions/ADR-030-docs-grindvakter-frontmatter-policy.md
#        § Del 1 position #5 (K5 scripted-checklist-check)
#        Retroaktiv config-driven-refactor: Session 6.6 fortsättning #2 K7.5
#        K7 Lesson #6 (UNIVERSAL): hub-spoke-portabilitet är default

# === Vita listan — publika docs som måste vara grön ===
# Exakt-path-match, INTE glob. Path relativt repo-root.
CHECKLIST_FILES_PLAIN=(
    "README.md"
    "CHANGELOG.md"
    "SECURITY.md"
    "docs/byggplan.md"
    "docs/specs/BYGGPLAN-LÄTTLÄST-v3.md"
)

# === Fil med sektion-baserad exklusion ===
# CONTRIBUTING.md har `## Definition of Done — per session` +
# `## Definition of Done — per fas`. Skriptets awk-pattern triggar
# skip=1 vid `^## Definition of Done`-rubrik och skip=0 vid nästa `^## `.
CHECKLIST_FILE_WITH_EXCLUSION="CONTRIBUTING.md"
