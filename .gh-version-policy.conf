# shellcheck shell=bash
# shellcheck disable=SC2034
# Variabeln här sourcas och konsumeras av scripts/lib/gh-guard.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears
# unused") slår som falskt positiv. Disable är fil-nivå och avsiktlig —
# samma form som .prod-ref-policy.conf, .supabase-cli-policy.conf,
# .jq-version-policy.conf m.fl. (Lesson #6, UNIVERSAL).

# .gh-version-policy.conf
#
# Per-projekt config för scripts/lib/gh-guard.sh. Skriptets LOGIK är
# universell (kan dupliceras till andra spokes utan refactor); VÄRDET här —
# den lägsta gh-version landningsvägen kräver — är projektspecifikt data.
# Samma konvention som .jq-version-policy.conf (TASK-312, 2026-08-24).
#
# === Duplicera till nytt spoke (2 steg) ===
# 1. cp scripts/lib/gh-guard.sh + denna fil till nytt repo
# 2. Sätt GH_MIN_VERSION till den lägsta version det nya repot vill kräva
#
# === VARFÖR MINIMIVERSION OCH INTE EXAKT PIN ===
#
# gh är, precis som jq, en SYSTEMBINÄR vi inte äger installationsvägen
# för: Homebrew på Marcus maskin, ubuntu-latest-runnerns förinstallerade
# paket i CI (`gh` ingår i actions/runner-images standardavbildning). Ett
# EXAKT-pin hade fällt varje miljö vars paketkälla ligger en patch-version
# före/efter utan att det faktiskt är ett problem. En MINIMIVERSION fångar
# den verkliga risken (en ANTIK gh vars merge-queue-hantering eller
# `--jq`-stöd skiljer sig från vad landningsvägen förutsätter) utan att bli
# en spränggrop för legitima patch-skillnader.
#
# === VARFÖR DENNA VERSION SOM FLOOR ===
#
# CLAUDE.md § Landning dokumenterar landningsvägens beroende av en
# SPECIFIK, modern gh-generation: merge-queue-medveten `gh pr merge --auto`
# (avvisar `--merge`/`--squash`/`--rebase` med "The merge strategy for
# main is set by the merge queue"), `isInMergeQueue`-medveten klassning,
# och `--jq`-flaggans inbyggda gojq-motor (scripts/ci-metrics.mjs,
# scripts/classify-post-merge.sh). Floor satt till den lokalt verifierade
# fungerande versionen (`gh --version`, 2026-08-24) MINUS två minor-steg,
# för att ge patch-/minor-tolerans utan att riskera en version FÖRE den
# merge-queue-medvetna omskrivningen.
#
# === HUR MAN UPPGRADERAR ===
#
# 1. Bumpa GH_MIN_VERSION nedan.
# 2. Kör bash scripts/test-gh-guard.sh.
# 3. Verifiera att `gh --version` på Marcus maskin ligger på eller över det
#    nya talet innan push.

GH_MIN_VERSION="2.94.0"
