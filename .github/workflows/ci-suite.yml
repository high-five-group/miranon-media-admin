---
name: CI Suite (reusable)

# Reusable tung testsvit (task-36.2 / T85 våg 2a, ADR-077). EN KÄLLA för de
# fyra tunga jobben — anropad av både ci.yml (presubmit, villkorat på
# should_skip_tests) och nightly.yml (schemalagd fullsvit). Extraherad ur
# ci.yml S79 (verbatim steg); villkoren flyttade: caller-jobbet i ci.yml
# gatar HELA anropet på should_skip_tests, så inner-jobben bär ENDAST sina
# dependabot-/purge-villkor. github.actor-uttrycket fungerar i båda
# kontexterna (schedule/dispatch är aldrig dependabot).
#
# INGA fetch-depth-bärare bor här: de tre bärarna (changed/lint/docs) stannar
# i ci.yml — fetch-depth-invarianten (ADR-039/054, scripts/check-fetch-depth-
# invariant.sh läser ci.yml, EXPECTED_CI_CARRIERS=3) förblir ORÖRD. Lägg
# ALDRIG en fetch-depth-rad i detta jobb utan att uppdatera invarianten.
#
# secrets: inherit hos anroparen → staging-secrets når test-staging/purge/a11y
# direkt (bevisat via reusable-spike 2026-07-23, run 30036119790).

on:
  workflow_call:

permissions: {}

jobs:
  # Staging sentinel purge — setup-purge FÖRE staging-stegen (ADR-060 punkt
  # 3–4, wirad via TASK-16): sentinel-rader äldre än ålders-guarden raderas ur
  # staging-basen INNAN staging-jobbet skapar nya. EGET jobb = egen runner-VM
  # med EGEN secret (EF-only-gränsen, ADR-060 punkt 2+4).
  purge:
    name: Staging sentinel purge
    # Dependabot-skip på JOBB-nivå (ADR-031 Lager 3 — Dependabot-runs saknar
    # Actions-secrets och rör aldrig staging). Docs-only-skippet bärs numera
    # av caller-gaten (ci.yml suite-jobbets if: should_skip_tests != 'true').
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Medvetet UTAN fetch-depth-config: jobbet kör enbart purge-skriptet +
        # policy-filen och behöver ingen git-historik. Utanför fetch-depth-
        # bärar-mängden by design (ADR-039).

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'

      # Ålders-guarden (60 min, .purge-staging-policy.json) skyddar in-flight-
      # körningar — därför behöver jobbet INTE staging-tests-mutexen.
      # STAGING_AIRTABLE_TOKEN = least-privilege-PAT scopad till ENBART
      # staging-basen (data.records:read+write) — kan aldrig röra prod.
      - name: Purge staging sentinels
        run: node scripts/purge-staging-sentinels.mjs
        env:
          STAGING_AIRTABLE_TOKEN: ${{ secrets.STAGING_AIRTABLE_TOKEN }}

  # Pure + Build — mutex-fritt, kör även för dependabot (dep-bump-regression
  # fångas här via pure-tests + build). Split ur gamla Test+Build (S77 våg 1).
  test-fast:
    name: Pure + Build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Medvetet UTAN fetch-depth-config — inga historik-beroende skript.

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: API tests (pure)
        run: npm run test:api:pure

      - name: Build
        run: npm run build

  # A11y (axe-runner) — rör ALDRIG staging (egen alltid-färsk dev-server på
  # dedikerad port, ADR-045 beslut 1+3) → ingen mutex. Dependabot-skip på
  # JOBB-nivå (ADR-031 Lager 3, secrets-isolation).
  a11y:
    name: A11y (axe-runner)
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Medvetet UTAN fetch-depth-config — utanför bärar-mängden (ADR-039).

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache Playwright browsers (~150MB) per ADR-029 §1c. Samma nyckel som
      # test-staging — först färdiga jobbet värmer, det andra hit:ar.
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        id: playwright-cache-a11y
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # A11y-runner per ADR-045 beslut 1+3: PLAYWRIGHT_TEST_BASE_URL lämnas
      # OSATT så webServer-blocket i playwright.config.ts startar Vite dev-
      # servern — /dev/primitives är DEV-guardad (ADR-044).
      - name: A11y tests (axe-runner)
        run: npm run test:a11y
        env:
          VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}

  # Staging (API + E2E) — bär EN staging-miljö. Mutexen staging-tests
  # serialiserar över ALLA staging-rörande runs (PR ∥ PR, PR ∥ main-push OCH
  # PR ∥ nightly): concurrency-gruppen är en global sträng oavsett vilken
  # anropare som instansierar jobbet (reusable-nesting påverkar inte scopet;
  # bevisat via spike 2026-07-23). queue: max köar väntande FIFO;
  # cancel-in-progress medvetet OSATT (krav för queue: max).
  test-staging:
    name: Staging (API + E2E)
    # needs purge: setup-purgen (ADR-060 punkt 3–4) ska ha kört FÖRE staging-
    # stegen. Villkoret tolererar 'skipped' (dependabot) men INTE 'failure'.
    needs: [purge]
    if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && (needs.purge.result == 'success' || needs.purge.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    concurrency:
      group: staging-tests
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Medvetet UTAN fetch-depth-config — utanför bärar-mängden (ADR-039).

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # ADR-031 Lager 3 (Alt D Hybrid): staging kräver Actions-secrets som
      # Dependabot-workflows saknar — därav jobb-nivå-skippet ovan.
      - name: API tests (staging)
        run: npm run test:api:staging
        env:
          STAGING_REQUIRED: '1'
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_REGISTRATION_RECORD_ID: ${{ secrets.TEST_REGISTRATION_RECORD_ID }}

      - name: E2E tests (staging)
        run: npm run test:e2e:staging
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}

      # Playwright-artefakter vid RÖTT e2e-steg (trace/screenshot/video).
      # global-teardown.ts har redan purgat klartext-lösenord ur
      # error-context.md (ADR-061 pelare 3, T29) innan uppladdningen.
      - name: Ladda upp Playwright-artefakter vid rött e2e
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artefakter
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
