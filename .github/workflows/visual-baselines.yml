---
name: Visual baselines

# Baseline-födseln (task-36.7 AC 1–3): referensbilderna genereras i SAMMA
# miljö de jämförs i (ubuntu-linux — en Mac-bild matchar aldrig en linux-
# jämförelse) och landar ALLTID som en granskningsbar PR, aldrig en tyst
# uppdatering. Avfyras riktat (workflow_dispatch) — vid första födseln och
# därefter enligt kadens-regeln (CONTRIBUTING § Visuell regression):
# medveten browser-/verktygsuppgradering ⇒ förväntad drift ⇒ baseline-PR
# granskad IHOP med uppgraderingen.
#
# PR:n skapas med GITHUB_TOKEN — dess CI hamnar då i approval-required-läge
# och merge-boxen visar "Approve workflows to run" (GitHub Docs: GITHUB_TOKEN
# skapar pull_request-runs i approval-required state). Det klicket är INTE en
# brist utan GRANSKNINGSGRINDEN: samma människa som godkänner bilderna
# släpper CI:n. Medvetet INGEN PAT/GitHub App — noll nya secrets, noll
# rotationsyta (designtrail: sessionsdok S81 Del 3; verifierad mot
# förstapartsdok 2026-07-24).
#
# FÖRUTSÄTTNING: "Allow GitHub Actions to create and approve pull requests"
# måste vara PÅ (API: actions/permissions/workflow,
# can_approve_pull_request_reviews). Utan den failar gh pr create med
# "GitHub Actions is not permitted to create or approve pull requests"
# (empiriskt: run 30079692827 S81, run 30292488425 S91).
#
# ⚠️ DEN ÄR INTE EN REPO-INSTÄLLNING — det stod här tidigare och var fel.
# Flaggan är en TRE-NIVÅERS KEDJA: enterprise → org → repo, där varje nivå
# ärver nedåt och en restriktiv nivå LÅSER de lägre. Är den av högre upp är
# repots kryssruta mutad i UI:t, och ett PUT mot org-nivån avvisas med
# 409 Conflict: "The enterprise does not allow GitHub Actions to approve
# pull requests". Mätt 2026-07-27 (S91) — inte tolkat.
#
# Sätts alltså UPPIFRÅN OCH NED, med verifiering mellan varje steg:
#   gh api -X PUT enterprises/<slug>/actions/permissions/workflow \
#     -F default_workflow_permissions=read -F can_approve_pull_request_reviews=true
#   gh api -X PUT orgs/<org>/actions/permissions/workflow   (samma fält)
#   repo ärver automatiskt — verifiera, sätt inte
# Läsning kräver admin:org, skrivning på enterprise-nivå admin:enterprise.
#
# VARFÖR DEN VAR AV: repot flyttades till org på Enterprise 2026-07-27
# 11:15:43Z. Dispatchen gick grönt 2026-07-24 när repot var personligt ägt;
# efter flytten ärvde det enterprise-defaulten false. Klassen är samma som
# ägarbytets övriga städning (S91 Del 9.8) — den här posten missades där.
#
# default_workflow_permissions hålls kvar på read — approve-halvan är
# verkningslös här (ruleset main-skydd kräver 0 approvals).
#
# ── RIKTAD KÖRNING (TASK-298, 2026-08-22) ────────────────────────────────
# Workflowen var allt-eller-inget: hela sviten kördes med --update-snapshots
# och steget failar hårt, så EN familjs röda test blockerade hela födseln.
# Mätt i run 32587783890: 238 passed, 8 failed — samtliga åtta i
# hem-familjen — och därmed skapades ingen PR alls, så notisfamiljens och
# personlistans baslinjer kunde inte födas.
#
# Den valfria inputen `specfilter` ger en riktad väg ut. Tre egenskaper bär
# den, och alla tre är grindade av scripts/test-visual-baselines-scope.sh:
#
#   1. DEFAULT ÄR OFÖRÄNDRAT. Tom input kör byte-identiskt kommando och ger
#      byte-identisk PR-titel som före TASK-298. Riktad körning är ett
#      medvetet undantag, aldrig normalvägen.
#   2. SCOPET SYNS FÖR GRANSKAREN. En riktad körning märks i grennamnet, i
#      PR-titeln OCH i PR-kroppen, där filtret och de faktiskt körda
#      spec-sökvägarna skrivs ut. En baseline-PR med en delmängd får aldrig
#      kunna läsas som en fullständig födsel — det är hela skillnaden mellan
#      ett verktyg och en fälla.
#   3. FAIL-CLOSED. scripts/visual-baselines-scope.sh prövar inputen och
#      löser upp den mot Playwrights egen fil-lista FÖRE bildgenereringen.
#      Skräp-input, ledande bindestreck, radbrytning, överlängd eller noll
#      matchande specar dödar jobbet där — aldrig en tom PR, aldrig en tyst
#      full körning.
#
# GRANSKNINGSGRINDEN ÄR ORÖRD: samma GITHUB_TOKEN, samma permissions-block,
# samma approval-required-läge. Inputen är dessutom RÅ exakt en gång — i
# scope-stegets env: — och varje steg därefter läser det VALIDERADE värdet
# ur steps.scope.outputs. Ingen ${{ }}-interpolation i något run-block.

on:
  workflow_dispatch:
    inputs:
      specfilter:
        description: >-
          Valfritt. Regex mot spec-SÖKVÄGEN (Playwrights positionsfilter),
          t.ex. personer-promoverings-grind eller notis-visual|personer.
          LÄMNA TOMT för hela sviten — det är normalvägen. En riktad körning
          märks tydligt i PR:ens titel och kropp.
        required: false
        default: ''
        type: string

permissions: {}

# En baseline-födsel åt gången — parallella dispatcher skulle öppna
# konkurrerande PR:er mot samma bilder.
concurrency:
  group: visual-baselines
  cancel-in-progress: false

jobs:
  generate:
    name: Generera linux-baselines + öppna baseline-PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        # SHA-pin: se ci.yml:s FÖRSTA Checkout-steg (jobbet `changed`) för
        # hela rationalen (TASK-312, 2026-08-24).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # Medvetet UTAN fetch-depth-config — utanför bärar-mängden (ADR-039).

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # FAIL-CLOSED-GRINDEN. Ligger MEDVETET före browser-installationen:
      # `playwright test --list` startar varken webbserver eller webbläsare
      # (mätt 2026-08-22 — exit 0 med PLAYWRIGHT_BROWSERS_PATH mot en tom
      # katalog), så skräp-input dör innan jobbets dyra halva börjar.
      # Detta är den ENDA plats där den råa inputen når ett skal, och den
      # når det som en env-variabel — aldrig via ${{ }} i ett run-block.
      - name: Avgränsa körningens scope (fail-closed)
        id: scope
        env:
          VISUAL_SPECFILTER: ${{ inputs.specfilter }}
        run: bash scripts/visual-baselines-scope.sh

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: playwright-cache-baselines
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # --update-snapshots (preset "changed") skriver om varje baseline vars
      # faktiska rendering avviker och föder saknade — exit 0 även vid
      # omskrivning (födsel-läget, aldrig grind-läget).
      # Filtret läses ur scope-stegets VALIDERADE utdata, aldrig ur inputen
      # igen — det som passerar hit har redan lösts upp mot en verklig spec.
      # Den tomma grenen är byte-identisk med kommandot som kördes före
      # TASK-298 och grindas som invariant av testsviten.
      #
      # FILTRET STÅR FÖRE FLAGGAN, OCH DET ÄR INTE KOSMETIK. `-u,
      # --update-snapshots [mode]` tar ett VALFRITT argument, så formen
      # `--update-snapshots "${FILTER}"` läser filtret som LÄGE och dör:
      #   error: option '-u, --update-snapshots [mode]' argument
      #   'personer-promoverings-grind' is invalid. Allowed choices are
      #   all, changed, missing, none.
      # Mätt skarpt i run 32590344458 (2026-08-22) — första riktade
      # dispatchen föll på exakt detta. Med filtret före flaggan står
      # --update-snapshots sist utan efterföljande token och behåller sitt
      # preset ("changed", per `playwright test --help`), vilket gör att
      # BÅDA grenarna använder flaggan i identisk bar form — läget kan
      # därmed inte drifta isär mellan normalvägen och den riktade vägen.
      # Ordningen grindas som invariant av testsviten.
      - name: Generera baselines i linux-miljön
        env:
          FILTER: ${{ steps.scope.outputs.filter }}
        run: |
          set -euo pipefail
          if [[ -z "${FILTER}" ]]; then
            npm run test:visual -- --update-snapshots
          else
            npm run test:visual -- "${FILTER}" --update-snapshots
          fi

      - name: Öppna baseline-PR om bilderna ändrats
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SCOPE: ${{ steps.scope.outputs.scope }}
          FILTER: ${{ steps.scope.outputs.filter }}
          ANTAL_TESTER: ${{ steps.scope.outputs.antal_tester }}
          SPECFILER: ${{ steps.scope.outputs.specfiler }}
        run: |
          set -euo pipefail
          # -uall: porcelain kollapsar annars en helt ospårad katalog till EN
          # rad → fel bildantal i PR-titeln (empiriskt: PR-titeln "1 bilder"
          # vid 12 födda bilder, run 30079805732).
          if git status --porcelain -uall -- tests/visual/__screenshots__ | grep -q .; then
            antal=$(git status --porcelain -uall -- tests/visual/__screenshots__ | wc -l | tr -d ' ')
            # SCOPET SYNS PÅ TRE STÄLLEN — grennamn, titel och kropp. En
            # baseline-PR som bär en delmängd får aldrig kunna läsas som en
            # fullständig födsel; frånvaron av en markör är en för svag
            # signal (den kan lika gärna betyda gammal workflow-version), så
            # BÅDA lägena skriver ut sin omfattning positivt.
            if [[ "${SCOPE}" = "riktad" ]]; then
              # De enkla citaten nedan bär MARKDOWN till PR-kroppen — de
              # bakåtcitaten ska förbli literaler, inte kommandosubstitution.
              # shellcheck disable=SC2016
              speclista=$(printf '%s\n' "${SPECFILER}" | sed 's|^|- `|; s|$|`|')
              gren="visual-baselines/riktad-run-${RUN_ID}"
              titel="test(visual): RIKTAD baseline-uppdatering ur CI (${antal} bilder — filter: ${FILTER})"
              # shellcheck disable=SC2016
              omfattning=$(printf '**OMFATTNING: RIKTAD KÖRNING — EN DELMÄNGD, INTE EN FULLSTÄNDIG BASELINE-FÖDSEL.**\n\nDispatchen kördes med filtret `%s`, och ENDAST dessa specar kördes (%s matchande tester):\n\n%s\n\nVarje baslinje UTANFÖR listan ovan är ORÖRD av denna körning. Att en vy saknas i diffen betyder alltså INTE att den är oförändrad — den kördes aldrig. Läs diffen som en delmängd.' "${FILTER}" "${ANTAL_TESTER}" "${speclista}")
            else
              gren="visual-baselines/run-${RUN_ID}"
              titel="test(visual): baseline-uppdatering ur CI (${antal} bilder)"
              omfattning='**OMFATTNING: HELA visual-sviten** — dispatchen kördes utan filter-input. Detta är en fullständig baseline-födsel.'
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "${gren}"
            git add tests/visual/__screenshots__
            git commit -m "test(visual): baseline-uppdatering ur CI (run ${RUN_ID})"
            git push origin "${gren}"
            # gh — MEDVETET OPINNAD (TASK-312, 2026-08-24): GitHub-hostad
            # runner, gh förinstallerat/versionshanterat av GitHub självt.
            # Se scripts/lib/gh-guard.sh § SCOPE.
            gh pr create \
              --title "${titel}" \
              --body "$(printf 'CI-födda linux-baselines från visual-baselines-run %s (%s ändrade/nya bilder).\n\n%s\n\nGRANSKNINGSPLIKT: varje bild i diffen definierar vad som hädanefter anses KORREKT — granska att vyerna ser ut som de SKA innan merge. CI:n på denna PR står i approval-required-läge (Approve workflows to run) tills en granskare släpper den; det är avsiktligt — samma blick som godkänner bilderna släpper grinden.' "${RUN_ID}" "${antal}" "${omfattning}")"
            echo "Baseline-PR öppnad (${antal} bilder, scope ${SCOPE}) — granska och godkänn."
          else
            echo "Inga baseline-ändringar (scope ${SCOPE}) — renderingen matchar incheckade bilder."
          fi
