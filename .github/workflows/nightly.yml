---
name: Nightly

# Nattnätet (task-36.2 / T85 våg 2a, ADR-077): post-submit-nätet som gör
# presubmit-selektionen (D1/dedup, task-36.3/36.4) försvarbar. Kör hela
# repot i full bredd när kön är tom och mutexen fri — allt som dagens
# selektion hoppade över prövas senast inom ett dygn. Rött ⇒ automatiskt,
# tilldelat ärende (kyrkogårds-motgift: CONTRIBUTING § Nattnätet — stängs
# aldrig tyst).

on:
  schedule:
    # 03:00 Europe/Stockholm året om (T85-korrigeringspaketet punkt 5, S88).
    # Den tidigare kommentaren påstod att "GitHub-cron saknar tidszon" — det
    # är falskt sedan 2026-03-19, då schedule-timezone blev GA. Verifierat mot
    # github/docs och mot vår PINNADE actionlint 1.7.12, som validerar nyckeln
    # (stödet kom i just den versionen; ingen -ignore behövs).
    #
    # 03:00 är valt, inte godtyckligt: docs anger att en tid i DST-luckan
    # skjuts fram till nästa giltiga tid (02:30 → 03:00) vid vår-omställningen.
    # 03:00 hamnar aldrig i luckan, så klockslaget står stilla året om.
    #
    # ÄRLIG BEGRÄNSNING: timezone styr när körningen SCHEMALÄGGS, inte när den
    # startar. Uppmätt eftersläp i repot är stort — de två faktiska
    # schedule-runsen startade 03:56 och 04:00 UTC mot cron 01:00 UTC, alltså
    # ~3 h. GitHub-schemat är best-effort och kan tappa köade jobb helt. Vakter
    # som mäter "kom natten igång?" måste därför ha marginal mot uppmätt drift,
    # inte mot nominell cron.
    - cron: '0 3 * * *'
      timezone: 'Europe/Stockholm'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: >-
          true = tvinga larm-jobbet att fyra även om sviten är grön (bevisar
          larmkedjan utan en äkta röd natt; städa test-ärendet med motivering).
        type: boolean
        default: false

# Least-privilege default (ADR-029 §4); larm-jobbet höjer själv till issues:write.
permissions: {}

# En nattkörning avbryts aldrig mitt i (cancel-in-progress OSATT).
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Full tung svit via EN KÄLLA (delad med ci.yml). Ovillkorat: natten kör
  # allt (github.actor = schemaläggaren, aldrig dependabot → inner-skippen
  # biter inte). Staging-jobbet tar den delade staging-tests-mutexen.
  suite:
    name: Nattlig fullsvit
    # Permissions-taket för ci-suite.yml — ett anropat workflow kan bara behålla
    # eller minska, aldrig eskalera (samma regel som ci.yml:s suite-jobb). Utan
    # detta grant ärver suite nightly:s topp-nivå permissions: {} och ci-suite:s
    # contents: read blir en eskalering ⇒ startup_failure. Andra anroparen —
    # missad i ci.yml-fixen, fångad av nightly-dispatchen (run 30038460735).
    permissions:
      contents: read
    uses: ./.github/workflows/ci-suite.yml
    secrets: inherit

  # Bredare sårbarhetsgranskning än dagsvitens (daglig: audit-ci.jsonc high:true).
  # Natten sänker tröskeln till moderate → fångar advisories som dagsviten
  # medvetet släpper förbi, vid en tidpunkt då ingen väntar på svaret.
  nightly-audit:
    name: Bredare sårbarhetsgranskning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        # SHA-pin: se ci.yml:s FÖRSTA Checkout-steg (jobbet `changed`) för
        # hela rationalen (TASK-312, 2026-08-24) — gäller identiskt för
        # varje actions/checkout · actions/setup-node-anropsställe i denna
        # fil.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (moderate — bredare än dagsvitens high)
        run: npx audit-ci --moderate

  # Länkkontroll UTAN cache, över BÅDE intern och extern yta — natten kör kall
  # för att fånga länk-röta som en varm cache skulle dölja.
  #
  # ═══ ADR-082 (2026-07-28): DENNA HALVA ÄR DEN ENDA SOM SER EXTERNA LÄNKAR ═══
  # ci.yml:s docs-jobb kör sedan dess med --offline och kontrollerar bara intern
  # yta. Scopen är därmed AVSIKTLIGT INTE längre identiska — det är hela poängen
  # med uppdelningen, inte en drift att konsolidera bort. En framtida
  # lychee-konfigfil skulle dölja precis den skillnaden (YAGNI kvarstår).
  #
  # Jobbet står MEDVETET UTANFÖR alarm.needs och har en egen, mildare kanal
  # (links-arende nedan). Skälet: nattärendet är tilldelat och ska betyda "något
  # är akut fel"; en extern värds dåliga dag hör inte dit. Att bara ta ut jobbet
  # utan kanal vore fail-open — L321/L322-klassen — därav den egna kanalen.
  # ═══ TIMEOUT-BUDGETEN ÄR MEDVETET PÅ STEG-NIVÅ, INTE JOBB-NIVÅ ═══
  # (mätt 2026-08-05, run 30877269209): en jobb-nivå-timeout gav jobbet
  # conclusion "cancelled" mitt i lychees retry-backoff (steget "Run lychee
  # link check" löpte 04:18:11→04:23:20, ~5 min 9 s). `cancelled` missar
  # BÅDA kanalerna: `links-arende` nedan kräver `result == 'failure'` och
  # skippades tyst (ärende #464 fick ingen kommentar den natten), och det
  # bredare nattlarmet (`alarm` längre ned) fyrade förvisso — det räknar
  # redan `cancelled` — men dess body (#681) nämnde varken "länk", "lychee"
  # eller "cancelled".
  #
  # Källa till klassningen (förstaparts, båda styckena verifierade
  # 2026-08-05):
  #   - `jobs.<job_id>.timeout-minutes`: "the maximum number of minutes to
  #     let a job run before GitHub automatically CANCELS it"
  #     (github/docs, workflow-syntax.md).
  #   - `jobs.<job_id>.steps[*].timeout-minutes`: "the maximum number of
  #     minutes to run the step before killing the process" — inget "cancel"
  #     i steg-varianten. Bekräftat i runner-källkoden
  #     (actions/runner, Runner.Worker/StepsRunner.cs, RunStepAsync): när
  #     STEGETS EGNA cancellation-token löser ut utan att JOBBETS gör det
  #     sätts `step.ExecutionContext.Result = TaskResult.Failed` — bara när
  #     jobbets egna token (jobb-timeout ELLER en manuell avbrytning) är
  #     inblandat blir resultatet `TaskResult.Canceled`. Reproducerat live på
  #     detta repots runners (T146-scratch-testet, samma push som denna
  #     commit initialt bar, borttaget innan PR): en jobb-nivå-timeout gav
  #     `cancelled`, en steg-nivå-timeout på samma sömn gav `failure` — och
  #     avslutade dessutom EFTER stegets kortare budget, inte jobbets längre.
  #
  # Flytten ändrar alltså UTGÅNGENS KLASS (cancelled → failure) för det
  # vanliga fallet (extern retry-backoff drar ut på tiden), utan att bredda
  # något larmvillkor — båda kanalerna lyssnar redan på `failure`. En GENUIN
  # manuell avbrytning av hela körningen förblir `cancelled` (jobbets egna
  # cancellation-token löser då ut), och `links-arende` förblir tyst om den
  # — korrekt, det var aldrig en länk som gick sönder. Jobb-nivåns
  # `timeout-minutes` nedan är kvar som BACKSTOP mot en genuint hängande
  # runner/checkout, inte den aktiva budgeten.
  nightly-links:
    name: Länkkontroll (utan cache)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Run lychee link check (no cache)
        # SHA-pin per ADR-029 §6 — samma pin som ci.yml docs-jobbet.
        # timeout-minutes HÄR (steg-nivå) är den aktiva budgeten — se
        # kommentarblocket ovan jobbet för varför. 5 min = samma budget
        # jobbet bar tidigare; checkout ovan tar sekunder, så flytten
        # kostar ingen väggklocka i det normala (gröna) fallet.
        timeout-minutes: 5
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          # --accept-timeouts (ADR-082 beslut 2): lychee för timeouts i en EGEN
          # karta, men lyckat-villkoret krävde att både error_map OCH timeout_map
          # var tomma — därav det förvirrande "🚫 Errors 0" på en körning som ändå
          # föll med exit 2 (ADR-081:s PR). Flaggan (lychee PR #2063, merged
          # 2026-03-04) byter till is_success_ignoring_timeouts. Den stänger INTE
          # av grinden: mätt ger enbart-timeout exit 0, men timeout PLUS ett äkta
          # trasigt mål ger fortfarande exit 2. Timeout degraderas till rapport,
          # allt annat hålls kvar.
          args: >-
            --accept-timeouts
            --no-progress
            --verbose
            --header "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
            --exclude-path docs/archive
            --exclude-path docs/reference/pocock
            './docs/**/*.md'
            './tasks/*.md'
            './tasks/sessions/*.md'
            './tasks/threads/*.md'
            './*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # Länkrötans egen kanal (ADR-082 beslut 4). Fyrar ENDAST när nightly-links är
  # röd, och håller ETT stående ärende i stället för ett nytt per natt — en död
  # extern länk som står i en vecka ska ge ett ärende, inte sju. Det är precis
  # den skillnaden som avgör om kanalen läses eller filtreras bort.
  #
  # Byggd på repots BEFINTLIGA gh issue-mönster (se alarm nedan), inte på en ny
  # third-party Action. Lychees dokumenterade mönster använder
  # peter-evans/create-issue-from-file, men det vore en ny supply-chain-yta att
  # SHA-pinna och bevaka under ADR-029 §6 för en förmåga vi redan har i huset.
  links-arende:
    name: Länkröta — stående ärende
    needs: [nightly-links]
    if: ${{ always() && needs.nightly-links.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - name: Skapa eller uppdatera det stående länkröte-ärendet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run_url="${SERVER}/${REPO}/actions/runs/${RUN_ID}"

          # Exit-koden fångas SEPARAT från resultatet — samma disciplin som
          # alarm-jobbet lärde sig den hårda vägen (TASK-51): formen
          # `$(gh ... || echo "")` kollapsar "anropet gick fel" och "det finns
          # inget svar" till samma tomma sträng, och då byggs ett faktapåstående
          # på frånvaro av data. Signalen ska vara success ELLER failure, aldrig
          # frånvaro (L322-klassen).
          # --repo är OBLIGATORISK: jobbet gör ingen checkout, så gh kan inte
          # härleda repot ur en git-remote.
          gh_failed=""
          existing=$(gh issue list --repo "${REPO}" --label lankrota \
            --state open --limit 1 --json number \
            --jq '.[0].number // ""') || gh_failed="1"

          if [ -n "${gh_failed}" ]; then
            echo "::error::Kunde inte läsa befintliga lankrota-ärenden — kanalen är inte verifierbar denna natt."
            exit 1
          fi

          body="Den nattliga länkkontrollen (\`nightly-links\`) föll.

          - **Körning:** ${run_url}
          - **HEAD:** \`${CURRENT_SHA}\`

          Kontrollen täcker BÅDE intern och extern yta; PR-grinden ser sedan
          ADR-082 bara den interna. Ett fynd här är därför antingen extern
          länkröta (någon annans sida har flyttat eller dött) eller en intern
          pekare som ruttnat mellan två PR:er.

          **Detta ärende är icke-blockerande och STÅENDE** — nya fynd läggs som
          kommentarer i stället för nya ärenden. Stäng det när körningen är grön
          igen, eller med en öppet skriven motivering (t.ex. att mönstret lagts i
          \`.lycheeignore\` med motivering och datum, per ADR-082 beslut 5)."

          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${REPO}" --body "🔗 **Ny röd länkkontroll $(date -u +%F)**

          - **Körning:** ${run_url}
          - **HEAD:** \`${CURRENT_SHA}\`

          _(Stående ärende — kommentar i stället för nytt ärende, per ADR-082 beslut 4.)_"
            echo "Uppdaterade stående ärende #${existing}."
          else
            gh issue create \
              --repo "${REPO}" \
              --title "🔗 Länkröta — nattlig kontroll röd" \
              --label lankrota \
              --body "${body}"
            echo "Skapade nytt stående länkröte-ärende."
          fi

  # Mätskriptet (task-36.5 / ADR-077): CI-hastighet som siffror — ledtid,
  # mutex-kötid, röd-orsak, flaky-frekvens, dedup-träffkvot ur körnings-API:t.
  # Nattlig körning bygger kurvan av sig själv; samma skript körs manuellt via
  # `npm run metrics:ci`. Testsviten (fixtur-data) körs som första steg så
  # test-ci-metrics.mjs har en återkommande CI-bärare utan att ci.yml rörs.
  # Skriptet är beroendefritt (node + gh) — inget npm ci behövs.
  #
  # Jobbet bär sedan TASK-81 testsviten för ÄNNU ett mätverktyg
  # (scripts/flake-matserie.mjs). Skälet det bor här och inte i ci.yml:s
  # grindvakts-steg är att ingendera är en GRIND — de är mätare, och ci.yml:s
  # steg heter "Test gatekeeper script suites". Kadens-argumentet (L43 /
  # ADR-039 § lesson→grind: en testsvit som inte körs fortlöpande ruttnar —
  # TASK-72:s empiri) gäller ändå, och nattlig kadens räcker för en mätare.
  # Även flake-riggens testsvit är beroendefri (node, fixtur-data, startar
  # aldrig Playwright).
  nightly-metrics:
    name: CI-mätning (siffror, ej känsla)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Metrics-testsvit (fixtur-data, aldrig levande API)
        run: node scripts/test-ci-metrics.mjs

      - name: Flake-riggens testsvit (fixtur-data, startar aldrig Playwright)
        # TASK-81: scripts/flake-matserie.mjs bär de fyra egenskaper TASK-74:s
        # mätning visade bärande (interfoliering, loadavg per körning,
        # retries=0, rådata per testresultat). Sviten prövar att de är KODADE
        # och inte bara beskrivna — bl.a. att byggPlan inte kan producera en
        # blockad serie och att en oläsbar loadavg blir OKÄND, aldrig 0.
        run: node scripts/test-flake-matserie.mjs

      - name: Uppdragsrevisionens testsvit (T110/ADR-086)
        # ADR-086: scripts/uppdragsrevision.mjs extraherar en sessions
        # Agent-spawns ur transcript-JSONL (read-only, fail-loud) — en mätare,
        # inte en grind, därav bäraren här och inte i ci.yml (samma
        # kadens-argument som grannstegen: en testsvit som inte körs
        # fortlöpande ruttnar). Sviten är beroendefri (node + fixtur-data,
        # enbart node:-builtins — inget npm ci) och prövar båda riktningarna:
        # att extraktionen träffar facit och att skriptet FÄLLER på saknad
        # session, tvetydigt prefix och fil utan giltig JSON.
        run: node scripts/test-uppdragsrevision.mjs

      - name: CI-mätning (fönster 50 runs) → logg + step-summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ci-metrics.mjs --limit 50 | tee metrics-report.txt
          { echo '```'; cat metrics-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Kontraktsvakten (task-59.2, ADR-080 beslut 3): jämför fixturvärldens svar
  # mot SKARP staging och fäller när de glidit isär. Zod-schemana är halva
  # kontraktet — de fångar form-drift men inte värde-drift, och inte schemats
  # egen drift mot funktionen. Fowlers kadens ("once a day is plenty") och
  # fail-semantik ("shouldn't necessarily break the build") är exakt nattens.
  #
  # ICKE-BLOCKERANDE PER PLACERING, INTE PER FLAGGA: jobbet finns bara här, och
  # `kontraktsvakt`-projektet ingår inte i ci-suite.yml — därför kan det
  # strukturellt inte fälla en PR. `continue-on-error` vore FEL väg: det gör
  # needs-resultatet 'success' och larm-jobbet nedan hade aldrig fyrat.
  #
  # INGEN staging-tests-MUTEX: vakten gör sju GET och muterar ingenting.
  # Sentinel-rader som suite-jobbet skapar samtidigt ändrar antalet poster men
  # inte deras form, och form är allt som jämförs. Att ta mutexen hade
  # serialiserat natten en gång till utan att köpa något.
  kontraktsvakt:
    name: Kontraktsvakt (fixtur mot skarp staging)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # STAGING_REQUIRED=1: saknade creds ska HARD-FAILA, aldrig skippa tyst.
      # En vakt som skippar sig själv ser exakt likadan ut som en tyst natt.
      # Samma secret-uppsättning som ci-suite.yml:s api-staging-steg — vakten
      # återanvänder api-setup-projektet och behöver därför båda inloggningarna.
      - name: Kontraktsvakt mot staging
        run: npm run vakt:kontrakt
        env:
          STAGING_REQUIRED: '1'
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

  # Backlog-stängningsgrinden (TASK-102-wiringen, T107): fångar kort vars ARBETE
  # är klart men vars STATUS inte är det. Hela varför-blocket bor i grindens eget
  # huvud (scripts/check-backlog-closure.sh) — kortversionen: repots stängning är
  # TVÅSTEGS (ADR-073 beslut 5), så ett obockat kort direkt efter landning är
  # NORMALT; felet är när det FÖRBLIR obockat. Det är en
  # inaktuellt-tillstånd-kontroll och hör därför i NATTEN, aldrig i PR-grinden,
  # där den hade fällt varje korrekt leverans-commit (karensen 24 h är mätt på
  # n=91 kort, se grindens § KARENSEN).
  #
  # npm ci ÄR FÖRUTSÄTTNINGEN, inte en vana: grindens default är
  # node_modules/.bin/backlog — den pinnade devDependencyn backlog.md@1.48.0
  # (TASK-102). `npx backlog` är förbjudet som form: paketet `backlog` i
  # registret är ETT ANNAT paket av en annan författare, och npx
  # auto-installerar det utan att fråga när stdin inte är en TTY — vilket den
  # aldrig är här. Se grindens huvud § DEFAULTEN.
  #
  # EXIT-KODERNA BÄR TVÅ OLIKA BUDSKAP och får inte kollapsas: exit 1 = DRIFT
  # (kort som glömts öppna — åtgärda korten), exit 2 = ANROPSFEL (CLI:t,
  # policyn eller utdataformatet svarade inte som väntat — åtgärda grinden,
  # korten är oprövade). Steget klassar koden till en output som larm-jobbet
  # nedan skriver in i nattärendet; loggen bär samma klassning som ::error::.
  # Kollapsade man dem hade ett trasigt CLI öppnat ett ärende som skickar
  # läsaren att jaga kort som ingen prövat — fel ärende, samma natt (jfr
  # links-arende-jobbets separation av "anropet gick fel" från "inget svar").
  #
  # Körtid: grinden är LOKALT mätt till ~139 s (TASK-102, efter dess
  # 34 %-förbättring) — CI-tiden är INTE mätt och kan avvika åt båda håll,
  # bl.a. för att backlog/config.yml:s check_active_branches läser grenar som
  # en CI-checkout med fetch-depth: 1 inte har. timeout-minutes: 10 rymmer
  # npm ci + grinden med marginal; första skarpa natten är mätpunkten.
  backlog-closure:
    name: Backlog-stängning (natt-grind)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      utfall: ${{ steps.grind.outputs.utfall }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Backlog-stängningsgrinden (exit 1 = drift, exit 2 = anropsfel)
        id: grind
        # Exitkoden fångas SEPARAT (KOD=$?-disciplinen) och klassas INNAN
        # steget faller: en output som skrivs efter `exit` skrivs aldrig.
        # `okand-…`-grenen är fail-closed åt rätt håll — en exitkod grinden
        # inte dokumenterar rapporteras som sig själv, aldrig som drift.
        run: |
          set -uo pipefail
          KOD=0
          bash scripts/check-backlog-closure.sh || KOD=$?
          case "${KOD}" in
            0) utfall="gron" ;;
            1) utfall="drift" ;;
            2) utfall="anropsfel" ;;
            *) utfall="okand-exitkod-${KOD}" ;;
          esac
          echo "utfall=${utfall}" >> "${GITHUB_OUTPUT}"
          if [ "${KOD}" -eq 1 ]; then
            echo "::error::Backlog-DRIFT (exit 1): grinden fann inkonsistenta kort. Invariant och rätt åtgärd skiljer sig PER KORT (invariant 1/3: öppet men bevisat klart — åtgärd: stäng korten; invariant 2: stängt men obockat — åtgärd: bocka DoD/AC mot belägg eller öppna ärligt) — se loggens ❌-rader ovan för vilket kort som bär vilken."
          elif [ "${KOD}" -ne 0 ]; then
            echo "::error::ANROPSFEL i grinden (exit ${KOD}): korten är OPRÖVADE. Åtgärd: laga grinden/miljön, inte korten."
          fi
          exit "${KOD}"

  # Sannings-avstämningen (T119 arbetslista (b), S97): fångar sessionsdok vars
  # FÄLT påstår paus medan git-HISTORIKEN visar att arbete landat. Hela
  # varför-blocket bor i grindens eget huvud
  # (scripts/check-pausade-sessioner.sh) — kortversionen: detta är
  # tre-lagers-doktrinens lager 2. `check-lifecycle.sh` är lager 1 och prövar
  # att `lifecycle: paused` och `## PAUSLÄGE`-rubriken är ett giltigt PAR: två
  # strängar i samma filversion, ingen git-operation, ingen tidsdimension. Den
  # KAN därför inte se att sessionen faktiskt arbetar. S96 Del 8: sessionen
  # stod paused medan fem [S96]-taggade PR:er landade i den, och grinden var
  # grön hela tiden — felet fångades av Marcus, inte av någon mekanism.
  #
  # fetch-depth: 0 ÄR FÖRUTSÄTTNINGEN, inte en vana. Grinden gör
  # `git log <paus-commit>..HEAD` och kräver att paus-commiten är NÅBAR; utan
  # historik svarar intervallet tomt och grinden hade rapporterat grönt ur en
  # mätning den inte kunde göra. Den vägrar därför (exit 2) när nåbarheten
  # inte håller, i stället för att svara grönt — samma fail-closed-hållning som
  # ci-wait.sh, och motsatsen till den vakt som vid S97:s paus-landning
  # rapporterade "ALLA KLARA" beräknat ur en tom lista.
  #
  # fetch-depth-invarianten (scripts/check-fetch-depth-invariant.sh) räknar
  # ENBART ci.yml:s tre bärare (changed/lint/docs, EXPECTED_CI_CARRIERS=3) plus
  # .frontmatter-policy.conf och check-frontmatter.sh. nightly.yml ligger
  # utanför den mängden, precis som ci.yml:s egna historik-oberoende jobb
  # medvetet gör — detta jobb bryter alltså inte invarianten. Verifierat genom
  # att köra grinden efter ändringen, inte antaget.
  #
  # HÖR I NATTEN, ALDRIG I PR-GRINDEN — samma skäl som backlog-closure ovan:
  # det är en inaktuellt-tillstånd-kontroll. En paus-landning följs normalt av
  # en kort svans (kadensrad, Vale-rättelser), och att fälla den i PR-grinden
  # hade fällt varje korrekt paus-landning. Felet är inte att svansen finns —
  # felet är att ARBETE fortsätter medan dokumentet påstår paus. Skiljelinjen
  # är VAD commiten rör, inte hur sent den kom: en ren tidskarens föll på
  # mätningen (S92:s legitima svans kom +16 h; S96:s verkliga arbete kom
  # 10-14 h), så 24 h hade tystat bruset OCH missat felet.
  #
  # EXIT-KODERNA BÄR TVÅ OLIKA BUDSKAP, precis som i backlog-closure: exit 1 =
  # DRIFT (ett dok påstår paus medan arbete landat — åtgärda DOKUMENTET via
  # session-resume steg 6), exit 2 = ANROPSFEL (grinden kunde inte mäta —
  # åtgärda GRINDEN, dokumenten är oprövade). Kollapsade man dem hade ett
  # trasigt anrop skickat läsaren att jaga en motsägelse ingen prövat.
  pausade-sessioner:
    name: Sannings-avstämning — pausade sessioner (natt-grind)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      utfall: ${{ steps.grind.outputs.utfall }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full historik — se blocket ovan. Grinden vägrar mäta utan den.
          fetch-depth: 0

      - name: Sannings-avstämningen (exit 1 = drift, exit 2 = anropsfel)
        id: grind
        # Exitkoden fångas SEPARAT (KOD=$?-disciplinen) och klassas INNAN
        # steget faller: en output som skrivs efter `exit` skrivs aldrig.
        # `okand-…`-grenen är fail-closed åt rätt håll — en exitkod grinden
        # inte dokumenterar rapporteras som sig själv, aldrig som drift.
        run: |
          set -uo pipefail
          KOD=0
          bash scripts/check-pausade-sessioner.sh || KOD=$?
          case "${KOD}" in
            0) utfall="gron" ;;
            1) utfall="drift" ;;
            2) utfall="anropsfel" ;;
            *) utfall="okand-exitkod-${KOD}" ;;
          esac
          echo "utfall=${utfall}" >> "${GITHUB_OUTPUT}"
          if [ "${KOD}" -eq 1 ]; then
            echo "::error::PAUS-DRIFT (exit 1): ett sessionsdok påstår paus medan taggat arbete landat efter pausen. Åtgärd: kör session-resume steg 6 (lifecycle-flipp + paus-rubrik till historik-form), eller stäng sessionen."
          elif [ "${KOD}" -ne 0 ]; then
            echo "::error::ANROPSFEL i grinden (exit ${KOD}): dokumenten är OPRÖVADE. Åtgärd: laga grinden/miljön, inte dokumenten."
          fi
          exit "${KOD}"

  # Sessionsdok-fönstrets drift-grind (ADR-099, TASK-158.4): fångar att
  # tasks/sessions/-roten VUXIT FÖRBI det rullande fönstret (TASK-158.1s
  # regel, TASK-158.2s skript) utan att någon kört arkiverings-skriptet med
  # --utfor. Hela varför-blocket bor i grindens eget huvud
  # (scripts/check-sessionsdok-fonster.sh) — kortversionen: grinden anropar
  # arkivera-sessionsdok.sh i TORRKÖRNING och läser dess rapport i stället för
  # att implementera en egen klassificering (samma dubbelriktade
  # över-engineering-vakt de övriga natt-grindarna redan följer — ingen
  # abstraktion/logik-kopia utan en faktisk andra användare).
  #
  # HÖR I NATTEN, ALDRIG I PR-GRINDEN — samma skäl som pausade-sessioner och
  # backlog-closure ovan: det är en inaktuellt-tillstånd-kontroll (roten VÄXER
  # mellan sessioner snarare än inom en enskild PR-diff), och att fälla den i
  # PR-grinden hade ingen naturlig utlösningspunkt.
  #
  # fetch-depth: 1 räcker — grinden läser bara det AKTUELLA filträdet
  # (frontmatter + filnamn) plus `git grep` för länk-förhandsvisningen, ingen
  # historik krävs (samma motivering som backlog-closure/obesvarade-larm ovan;
  # skiljer sig från pausade-sessioner, som behöver full historik för sin
  # egen, git-log-baserade mätning).
  #
  # EXIT-KODERNA BÄR TVÅ OLIKA BUDSKAP, samma disciplin som syskongrindarna:
  # exit 1 = DRIFT (roten har arkiv-kandidater — kör arkiverings-skriptet med
  # --utfor), exit 2 = ANROPSFEL (skriptet/policyn svarade inte som väntat —
  # roten är OPRÖVAD, inte grön av brist på bevis).
  sessionsdok-fonster:
    name: Sessionsdok-fönstret (natt-grind, ADR-099)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      utfall: ${{ steps.grind.outputs.utfall }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Sessionsdok-fönstret (exit 1 = drift, exit 2 = anropsfel)
        id: grind
        # Exitkoden fångas SEPARAT (KOD=$?-disciplinen) och klassas INNAN
        # steget faller: en output som skrivs efter `exit` skrivs aldrig.
        # `okand-…`-grenen är fail-closed åt rätt håll — en exitkod grinden
        # inte dokumenterar rapporteras som sig själv, aldrig som drift.
        run: |
          set -uo pipefail
          KOD=0
          bash scripts/check-sessionsdok-fonster.sh || KOD=$?
          case "${KOD}" in
            0) utfall="gron" ;;
            1) utfall="drift" ;;
            2) utfall="anropsfel" ;;
            *) utfall="okand-exitkod-${KOD}" ;;
          esac
          echo "utfall=${utfall}" >> "${GITHUB_OUTPUT}"
          if [ "${KOD}" -eq 1 ]; then
            echo "::error::SESSIONSDOK-FÖNSTER-DRIFT (exit 1): tasks/sessions/-roten har vuxit förbi det rullande fönstret (ADR-099). Åtgärd: kör 'scripts/arkivera-sessionsdok.sh --utfor' och landa flytten + länkomskrivningen — se loggen ovan för vilka dokument."
          elif [ "${KOD}" -ne 0 ]; then
            echo "::error::ANROPSFEL i grinden (exit ${KOD}): roten är OPRÖVAD. Åtgärd: laga grinden/skriptet/policyn, inte roten."
          fi
          exit "${KOD}"

  # Larm-ärende-avstämningen (T119 arbetslista (b), post-merge-vägen, S97):
  # fångar larm som SKAPATS men aldrig besvarats. Hela varför-blocket bor i
  # grindens huvud (scripts/check-obesvarade-larm.sh) — kortversionen:
  # post-merge.yml skapar vid rött ett tilldelat ärende med revert-förslag och
  # är MEDVETET aldrig en required check. Det är rätt design. Hålet är att
  # ingenting pollar de ärendena: heartbeat-svepet bevakar PR-landningsläge,
  # inte skapade ärenden på redan mergade träd.
  #
  # BELÄGGET (mätt mot GitHub 2026-08-04 över samtliga sex ci-post-merge-
  # ärenden som någonsin skapats): #616/#619 öppnades för en äkta regression,
  # fixen landade ~18 h senare, och ärendena stod öppna ytterligare ~23,5 h
  # EFTER fixen — stängda först tillsammans med det orelaterade #656, tre
  # ärenden inom 18 sekunder. Retrospektiv batch-sanering, inte en reaktion.
  #
  # VARFÖR NATTEN OCH INTE HEARTBEAT-SVEPET: svepet är en process en agent
  # startar inuti sin session. Forskningsdoket förkastar den formen för just
  # denna felklass — "detektorn dör i samma ögonblick den behövs" — eftersom
  # felet vi fångar är att aktören slutade. Lager 2 måste vara oberoende av
  # den övervakade aktören. En femte väg i svepet kompletterar detta senare,
  # men ersätter det inte.
  #
  # issues: read KRÄVS — ospecificerade permissions sätts till none, och
  # `gh issue list` får då 403. Samma fälla som TASK-51 (S89) rättade för
  # larm-jobbets actions-grant.
  #
  # FAIL-CLOSED PÅ TOM MÄNGD: ett gh-anrop som failar ger tom utdata, och en
  # naiv räkning hade läst tomheten som "inga ärenden" = grönt. Grinden
  # skiljer "svarade tomt" (giltigt) från "svarade inte" (exit 2) på anropets
  # EGEN exitkod, aldrig på utdatans längd.
  obesvarade-larm:
    name: Sannings-avstämning — obesvarade larm (natt-grind)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      utfall: ${{ steps.grind.outputs.utfall }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Larm-ärende-avstämningen (exit 1 = drift, exit 2 = anropsfel)
        id: grind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          KOD=0
          bash scripts/check-obesvarade-larm.sh || KOD=$?
          case "${KOD}" in
            0) utfall="gron" ;;
            1) utfall="drift" ;;
            2) utfall="anropsfel" ;;
            *) utfall="okand-exitkod-${KOD}" ;;
          esac
          echo "utfall=${utfall}" >> "${GITHUB_OUTPUT}"
          if [ "${KOD}" -eq 1 ]; then
            echo "::error::OBESVARAT LARM (exit 1): ett larm-ärende har stått öppet bortom sin tröskel. Åtgärd: åtgärda eller stäng ärendet med motivering — se loggen för vilket."
          elif [ "${KOD}" -ne 0 ]; then
            echo "::error::ANROPSFEL i grinden (exit ${KOD}): ärendena är OPRÖVADE. Åtgärda grinden/miljön, inte ärendena."
          fi
          exit "${KOD}"

  # Larmkedjan: fyrar vid RÖD natt (eller simulate_failure-dispatch). Skapar
  # ett tilldelat, etiketterat ärende med körningslänk + commit-spann sedan
  # senaste GRÖNA natt. Grön natt ⇒ jobbet skippas ⇒ inget ärende, inga spår
  # (AC#4). nightly-metrics ingår i needs — röda mätningar får aldrig vara tysta
  # (L321-klassen: nightly saknar annan åskådare, rött utan larm vore en tyst
  # permanent). kontraktsvakt ingår av SAMMA skäl: en fixtur som glidit ifrån
  # verkligheten ska nå en kedja som redan bevakas, inte bli ännu en signal
  # ingen läser (ADR-080 beslut 3).
  #
  # nightly-links ingår MEDVETET INTE sedan ADR-082 (2026-07-28). Detta ärende är
  # tilldelat och ska betyda "något är akut fel"; en extern värds dåliga dag hör
  # inte dit och devalverar signalen. Länkrötan har i stället en egen, mildare
  # kanal (links-arende ovan) — utelämnandet är alltså inte fail-open, vilket är
  # hela skillnaden mot L321/L322-fällan.
  #
  # backlog-closure ingår i needs av samma L321-skäl som nightly-metrics: natten
  # saknar annan åskådare, och en röd grind utan larm vore en tyst permanent.
  # Ärendets text SKILJER exit 1 från exit 2 via jobbets utfall-output — de två
  # koderna kräver motsatta åtgärder (stäng korten respektive laga grinden),
  # och ett ärende som inte säger vilken devalverar sig självt.
  #
  # pausade-sessioner ingår av EXAKT samma skäl, och tillhör samma klass: en
  # grind vars fynd bara syns i en nattlogg ingen läser är inte en mekanism,
  # den är en loggrad. Felet den fångar (S96 Del 8) upptäcktes en gång av
  # Marcus i en chattfråga — hela poängen med att bygga den är att det inte
  # ska behöva vara vägen.
  #
  # sessionsdok-fonster (ADR-099, TASK-158.4) ingår av samma L321-skäl: en
  # rot som vuxit förbi det rullande fönstret utan larm är samma tysta
  # permanent som de övriga inaktuellt-tillstånd-kontrollerna ovan skyddar
  # mot — PRD task-158 § användarberättelse 5 begär uttryckligen just detta.
  #
  # issues:write finns numera på TVÅ jobb (detta + links-arende), inte bara här.
  alarm:
    name: Larm vid röd natt
    needs: [suite, nightly-audit, nightly-metrics, kontraktsvakt, backlog-closure, pausade-sessioner, obesvarade-larm, sessionsdok-fonster]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || inputs.simulate_failure) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      # TASK-51 (S89): `gh run list` läser körnings-API:t. Ospecificerade
      # permissions sätts till none, så utan detta grant är actions=none och
      # anropet får 403 när det väl når API:t. nightly-metrics ovan hade
      # redan samma grant — larm-jobbet fick aldrig samma behandling.
      #
      # ÄRLIG AVGRÄNSNING: 403:an är dokumentations-belagd, inte observerad.
      # Det fel vi FAKTISKT såg (run 30173436345) var "failed to determine
      # base repo" från den saknade --repo-flaggan nedan — den dödade
      # anropet före behörighetsprövningen. Båda krävs; ordningen på
      # felen gjorde bara den andra osynlig.
      actions: read
    steps:
      - name: Skapa nattärende (tilldelat, etiketterat, med spann)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
          SIMULATED: ${{ inputs.simulate_failure }}
          # Outputs från ett FALLET jobb är läsbara i needs — steget som skrev
          # utfall körde klart innan jobbet föll (klassningen sker före exit).
          BACKLOG_RESULT: ${{ needs.backlog-closure.result }}
          BACKLOG_UTFALL: ${{ needs.backlog-closure.outputs.utfall }}
          # Resten av needs-jobbens rå-resultat (T146, 2026-08-05) — se
          # jobb_sektion-blocket nedan för varför de behövs utöver
          # BACKLOG_RESULT ovan.
          SUITE_RESULT: ${{ needs.suite.result }}
          AUDIT_RESULT: ${{ needs.nightly-audit.result }}
          METRICS_RESULT: ${{ needs.nightly-metrics.result }}
          KONTRAKTSVAKT_RESULT: ${{ needs.kontraktsvakt.result }}
          PAUSADE_RESULT: ${{ needs.pausade-sessioner.result }}
          OBESVARADE_RESULT: ${{ needs.obesvarade-larm.result }}
          SESSIONSDOK_FONSTER_RESULT: ${{ needs.sessionsdok-fonster.result }}
        run: |
          set -euo pipefail
          run_url="${SERVER}/${REPO}/actions/runs/${RUN_ID}"

          # ═══ JOBB-STATUS (T146, 2026-08-05) — REDOVISA ALLA ICKE-GRÖNA ═══
          # Rent additivt: bredare INNEHÅLL i ett ärende som ändå skapas, inte
          # en breddning av NÄR det skapas (villkoret på rad 628 är orört).
          #
          # Innan detta block namngavs bara backlog-closure explicit
          # (backlog_sektion nedan) — övriga sex needs-jobb syntes bara
          # indirekt genom att ärendet fanns, aldrig med NAMN eller RESULTAT i
          # texten. Den 2026-08-04 föll natten med `Länkkontroll (utan
          # cache)` CANCELLED (se nightly-links-jobbets kommentarblock för
          # rotorsaken); den jobbet ligger MEDVETET utanför denna needs-lista
          # (ADR-082) så det syns aldrig här — men SAMMA natt visade också att
          # ingen av de sju jobb som FAKTISKT ingår i needs namngavs i
          # ärendet (#681), bara backlog-closure fick en särskild sektion.
          # En cancelled eller skipped post i just DESSA sju jobb hade varit
          # lika osynlig. Listan täckte då alla sju, inte bara det som råkade
          # utlösa fyndet — sessionsdok-fonster (TASK-158.4) är det åttonde
          # tillskottet till samma lista, av samma skäl.
          jobbnamn=(
            "Nattlig fullsvit"
            "Bredare sårbarhetsgranskning"
            "CI-mätning (siffror, ej känsla)"
            "Kontraktsvakt (fixtur mot skarp staging)"
            "Backlog-stängning (natt-grind)"
            "Sannings-avstämning — pausade sessioner (natt-grind)"
            "Sannings-avstämning — obesvarade larm (natt-grind)"
            "Sessionsdok-fönstret (natt-grind, ADR-099)"
          )
          jobbresultat=(
            "${SUITE_RESULT}"
            "${AUDIT_RESULT}"
            "${METRICS_RESULT}"
            "${KONTRAKTSVAKT_RESULT}"
            "${BACKLOG_RESULT}"
            "${PAUSADE_RESULT}"
            "${OBESVARADE_RESULT}"
            "${SESSIONSDOK_FONSTER_RESULT}"
          )
          jobb_rader=""
          for i in "${!jobbnamn[@]}"; do
            r="${jobbresultat[$i]}"
            if [ "${r}" != "success" ]; then
              jobb_rader="${jobb_rader}"$'\n'"- **${jobbnamn[$i]}:** \`${r}\`"
            fi
          done
          jobb_sektion=""
          if [ -n "${jobb_rader}" ]; then
            jobb_sektion=$'\n\n**Jobb-status (icke-gröna):**'"${jobb_rader}"
          fi

          # Backlog-grindens två felkoder kräver MOTSATTA åtgärder och får
          # aldrig kollapsas i ärendetexten (se backlog-closure-jobbets huvud).
          # Tom/okänd output med result=failure betyder att jobbet dog FÖRE
          # klassningen (timeout, npm ci, infra) — det redovisas som sig
          # självt, aldrig som drift.
          backlog_sektion=""
          if [ "${BACKLOG_RESULT}" = "failure" ]; then
            case "${BACKLOG_UTFALL}" in
              drift)
                backlog_sektion=$'\n\n**Backlog-stängningsgrinden: DRIFT (exit 1).** Grinden fann inkonsistenta kort — invariant och åtgärd skiljer sig PER KORT: invariant 1/3 (öppet men bevisat klart) ⇒ stäng korten via CLI:t (`node_modules/.bin/backlog task edit <id> --check-dod … -s Done`); invariant 2 (stängt men obockat) ⇒ bocka DoD/AC mot belägg eller öppna ärligt. Körningsloggens ❌-rader namnger vilket kort som bär vilken invariant — läs dem innan åtgärd, applicera inte en gemensam åtgärd på alla.'
                ;;
              anropsfel)
                backlog_sektion=$'\n\n**Backlog-stängningsgrinden: ANROPSFEL (exit 2).** Grinden kunde inte pröva korten (CLI-, policy- eller formatfel). Detta är INTE ett påstående om kortens tillstånd — åtgärda grinden/miljön, inte korten.'
                ;;
              *)
                backlog_sektion=$'\n\n**Backlog-stängningsgrinden föll utan läsbart utfall** — jobbet dog före klassningen (timeout/npm ci/infra) eller gav en odokumenterad exitkod. Se körningsloggen; korten är oprövade.'
                ;;
            esac
          fi

          # Senaste GRÖNA körningen av nightly.yml på main (exkl. denna).
          #
          # Exit-koden fångas SEPARAT från resultatet. Den gamla formen
          # `$(gh ... || echo "")` kollapsade "anropet gick fel" och "det finns
          # inget svar" till samma tomma sträng, och villkorskedjan valde då
          # sin första gren — ett faktapåstående om historiken byggt på
          # frånvaro av data (TASK-51). Samma klass som L322: signalen ska
          # vara success ELLER failure, aldrig frånvaro.
          # --repo är OBLIGATORISK här: jobbet gör ingen checkout, så gh kan
          # inte härleda repot ur en git-remote. Utan flaggan dör anropet på
          # "failed to determine base repo" INNAN behörigheten ens prövas
          # (skarpt bevisat, run 30173436345). gh issue create nedan hade
          # flaggan från början — gh run list fick den aldrig.
          gh_failed=""
          last_green=$(gh run list --repo "${REPO}" \
            --workflow nightly.yml --branch main \
            --status success --limit 1 --json headSha \
            --jq '.[0].headSha // ""') || gh_failed="1"

          # Fyra distinkta fall — meddelandet får aldrig ljuga om läget:
          #   0. Anropet misslyckades → spannet är OKÄNT, inte tomt.
          #   1. Ingen tidigare grön körning (första gången / alla röda).
          #   2. Föregående gröna körning låg på SAMMA träd (noll-commit-natt) →
          #      inget commit-spann finns, OCH samma kod var grön igår = flake/
          #      infra-signal (får ej döljas som "ingen tidigare grön").
          #   3. Föregående gröna körning på annat träd → äkta compare-spann.
          if [ -n "${gh_failed}" ]; then
            span="_(**kunde inte hämta spannet** — anropet mot körnings-API:t misslyckades. Detta är INTE ett påstående om historiken: spannet är okänt. Se körningsloggen; kontrollera att larm-jobbet har \`actions: read\`.)_"
          elif [ -z "${last_green}" ]; then
            span="_(ingen tidigare grön körning av nattsviten — första gången eller alla röda; hela historiken fram till \`${CURRENT_SHA:0:7}\`)_"
          elif [ "${last_green}" = "${CURRENT_SHA}" ]; then
            span="_(samma träd \`${CURRENT_SHA:0:7}\` var GRÖNT i föregående körning av nattsviten — inget commit-spann; sannolik flake eller infra-regression, ej kod)_"
          else
            span="[\`${last_green:0:7}...${CURRENT_SHA:0:7}\`](${SERVER}/${REPO}/compare/${last_green}...${CURRENT_SHA})"
          fi

          note=""
          if [ "${SIMULATED}" = "true" ]; then
            note=$'\n\n> ⚠️ **SIMULERAT** via `simulate_failure`-dispatch — larmkedje-test, ingen äkta regression. Stäng med denna motivering.'
          fi

          title="🌙 Nattnätet rött — $(date -u +%F)"
          body="Den schemalagda nattkörningen (\`nightly.yml\`) blev röd.

          - **Körning:** ${run_url}
          - **Commit-spann sedan senaste gröna körning av nattsviten:** ${span}
          - **HEAD:** \`${CURRENT_SHA}\`${jobb_sektion}

          Stängningsregel (CONTRIBUTING § Nattnätet): detta ärende stängs ENDAST med (a) en åtgärd som fixar grundorsaken eller (b) en öppet skriven motivering — aldrig tyst.${backlog_sektion}${note}"

          gh issue create \
            --repo "${REPO}" \
            --title "${title}" \
            --body "${body}" \
            --label ci-natt \
            --assignee marcus803
