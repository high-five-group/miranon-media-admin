---
name: Nattvakt

# Vakt som står UTANFÖR nattkörningen (T85-korrigeringspaketet punkt 2, S88).
#
# VARFÖR DEN FINNS: nightly.yml:s larm-jobb bor INNE i den körning det bevakar.
# Det kan därför bara larma om körningen faktiskt äger rum. Två fall bryter det,
# och det ena har hänt på riktigt:
#   1. startup_failure — GitHub avvisar hela körningen. Empiriskt: run
#      30038460735 (2026-07-23) hade total_count: 0 jobb, alltså instansierades
#      aldrig larm-jobbet. Repots enda ci-natt-ärende någonsin (#114) kom från
#      en SIMULERAD dispatch; den verkliga incidenten lämnade noll spår.
#   2. Utebliven schemakörning — GitHub dokumenterar själva att schemalagda
#      körningar kan fördröjas och att köade jobb kan tappas.
#
# ARKITEKTUR (C, research-grundad 2026-07-25): vakten ERSÄTTER INTE larm-jobbet.
# Google SRE:s checklista för nya larmregler frågar "does this rule detect an
# otherwise undetected condition?" — vilket godkänner vakten för de två fallen
# ovan och underkänner den för resten, där larm-jobbet redan är en observatör
# med RIKARE data (commit-spann, flake-signal). Samma mönster som Prometheus
# Watchdog: ett larm som bevakar kanalen och ligger BREDVID vanliga larm.
# Precedent i GitHub Actions: armbian/os watchdog.yml.
#
# DEDUP: en kontroll av ÖPPNA ci-natt-ärenden, ELLER ärenden STÄNGDA inom ett
# fönster MED en skriven motivering (kommentar), före skapande. Motsvarar
# Alertmanagers inhibition och besvarar SRE-checklistans fråga 5 ("are other
# people getting paged for this issue…"). Utan den vore detta alternativ B.
# Den stängda-med-motivering-halvan är TASK-180 (2026-08-10, issue #1042):
# en tidigare version frågade bara efter ÖPPNA ärenden, missade ett larm som
# redan fanns och nyss stängts med en rotorsaksmotivering, och larmade själv
# — ett falsklarm. Beslutslogiken bor i scripts/check-nattvakt-dedup.sh
# (config: .nattvakt-dedup-policy.conf), testad tvåsidigt i
# scripts/test-check-nattvakt-dedup.sh.
#
# ÖPPET BOKFÖRD BEGRÄNSNING — REKURSIONEN: vakten är själv en GitHub
# Actions-cron och ärver därmed exakt den defekt den ska täcka. Den fångar det
# VANLIGA fallet (en enskild körning tappas eller vägrar starta) men inte det
# sällsynta (hela schemaläggningen nere). Att bryta rekursionen kräver en klocka
# utanför GitHub — separat beslut om extern tjänst, medveten deferral.
#
# BEVIS-LÄGE: "an untested dead man's switch is worse than none at all because
# it gives false confidence." Vakten måste därför kunna avfyras på beställning —
# samma praxis som nightly.yml:s simulate_failure och gate-proof.yml.

on:
  schedule:
    # 12:00 Europe/Stockholm. Nattnätet schemaläggs 03:00 och har uppmätt
    # eftersläp på ~3 h (03:56 / 04:00 UTC mot cron 01:00 UTC) — 12:00 ger
    # gott om marginal även en trög natt.
    - cron: '0 12 * * *'
      timezone: 'Europe/Stockholm'
  workflow_dispatch:
    inputs:
      simulate_missing:
        description: >-
          true = tvinga larm-grenen även när natten är frisk (bevisar
          vaktkedjan utan att invänta en äkta incident; städa test-ärendet
          med motivering).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-watchdog
  cancel-in-progress: false

jobs:
  watch:
    name: Kom natten igång?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checka ut repot
        # Krävs sedan TASK-180 (2026-08-10): dedup-beslutet nedan anropar
        # scripts/check-nattvakt-dedup.sh (+ .nattvakt-dedup-policy.conf),
        # som annars inte finns på runnern — jobbet var innan dess rent
        # gh-API-baserat utan lokala filer. Grunt (fetch-depth 1) räcker:
        # skriptet läser bara sin egen källa vid HEAD, ingen git-historik.
        # SHA-pin: se ci.yml:s FÖRSTA Checkout-steg (jobbet `changed`) för
        # hela rationalen (TASK-312, 2026-08-24).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Kontrollera senaste schemalagda nattkörning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          SIMULATE: ${{ inputs.simulate_missing }}
        run: |
          set -euo pipefail

          # Fönstret mäts mot UPPMÄTT drift, inte mot nominell cron. En grace
          # satt mot schemat hade gjort vakten till en falsklarmsmaskin — och
          # husregeln är att ett falsklarm är värre än ingen vakt.
          window_hours=26

          runs_json=$(gh run list --repo "${REPO}" --workflow nightly.yml \
            --branch main --event schedule --limit 1 \
            --json conclusion,createdAt,databaseId)
          count=$(jq 'length' <<<"${runs_json}")

          rubrik=""
          orsak=""

          if [ "${SIMULATE}" = "true" ]; then
            rubrik="Nattvakten — BEVIS-LÄGE"
            orsak="Avfyrad via \`simulate_missing\`-dispatch. Ingen äkta avvikelse; detta bevisar bara att vaktkedjan fungerar."
          elif [ "${count}" -eq 0 ]; then
            rubrik="Nattnätet har aldrig kört"
            orsak="Ingen schemalagd körning av \`nightly.yml\` hittades över huvud taget."
          else
            conclusion=$(jq -r '.[0].conclusion // ""' <<<"${runs_json}")
            created=$(jq -r '.[0].createdAt' <<<"${runs_json}")
            last_id=$(jq -r '.[0].databaseId' <<<"${runs_json}")
            created_epoch=$(date -u -d "${created}" +%s)
            now_epoch=$(date -u +%s)
            age_hours=$(( (now_epoch - created_epoch) / 3600 ))
            last_url="${SERVER}/${REPO}/actions/runs/${last_id}"

            if [ "${age_hours}" -gt "${window_hours}" ]; then
              rubrik="Nattnätet uteblev"
              orsak="Senaste schemalagda körningen är **${age_hours} h** gammal (fönster: ${window_hours} h). Senast sedda: ${last_url}"
            elif [ "${conclusion}" = "startup_failure" ]; then
              rubrik="Nattnätet vägrade starta"
              orsak="Senaste körningen har \`conclusion: startup_failure\` — noll jobb instansierades, så larm-jobbet i \`nightly.yml\` kunde per konstruktion inte fyra. Körning: ${last_url}"
            elif [ -n "${conclusion}" ] && [ "${conclusion}" != "success" ]; then
              # KÖRNINGENS conclusion RÄCKER INTE SOM SIGNAL — mätt 2026-08-04.
              #
              # ADR-082 ställde MEDVETET nightly-links utanför alarm-jobbets
              # needs: en extern värds dåliga dag ska inte devalvera det
              # tilldelade ci-natt-ärendet, och länkrötan har en egen mildare
              # kanal (links-arende). Följden är att en natt där ENDAST
              # länkkontrollen är röd får `conclusion: failure` på körningen
              # medan larm-jobbet KORREKT skippas.
              #
              # Den tidigare formen läste bara conclusion och larmade då
              # "Nattnätet rött utan larm". Det inträffade skarpt: körning
              # 30513174298 (2026-07-30) hade ett enda rött jobb —
              # "Länkkontroll (utan cache)" — och "Larm vid röd natt: skipped",
              # vilket var rätt beteende. Vakten larmade ändå, och ärende #469
              # blev därmed OÅTGÄRDBART: det fanns ingen grundorsak att fixa.
              # Det låg öppet i 123 timmar och devalverade precis den kanal
              # ADR-082 skyddade.
              #
              # Vaktens EGET huvud slår fast husregeln — "ett falsklarm är
              # värre än ingen vakt" — och den tillämpades på tidsfönstret men
              # aldrig här. Nu frågar vakten vilka JOBB som var röda och
              # bortser från dem som per konstruktion inte bär alarm-jobbet.
              #
              # FAIL-CLOSED: kan jobblistan inte hämtas eller tolkas larmar
              # vakten ändå, med det öppet skrivet i orsaken. "Vet inte" får
              # aldrig bli tyst — samma hållning som ci-wait.sh och L322.
              alarm_barande_rott=""
              jobs_json=""
              if jobs_json=$(gh run view "${last_id}" --repo "${REPO}" --json jobs 2>/dev/null); then
                if alarm_barande_rott=$(jq -r '
                      [ .jobs[]
                        | select(.conclusion == "failure" or .conclusion == "cancelled")
                        | select(.name | test("Länkkontroll|Länkröta") | not)
                        | .name ]
                      | join(", ")
                    ' <<<"${jobs_json}" 2>/dev/null); then
                  :
                else
                  alarm_barande_rott="OKÄND (jq kunde inte tolka jobblistan)"
                fi
              else
                alarm_barande_rott="OKÄND (jobblistan kunde inte hämtas)"
              fi

              if [ -n "${alarm_barande_rott}" ]; then
                rubrik="Nattnätet rött utan larm"
                orsak="Senaste körningen har \`conclusion: ${conclusion}\` men inget öppet \`ci-natt\`-ärende finns — larm-jobbet kan självt ha uteblivit. Alarm-bärande röda jobb: ${alarm_barande_rott}. Körning: ${last_url}"
              else
                echo "Körningen är röd (${conclusion}), men enbart i jobb som per ADR-082 står utanför alarm-jobbets needs (länkkontroll/länkröta). Larm-jobbet skippades korrekt — vakten är tyst. Körning: ${last_url}"
              fi
            fi
          fi

          if [ -z "${rubrik}" ]; then
            echo "✅ Natten kom igång och larm-läget är konsistent — vakten är tyst."
            exit 0
          fi

          # DEDUP före skapande: vakten dubblerar aldrig ett larm som redan är
          # TÄCKT — öppet, ELLER stängt inom fönstret med skriven motivering.
          # TASK-180 / issue #1042 (2026-08-10): den tidigare formen frågade
          # bara efter ÖPPNA ärenden, missade #1028 (redan stängt 07:19 med
          # rotorsaksmotivering) och larmade ändå — ett falsklarm. Beslutet
          # bor nu i scripts/check-nattvakt-dedup.sh (config:
          # .nattvakt-dedup-policy.conf). I bevis-läge kringgås dedupen med
          # avsikt, annars kan kedjan inte bevisas medan ett äkta ärende är
          # öppet.
          #
          # FAIL-CLOSED: kan täckningen inte avgöras (skriptets exit 2)
          # larmar vakten ändå — "vet inte" tystas aldrig, samma hållning
          # som alarm_barande_rott ovan.
          if [ "${SIMULATE}" != "true" ]; then
            dedup_kod=0
            dedup_ut=$(REPO="${REPO}" bash scripts/check-nattvakt-dedup.sh 2>&1) || dedup_kod=$?
            echo "${dedup_ut}"
            if [ "${dedup_kod}" -eq 0 ]; then
              echo "Avvikelse funnen (${rubrik}), men täckningen ovan visar att den redan är hanterad — larmar inte (dedup)."
              exit 0
            fi
          fi

          note=""
          if [ "${SIMULATE}" = "true" ]; then
            note=$'\n\n> ⚠️ **SIMULERAT** via `simulate_missing`-dispatch — vaktkedje-test, ingen äkta avvikelse. Stäng med denna motivering.'
          fi

          body="Nattvakten hittade en avvikelse som \`nightly.yml\`:s eget larm-jobb inte kan rapportera.

          - **Vad:** ${orsak}
          - **Vaktens körning:** ${SERVER}/${REPO}/actions/runs/${RUN_ID}

          Vakten står utanför nattkörningen just för att kunna se det som ett larm inuti den är blint för: \`startup_failure\` (noll jobb ⇒ inget larm-jobb) och utebliven schemakörning.

          Stängningsregel (CONTRIBUTING § Nattnätet): stängs ENDAST med (a) åtgärd som fixar grundorsaken eller (b) öppet skriven motivering — aldrig tyst.${note}"

          # gh — MEDVETET OPINNAD (TASK-312, 2026-08-24): GitHub-hostad
          # runner, gh förinstallerat/versionshanterat av GitHub självt.
          # Se scripts/lib/gh-guard.sh § SCOPE.
          gh issue create \
            --repo "${REPO}" \
            --title "🌑 ${rubrik} — $(date -u +%F)" \
            --body "${body}" \
            --label ci-natt \
            --assignee marcus803
