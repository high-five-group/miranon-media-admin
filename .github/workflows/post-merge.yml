---
name: Post-merge

# Post-merge-lagret (A7:4 / TASK-70.2). Det ANDRA skyddslagret: verifierar det
# MERGADE trädet på main, efter att grinden redan släppt igenom det.
#
# ═══ VARFÖR FILEN FINNS — vad som saknades före den ═══
# ci.yml kör visserligen på push till main (dess `on.push.branches: [main]`),
# men två reduktioner staplas ovanpå varandra och lämnar ett hål:
#   1. MERGE-DEDUPEN. `dedup_hit` (ci.yml, jobbet `changed`, steget
#      "Merge-dedup") släcker HELA svit-anropet när merge-commitens träd redan
#      bevisats grönt i PR:en. En main-push kör alltså MINDRE än PR:en gjorde.
#      Mätt, inte antaget: körning 30390109862 (merge-commit 4543d186, en
#      kod-PR) hade `Test suite = skipped`.
#   2. RISKKLASSNINGEN. D1 (`ui_low_risk`) och `acceptance_local` kunde släcka
#      staging redan i PR-körningen. Ett sådant träd landar på main med NOLL
#      staging-täckning — och punkt 1 gör att main-pushen inte heller kör den.
# Mellan merge och nattkörningen (nightly.yml, 03:00) fanns därför ingenting.
#
# SEDAN A7:5 (TASK-70.3) ÄR PUNKT 2 INTE LÄNGRE ETT SPECIALFALL UTAN REGELN.
# ci.yml skickar `run_staging: false` villkorslöst, så INGEN PR-körning kör
# staging. Varje icke-D0-träd landar därmed på main utan staging-täckning, och
# den här filen är den FÖRSTA ytan som ger den. Lagret gick från skyddsnät till
# primär bärare av staging-kontrollen; det höjer insatsen i varje rad nedan.
#
# ═══ VAD DEN INTE GÖR — icke-dubblering är ett krav, inte en bonus ═══
# ci.yml:s `lint`-jobb kör OVILLKORAT på varje main-push (inget if, inget
# needs) och dess `docs`-jobb kör på docs-ändringar. Den här filen rör inget av
# det: den kör ENBART den tunga sviten via samma EN KÄLLA (ci-suite.yml) —
# alltså exakt det lager dedupen släcker, och ingenting annat.
#
# Den FÖRLITAR sig heller inte på ci.yml:s main-push-körning: sviten anropas
# härifrån oavsett vad dedupen beslutade, eftersom det är just dedupen som
# skapar hålet.
#
# ═══ ADDITIV OCH AVBROTTSFRI — per konstruktion, inte per löfte ═══
# Workflowen triggar FÖRST EFTER att mergen skett. Den kan därför strukturellt
# inte blockera en landning. Den är INTE och ska ALDRIG bli en required check:
# rulesetet `main-skydd` (id 19627609) har exakt en — `CI Passed or Skipped` i
# ci.yml — och hela poängen med det här lagret är att stå utanför den.
#
# ═══ MÅLET FÖR A7:5–A7:6 (TASK-70.3 / TASK-70.4) — BÅDA LANDADE ═══
# När `Staging (API + E2E)` och `A11y (axe-runner)` flyttades UR PR-grinden var
# det HIT de flyttades. Ordningen var en invariant: utan lagret tas kontrollen
# bort i stället för väntan.
#
# A7:5 (TASK-70.3): `Staging (API + E2E)` + `Staging sentinel purge` körs inte
# längre av ci.yml (`with: run_staging: false`, villkorslöst).
# A7:6 (TASK-70.4): `A11y (axe-runner)` likaså (`with: run_a11y: false`,
# villkorslöst). ci.yml instansierar därmed tre av ci-suite.yml:s sex tunga
# jobb (`Pure + Build`, `Acceptance (hermetisk)`, `Webblasarbeteende` —
# TASK-131 lade den sjätte utan eget villkor, av samma skäl som de andra två:
# inga secrets, ingen staging-beröring); de tre övriga instansieras HÄR och i
# nightly.yml.
#
# SKILLNADEN MELLAN DE TVÅ FLYTTARNA, ÖPPET: staging FLYTTADE hit. A11y kördes
# redan här före A7:6 (anropet nedan skickar inga inputs och fick defaulten
# `true` även då — post-merge-körning 30402869073, a11y 119 s grön). A7:6 tog
# alltså bort PR-sidans DUBBLETT, inte en kontroll som saknade hemvist. Denna
# fil blev därför primär bärare av staging-signalen med A7:5, men var redan
# bärare av a11y-signalen före A7:6.
#
# RIBBAN ÄR ORÖRD. Tillgänglighet är 11 utan undantag (CLAUDE.md
# § Kvalitetsribba) och 0-violations-regeln (ADR-045 § Beslut 2) står kvar.
# Det som ändrades var när den mäts, inte hur högt den ligger.
#
# ═══ MUTEX-KOSTNADEN, ÖPPET BOKFÖRD — OCH BETALD ═══
# Anropet nedan skickar INGEN `run_staging`-input och får därmed ci-suite.yml:s
# default `true` — samma form som nightly.yml. Före A7:5 var konsekvensen att
# varje KOD-landning på main tog den globala `staging-tests`-mutexen
# (ci-suite.yml, jobbet `test-staging`) EN GÅNG TILL, utöver PR-körningen som
# redan tagit den: 1 körning före lagret, 2 efter.
#
# Kostnaden var ÖVERGÅNGSVIS OCH AVSIKTLIG, och A7:5 betalade den. PR-körningen
# tar inte längre mutexen, så en landad kod-PR ger åter EN mutex-tagning — men
# nu på det MERGADE trädet i stället för på PR-headen, vilket är hela poängen.
#
# LEVERN STÅR KVAR SKRIVEN, av samma skäl som förut: `with: {run_staging: false}`
# på suite-jobbet nedan behåller acceptance + a11y + pure/build på det mergade
# trädet men avstår från staging. Efter A7:5 vore den dock ett helt annat beslut
# än före — det finns ingen annan yta som kör staging på det landade trädet
# förrän natten. Att dra i den är att lämna varje kod-landning utan
# staging-täckning i upp till ett dygn. Skrivet, inte tyst utövat.
#
# ═══ DOCS-LANDNINGAR ÄR UNDANTAGNA — ÄRVD KLASSNING (TASK-73) ═══
# Talen ovan gäller KOD-landningar. För DOCS-landningar var de andra och sämre:
# 0 mutex-takers före lagret (PR-grindens svit skippad av D0, main-pushens av
# dedupen) mot 1 efter — en ökning från noll, för en diff som strukturellt inte
# kan påverka något testet mäter.
#
# Det var inte teori. Merge `ed51b95` landade ÅTTA rader i en enda `.md`-fil;
# post-merge-körning 30393323548 körde full staging på den och tog mutexen.
# Revert-PR #375 (körning 30393415005) låg `pending` på samma mutex och kunde
# inte landa; `ci-wait.sh` timade ut efter 900 s. Revert-vägen — som finns till
# för att vara SNABB — blockerades av en markdown-landning. Mätt: revert-commit
# → landad merge 25 min 16 s, mot en CI-kostnad under en minut för en
# docs-revert (CONTRIBUTING.md § Revert-vägen).
#
# `klassning`-jobbet nedan stänger det genom att ÄRVA ci.yml:s beslut om exakt
# samma träd — det räknar aldrig om klassningen, och har därför ingen kopia av
# glob-listorna som kan drifta (ADR-077 § Beslut 1 avvisar den formen; en andra
# hemvist utan paritetsgrind är restlistans A3-skuld en gång till). Skriptets
# enda koppling till ci.yml är jobbnamnet `Test suite`, och den grindas
# mekaniskt av scripts/test-classify-post-merge.sh T13.
#
# ENDAST D0 ÄRVS. `ui_low_risk` (D1) och `acceptance_local` ärvs MEDVETET INTE:
# de släcker staging som RISKREDUKTION, vilket är precis varför sådana träd
# landar utan staging-täckning — punkt 2 i § VARFÖR FILEN FINNS ovan, alltså
# halva skälet att lagret existerar. D0 säger något annat: diffen kan
# STRUKTURELLT inte påverka sviten, så det finns ingen täckning som saknas.
#
# FORMEN BAR ÖVER A7:5 (TASK-70.3) UTAN ATT RIVAS UPP — vilket den nu bevisligen
# gjorde: staging ligger ur PR-grinden, D0-landningar hoppas fortfarande här, och
# allt annat — inklusive D1 och acceptance_local — kör staging här. Det var exakt
# det beteende A7:5 behövde, och skälet att lagret ärver EN klassbit i stället
# för tre.
#
# MEN FORMEN BAR INTE ÖVER MERGE QUEUE (TASK-70.1) — den bröts samma dag kön
# landade, och lagningen är TASK-78. Kön bygger varje post mot `main`s AKTUELLA
# spets, så merge-commitens träd bär mer än PR:ens egen diff så snart `main` rört
# sig sedan PR-headen skrevs. Träd-identiteten mot PR-headen fällde då till full
# svit — inklusive staging — på rena docs-landningar. Villkoret var INTE "inte
# först i kön": `#423` låg ensam i kön och drabbades ändå. Mätt: 6 av de 14
# senaste landningarna drog full svit i onödan.
#
# SKRIPTET LÄSER DÄRFÖR KÖ-KÖRNINGEN FÖRST. Kön kör ci.yml med
# `event=merge_group` på EXAKT den commit som landar (kö-körning 30438569547 har
# `headSha` = merge-commiten `58a1a10` för `#423`), så klassningen finns redan,
# på rätt träd — och behöver ingen träd-jämförelse, eftersom identiteten är SHA:t
# självt. PR-vägen står kvar för landningar utanför kön. Formerna, de förkastade
# alternativen och kö-basens verifiering: se skriptets § TVÅ KÄLLOR.
#
# ═══ ÖPPET BOKFÖRD BEGRÄNSNING ═══
# Larm-jobbet bor INNE i den körning det bevakar och kan därför bara larma om
# körningen faktiskt äger rum. Ett `startup_failure` (noll jobb instansieras)
# lämnar inget spår — exakt den defekt nightly-watchdog.yml byggdes för på
# nattsidan. Motsvarande vakt för denna workflow finns INTE och är medvetet
# INTE byggd här: den hör till en egen avvägning om huruvida en andra vakt
# tjänar mer än den kostar. Bokförd, inte antagen bort.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: >-
          true = ett självtest-jobb failar MED AVSIKT så larmkedjan prövas mot
          ett ÄKTA failure-resultat i larmets needs — inte via en bypass i dess
          if-villkor. Sviten hoppas då över: beviset ska vara billigt och aldrig
          ta staging-mutexen. Städa test-ärendet med motivering.
        type: boolean
        default: false

# Least-privilege default (ADR-029 §4); jobben höjer själva där de måste.
permissions: {}

# Per-SHA-grupp, cancel-in-progress OSATT: DENNA GRUPP avbryter aldrig en
# post-merge-körning genom att en annan tränger undan den. En serialiserande
# grupp (som nightly.yml:s `nightly`) vore FEL här — GitHubs default-
# concurrency håller bara EN väntande körning, så en tredje landning hade
# avbrutit den andras väntande körning och tyst tappat dess täckning. Per-SHA
# ger en körning per landat träd, alltid.
#
# RÄTTAT (T135, 2026-08-10 — TASK-178). Raden stod tidigare "en post-merge-
# körning avbryts ALDRIG" utan kvalificering. FALSIFIERAT: den här GRUPPEN
# skyddar bara mot grupp-nivå-eviction (dess enda jurisdiktion) — den skyddar
# INTE mot att `suite`-jobbets EGET tak (ci-suite.yml, jobbet `test-staging`,
# `timeout-minutes: 12`) slår till. Ett sådant timeout ger IDENTISK signatur
# i API:t — `conclusion: cancelled`, loggraden "The operation was canceled."
# — som en grupp-eviction, eftersom GitHub sedan en plattformsändring inte
# längre skriver ut VILKEN mekanism som avbröt körningen (community-
# diskussion github.com/orgs/community/discussions/40582). Tre reproducerade
# instanser (körning 31196593426/31197915169/31198327068, 2026-08-07) mätte
# jobbets väggklocka (started_at → completed_at) till 12m15–12m16s — exakt
# `timeout-minutes: 12`, inte en mutex-krock (`staging-tests`-gruppens
# `queue: max` kan per GitHubs dokumentation bara evictera VÄNTANDE poster,
# aldrig en redan PÅGÅENDE — och alla tre hade redan klarat API-steget när
# E2E-steget avbröts). Full diagnos, källor och den öppna eskaleringen:
# tasks/threads/T135-post-merge-korningen-avbryts-trots-att-filen-sager-aldrig.md.
concurrency:
  group: post-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # ÄRVD KLASSNING (TASK-73). Besvarar EN fråga om det landade trädet: skippade
  # PR-grinden HELA testsviten för det? Klassningen räknas inte om — den LÄSES
  # ur ci.yml:s körning på samma träd (se § DOCS-LANDNINGAR i huvudet).
  #
  # Jobbet gör checkout men bär MEDVETET ingen fetch-depth-rad: skriptet utför
  # noll git-operationer — föräldrar och träd hämtas ur commits-API:t. Det står
  # därmed utanför fetch-depth-bärar-mängden by design (ADR-039), och
  # invarianten (scripts/check-fetch-depth-invariant.sh) läser dessutom bara
  # ci.yml. Lägg ALDRIG en fetch-depth-rad här utan att läsa den grinden först.
  #
  # FAIL-CLOSED HELA VÄGEN: varje avvikelse — API-fel, träd-avvikelse, ingen
  # andra förälder, ingen grön PR-körning — ger docs_only=false, alltså full
  # svit. En besparing får aldrig bli ett hål (ADR-077 § Beslut 2). Skulle
  # jobbet självt FALLA hoppas sviten, men då är `klassning` med i larmets
  # `needs` och ärendet skapas: en trasig klassning betyder att ingen svit kördes,
  # och det får aldrig vara tyst (L321/L322-klassen).
  klassning:
    name: Ärvd klassning — körde PR-grinden sviten?
    if: ${{ !inputs.simulate_failure }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      # contents: read — checkout + commits-API (föräldrar och träd-SHA).
      contents: read
      # actions: read — `gh run list` / `gh run view` mot ci.yml-körningen på
      # PR-headen. Utan grantet får anropen 403 (samma fälla som TASK-51 fann i
      # nightly.yml:s larm-jobb); skriptet fångar det och faller till full svit.
      actions: read
    outputs:
      docs_only: ${{ steps.klassa.outputs.docs_only }}
    steps:
      - name: Checkout
        # SHA-pin: se ci.yml:s FÖRSTA Checkout-steg (jobbet `changed`) för
        # hela rationalen (TASK-312, 2026-08-24).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Ärv ci.yml:s klassning för det landade trädet
        id: klassa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: bash scripts/classify-post-merge.sh "${SHA}"

  # Den tunga sviten via EN KÄLLA (ci-suite.yml, delad med ci.yml och
  # nightly.yml). Hoppas i självtest-läge (se `sjalvtest` nedan) OCH när
  # klassningen ärvt ett D0-beslut — då körde PR-grinden ingen svit heller,
  # eftersom diffen strukturellt inte kan påverka den.
  suite:
    name: Verifierande svit på det mergade trädet
    needs: [klassning]
    if: ${{ !inputs.simulate_failure && needs.klassning.outputs.docs_only != 'true' }}
    # Permissions-taket för ci-suite.yml. Ett anropat workflow kan bara BEHÅLLA
    # eller MINSKA anroparens token-permissions, aldrig eskalera (L326; GitHub
    # Docs: "Permissions can only be maintained or reduced—not elevated—
    # throughout the chain"). Utan detta grant ärver jobbet topp-nivåns
    # `permissions: {}`, och ci-suite:s `contents: read` för checkout blir en
    # ESKALERING ⇒ startup_failure. Tredje anroparen; de två föregående
    # (ci.yml, nightly.yml) fick var sin skarp startup_failure innan grantet satt.
    permissions:
      contents: read
    uses: ./.github/workflows/ci-suite.yml
    # INGEN `with:` — ci-suite.yml:s defaulter gäller (`run_staging: true`,
    # `run_a11y: true` OCH `acceptance_selection: ''`), samma form som
    # nightly.yml. Se § MUTEX-KOSTNADEN i huvudet: talet är mätt, och levern för
    # att sänka det står skriven där.
    # Sedan A7:5 (TASK-70.3) är detta anrop den ENDA ytan som kör staging på ett
    # landat träd före natten, och sedan A7:6 (TASK-70.4) gäller detsamma för
    # a11y. Utelämnandet av `with:` är alltså inte längre en default man ärver,
    # utan den rad som bär ALLA TRE kontrollerna.
    #
    # DEN TREDJE KOM MED TASK-75 och är av en annan sort än de två andra. Där
    # `run_staging`/`run_a11y` styr OM ett jobb instansieras, styr
    # `acceptance_selection` HUR MYCKET `Acceptance (hermetisk)` kör: tom sträng
    # = hela klassens 18 spec-filer. PR-grinden kan skicka ett urval när diffen
    # rör enbart spec-filer, och det urvalet är försvarbart ENDAST för att denna
    # rad kör full klass på det mergade trädet (ADR-077 § Kontext,
    # Google-modellen). scripts/test-acceptance-urval.sh T15f grindar defaulten.
    #
    # Att lägga till en `with:` här släcker alltså antingen ett jobb som ingen
    # annan yta kör förrän natten, eller — för den tredje inputen — smalnar av
    # det enda stället där hela acceptance-klassen möter ett landat träd.
    secrets: inherit

  # Självtestet (tvåsidigt bevis, gate-proof.yml:s form). Normalt SKIPPAT — det
  # instansieras bara av en dispatch med simulate_failure=true, och failar då
  # genuint. Poängen: larmkedjan prövas mot ett ÄKTA `failure`-resultat i
  # needs, genom exakt samma väg som en röd svit tar. nightly.yml:s
  # `simulate_failure` går i stället runt sitt needs-villkor via larmets
  # if-uttryck — det bevisar att ärendet KAN skapas, men inte att en röd svit
  # faktiskt utlöser det. Här bevisas hela vägen.
  sjalvtest:
    name: Självtest — framkalla rött (endast simulate_failure)
    if: ${{ inputs.simulate_failure }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Fail on purpose
        run: |
          echo "Framkallar ett ÄKTA failure-resultat i larmets needs."
          echo "Ingen bypass: larmet läser needs.*.result precis som vid en röd svit."
          exit 1

  # EXPONERINGSFÖNSTRET (kortets § VAD SOM MÅSTE MÄTAS). Tiden från merge till
  # post-merge-svar är hur länge ett fel kan ligga oupptäckt i main, och det är
  # siffran A7:5 och A7:6 lutar sig mot när de tar bort blockerande kontroller.
  # Utan den mätningen är de två skivorna obelagda — därför mäts den VARJE
  # körning och skrivs till körningens step-summary, inte en gång vid bygget.
  #
  # `if: always()` ENSAMT: fönstret ska mätas även när sviten är RÖD — en röd
  # körning är precis den vars fönster betyder något. Jobbet har `permissions:
  # {}` och gör ingen checkout: hela mätningen finns i push-eventets nyttolast.
  exponeringsfonster:
    name: Exponeringsfönster (merge → svar)
    needs: [klassning, suite, sjalvtest]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Mät fönstret och publicera det som tal
        env:
          MERGE_TS: ${{ github.event.head_commit.timestamp }}
          NEEDS: ${{ toJSON(needs) }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          {
            echo "## Post-merge — exponeringsfönster"
            echo ""
            echo "| Vad | Värde |"
            echo "|---|---|"
            echo "| Mergat träd | \`${SHA:0:12}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

          # Tomt MERGE_TS = workflow_dispatch (inget head_commit i nyttolasten).
          # Rapportera det som EJ TILLÄMPLIGT, aldrig som noll: ett påhittat
          # tal är värre än ett uteblivet (L322-klassen — frånvaro är inte data).
          if [ -z "${MERGE_TS}" ]; then
            echo "| Fönster | _ej tillämpligt — dispatch, inget \`head_commit\`_ |" >> "${GITHUB_STEP_SUMMARY}"
            echo "Fönstret mäts bara på push-event. Detta är en dispatch."
          else
            merge_epoch=$(date -u -d "${MERGE_TS}" +%s)
            now_epoch=$(date -u +%s)
            window=$(( now_epoch - merge_epoch ))
            {
              echo "| Merge-commitens tidsstämpel | \`${MERGE_TS}\` |"
              echo "| **Exponeringsfönster (merge → svar)** | **${window} s** |"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "Exponeringsfönster: ${window} s (merge ${MERGE_TS} → nu)."
          fi

          {
            echo ""
            echo "### Jobbresultat"
            echo ""
            echo '```'
            jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${NEEDS}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # LARMKEDJAN. Fyrar vid RÖTT (eller cancelled — utebliven dom är inte grön,
  # L321/L322-klassen) och skapar ett TILLDELAT ärende med REVERT-FÖRSLAG.
  # Grönt post-merge ⇒ jobbet skippas ⇒ inget ärende, inga spår.
  #
  # Ärendet bär medvetet MER än nattärendet, av ett skäl: en röd post-merge
  # ställer EN fråga — ska den här landningen backas? — och den frågan kan inte
  # besvaras utan (a) vilka jobb som föll, (b) om föregående post-merge var
  # grön (⇒ den här landningen är misstänkt) eller redan röd (⇒ felet är äldre
  # och en revert av DENNA commit är sannolikt fel åtgärd), och (c) ett
  # revert-kommando med RÄTT form. Allt tre hämtas nedan, och varje hämtning
  # som misslyckas rapporteras som OKÄND — aldrig som ett faktapåstående byggt
  # på frånvaro av data.
  #
  # `exponeringsfonster` INGÅR i needs, av samma skäl som nightly.yml lägger
  # sitt `nightly-metrics` i larmets needs: röda MÄTNINGAR får aldrig vara
  # tysta (L321-klassen). Fönstret är talet A7:5 och A7:6 lutar sig mot — går
  # mätningen sönder utan att någon får veta, fattas nästa beslut på en siffra
  # ingen längre producerar. Ärendets tolkningshjälp skiljer det fallet från
  # en äkta regression, så signalen inte devalveras.
  #
  # `klassning` INGÅR av ett skarpare skäl (TASK-73): faller det jobbet hoppas
  # `suite` på sitt needs-villkor, och då kördes INGEN svit på det landade
  # trädet. Utan posten i needs vore utfallet en grön post-merge utan täckning —
  # fail-open i sin renaste form. Skriptet självt är fail-closed på varje
  # API-avvikelse och faller till full svit; needs-posten täcker det som är kvar,
  # alltså att jobbet inte kör alls.
  larm:
    name: Larm vid rött post-merge
    needs: [klassning, suite, sjalvtest, exponeringsfonster]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      # contents: read — `gh api repos/.../commits/<sha>` för antalet föräldrar
      # (avgör om revert-förslaget ska bära `-m 1` eller inte).
      contents: read
      issues: write
      # actions: read — `gh run list` mot körnings-API:t för föregående
      # post-merge-körnings utfall. Ospecificerade permissions sätts till none,
      # så utan grantet får anropet 403 (samma fälla som TASK-51 fann i
      # nightly.yml:s larm-jobb).
      actions: read
    steps:
      - name: Skapa tilldelat ärende med revert-förslag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          NEEDS: ${{ toJSON(needs) }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SIMULATED: ${{ inputs.simulate_failure }}
        run: |
          set -euo pipefail
          run_url="${SERVER}/${REPO}/actions/runs/${RUN_ID}"
          short="${SHA:0:12}"

          # --- (a) Vilka jobb föll ------------------------------------------
          roda=$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key) (\(.value.result))"] | join(", ")' <<<"${NEEDS}")

          # --- (b) Föregående post-merge-körning på main --------------------
          # Exit-koden fångas SEPARAT från resultatet. Formen `$(gh … || echo "")`
          # kollapsar "anropet gick fel" och "det finns inget svar" till samma
          # tomma sträng, och då byggs ett faktapåstående på frånvaro av data
          # (TASK-51, L322-klassen). --repo är OBLIGATORISK: jobbet gör ingen
          # checkout, så gh kan inte härleda repot ur en git-remote.
          gh_failed=""
          forra=$(gh run list --repo "${REPO}" \
            --workflow post-merge.yml --branch main --event push \
            --limit 2 --json conclusion,databaseId \
            --jq "[.[] | select(.databaseId != ${RUN_ID})][0].conclusion // \"\"") || gh_failed="1"

          if [ -n "${gh_failed}" ]; then
            historik="**OKÄND** — anropet mot körnings-API:t misslyckades. Detta är inte ett påstående om historiken; kontrollera att larm-jobbet har \`actions: read\`."
          elif [ -z "${forra}" ]; then
            historik="**Ingen tidigare post-merge-körning** på main — det här är den första. Ingen jämförelse att göra."
          elif [ "${forra}" = "success" ]; then
            historik="Föregående post-merge-körning var **GRÖN** ⇒ den här landningen är den primära misstänkta. Revert nedan är sannolikt rätt första åtgärd."
          else
            historik="Föregående post-merge-körning var **\`${forra}\`** ⇒ felet är sannolikt ÄLDRE än den här landningen. **Revertera inte reflexmässigt** — leta upp den första röda körningen först, annars backas fel commit."
          fi

          # --- (c) Revert-förslag med RÄTT form -----------------------------
          # En merge-commit kräver `-m 1`; en enkel commit gör inte det, och fel
          # form ger ett revert-kommando som bara failar när det behövs som mest.
          # Föräldraantalet hämtas i stället för att gissas.
          api_failed=""
          parents=$(gh api "repos/${REPO}/commits/${SHA}" --jq '.parents | length') || api_failed="1"

          if [ -n "${api_failed}" ]; then
            revert_cmd="git revert -m 1 ${SHA}   # OBS: föräldraantalet kunde inte hämtas — utelämna '-m 1' om detta INTE är en merge-commit"
          elif [ "${parents}" -gt 1 ]; then
            revert_cmd="git revert -m 1 ${SHA}"
          else
            revert_cmd="git revert ${SHA}"
          fi

          # --- Dedup: en re-körning av samma röda körning ska inte ge två ---
          # ärenden. Nyckeln är TRÄDET (kort SHA i rubriken), inte etiketten:
          # varje rött träd är en egen incident med ett eget revert-beslut, så
          # ett stående ärende (jfr `links-arende` i nightly.yml) vore fel form
          # här. Dedupen gäller alltså per commit, inte per kanal.
          list_failed=""
          befintligt=$(gh issue list --repo "${REPO}" --label ci-post-merge \
            --state open --limit 50 --json number,title \
            --jq "[.[] | select(.title | contains(\"${short}\"))][0].number // \"\"") || list_failed="1"

          if [ -n "${list_failed}" ]; then
            echo "::error::Kunde inte läsa befintliga ci-post-merge-ärenden — kanalen är inte verifierbar denna körning."
            exit 1
          fi

          note=""
          if [ "${SIMULATED}" = "true" ]; then
            note=$'\n> ⚠️ **SIMULERAT** via `simulate_failure`-dispatch — larmkedje-test, ingen äkta regression. Stäng med denna motivering.\n'
          fi

          cat > /tmp/post-merge-body.md <<EOF
          Post-merge-lagret (\`post-merge.yml\`) blev rött på ett träd som redan ligger i \`main\`.
          ${note}
          | | |
          |---|---|
          | **Körning** | ${run_url} |
          | **Mergat träd** | \`${SHA}\` |
          | **Röda jobb** | ${roda:-_inga i needs — se körningen_} |

          **Merge-commitens meddelande**

          \`\`\`
          ${COMMIT_MSG:-<ej tillgängligt — dispatch>}
          \`\`\`

          ## Är det den här landningen?

          ${historik}

          ## Revert-förslag

          Direktpush till \`main\` avvisas av rulesetet (ADR-076) — reverten går via PR som allt annat:

          \`\`\`bash
          git fetch origin main
          git checkout -b revert/${short} origin/main
          ${revert_cmd}
          git push -u origin revert/${short}
          gh pr create --fill
          \`\`\`

          ## Stängningsregel

          Ärendet stängs ENDAST med (a) en åtgärd som fixar grundorsaken, (b) en genomförd revert, eller (c) en öppet skriven motivering — aldrig tyst. Samma regel som nattnätet (\`CONTRIBUTING.md\` § Nattnätet).

          ## Tolkningshjälp — läs FÖRE revert

          - **Är \`Acceptance (hermetisk)\` det enda röda jobbet?** Sviten har en mätt flake-historia (\`TASK-64\` + \`TASK-74\`, båda Done sedan 2026-07-29 med belägg — klass A:s fix mätt 3/8 → 0/8 fällningar, klass B:s rest kartlagd i \`TASK-74\`). En första omkörning är därför ett rimligt steg. Men fäller körningen igen: det är INTE längre täckt av känd flake — behandla upprepad fällning som en möjlig äkta regression och gå revert-vägen.
          - **Är \`Exponeringsfönster (merge → svar)\` det enda röda jobbet?** Då är det MÄTNINGEN som gått sönder, inte \`main\`. Reverta ingenting; laga mät-steget i \`post-merge.yml\`.
          - **Är \`Staging (API + E2E)\` \`cancelled\` (INTE \`failure\`)?** Jobbet bär ett eget \`timeout-minutes: 12\`-tak (ci-suite.yml) — en HELT ANNAN avbrottskälla än concurrency-gruppen ovan. GitHub skriver samma generiska "The operation was canceled" för båda, utan att skilja dem (github.com/orgs/community/discussions/40582). Läs jobbets väggklocka: \`gh api repos/${REPO}/actions/jobs/<id> --jq '{started_at,completed_at}'\`. Ligger den på ~12 min är det ett SJÄLVPÅFÖRT timeout — inte en mutex-krock och inte nödvändigtvis en kodregression. Tre verifierade instanser (T135, 2026-08-10): tasks/threads/T135-post-merge-korningen-avbryts-trots-att-filen-sager-aldrig.md. Reverta inte reflexmässigt; en omkörning är rimlig först.
          - **Är staging, bygget, acceptance-självtestet eller a11y RÖTT (\`failure\`, inte \`cancelled\`)?** Ingen av brasklapparna ovan gäller — behandla det som en äkta regression.
          EOF

          # gh — MEDVETET OPINNAD (TASK-312, 2026-08-24): körs på en
          # GitHub-hostad runner där gh är förinstallerat och
          # versionshanterat av GitHub självt — vi äger inte den
          # installationsvägen (samma kategori som jq där, se
          # scripts/lib/jq-guard.sh § DEN ENA UNDANTAGNA ANROPSPUNKTEN).
          # Se scripts/lib/gh-guard.sh § SCOPE för den fulla avvägningen.
          if [ -n "${befintligt}" ]; then
            gh issue comment "${befintligt}" --repo "${REPO}" \
              --body-file /tmp/post-merge-body.md
            echo "Kommenterade befintligt ärende #${befintligt} (samma träd ${short} — dedup)."
          else
            gh issue create \
              --repo "${REPO}" \
              --title "🔻 Post-merge rött — \`${short}\` ($(date -u +%F))" \
              --body-file /tmp/post-merge-body.md \
              --label ci-post-merge \
              --assignee marcus803
            echo "Skapade nytt post-merge-ärende för träd ${short}."
          fi
