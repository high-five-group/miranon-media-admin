        # utan token och med globalThis.fetch spärrad till throw: exit 0 båda
        # gångerna. Villkoret faller alltså inte ut — sviten är hermetisk och hör
        # i den billiga klassen.
        #
        # Korsläsningen mot policy-filen bär samma PR-argument som steget ovan: en
        # PR som breddar purge-mönstret kan få granskningsfixturen att städas bort
        # mitt under en pågående granskning, och det ska fällas före landning.
        #
        # ≈0,1 s LOKALT mätt (macOS, 2026-07-29) — CI-tiden är inte mätt av mig.
        run: node scripts/test-seed-review-fixture.mjs

      - name: Test facit:godkann-skriptets guard-funktioner (TASK-167)
