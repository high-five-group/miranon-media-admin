  # Job 3: Tung testsvit — anropar den reusable ci-suite.yml (EN KÄLLA,
  # delad med nightly.yml OCH post-merge.yml; task-36.2 / ADR-077). Villkorat på
  # changed-detection: HELA svit-anropet skippas på doc-only-commits
  # (should_skip_tests) → aggregatorn ser 'suite: skipped' (tolererat).
  # secrets: inherit → staging-secrets når inner-jobben (bevisat via spike
  # 2026-07-23, run 30036119790). Dependabot-hanteringen bor INNE i
  # ci-suite.yml (per-jobb) — test-fast måste köra även för dependabot.
  suite:
    name: Test suite
    needs: changed
    # Skippas vid docs-only (should_skip_tests) ELLER merge-dedup-träff
    # (dedup_hit, task-36.4): main-push vars träd redan bevisats grönt kör inte
    # om tunga jobb. Paraply-checken (ci-passed, always()) blir grön ändå —
    # skipped tolereras (AC#3). Fail-closad dedup ⇒ full svit vid varje tvivel.
    if: ${{ needs.changed.outputs.should_skip_tests != 'true' && needs.changed.outputs.dedup_hit != 'true' }}
    # Permissions-taket för det anropade ci-suite.yml. Ett anropat workflow kan
    # bara BEHÅLLA eller MINSKA anroparens token-permissions, aldrig eskalera
    # (GitHub Docs: "Permissions can only be maintained or reduced—not
    # elevated—throughout the chain"). ci.yml:s topp-nivå är permissions: {}
    # (least-privilege default, ADR-029 §4) — utan detta grant ärver suite-
    # jobbet {} och ci-suite:s jobb (contents: read för checkout) blir en
    # eskalering ⇒ startup_failure. Empiriskt fångat S79 (run 30037333924);
    # spike 30036119790 var grön just för att dess reusable-jobb bar {}.
    permissions:
      contents: read
    uses: ./.github/workflows/ci-suite.yml
    # ═══ STAGING LIGGER INTE LÄNGRE I PR-GRINDEN (A7:5 / TASK-70.3) ═══
    # `run_staging: false` är VILLKORSLÖST. `Staging (API + E2E)` och
    # `Staging sentinel purge` instansieras därmed aldrig av ci.yml — varken på
    # `pull_request` eller på `push` till main.
    #
    # KONTROLLEN ÄR FLYTTAD, INTE BORTTAGEN. Båda jobben körs oförändrat på de
    # två andra anropar-ytorna, som medvetet INTE skickar inputen och därför får
    # ci-suite.yml:s default `true`:
    #   · post-merge.yml — varje kod-landning på main, direkt efter merge.
    #   · nightly.yml    — full bredd varje natt.
    # Ordningen var en invariant, inte en preferens: post-merge-lagret
    # (TASK-70.2) och den skrivna revert-vägen (TASK-70.5) landade FÖRE denna
    # rad. Utan bådadera hade raden tagit bort en kontroll i stället för väntan.
    #
    # VARFÖR — MUTEXEN, INTE SEKUNDERNA. Jobbet självt bär 375 s (run
    # 30369011230), men den kostnad som faktiskt växer är den globala
    # `staging-tests`-mutexen (ci-suite.yml, jobbet `test-staging`): den
    # serialiserar över ALLA staging-rörande körningar — PR ∥ PR, PR ∥ main-push,
    # PR ∥ natt. Mätt 2026-07-28 på två fulla körningar med IDENTISKT
    # svit-innehåll: run 30400021534 = 7,8 min (jobben startade 19 s isär och
    # kördes parallellt) mot run 30400640305 = 20,3 min (staging startade
    # 5 min 36 s EFTER att acceptance var klar — den stod i kö). Hela skillnaden
    # var kötid. Ur PR-vägen slutar kritiska vägen alltså VÄXA med antalet
    # parallella PR:er, och det är den egenskap ett flöde med flera samtidiga
    # agenter behöver mest.
    #
    # VARFÖR LITTERALT `false` OCH INTE ETT UTTRYCK. Ett villkor är en fråga om
    # NÄR staging ska köras här — och svaret är aldrig. En villkorings-mekanism
    # hade beskrivit en grind som inte längre finns, och hade dessutom behövt
    # rivas igen när merge queue (TASK-70.1) lägger `merge_group` bredvid
    # `pull_request`: två ytor som båda måste minnas att släcka samma sak.
    #
    # ÄRLIGT OM VAD SOM VINNS. Väggklockan för EN ensam kod-PR sjunker knappt:
    # `Acceptance (hermetisk)` blir ensam bärare av kritiska vägen och är mätt
    # till 404 s (`#318`), 407 s (`#323`) och 452 s (`#324`). Taket ligger därför
    # kvar kring 7 min även efter denna rad. TASK-75 är kortet som sänker det;
    # denna rad tar bort kön, inte sviten.
    #
    # FÖLJD SOM BOKFÖRS ÖPPET: `ui_low_risk` (D1, task-36.3) och
    # `acceptance_local` (task-59.7) hade `run_staging` som sin ENDA konsument.
    # De beräknas fortfarande i `changed`-jobbet men styr efter denna rad
    # ingenting. Stegen står kvar MEDVETET — de är inte glömda, och de rivs inte
    # på vägen förbi: ADR-077 § Beslut 1 äger klassrymden, och S91:s
    # arbetsflödes-granskning listar riskklassningen under "ska behållas orört".
    # A7:6 (a11y, TASK-70.4) ÅTERANVÄNDE DEM INTE — den skickar `run_a11y: false`
    # villkorslöst av samma skäl som raden ovan, så levrarna är fortfarande utan
    # konsument. Frågan om de ska avvecklas eller bevaras som klassrymdens
    # invariant är ett eget beslut och fattas inte som sidoeffekt här.
    #
    # ═══ A11Y LIGGER INTE HELLER I PR-GRINDEN (A7:6 / TASK-70.4) ═══
    # `run_a11y: false` är VILLKORSLÖST. `A11y (axe-runner)` instansieras därmed
    # aldrig av ci.yml — inte på `pull_request`, inte på `merge_group` (kö-ytan,
    # TASK-70.1) och inte på `push` till main. Samma tre ytor, samma ord: ett
    # yt-villkorat uttryck hade varit tre ställen att minnas i stället för ett.
    #
    # KONTROLLEN ÄR FLYTTAD, INTE BORTTAGEN — och den fanns redan på andra
    # sidan: post-merge.yml och nightly.yml utelämnar inputen, får defaulten
    # `true` och körde a11y även FÖRE denna rad (post-merge-körning 30402869073,
    # a11y 119 s grön). Det denna rad tar bort är alltså PR-sidans DUBBLETT av
    # ett jobb som ändå körs på det landade trädet.
    #
    # RIBBAN ÄNDRAS INTE — MÄTPUNKTEN GÖR DET. Repots kvalitetsribba säger
    # tillgänglighet 11 utan undantag (CLAUDE.md § Kvalitetsribba) och
    # 0-violations-regeln (ADR-045 § Beslut 2) står orörd. Skillnaden är NÄR den
    # mäts: efter merge i stället för före. Läser någon senare denna rad som en
    # sänkt ribba är det en felläsning — inget i toleransen, måltavlan eller
    # sviten är rört.
    #
    # ÄRLIGT OM VAD SOM VINNS — INTE VÄGGKLOCKA. A11y bär 103–104 s (run
    # 30369011230; 104 s i 30408622828) men kör PARALLELLT med `Acceptance
    # (hermetisk)`, som är kritiska vägen med 424 s i samma körning. Väggklockan
    # för en kod-PR sjunker därför inte alls av denna rad — den väntade
    # besparingen är NOLL sekunder, och det är det förväntade utfallet, inte ett
    # misslyckande. Vinsten mäts i runner-minuter: ~1,7 min per kod-PR-körning,
    # plus lika mycket per merge_group-körning av samma PR.
    #
    # OFÖRÄNDRAT AV DENNA RAD: `ci-passed` behåller sin needs-lista och sin
    # fail-closed-gren, och rulesetets enda required check heter fortfarande
    # `CI Passed or Skipped`. Aggregatorn ser numera `suite`-anropet utan sina
    # två staging-jobb och utan a11y — en ändrad jobb-mängd INUTI ett anrop som
    # fortfarande rapporterar sitt resultat uppåt.
    #
    # ═══ ACCEPTANCE-URVALET (TASK-75) ═══
    # Till skillnad från de två raderna ovan är detta INTE ett villkorslöst ord
    # utan ett UTFALL: `changed`-jobbets `acceptance_urval` är tom sträng i
    # varje läge utom ett — när varenda ändrad fil utanför D0-klassen är en
    # acceptance-spec-fil som finns på disk. Tomt = full klass, och tomt är
    # defaulten vid minsta osäkerhet (scripts/acceptance-urval.sh).
    #
    # VARFÖR EN INPUT OCH INTE EN RADERING: exakt samma skäl som `run_a11y`.
    # `post-merge.yml` och `nightly.yml` utelämnar inputen, får ci-suite.yml:s
    # default (tom) och kör därmed HELA klassen på varje mergat träd. Urvalet
    # existerar alltså bara på PR-ytan, och post-merge-lagret är det nät som gör
    # det försvarbart (ADR-077 § Kontext: en riskanpassad presubmit är
    # försvarbar ENDAST med ett post-submit-nät under sig).
    with:
      run_staging: false
      run_a11y: false
      acceptance_selection: ${{ needs.changed.outputs.acceptance_urval }}
    secrets: inherit

  # Job 4: Markdown link validation. Conditional på docs-changes.
  # Per ADR-029 §1d. Ny kvalitets-check som inte fanns innan ("höjer kvaliten").
  docs:
    name: Docs link check
    needs: changed
    if: needs.changed.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 = FULL historik (ADR-054, 2026-06-17) för
          # scripts/check-frontmatter.sh Check 2 (git log -1 --format=%cs -- <fil>).
          # Finit djup var anti-mönstret (1→50→100→250 brast 4 ggr när orörda
          # governing-docs passerade boundaryn). Konsistent med changed-jobbet;
          # invarianten (ADR-039) hålls enhetlig över alla 5 bärare.
          fetch-depth: 0

      - name: Run lychee link check (INTERN yta — offline)
        # SHA-pin per ADR-029 §6.
        # lychee-action v2.8.0 verifierad 2026-05-13 (K1.C Block 2), Rust-baserad.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          # ═══ ADR-082 (2026-07-28): DENNA HALVA ÄR INTERN-ONLY ═══
          # --offline byter ut lychees schema-filter till enbart "file", så varje
          # http(s)-adress klassas Status::Excluded — inte fel, inte timeout.
          # Verifierat i källkoden (lychee-bin/src/client.rs, taggen lychee-v0.24.2),
          # inte antaget ur hjälptexten.
          #
          # VARFÖR: grinden blockerar PR:er, och 467 av scopets 903 unika länkar är
          # externa, fördelade på 125 skilda värdar. Var och en kunde ensam rödmåla
          # en PR som inte rör den. Av nio undersökta branschledande projekt låter
          # NOLL externa länkar blockera en PR. Extern yta kontrolleras i stället
          # kallt varje natt (nightly.yml → nightly-links) med egen ärende-kanal.
          # Röd docs-grind betyder från och med nu "vår text pekar fel", aldrig
          # "internet hade en dålig dag".
          #
          # CACHEN ÄR BORTTAGEN med samma ändring: en körning utan nätverk har
          # ingenting att cacha. Mätt kostnad för hela den interna kontrollen är
          # 31 ms. --cache-exclude-status '429' var dessutom redan en no-op —
          # felcachning togs bort i lychee v0.24.0 och vi kör v0.24.2 sedan
          # 2026-07-19. --header (User-Agent) föll av samma skäl: ingen begäran skickas.
          #
          # Scope efter Marcus' Gate 2 anti-genväg-review + Commit 4a scope-konsistens:
          # INKLUDERAR: aktiva docs + aktiva tasks-dok + AKTIVA sessionsdok
          #             (tasks/sessions/*.md, Session 17 K7 — stänger L91/L97-
          #             felklassen; grind A-mätt 0-skuld) + repo-root .md
          # UTELÄMNAR: tasks/sessions/archive/** (frozen ADR-023) — K1.D §0 utelämning #1
          #            docs/archive/** (frozen ADR-023-mall, normaliserad i Commit 4a 2026-05-14)
          #            docs/reference/pocock/** (vendorerat externt Pocock-material, S47 Steg 0 —
          #            samma rationale som archive/: extern korpus, ej vår prosa)
          #            backlog/** (medvetet utanför — verktygsägd yta, L226; S48 Del 2 gren C)
          #
          # .claude/**/*.md TILLAGT S91 (TASK-71): agentdefinitionerna klassas nu
          # som docs i changed-files-stegen ovan, och då måste grindarna faktiskt
          # läsa dem. --exclude-path .claude/worktrees är no-op HÄR (worktrees är
          # gitignorerade och checkas aldrig ut i CI) men står med för att
          # scripts/check-docs.sh speglar detta block i sak — den lokala
          # körningen behöver raden, och divergens mellan de två är felklassen
          # skriptet finns för att stänga.
          #
          # SPEGLINGEN ÄR SEDAN TASK-85 GRINDAD, inte längre bara utlovad:
          # markörerna nedan avgränsar blocket för scripts/check-listparitet.sh,
          # som jämför det mot check-docs.sh:s motsvarande markerade block. Alla
          # kommentarer måste stå OVANFÖR start-markören — regionen mellan
          # markörerna läses som data.
          #
          # './tasks/lessons/*.md' TILLAGT TASK-161.9 (2026-08-08,
          # ADR-085-volymformen): 'tasks/*.md' korsar inte in i underkatalogen
          # (samma gräns-fråga som lessons.d ovan) — utan raden lämnas
          # volymfilernas länkar tyst okontrollerade.
          # paritet:start lychee-ci
          args: >-
            --offline
            --no-progress
            --verbose
            --exclude-path docs/archive
            --exclude-path docs/reference/pocock
            --exclude-path .claude/worktrees
            './docs/**/*.md'
            './tasks/*.md'
            './tasks/sessions/*.md'
            './tasks/threads/*.md'
            './tasks/lessons.d/*.md'
            './tasks/lessons/*.md'
            './.claude/**/*.md'
            './*.md'
          # paritet:slut lychee-ci
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check markdown hygiene (markdownlint-cli2)
        # Per ADR-030 § Del 1.1: markdownlint-cli2 som docs-grindvakt efter
        # Lychee. Config: .markdownlint-cli2.jsonc. Scope definierad i
        # config-filens "globs"-fält (docs + tasks + repo-root .md).
        # Sessionsdok-archive + docs/archive exkluderade.
        # Ingen pre-commit-hook — CI-only-grindvakt per Marcus' direktiv K4.
        run: npx markdownlint-cli2

      - name: Install Vale
        # Per ADR-030 § Del 1.3: Vale-binary-install via curl + tar (analog
        # till actionlint per ADR-029 § Utelämning #3). vale-action är
        # underhåll-osäker (~17 mån gammal); binary minimerar Actions-
        # supply-chain-yta.
        # SHA256 tillagd S88 (T85-korrigeringspaketet punkt 3) — steget hade
        # actionlint-formens curl+tar men saknade dess checksumme-koll, alltså
        # halva mönstret. Siffran verifierad tre oberoende vägar 2026-07-25:
        # egen nedladdning + sha256sum, Vale-projektets vale_3.14.1_checksums.txt,
        # och Releases-API:ts digest-fält — identiska. Releases är immutabla;
        # re-verifiering: ladda samma URL + sha256sum lokalt.
        # NOT: errata-ai/vale är omdöpt till vale-cli/vale — URL:en nedan lever
        # på GitHub-redirect (`-L` i curl-formen nedan). Byte av org-namn görs
        # vid nästa versions-bump, inte här (URL + checksumma hör ihop).
        #
        # TILLGÄNGLIGHET (TASK-92, 2026-07-30) — curl-flaggorna bär samma
        # rationale som `Install shellcheck (pinned v0.11.0)` i lint-jobbet, där
        # den är skriven i sin helhet: `--retry` ensam täcker en UPPRÄKNAD
        # felmängd som INTE rymmer exit 35 (CURLE_SSL_CONNECT_ERROR), och
        # --retry-all-errors (curl 7.71.0+; runnern kör 8.5.0) är flaggan som
        # täcker den. `-o` är förutsättningen — curl nollställer en
        # fildestination mellan försöken, en shell-omdirigering inte.
        # Detta var mönstrets TREDJE instans; TASK-83 åtgärdade de två i
        # lint-jobbet och RAPPORTERADE denna i stället för att tyst fixa den.
        #
        # EXPONERINGEN ÄR MÄTT, INTE ANTAGEN (2026-07-30): att docs-jobbet är
        # villkorat på `docs_changed` gör den INTE lägre. Över 300 ci.yml-runs
        # (2026-07-28T19:23Z→2026-07-30T19:15Z, `jobs?filter=all` så alla
        # attempts räknas) kördes detta steg 289 gånger, mot 305 för det
        # alltid-på lint-jobbets två steg — 95 %. Villkoret tar bort en
        # tjugondel av exekveringarna, inte en storleksordning, och därför
        # bär steget samma flaggor och inte en svagare variant.
        # sha256sum-verifieringen nedan är ORÖRD: kortet rör tillgänglighet,
        # inte pinning.
        run: |
          VALE_VERSION="3.14.1"
          VALE_SHA256="ff2b49ffaa9dcd246fd5008f03ff67746d2790b75bf4d3657e2fb9530fb96db3"
          VALE_URL="https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-max-time 60 "${VALE_URL}" -o /tmp/vale.tar.gz
          echo "${VALE_SHA256}  /tmp/vale.tar.gz" | sha256sum -c
          tar -xzf /tmp/vale.tar.gz -C /tmp
          sudo mv /tmp/vale /usr/local/bin/vale
          vale --version

      - name: Check prose with Vale
        # Per ADR-030 § Del 1.3 (post-K6.1+K6.2): Vale.Spelling AV (F.1'
        # engelsk-hunspell-mismatch), Vale.Repetition + Miranon-stilguide
        # (VueToReact + Brand + Undvik) + Vocab-genererad Vale.Terms.
        # Vale.Terms + Miranon.VueToReact deferade till Session 6.6.6 via
        # per-fil rad-1-disable (Alt F per K6.2 Steg 7).
        # Single-source: samma definition som lokalt `npm run lint:prose`
        # (package.json). Vale-binary installerad i föregående step; npm finns
        # via setup-node ovan. Session 7 K0.S2.
        run: npm run lint:prose

      - name: Validate Vale L_X.2 regression-test-suite
        # Per ADR-032 § Regression-skydd: 3-test AssertFlip-suite för
        # L_X.2-upstream-bug lift-trigger. T1 inverterad assertion
        # (PASS = bug bekräftad fortfarande); FAIL = lift-protokoll
        # aktiveras. T2 helfil-disable suppression. T3 Brand-rule
        # ej maskerad. Vale-binary redan installerad i föregående step.
        # Etablerad: Session 6.6.6 K3.6 (2026-05-20).
        run: bash scripts/test-vale-regression.sh

  # Job 5: Aggregator — REQUIRED CHECK för main-rulesetet (ADR-076).
  # Per ADR-029 §1e + S77-incidenten (PR #101): jobbet KÖR ALLTID och
  # rapporterar success ELLER failure — ALDRIG skipped. Gamla formen
  # (if-villkor som skippade jobbet vid failure i needs) var FAIL-OPEN
  # som required check: GitHub räknar en skipped check som uppfylld →
  # auto-merge mergade en RÖD PR (docs-jobb failure, aggregator skipped;
  # run 30023934304 → main-rött 30024005788). Detta är dual-signal-
  # behovet som ADR-029 utelämning #5 förutsåg ("explicit failure-signal
  # överflödig utan automation som läser den") — rulesetet ÄR den
  # automationen; signalen aktiverad här. Cancelled-gotchan (Commit 1.5:
  # per-job-cancellation osynlig för cancelled()) täcks av samma
  # needs-läsning: cancelled ⇒ explicit fail.
  # Fail-grenens gate-proof: gate-proof.yml (task-36.1, levererad S78) —
  # bevis-skulden BETALD (tvåsidigt: run 30032296699 grön + self-test
  # 30032299223 röd). Kör gate-proof.yml efter varje ci.yml-ändring (T85).
  ci-passed:
    name: CI Passed or Skipped
    if: ${{ always() }}
    needs: [changed, lint, docs, suite]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Verifiera needs-resultaten (fail-closed)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "${NEEDS}" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")] | length')
          if [ "${bad}" -ne 0 ]; then
            echo "❌ ${bad} jobb med failure/cancelled — aggregatorn FAILAR explicit (aldrig skipped; required-check-hålet stängt S77)."
            exit 1
          fi
          echo "✅ CI Passed or Skipped — alla jobb success eller skipped-by-design."
