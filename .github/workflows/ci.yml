---
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # MERGE QUEUE (A7:3 / TASK-70.1). GitHub är kategorisk: "You MUST use the
  # `merge_group` event to trigger your GitHub Actions workflow when a pull
  # request is added to a merge queue" — utan den startar de required checkarna
  # ALDRIG på kö-ytan, och mergen failar på en check som aldrig rapporteras.
  #
  # `checks_requested` är i skrivande stund den ENDA aktivitetstypen eventet
  # har. Den skrivs ändå ut: en tom `merge_group:` är ekvivalent i dag men
  # tyst om vad den lyssnar på, och en framtida andra typ skulle då tas in
  # utan beslut.
  #
  # Check-NAMNET måste vara identiskt på båda ytorna, annars matchar rulesetets
  # required check inte kö-körningen. Vi rapporterar `CI Passed or Skipped`
  # från samma aggregator-jobb oavsett event — se jobbet längst ned.
  merge_group:
    types: [checks_requested]
    branches: [main]

# Security hardening: least-privilege default per ADR-029 §4.
# GITHUB_TOKEN får endast contents:read via explicit grant i jobs.
permissions: {}

# Auto-cancel in-progress runs på samma branch/PR per ADR-029 §4.
#
# MERGE QUEUE-SKYDDET (TASK-70.1) — cancel-in-progress är AVSTÄNGT för
# `merge_group`, och det är inte en detalj. Att avbryta en kö-körning gör att
# dess required check aldrig rapporteras, PR:en faller ur kön, och i värsta
# fall fälls hela kön. Det är en dokumenterad merge queue-fälla
# (community-discussion #137976), inte en teoretisk risk.
#
# Nyckeln bär `merge_group.head_sha` EXPLICIT. Utan den raden hade uttrycket
# fallit till `github.sha`, som råkar vara unik per merge group — alltså rätt
# beteende av en slump, buret av att `event.number` är tom på kö-ytan. Ett
# skydd ingen skrivit medvetet är ett skydd nästa refaktor tar bort utan att
# veta om det.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  # Job 1: Detect changed files — sets should_skip_tests + docs_changed
  # outputs for downstream conditional jobs. Per ADR-029 §1a.
  changed:
    name: Detect changed files
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      # actions: read — dedup-steget (task-36.4) frågar körnings-API:t
      # (gh run list) om PR-headen redan har en grön CI-run. Minsta grant
      # utöver contents:read.
      actions: read
    outputs:
      should_skip_tests: ${{ steps.changed-files.outputs.only_changed == 'true' }}
      docs_changed: ${{ steps.changed-docs.outputs.any_changed == 'true' }}
      # ═══ UTAN KONSUMENT SEDAN A7:5 (TASK-70.3) — LÄS DE TVÅ NÄSTA SOM HISTORIK
      # De beskriver vad klasserna GJORDE när staging låg i PR-grinden. Sedan
      # `suite`-jobbet skickar `run_staging: false` villkorslöst styr ingen av
      # dem längre någonting; de beräknas, exponeras och läses av noll jobb.
      # Varför de ändå står kvar — och vem beslutet tillhör — står vid
      # `with: run_staging:` i `suite`-jobbet nedan. ═══
      #
      # D1-klassen (task-36.3 / ADR-077): true = ALLA ändrade filer är ren UI-yta
      # (stilmallar/CSS/publika statiska filer) OCH ingen exkluderad fil (samma
      # exkludering som docs-klassen). Släckte staging, körde a11y/pure/build.
      ui_low_risk: ${{ steps.changed-ui.outputs.only_changed == 'true' }}
      # Acceptance-klassen (task-59.7 / ADR-080): true = ALLA ändrade filer bor
      # i tests/acceptance/**. Släckte staging + purge (ingen mutex) medan
      # acceptance/a11y/pure/build kördes. Samma LEVER som ui_low_risk, egen
      # klassning — se steget för varför levern delades.
      acceptance_local: ${{ steps.changed-acceptance.outputs.only_changed == 'true' }}
      # Merge-dedup (task-36.4 / ADR-077): true = main-push vars träd redan
      # bevisats grönt i PR:en → tunga jobb hoppas. Fail-closed (se steget).
      dedup_hit: ${{ steps.dedup.outputs.dedup_hit == 'true' }}
      # ACCEPTANCE-URVALET (TASK-75). Blankstegsseparerad lista med de
      # spec-filer `Acceptance (hermetisk)` ska köra i stället för hela klassen,
      # eller TOM STRÄNG för full klass. Tomt är defaulten i varje osäkert läge
      # — se `acceptance-urval`-steget nedan och scripts/acceptance-urval.sh.
      acceptance_urval: ${{ steps.acceptance-urval.outputs.acceptance_urval }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 = FULL historik (ADR-054, 2026-06-17). Finit djup var
          # anti-mönstret: 1→50→100→250 brast 4 ggr när orörda governing-docs
          # passerade boundaryn (Session 22: dok-commit sköt fönstret 263→264).
          # check-frontmatter.sh Check 2 kräver filens sanna commit-datum. Per K1.D §0 utelämning #6.
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        # SHA-pin per ADR-029 §6 third-party Actions-policy.
        # tj-actions/changed-files v47.0.6 verifierad 2026-05-13 (K1.C Block 2).
        # Veckovis Actions-granskning per tasks/todo.md.
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          # quotepath: false — matcha non-ASCII-paths verbatim (upstream-
          # dokumenterad input i action.yml @ pinnad SHA). Gits default
          # core.quotepath=true oktal-escapar t.ex. backlog-kortfilers å/ä/—
          # och citerar strängen → den slutar på '"', inte '.md' →
          # **/*.md-globben missar → only_changed=false → onödig full
          # Test+Build för varje commit som rör kortfiler utan kod
          # (K1.17-klassen; TASK-15 S69, kontrastbevis run 29657524469
          # [kortfil → full] vs 29657760975 [ren ASCII-docs → skip]).
          #
          # DOCS-VERKTYGENS EGNA CONFIGFILER (S91): .lycheeignore, .vale.ini,
          # .vale/** och .markdownlint-cli2.jsonc står i listan nedan. De läses
          # ENBART av docs-jobbets grindar (lychee, markdownlint, Vale) och kan
          # per konstruktion inte påverka testsviten — verifierat med grep över
          # hela trädet 2026-07-26; enda träffarna utanför denna fil är
          # kommentarer plus scripts/test-vale-regression.sh, som självt kör i
          # docs-jobbet. Samma rationale som tests/vale-regression/** +
          # scripts/test-vale-regression.sh, vilka redan bar klassningen —
          # dessa fyra var luckan i den.
          # EMPIRI, två oberoende fall där full svit kördes i onödan:
          #   run 30201519323 — .lycheeignore + 1 .md                        → 14,3 min
          #   run 30163753632 — .vale.ini + .markdownlint-cli2.jsonc + 3 .md →  9,8 min
          # PARAD ÄNDRING (obligatorisk): varje docs-config-post här måste ALLTID
          # finnas även i changed-docs-stegets lista nedan. Utan paret blir en
          # ensam-ändring av filen BÅDE testsvit-skippad OCH docs-skippad, alltså
          # tyst ovaliderad (fail-open, L322-klassen). De två listorna härleds
          # oberoende och ingen grind håller dem synkade — paret hålls för hand.
          #
          # NOT OM FORMEN: kommentarer måste stå HÄR, aldrig inne i "files: |".
          # Det blocket är en YAML literal block scalar — en "#"-rad där blir en
          # literal glob-post, inte en kommentar. Felet gjordes och fångades
          # under bygget av just denna ändring (S91), därav noten.
          #
          # AGENT- OCH HARNESS-KONFIG (S91, TASK-71): .claude/**-raderna nedan.
          # Katalogen kan per konstruktion inte påverka en testkörning — CI kör
          # aldrig Claude Code. Grep över src, tests, scripts, .github och
          # supabase 2026-07-28 gav tre träffar, alla ofarliga:
          # scripts/agent-spawn-log.sh och scripts/agent-spawn-metrics.mjs läser
          # katalogen via CLAUDE_PROJECT_DIR (körs bara av Claude Code självt),
          # och scripts/test-agent-spawn-log.sh — den enda av de tre som CI kör —
          # pekar CLAUDE_PROJECT_DIR på en /tmp-sandlåda och rör alltså aldrig
          # repots .claude/.
          #
          # VARFÖR RADERNA BEHÖVS TROTS **/*.md OVAN: micromatch matchar inte
          # dot-yta utan dot: true. Mätt mot node_modules/micromatch 4.0.8
          # 2026-07-28: '**/*.md' ger NOLL träff på .claude/agents/bygg-skiva.md,
          # '.claude/**' full träff. Samma skäl som .github/PULL_REQUEST_TEMPLATE.md
          # och .github/ISSUE_TEMPLATE/** står explicit trots **/*.md — vore
          # dot-matchning påslagen vore de raderna döda.
          #
          # DÄRFÖR ÄR POSTERNA TVÅ. Samma dot-regel biter en gång till INNE i
          # katalogen: '.claude/**' matchar INTE .claude/.markdownlint.jsonc,
          # eftersom filnamnet börjar med punkt (mätt, samma körning). Med bara
          # den ena raden hade den nya markdownlint-configen legat utanför båda
          # listorna — alltså exakt det fail-open kortet finns för att stänga,
          # återinfört av sin egen fix. '.claude/**/.*' täcker dot-filer på alla
          # nivåer under katalogen och är verifierad mot en nästlad probe-sökväg.
          #
          # .claude/settings.json INGÅR MEDVETET (TASK-71 AC#5). Den är JSON och
          # kan inte grindas av markdownlint, Vale eller lychee — men den är inte
          # ovaliderad: `npx @biomejs/biome check .` i lint-jobbet, som kör ALLTID
          # (inget if-, inget needs-villkor), traverserar .claude/ och fäller på
          # trasig eller ofärdig JSON. Verifierat med probe-fil 2026-07-28: en
          # felformaterad .claude/-JSON rapporteras av `biome check .`. Filens
          # grind byter alltså jobb, den försvinner inte. Empirin bakom valet:
          # ab52cd5, 7b60dc1, b48ece0 och 8b98e95 rörde ENBART den filen och drog
          # var och en full svit bakom staging-mutexen.
          quotepath: false
          # ═══ PARITETS-MARKÖRER (TASK-85) ═══
          # Raderna `# paritet:start …` / `# paritet:slut …` avgränsar en LISTA
          # som scripts/check-listparitet.sh läser och jämför mot sin motpart.
          # Vilka par som finns, och varför, står i .listparitet-policy.conf.
          #
          # MARKÖRERNA MÅSTE STÅ UTANFÖR `files: |`, aldrig inne i blocket. Det
          # är samma regel som "NOT OM FORMEN" ovan slår fast: en `#`-rad inne i
          # en literal block scalar blir en literal glob-post, inte en kommentar.
          # Verifierat efter placeringen med js-yaml, yamllint och actionlint —
          # blockets värde är oförändrat med markörerna på plats.
          #
          # DENNA LISTA BÄR TVÅ PAR PÅ EN GÅNG: `!`-raderna jämförs mot D1:s och
          # acceptance-klassens (kommentarerna i de stegen säger IDENTISKA), och
          # de positiva raderna mot changed-docs-stegets (PARAD ÄNDRING ovan).
          # paritet:start klassning-d0
          files: |
            **/*.md
            LICENSE
            docs/**
            tasks/**
            tests/vale-regression/**
            scripts/test-vale-regression.sh
            .github/ISSUE_TEMPLATE/**
            .github/PULL_REQUEST_TEMPLATE.md
            .github/CODEOWNERS
            .vscode/extensions.json
            .editorconfig
            .lycheeignore
            .vale.ini
            .vale/**
            .markdownlint-cli2.jsonc
            .claude/**
            .claude/**/.*
            !.github/workflows/**
            !.github/dependabot.yml
            !package.json
            !package-lock.json
            !audit-ci.jsonc
            !tsconfig*.json
            !biome.json
            !vite.config.ts
            !playwright.config.ts
            !tsr.config.json
            !.nvmrc
            !.gitignore
          # paritet:slut klassning-d0

      - name: Get changed docs files
        id: changed-docs
        # Separat docs-härledning (väg ii-a, Session 11): docs_changed ska bli true
        # även vid .lycheeignore-/ci.yml-ändring (lychee-config/ignore re-validerar
        # docs-link-check — stänger skip-gapet). Hålls ISÄR från should_skip_tests-
        # steget så det medvetna !.github/workflows/**-valet bevaras (en ci.yml-only-
        # commit kör fortfarande Test+Build via det orörda only_changed-filtret).
        #
        # S91: listan utvidgad så den TÄCKER should_skip_tests-stegets docs-poster.
        # Två klasser lades till, av två olika skäl:
        #   (a) .vale.ini / .vale/** / .markdownlint-cli2.jsonc — nya i BÅDA listorna.
        #       Paret är obligatoriskt: utan raden här hade skip-tests-tillägget gjort
        #       en ensam-ändring av dem tyst ovaliderad (svit skippad + docs skippad).
        #   (b) tests/vale-regression/** + scripts/test-vale-regression.sh — stod
        #       REDAN i skip-tests-listan men saknades här, alltså ett befintligt
        #       fail-open: en ensam-ändring skippade testsviten OCH docs-jobbet, och
        #       docs-jobbet är det enda som kör Vale-regressionssviten. Shellcheck i
        #       det alltid-på lint-jobbet gav syntaxtäckning men ingen funktionell.
        # Invarianten framåt: docs-verktygs-config hör hemma i BÅDA listorna.
        #
        # S91 forts. (TASK-71): .claude/** tillagt i BÅDA listorna i SAMMA
        # ändring — den parade formen, inte en rad i taget. Docs-grindarnas
        # scope utvidgades samtidigt så posten faktiskt validerar något:
        # .claude/**/*.md lintas nu av markdownlint (.markdownlint-cli2.jsonc
        # globs + .claude/.markdownlint.jsonc), av Vale (npm run lint:prose) och
        # av lychee (arg-blocket i docs-jobbet nedan). Utan raden här hade
        # skip-tests-tillägget gjort en agentfil BÅDE svit-skippad och
        # docs-skippad — tyst ovaliderad, L322-klassen.
        #
        # POSTERNA ÄR .claude/** + .claude/**/.*, INTE .claude/**/*.md, och det
        # är avsiktligt: listorna ska vara IDENTISKA post för post. En snävare
        # post här hade lämnat .claude/settings.json ensam i skip-tests-listan
        # och därmed återinfört precis den asymmetri paret finns för att
        # förhindra. Att settings.json grindas av Biome i det alltid-på
        # lint-jobbet (se skip-tests-steget) ändrar inte formen på invarianten.
        # Varför dot-raden är en egen post: se samma steg — '.claude/**' missar
        # dot-filer, och .claude/.markdownlint.jsonc är en av dem.
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          # quotepath: false — samma invariant som changed-files-steget
          # (TASK-15 S69): utan den ger en UTF-8-namngiven .md-ändring
          # docs_changed=false → Docs link check TYST SKIPPAD på en äkta
          # docs-ändring (allvarligare granne till only_changed-symptomet).
          quotepath: false
          # paritet:start klassning-docs (se markör-noten i changed-files-steget)
          files: |
            **/*.md
            .lycheeignore
            .vale.ini
            .vale/**
            .markdownlint-cli2.jsonc
            tests/vale-regression/**
            scripts/test-vale-regression.sh
            .github/workflows/ci.yml
            .claude/**
            .claude/**/.*
          # paritet:slut klassning-docs

      - name: Get changed UI files (D1-klassning)
        id: changed-ui
        # D1-klassen (task-36.3): en ALLOWLIST, aldrig blocklist. only_changed
        # blir true ENDAST när varenda ändrad fil matchar en UI-positiv OCH ingen
        # matchar en exkludering. Exkluderingarna är IDENTISKA med
        # should_skip_tests-stegets (AC#2): CI-workflow, paketmanifest, låsfil och
        # byggkonfig kan ALDRIG bli D1 — även om de ligger i samma commit som en
        # CSS-fil faller hela commiten till full svit (allowlist-golvet, AC#4).
        # quotepath: false — samma invariant som de andra stegen (TASK-15).
        # Bevisas med kontrastbevis-tripel, inte resonemang (AC#6).
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          quotepath: false
          # paritet:start klassning-d1 (se markör-noten i changed-files-steget)
          files: |
            **/*.css
            src/styles/**
            public/**
            !.github/workflows/**
            !.github/dependabot.yml
            !package.json
            !package-lock.json
            !audit-ci.jsonc
            !tsconfig*.json
            !biome.json
            !vite.config.ts
            !playwright.config.ts
            !tsr.config.json
            !.nvmrc
            !.gitignore
          # paritet:slut klassning-d1

      - name: Get changed acceptance-class files (klass-lokal ändring)
        id: changed-acceptance
        # ACCEPTANCE-KLASSEN I RISK-KLASSNINGEN (task-59.7, AC#3 / ADR-080).
        # Klassen fick eget mutexfritt jobb i task-59.3 men ingen plats i
        # klassnings-mekaniken: en ändring som BARA rör tests/acceptance/**
        # drog fortfarande med sig hela sviten, inklusive staging bakom den
        # globala mutexen. Filerna som klassas här kan per konstruktion inte
        # påverka staging — acceptance-projektet har egen testDir, körs mot
        # fixturvärlden, och ingen fil under tests/e2e, tests/api eller
        # tests/a11y importerar från katalogen (verifierat med grep 2026-07-28).
        #
        # SAMMA LEVER SOM D1, EGEN KLASSNING. Utfallet wirades till suite-jobbets
        # run_staging-input, exakt som ui_low_risk — inte till en ny input.
        # Skälet var att den dyra resursen är EN: staging-mutexen. En andra input
        # hade gett två sätt att uttrycka samma sak och därmed en ny
        # divergens-yta i precis den mekanik ADR-077 byggde för att slippa den.
        # SEDAN A7:5 (TASK-70.3) HAR LEVERN INGEN KONSUMENT — se outputs-blocket
        # ovan och `with: run_staging:` i suite-jobbet.
        #
        # INGET NYTT D-NUMMER MINTAS HÄR. ADR-077 diskuterar D2-slotten
        # explicit och lämnar den öppen för en framtida testgrafs-design;
        # klassen tar därför ett beskrivande namn i stället för att beslagta ett
        # nummer som är reserverat för en annan idé.
        #
        # ALLOWLIST, ALDRIG BLOCKLIST (ADR-077 §1). only_changed blir true
        # ENDAST när VARENDA ändrad fil ligger under tests/acceptance/**. En
        # commit som rör både klassen och något annat faller till full svit.
        #
        # DEN FARLIGA FRÅGAN, VERIFIERAD I KÄLLAN OCH INTE ANTAGEN: blir
        # only_changed vakuöst `true` när INGEN fil matchar allowlisten? Det
        # hade släckt staging för varenda PR som inte rör klassen — ett
        # katastrofalt fail-open. Svaret är NEJ, läst i actionens källa vid
        # EXAKT den pinnade SHA:n ovan (src/changedFilesOutput.ts):
        #   onlyChanged = otherChangedFiles.length === 0
        #              && allChangedFiles.paths.length > 0
        #              && filePatterns.length > 0
        # Andra ledet kräver minst EN matchande fil. Noll matchningar ⇒ false ⇒
        # full svit. Kontrollera om vid varje SHA-bump av actionen.
        # Exkluderingarna nedan är IDENTISKA med D0:s och D1:s. De är i dag
        # REDUNDANTA — ingen av dem kan matcha under tests/acceptance/** — och
        # står här som klassrymdens invariant, inte som bärande logik: skulle
        # allowlisten någon gång vidgas är golvet redan på plats. Läs dem inte
        # som att de gör något i nuvarande form.
        #
        # quotepath: false — samma invariant som de andra stegen (TASK-15).
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          quotepath: false
          # paritet:start klassning-acceptance (se markör-noten i changed-files-steget)
          files: |
            tests/acceptance/**
            !.github/workflows/**
            !.github/dependabot.yml
            !package.json
            !package-lock.json
            !audit-ci.jsonc
            !tsconfig*.json
            !biome.json
            !vite.config.ts
            !playwright.config.ts
            !tsr.config.json
            !.nvmrc
            !.gitignore
          # paritet:slut klassning-acceptance

      - name: Acceptance-urval — kör den delmängd diffen rör
        id: acceptance-urval
        # TASK-75 / ADR-077 §§ 1+3. Efter A7:5 (TASK-70.3) är `Acceptance
        # (hermetisk)` ENSAM bärare av PR-grindens kritiska väg — mätt till
        # 422/433/422 s över tre fulla körningar 2026-07-28, alltså cirka 50 s
        # LÅNGSAMMARE än den staging-svit som flyttades bort. Klassen kör alla
        # 18 spec-filer oavsett vad diffen rör; detta steg väljer delmängden.
        #
        # STEGET ÄGER NOLL GLOBAR, OCH DET ÄR HELA FORMEN. Det läser
        # `changed-files`-stegets EGEN `other_changed_files` — per actionens
        # källa vid den pinnade SHA:n exakt "de ändrade filer som inte matchade
        # D0-listan", inklusive dem som slogs ut av `!`-exkluderingarna. D0:s
        # lista förblir därmed ENDA hemvist för docs-klassningen. En TREDJE
        # hand-hållen kopia (filen bär redan två, med uttrycklig varning om att
        # paret hålls för hand) vore precis den divergens-skuld ADR-077
        # § Beslut 1 avvisar när den slår fast att klassningen "förblir
        # deklarativ i changed-files-steget".
        #
        # VARFÖR D0-LISTAN DUGER SOM NEUTRAL GRUND: den är redan betrodd för ett
        # STARKARE påstående — att hoppa HELA testsviten. Att här bara låta dess
        # filer vara neutralt sällskap åt en spec-ändring är strikt svagare än
        # vad repot redan gör. Och det är inte akademiskt: repots arbetsregel
        # lägger kortändringen i SAMMA commit som koden, så varje verklig
        # spec-PR bär en `backlog/**`-fil. Mätt på de två faktiska spec-PR:erna
        # i historiken — `#377` (`990add4a2`) och `#368` (`d7b9558b2`) — bestod
        # bådas diff av exakt ett kort plus 2 respektive 3 spec-filer. Utan
        # docs-klassen som neutralt sällskap hade urvalet aldrig kunnat falla ut
        # en enda gång, och mekaniken varit en tyst nolla.
        #
        # ALLOWLIST, ALDRIG BLOCKLIST: skriptet ger urval ENDAST när VARENDA
        # post är en acceptance-spec-fil som finns på disk. En källfil, den
        # delade sömmen under tests/acceptance/support/, en workflow eller en
        # okänd filtyp ⇒ tomt ⇒ full klass. Okänt givet faller till full svit.
        #
        # SKYDDSNÄTET: post-merge.yml skickar ingen input och kör därmed full
        # klass på varje mergat träd (ADR-077 § Kontext, Google-modellen).
        env:
          # Karantän i env, aldrig interpolerat in i skalet: `other_changed_files`
          # är angriparstyrbar via filnamn i en PR (ADR-029 § script injection).
          OVRIGA_ANDRADE: ${{ steps.changed-files.outputs.other_changed_files }}
        run: |
          set -euo pipefail
          urval=$(bash scripts/acceptance-urval.sh "${OVRIGA_ANDRADE}")
          echo "acceptance_urval=${urval}" >> "${GITHUB_OUTPUT}"

      - name: Merge-dedup — hoppa tungt om trädet redan bevisats grönt
        id: dedup
        # task-36.4 / ADR-077. Innehållsadresserad dedup UTAN ny lagringsyta:
        # på en main-push (merge-commit) läses andra föräldern (den mergade
        # PR-headen), och de tunga jobben hoppas ENDAST om merge-commitens träd
        # är identiskt med PR-headens träd OCH den SHA:n redan har en grön
        # CI-run. Sundheten vilar på merge-grindens strict up-to-date-krav
        # (ADR-076): en up-to-date-branch ger merge-commit vars träd == PR-head.
        #
        # ASYMMETRIN ÄR MEDVETEN: nyckeln ÄR trädet självt, så dedupen kan bara
        # orsaka onödig körning, aldrig släppa förbi otestat. FAIL-CLOSED på
        # VARJE avvikelse — ingen andra förälder, träd-avvikelse, API-fel eller
        # icke-grön run ⇒ dedup_hit=false ⇒ full svit. Full SHA mot API:t (L314;
        # förkortad SHA ger noll träffar). Bor i changed-jobbet som redan har
        # fetch-depth: 0 → fetch-depth-invarianten (ADR-039/054) ORÖRD.
        # Logiken unit-testad lokalt mot 6 grenar (1 hit + 5 fail-closed) före
        # bygget. Cache-formen är FALSIFIERAD och byggs aldrig (L325).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          dedup_hit=false
          if [ "${EVENT_NAME}" = "push" ]; then
            if head2=$(git rev-parse --verify HEAD^2 2>/dev/null); then
              tree_head=$(git rev-parse 'HEAD^{tree}')
              tree_head2=$(git rev-parse "${head2}^{tree}")
              if [ "${tree_head}" = "${tree_head2}" ]; then
                conc=$(gh run list --commit "${head2}" --workflow ci.yml \
                  --json conclusion,status \
                  --jq '[.[] | select(.status == "completed")][0].conclusion // ""' \
                  2>/dev/null || echo "APIERR")
                if [ "${conc}" = "success" ]; then
                  dedup_hit=true
                  echo "✅ Dedup-TRÄFF: träd == ${head2:0:12}^{tree} och den SHA:n har grön CI-run → tunga jobb hoppas."
                else
                  echo "Dedup-miss: PR-head-run conclusion='${conc}' ej success → full svit (fail-closed)."
                fi
              else
                echo "Dedup-miss: träd-avvikelse (${tree_head:0:12} != ${tree_head2:0:12}) → full svit (fail-closed)."
              fi
            else
              echo "Dedup-miss: ingen andra förälder (ej merge-commit) → full svit (fail-closed)."
            fi
          else
            echo "Dedup ej tillämplig (event=${EVENT_NAME}, ej push) → full svit."
          fi
          echo "dedup_hit=${dedup_hit}" >> "${GITHUB_OUTPUT}"

  # Job 2: Always-on lint + audit + typecheck.
  # Kör på ALLA commits oavsett doc-only-detection. Per ADR-029 §1b + K17.
  lint:
    name: Lint + Audit + TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 = FULL historik (ADR-054, 2026-06-17) för
          # scripts/check-frontmatter.sh Check 2 (git log -1 --format=%cs -- <fil>).
          # Finit djup var anti-mönstret (1→50→100→250 brast 4 ggr när orörda
          # governing-docs passerade boundaryn). Konsistent med changed-jobbet;
          # invarianten (ADR-039) hålls enhetlig över alla 5 bärare.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (audit-ci with allowlist)
        run: npx audit-ci --config audit-ci.jsonc
        # K17 supply-chain-skydd: kör på varje commit (kod ELLER doc-only).
        # Allowlist tom efter K0åh (2026-05-13). ADR-028 reverse-flow aktiv.

      - name: Biome check
        run: npx @biomejs/biome check .

      - name: TypeScript check
        run: npm run typecheck

      - name: TypeScript check (tests)
        run: npm run typecheck:tests

      - name: Check workflow files (actionlint)
        # Release-pinnad install + egen SHA256-verifiering — shellcheck-
        # stegets mönster (S77 våg 1; processgranskningen 2026-07-23 § 8).
        # Ersätter ADR-029 utelämning #3:s download-script-form: skriptet
        # hämtades från MUTERBAR main och exekverade före all verifiering —
        # dess egen checksumme-koll skyddar inte mot komprometterad källa.
        # SHA256 downstream-beräknad mot fast release-asset 2026-07-23
        # (releases är immutabla); re-verifiering: ladda samma URL +
        # sha256sum lokalt. Erratum-not i ADR-029.
        # -ignore (smal, exakt feltext): actionlint 1.7.12:s schema släpar
        # efter Actions-featuren `queue:` i concurrency (plattforms-release
        # 2026-05-07; runtimen accepterar nyckeln — Test+Build grön i run
        # 29200533939 med den aktiv). LIFT: ta bort flaggan när actionlint
        # stödjer nyckeln (regexen blir då vestigial, matchar inget).
        #
        # TILLGÄNGLIGHET (TASK-83, 2026-07-29) — curl-flaggorna bär samma
        # rationale som `Install shellcheck (pinned v0.11.0)` nedan, där den är
        # skriven i sin helhet: --retry ensam täcker inte connect-fel, och
        # --retry-all-errors (curl 7.71.0+) är flaggan som gör det.
        # sha256sum-verifieringen nedan är ORÖRD.
        run: |
          AL_VERSION="1.7.12"
          AL_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          AL_URL="https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-max-time 60 "${AL_URL}" -o /tmp/actionlint.tar.gz
          echo "${AL_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color -ignore 'unexpected key "queue" for "concurrency" section'

      - name: Check YAML syntax (yamllint)
        # Per ADR-030 § Del 1.4: yamllint kompletterar actionlint (yamllint =
        # generic YAML syntax/style; actionlint = GitHub Actions semantics).
        # Config: .yamllint.yml. Scope: .github/ (workflow + dependabot).
        # Python pre-installed på ubuntu-latest; pip-install ~3-5s.
        # Ingen pre-commit-hook — CI-only-grindvakt per Marcus' direktiv K2.
        run: |
          pip install --quiet yamllint
          yamllint .github/

      # ═══ PARITETS-MARKÖRER (TASK-109) ═══
      # Regionen från start-markören på nästa rad till dess slut-markör (efter
      # listparitets-steget) är B-SIDAN i
      # paret `docs-grindar` (.listparitet-policy.conf): lint-jobbets
      # `bash scripts/check-*.sh`-körningar hålls mängd-lika med
      # scripts/check-docs.sh:s run_gate-lista (post 5–13). Driftar de isär —
      # en grind CI kör men listan saknar, eller en listan har men CI inte
      # kör — fäller scripts/check-listparitet.sh. Det var TASK-98:s och
      # TASK-106:s felklass, funnen två gånger av manuell grep, aldrig av en
      # grind. REGIONEN LÄSES SOM DATA: en kommentar här inne får aldrig bära
      # frasen "bash scripts/check-<namn>.sh" (se noten i listparitets-steget).
      # paritet:start docs-grindar-ci
      - name: Check public docs for unchecked items
        # Per ADR-030 § Del 1 (position #5): scripted-checklist-check fångar
        # oavslutade `- [ ]` i publika docs (README/CHANGELOG/SECURITY/
        # CONTRIBUTING/byggplan/BYGGPLAN-LÄTTLÄST-v3). CONTRIBUTING.md
        # `## Definition of Done`-sektioner exkluderade via per-sektion-
        # medveten awk-pattern. Snabb bash (<1s overhead). Ingen pre-commit-
        # hook (CI-only). Empirisk 4-test-suite verifierad vid K5-
        # implementation 2026-05-14; utvidgad till 5-test-suite vid K7.5
        # config-driven-refactor 2026-05-15. Config: .checklist-policy.conf.
        run: bash scripts/check-public-checklists.sh

      - name: Validate frontmatter on governing docs
        # Per ADR-030 § Del 3: 5-check-validator för YAML-frontmatter på
        # 17 styrande docs (TASK-161.4, 2026-08-08 — räknat om mot
        # .frontmatter-policy.conf FRONTMATTER_GOVERNING_DOCS; stod som "14"
        # (TASK-161.2) innan CONTRIBUTING.md/README.md/DESIGN-SYSTEM-SPEC.md
        # lades till listan) (existens, updated-match, review_by > today,
        # status-enum, owner-enum). Config: .frontmatter-policy.conf.
        # Empirisk 9-test-suite verifierad K7.B 2026-05-14.
        # Hub-spoke-portabel design per K7 Lesson #6 (UNIVERSAL).
        run: bash scripts/check-frontmatter.sh

      - name: Validate lifecycle field on session docs (ADR-052 gate)
        # ADR-052 beslut 4: dedikerad lätt grind (enum + konsistens fält↔kropp),
        # skild från frontmatter-governing-regimen (immutabilitets-skäl, ADR-023).
        run: bash scripts/check-lifecycle.sh

      - name: Validate thread index integrity (TASK-108 gate)
        # Komplement till check-lifecycle.sh, som loopar över trådFILER och tyst
        # hoppar varje fil utan lifecycle:-fält — mätt täckning 13 av 109 trådar
        # (11,9 %) när grinden byggdes. Denna grind validerar INDEXET självt
        # (tasks/threads/README.md): radform + kolumnantal, enum-giltigt
        # tillstånd i RÄTT kolumn, numreringens integritet (dubblett/lucka/
        # omkastning) och index↔fil åt båda håll. Ingen invariant överlappar
        # lifecycle-grinden — två grindar med rätt att säga emot varandra är
        # värre än en (skriptets § MEDVETET UTANFÖR SCOPE).
        #
        # EGET STEG HÄR ÄR NÖDVÄNDIGT, INTE EN DUBBLERING: TASK-108:s
        # wiring-beskrivning antog att grinden "följer med automatiskt via
        # check-docs.sh", men check-docs.sh körs INTE av CI (verifierat
        # 2026-07-31: noll run-träffar i något workflow — den är den LOKALA
        # samlaren som speglar detta jobb). Utan detta steg hade check-docs.sh
        # räknat upp grinden under rubriken "ci.yml lint-jobbet" medan CI körde
        # den noll gånger — exakt ADR-083-felklassen som TASK-98 lagade för
        # check-permissions-claims.sh.
        #
        # Ren textläsning (policy-driven, .thread-index-policy.conf — som sedan
        # denna ändring står i shellcheck-scopet nedan). Inget nätverk, inga
        # secrets. KOSTNADEN ÄR INTE FÖRSUMBAR: 41,0 respektive 43,4 s LOKALT
        # mätt (två körningar, macOS 2026-08-01, 98 % CPU — beräkningsbunden
        # bash-regex över registrets långa rader, inte maskinlast). CI-tiden är
        # INTE mätt av mig; jobbet bar 83–103 s mot taket 300 s före detta steg
        # (tre gröna main-körningar 2026-07-31), så marginalen bär steget även
        # om CI-talet blir högre än det lokala. Läs av den första skarpa
        # körningen; krymper marginalen är grindens regex (inv 3-länkmatchningen
        # mot långa rader) första optimeringskandidat — inte avwiring.
        run: bash scripts/check-thread-index.sh

      - name: Check ADR count consistency (ADR-039 gate)
        # Per ADR-039 § kadens-principen: deterministisk konsistens-check vid
        # VARJE push (ej bara fas-avslut). ADR-fil-antal == README:s kanoniska
        # levande räkning, nyckar mot samma "[0-9]+ arkitekturbeslut"-token som
        # phase-end-verify.sh head -1:ar. Stänger K0a-driften (README 28 vs 38).
        run: bash scripts/check-adr-count.sh

      - name: Check lesson numbering (ADR-081 gate)
        # Per ADR-081: nummer tilldelas VID LANDNING, inte vid skrivning.
        # Två invarianter — ingen duplicerad `### L<nnn>` i lessons.md, och
        # inget fragment i tasks/lessons.d/ som bär ett nummer. Empirin är
        # S91 2026-07-26: två parallella agenter mintade båda L354+L355,
        # kollisionen löstes för hand. Frånvarande fragment-katalog är GRÖNT
        # (vägen är tillgänglig, ej obligatorisk). Config: .lesson-policy.conf.
        run: bash scripts/check-lesson-numbers.sh

      - name: Check permissions claims (ADR-083 gate)
        # Per ADR-083: en styrande fil får inte påstå en permissions-mekanism
        # som inte finns. Nämner CLAUDE.md / CONTRIBUTING.md / agentdefinitionerna
        # `permissions.deny` eller `permissions.ask` tillsammans med en
        # påstående-markör, ska nyckeln finnas och vara icke-tom i en
        # settings-fil. Config: .permissions-claims-policy.conf.
        #
        # WIRAD FÖRST I TASK-98, och frånvaron dessförinnan är hela poängen.
        # ADR-083 mintades 2026-07-30 för prosa som påstår sig vara mekanism.
        # Grinden byggdes samma dag, kopplades in i `npm run check:docs` och
        # fick sin self-test körd här — men grinden SJÄLV wirades aldrig.
        # check-docs.sh:34-46 räknade ändå upp den under rubriken "ci.yml
        # lint-jobbet (kör alltid, även på kod-PR:er)". Mätt 2026-07-30 med
        # `grep -c 'bash scripts/<grind>.sh' ci.yml`: de fem syskongrindarna 1
        # var, denna 0. Alltså prosa som påstod en mekanism som inte fanns —
        # ADR-083:s egen felklass, i ADR-083:s egen grind. Funnen av TASK-85:s
        # agent, som klassade den som ett sjätte listparitets-par med faktisk
        # drift och eskalerade i stället för att bygga (CI-verkan = scope-beslut).
        #
        # HÄR OCH INTE I DOCS-JOBBET, och skälet är smalare än det först ser ut.
        # Lint-jobbet har varken `if:` eller `needs:` och kör alltså alltid;
        # docs-jobbet är villkorat på `docs_changed`.
        #
        # Det NAIVA argumentet håller inte, och står här för att ingen ska bygga
        # om det: de filer grinden LÄSER — de fyra styrande .md-filerna och
        # `.claude/settings.json` — ligger under `**/*.md` respektive `.claude/**`
        # i `klassning-docs`. En ändring av dem sätter alltså `docs_changed`, och
        # docs-jobbet hade kört i just de fallen.
        #
        # Det argument som FAKTISKT bär är grindens EGNA in-filer. Varken
        # `.permissions-claims-policy.conf` (GOVERNING_FILES, CLAIM_MARKERS,
        # CLAIM_WINDOW) eller `scripts/check-permissions-claims.sh` står i
        # `klassning-docs`-listan ovan. En PR som lägger till en styrande fil som
        # redan bär ett falskt påstående, stryker en markör, eller försvagar
        # skriptet, hade med grinden i docs-jobbet landat UTAN att grinden kördes.
        # Verifierat 2026-07-31: `grep -n 'permissions-claims' ci.yml` ger noll
        # träffar i klassnings-blocken.
        #
        # Andra halvan är kopplingens SKÖRHET. Att grinden körs på sin lästa yta
        # skulle bero på att `klassning-docs` råkar innehålla `.claude/**` — en
        # koppling ingen fil deklarerar och ingen grind vaktar. Att listan är
        # levande är mätbart: paret `klassning-docs-config` bär nio deklarerade
        # asymmetrier i .listparitet-policy.conf (åtta på D0-sidan, en på
        # changed-docs-sidan). Driftar `.claude/**` bort ur den upphör grinden
        # tyst att köra på sin egen lästa yta. Ett alltid-på jobb har ingen sådan
        # beroendekedja.
        #
        # FÖRKASTAT ALTERNATIV — rätta prosan i check-docs.sh i stället, alltså
        # flytta posten ur lint-rubriken och skriva att grinden bara körs lokalt.
        # Det hade gjort texten sann och lämnat hålet kvar. ADR-083 dömer den
        # utvägen i sin egen alternativ-sektion, om hub-repot: "En grind som
        # ingen kör är inte en grind, utan just den sortens artefakt denna ADR
        # handlar om." Samma mening gäller spoke-sidan. Prosa-rättning hade
        # dessutom sänkt skyddet till noll för `CLAUDE.md` och `CONTRIBUTING.md`
        # på varje PR där ingen råkar köra `npm run check:docs` för hand.
        #
        # Ren textläsning plus `jq` mot två settings-filer. Inget nätverk, inga
        # secrets. 0,066–0,079 s LOKALT mätt över tre körningar (macOS,
        # 2026-07-31, loadavg 3,6–3,9). CI-TIDEN ÄR INTE MÄTT AV MIG och kan
        # avvika åt båda håll.
        run: bash scripts/check-permissions-claims.sh

      - name: Check fetch-depth invariant (ADR-039 gate)
        # Per ADR-039 + L50: de 6 LEVANDE fetch-depth-bärarna (ci.yml ×4 jobb +
        # .frontmatter-policy.conf + check-frontmatter.sh-default) hålls
        # ömsesidigt identiska; ADR-029/030 (frusen text) bär erratum-not.
        # Frusen ADR-text/arkiv/kommentarer ignoreras (läser bara namngivna
        # bärar-platser). L50:s obyggda test-hälft.
        run: bash scripts/check-fetch-depth-invariant.sh

      - name: Check list parity (TASK-85 gate)
        # Repot bär flera invarianter som står på TVÅ ställen och som filerna
        # SJÄLVA säger ska hållas i synk: "PARAD ÄNDRING (obligatorisk)",
        # "Exkluderingarna är IDENTISKA med should_skip_tests-stegets", "speglar
        # det blocket i sak … får inte glida isär". ci.yml skrev till och med ut
        # att mekaniken saknades: "ingen grind håller dem synkade — paret hålls
        # för hand". Fem par vaktas nu; vilka, och varför just de, står härlett i
        # .listparitet-policy.conf.
        #
        # HÄR OCH INTE I DOCS-JOBBET, trots att ett av paren läser CONTRIBUTING.md:
        # tre av fem par bor i DENNA fil, och docs-jobbet är villkorat på
        # docs_changed. En ci.yml-only-ändring hade då kunnat drifta klassnings-
        # listorna utan att grinden kördes. Lint-jobbet kör alltid.
        #
        # Ren textläsning, inget nätverk. 1,15–1,28 s väggtid över tre körningar,
        # LOKALT mätt (macOS, 2026-07-30, loadavg 3,97–4,13, `time` på
        # skriptet). CI-TIDEN ÄR INTE MÄTT AV MIG
        # och kan avvika åt båda håll — en lokal mätning projicerad till CI är
        # ingen mätning.
        #
        # ORDALYDELSEN OVAN ÄR MEDVETET INDIREKT (TASK-109): raden skrev
        # tidigare ut kommandot med bakåtfnuttar, och den frasen matchade
        # paret `docs-grindar`-uttrycket `bash scripts/check-[a-z0-9-]+\.sh`.
        # Detta är regionens ENDA kommentar som matchade — mätt 2026-08-01:
        # med körnings-raden nedan borttagen gav hela-filen-extraktionen ändå
        # posten ur just denna kommentar, dvs paret hade rapporterat synk på en
        # avwirad grind (TASK-98:s felklass). Skriv ALDRIG frasen
        # "bash scripts/check-<namn>.sh" i en kommentar mellan
        # paritet-markörerna — grinden läser regionen som data.
        run: bash scripts/check-listparitet.sh

      - name: Validate locked facit is addressable (ADR-102 gate)
        # Per ADR-102 B1/B3: den låsta prototypen ÄR facit, och prototyp-kod
        # rivs aldrig före Marcus godkännande. Grinden läser facit-manifesten
        # under tasks/sessions/bilagor/ och fäller på (a) facit-bilder utan
        # manifest, (b) manifest som inte stämmer med disken — odeklarerad
        # bild, saknad bild, yta utan "bilder"-nyckel — och (c) rivning av
        # prototyp-markörerna medan "godkand" är null.
        #
        # ROTORSAKEN, mätt: TASK-145.3:s utförare rapporterade "bilderna finns
        # inte i repot och fanns inte i uppdraget" och byggde vidare mot en
        # annan baslinje — dagen EFTER att bilderna landat. Ett misslyckat
        # uppslag lästes som frånvaro. Grinden gör det uppslaget omöjligt att
        # missa: facit har en deklarerad adress, eller så är trädet rött.
        #
        # Grinden avgör INTE om ytan SER UT som facit — den jämförelsen är
        # Marcus öga. Config: .facit-policy.conf.
        run: bash scripts/check-facit.sh
      # paritet:slut docs-grindar-ci

      - name: Check mall parity (TASK-309.4 gate, ADR-125 § Beslut 4)
        # De genererade TS-strängmodulerna i
        # supabase/functions/_shared/mallar/ (html/css/typsnitt/bilder) MÅSTE
        # vara byte-identiska (efter avkodning) mot sin källa i
        # docs/mallar/bilagor/ och public/fonts/bilagor/ — annars renderar
        # prod-EF:en (`_shared/mall-render.ts`) en ANNAN mall än den Marcus
        # granskat. TASK-309.1s minimaltest bevisade skarpt att
        # `static_files`-bundling FALLERAR i denna miljö (ingen Docker,
        # API-bundlingsvägen), vilket är VARFÖR en committad kopia behövs
        # över huvud taget i stället för att läsa `docs/`-filerna direkt vid
        # deploy — se ADR-125 § Updates 2026-08-23.
        #
        # EN generator, TVÅ lägen (scripts/synka-bilagemallar.mjs, sync
        # ELLER --check) — check-mallparitet.sh är en tunn wrapper, ingen
        # fjärde handhållen kopia av jämförelselogiken (samma
        # --kontrollera/--deploya-disciplin som scripts/fas4-prod-deploy.sh).
        # Ren fil-läsning, inget nätverk.
        run: bash scripts/check-mallparitet.sh

      - name: Check for long dashes in UI strings (TASK-172 gate, scope A)
        # Marcus-beslut 2026-08-09 (task-172 Description): "Ta bort alla
        # långa bindestreck överallt, jag gillar de korta bindestrecken (-)".
        # Scope A = användar-synliga strängar i src/ (det Lotta och Marcus
        # ser i appen) — kodkommentarer och dokumentation ingår INTE.
        #
        # HÄR OCH INTE I DOCS-JOBBET: grinden läser TypeScript/TSX-källkod
        # under src/, inte markdown. Docs-jobbet är villkorat på
        # docs_changed; en ren kod-PR hade aldrig kört grinden där. Lint-
        # jobbet kör alltid.
        #
        # AST-baserad (@babel/parser + @babel/traverse, redan en transitiv
        # dependency av @tanstack/router-cli — se skriptets eget huvud för
        # fullständig motivering), inte regex: kommentarer besöks aldrig av
        # traverse() och kan strukturellt inte fällas — endast StringLiteral/
        # JSXText/TemplateElement. Config-drivna undantag (tom-markören +
