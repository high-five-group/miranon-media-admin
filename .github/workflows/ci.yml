        # utvecklarverktyg som seed-review-fixture.mjs ovan, och samma HEMVIST-
        # argument gäller: sviten är hermetisk (egen /tmp-sandlåda, ETT äkta
        # men tomt git-repo för att pröva `git rev-parse main` → `HEAD`-
        # fallbacken, ingen nätverkstrafik, inga secrets) och prövar de PURA
        # funktionerna (parseArgs, tillampaGodkannande, lasPolicy) plus main()
        # end-to-end mot sandlådan — aldrig det verkliga repots facit-manifest.
