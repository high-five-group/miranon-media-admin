---
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Security hardening: least-privilege default per ADR-029 §4.
# GITHUB_TOKEN får endast contents:read via explicit grant i jobs.
permissions: {}

# Auto-cancel in-progress runs på samma branch/PR per ADR-029 §4.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Job 1: Detect changed files — sets should_skip_tests + docs_changed
  # outputs for downstream conditional jobs. Per ADR-029 §1a.
  changed:
    name: Detect changed files
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      # actions: read — dedup-steget (task-36.4) frågar körnings-API:t
      # (gh run list) om PR-headen redan har en grön CI-run. Minsta grant
      # utöver contents:read.
      actions: read
    outputs:
      should_skip_tests: ${{ steps.changed-files.outputs.only_changed == 'true' }}
      docs_changed: ${{ steps.changed-docs.outputs.any_changed == 'true' }}
      # D1-klassen (task-36.3 / ADR-077): true = ALLA ändrade filer är ren UI-yta
      # (stilmallar/CSS/publika statiska filer) OCH ingen exkluderad fil (samma
      # exkludering som docs-klassen) → staging skippas, a11y/pure/build kör.
      ui_low_risk: ${{ steps.changed-ui.outputs.only_changed == 'true' }}
      # Merge-dedup (task-36.4 / ADR-077): true = main-push vars träd redan
      # bevisats grönt i PR:en → tunga jobb hoppas. Fail-closed (se steget).
      dedup_hit: ${{ steps.dedup.outputs.dedup_hit == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 = FULL historik (ADR-054, 2026-06-17). Finit djup var
          # anti-mönstret: 1→50→100→250 brast 4 ggr när orörda governing-docs
          # passerade boundaryn (Session 22: dok-commit sköt fönstret 263→264).
          # check-frontmatter.sh Check 2 kräver filens sanna commit-datum. Per K1.D §0 utelämning #6.
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        # SHA-pin per ADR-029 §6 third-party Actions-policy.
        # tj-actions/changed-files v47.0.6 verifierad 2026-05-13 (K1.C Block 2).
        # Veckovis Actions-granskning per tasks/todo.md.
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          # quotepath: false — matcha non-ASCII-paths verbatim (upstream-
          # dokumenterad input i action.yml @ pinnad SHA). Gits default
          # core.quotepath=true oktal-escapar t.ex. backlog-kortfilers å/ä/—
          # och citerar strängen → den slutar på '"', inte '.md' →
          # **/*.md-globben missar → only_changed=false → onödig full
          # Test+Build för varje commit som rör kortfiler utan kod
          # (K1.17-klassen; TASK-15 S69, kontrastbevis run 29657524469
          # [kortfil → full] vs 29657760975 [ren ASCII-docs → skip]).
          quotepath: false
          files: |
            **/*.md
            LICENSE
            docs/**
            tasks/**
            tests/vale-regression/**
            scripts/test-vale-regression.sh
            .github/ISSUE_TEMPLATE/**
            .github/PULL_REQUEST_TEMPLATE.md
            .github/CODEOWNERS
            .vscode/extensions.json
            .editorconfig
            !.github/workflows/**
            !.github/dependabot.yml
            !package.json
            !package-lock.json
            !audit-ci.jsonc
            !tsconfig*.json
            !biome.json
            !vite.config.ts
            !playwright.config.ts
            !tsr.config.json
            !.nvmrc
            !.gitignore

      - name: Get changed docs files
        id: changed-docs
        # Separat docs-härledning (väg ii-a, Session 11): docs_changed ska bli true
        # även vid .lycheeignore-/ci.yml-ändring (lychee-config/ignore re-validerar
        # docs-link-check — stänger skip-gapet). Hålls ISÄR från should_skip_tests-
        # steget så det medvetna !.github/workflows/**-valet bevaras (en ci.yml-only-
        # commit kör fortfarande Test+Build via det orörda only_changed-filtret).
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          # quotepath: false — samma invariant som changed-files-steget
          # (TASK-15 S69): utan den ger en UTF-8-namngiven .md-ändring
          # docs_changed=false → Docs link check TYST SKIPPAD på en äkta
          # docs-ändring (allvarligare granne till only_changed-symptomet).
          quotepath: false
          files: |
            **/*.md
            .lycheeignore
            .github/workflows/ci.yml

      - name: Get changed UI files (D1-klassning)
        id: changed-ui
        # D1-klassen (task-36.3): en ALLOWLIST, aldrig blocklist. only_changed
        # blir true ENDAST när varenda ändrad fil matchar en UI-positiv OCH ingen
        # matchar en exkludering. Exkluderingarna är IDENTISKA med
        # should_skip_tests-stegets (AC#2): CI-workflow, paketmanifest, låsfil och
        # byggkonfig kan ALDRIG bli D1 — även om de ligger i samma commit som en
        # CSS-fil faller hela commiten till full svit (allowlist-golvet, AC#4).
        # quotepath: false — samma invariant som de andra stegen (TASK-15).
        # Bevisas med kontrastbevis-tripel, inte resonemang (AC#6).
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          quotepath: false
          files: |
            **/*.css
            src/styles/**
            public/**
            !.github/workflows/**
            !.github/dependabot.yml
            !package.json
            !package-lock.json
            !audit-ci.jsonc
            !tsconfig*.json
            !biome.json
            !vite.config.ts
            !playwright.config.ts
            !tsr.config.json
            !.nvmrc
            !.gitignore

      - name: Merge-dedup — hoppa tungt om trädet redan bevisats grönt
        id: dedup
        # task-36.4 / ADR-077. Innehållsadresserad dedup UTAN ny lagringsyta:
        # på en main-push (merge-commit) läses andra föräldern (den mergade
        # PR-headen), och de tunga jobben hoppas ENDAST om merge-commitens träd
        # är identiskt med PR-headens träd OCH den SHA:n redan har en grön
        # CI-run. Sundheten vilar på merge-grindens strict up-to-date-krav
        # (ADR-076): en up-to-date-branch ger merge-commit vars träd == PR-head.
        #
        # ASYMMETRIN ÄR MEDVETEN: nyckeln ÄR trädet självt, så dedupen kan bara
        # orsaka onödig körning, aldrig släppa förbi otestat. FAIL-CLOSED på
        # VARJE avvikelse — ingen andra förälder, träd-avvikelse, API-fel eller
        # icke-grön run ⇒ dedup_hit=false ⇒ full svit. Full SHA mot API:t (L314;
        # förkortad SHA ger noll träffar). Bor i changed-jobbet som redan har
        # fetch-depth: 0 → fetch-depth-invarianten (ADR-039/054) ORÖRD.
        # Logiken unit-testad lokalt mot 6 grenar (1 hit + 5 fail-closed) före
        # bygget. Cache-formen är FALSIFIERAD och byggs aldrig (L325).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          dedup_hit=false
          if [ "${EVENT_NAME}" = "push" ]; then
            if head2=$(git rev-parse --verify HEAD^2 2>/dev/null); then
              tree_head=$(git rev-parse 'HEAD^{tree}')
              tree_head2=$(git rev-parse "${head2}^{tree}")
              if [ "${tree_head}" = "${tree_head2}" ]; then
                conc=$(gh run list --commit "${head2}" --workflow ci.yml \
                  --json conclusion,status \
                  --jq '[.[] | select(.status == "completed")][0].conclusion // ""' \
                  2>/dev/null || echo "APIERR")
                if [ "${conc}" = "success" ]; then
                  dedup_hit=true
                  echo "✅ Dedup-TRÄFF: träd == ${head2:0:12}^{tree} och den SHA:n har grön CI-run → tunga jobb hoppas."
                else
                  echo "Dedup-miss: PR-head-run conclusion='${conc}' ej success → full svit (fail-closed)."
                fi
              else
                echo "Dedup-miss: träd-avvikelse (${tree_head:0:12} != ${tree_head2:0:12}) → full svit (fail-closed)."
              fi
            else
              echo "Dedup-miss: ingen andra förälder (ej merge-commit) → full svit (fail-closed)."
            fi
          else
            echo "Dedup ej tillämplig (event=${EVENT_NAME}, ej push) → full svit."
          fi
          echo "dedup_hit=${dedup_hit}" >> "${GITHUB_OUTPUT}"

  # Job 2: Always-on lint + audit + typecheck.
  # Kör på ALLA commits oavsett doc-only-detection. Per ADR-029 §1b + K17.
  lint:
    name: Lint + Audit + TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 = FULL historik (ADR-054, 2026-06-17) för
          # scripts/check-frontmatter.sh Check 2 (git log -1 --format=%cs -- <fil>).
          # Finit djup var anti-mönstret (1→50→100→250 brast 4 ggr när orörda
          # governing-docs passerade boundaryn). Konsistent med changed-jobbet;
          # invarianten (ADR-039) hålls enhetlig över alla 5 bärare.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (audit-ci with allowlist)
        run: npx audit-ci --config audit-ci.jsonc
        # K17 supply-chain-skydd: kör på varje commit (kod ELLER doc-only).
        # Allowlist tom efter K0åh (2026-05-13). ADR-028 reverse-flow aktiv.

      - name: Biome check
        run: npx @biomejs/biome check .

      - name: TypeScript check
        run: npm run typecheck

      - name: TypeScript check (tests)
        run: npm run typecheck:tests

      - name: Check workflow files (actionlint)
        # Release-pinnad install + egen SHA256-verifiering — shellcheck-
        # stegets mönster (S77 våg 1; processgranskningen 2026-07-23 § 8).
        # Ersätter ADR-029 utelämning #3:s download-script-form: skriptet
        # hämtades från MUTERBAR main och exekverade före all verifiering —
        # dess egen checksumme-koll skyddar inte mot komprometterad källa.
        # SHA256 downstream-beräknad mot fast release-asset 2026-07-23
        # (releases är immutabla); re-verifiering: ladda samma URL +
        # sha256sum lokalt. Erratum-not i ADR-029.
        # -ignore (smal, exakt feltext): actionlint 1.7.12:s schema släpar
        # efter Actions-featuren `queue:` i concurrency (plattforms-release
        # 2026-05-07; runtimen accepterar nyckeln — Test+Build grön i run
        # 29200533939 med den aktiv). LIFT: ta bort flaggan när actionlint
        # stödjer nyckeln (regexen blir då vestigial, matchar inget).
        run: |
          AL_VERSION="1.7.12"
          AL_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          AL_URL="https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_linux_amd64.tar.gz"
          curl -sL "${AL_URL}" -o /tmp/actionlint.tar.gz
          echo "${AL_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color -ignore 'unexpected key "queue" for "concurrency" section'

      - name: Check YAML syntax (yamllint)
        # Per ADR-030 § Del 1.4: yamllint kompletterar actionlint (yamllint =
        # generic YAML syntax/style; actionlint = GitHub Actions semantics).
        # Config: .yamllint.yml. Scope: .github/ (workflow + dependabot).
        # Python pre-installed på ubuntu-latest; pip-install ~3-5s.
        # Ingen pre-commit-hook — CI-only-grindvakt per Marcus' direktiv K2.
        run: |
          pip install --quiet yamllint
          yamllint .github/

      - name: Check public docs for unchecked items
        # Per ADR-030 § Del 1 (position #5): scripted-checklist-check fångar
        # oavslutade `- [ ]` i publika docs (README/CHANGELOG/SECURITY/
        # CONTRIBUTING/byggplan/BYGGPLAN-LÄTTLÄST-v3). CONTRIBUTING.md
        # `## Definition of Done`-sektioner exkluderade via per-sektion-
        # medveten awk-pattern. Snabb bash (<1s overhead). Ingen pre-commit-
        # hook (CI-only). Empirisk 4-test-suite verifierad vid K5-
        # implementation 2026-05-14; utvidgad till 5-test-suite vid K7.5
        # config-driven-refactor 2026-05-15. Config: .checklist-policy.conf.
        run: bash scripts/check-public-checklists.sh

      - name: Validate frontmatter on governing docs
        # Per ADR-030 § Del 3: 5-check-validator för YAML-frontmatter på
        # 9 styrande docs (existens, updated-match, review_by > today,
        # status-enum, owner-enum). Config: .frontmatter-policy.conf.
        # Empirisk 9-test-suite verifierad K7.B 2026-05-14.
        # Hub-spoke-portabel design per K7 Lesson #6 (UNIVERSAL).
        run: bash scripts/check-frontmatter.sh

      - name: Validate lifecycle field on session docs (ADR-052 gate)
        # ADR-052 beslut 4: dedikerad lätt grind (enum + konsistens fält↔kropp),
        # skild från frontmatter-governing-regimen (immutabilitets-skäl, ADR-023).
        run: bash scripts/check-lifecycle.sh

      - name: Check ADR count consistency (ADR-039 gate)
        # Per ADR-039 § kadens-principen: deterministisk konsistens-check vid
        # VARJE push (ej bara fas-avslut). ADR-fil-antal == README:s kanoniska
        # levande räkning, nyckar mot samma "[0-9]+ arkitekturbeslut"-token som
        # phase-end-verify.sh head -1:ar. Stänger K0a-driften (README 28 vs 38).
        run: bash scripts/check-adr-count.sh

      - name: Check fetch-depth invariant (ADR-039 gate)
        # Per ADR-039 + L50: de 6 LEVANDE fetch-depth-bärarna (ci.yml ×4 jobb +
        # .frontmatter-policy.conf + check-frontmatter.sh-default) hålls
        # ömsesidigt identiska; ADR-029/030 (frusen text) bär erratum-not.
        # Frusen ADR-text/arkiv/kommentarer ignoreras (läser bara namngivna
        # bärar-platser). L50:s obyggda test-hälft.
        run: bash scripts/check-fetch-depth-invariant.sh

      - name: Test consistency gates (truth-table self-verification)
        # Per ADR-039 § lesson→grind: en grind är inte en grind förrän dess
        # fyrning FORTLÖPANDE verifieras (L43). Kontrast-testet bevisade dem
        # vid bygg-tid; dessa suiter bevisar att de fortsätter fånga drift
        # efter framtida edits. Kör varje push (snabba; changed-files-villkor
        # icke-trivialt för scripts/-domänen). Form-val: Session 8 K0b.
        run: |
          bash scripts/test-check-adr-count.sh
          bash scripts/test-check-fetch-depth-invariant.sh

      - name: Test gatekeeper script suites (frontmatter / checklists / hook)
        # Per K6-auditen (Session 17): 3 av 6 grindvakts-testsviter körs
        # tidigare endast manuellt — samma kadens-missmatch-felklass som
        # ADR-039 stänger. Kör varje push; snabba (~31 s summa, Grind B-mätt);
        # sandboxade i egna /tmp-kataloger med trap-cleanup (rör aldrig
        # repots .git — test-pre-commit-hook fixture-git-init:ar i /tmp).
        # Changed-files-villkor för scripts-domänen avfärdat som icke-
        # trivialt — samma motivering som consistency-gates-steget ovan.
        # STOPPA-beslut B (Session 17 K7): eget steg med ärligt namn i
        # stället för att utöka ADR-039-stegets — stegnamn ska inte ljuga
        # om sitt innehåll.
        run: |
          bash scripts/test-check-frontmatter.sh
          bash scripts/test-check-public-checklists.sh
          bash scripts/test-pre-commit-hook.sh
          bash scripts/test-check-lifecycle.sh

      - name: Test prod-deploy allowlist (fail-closed)
        # Bevisar fail-closed-egenskapen i scripts/deploy-prod-functions.sh
        # (ADR-050 steg 2 / Fas 7-skuld L115): test-* + nya funktioner
        # exkluderas från prod-deploy by default. Eget steg med ärligt namn
        # (Session 17 K7-disciplin: stegnamn ska inte ljuga om sitt innehåll).
        # Kör endast --list/felvägar — INGEN faktisk deploy.
        run: |
          bash scripts/test-deploy-prod-functions.sh

      - name: Install shellcheck (pinned v0.11.0)
        # Per ADR-033 § Säkerhet + ADR-029 § Third-party Actions-policy.
        # ubuntu-latest har shellcheck 0.9.0-1 pre-installerat (Image
        # 20260413 per actions/runner-images manifest) — under <0.10-
        # tröskeln, saknar v0.10+ optional checks (SC2310 m.fl.).
        # Falsk-grön-risk per L9 om framtida code-edit triggar
        # v0.10+-check. CI alignas till lokal 0.11.0 via SHA-pinnad
        # download från koalaman/shellcheck GitHub releases.
        #
        # SHA-pin-rationale: koalaman publicerar inte separat .sha256sum-
        # fil per release-asset (empirisk verifikation 2026-05-16).
        # SHA256 nedan är downstream-beräknad mot fast nedladdad
        # release-asset från GitHub releases (immutability per
        # https://docs.github.com/en/repositories/releasing-projects-on-github/about-releases).
        # För re-verifikation: ladda ned samma URL + sha256sum lokalt;
        # SHA-match bevisar release-asset oförändrad. Konsekvent med
        # ADR-029 § Medvetna utelämningar #3 actionlint-precedent.
        run: |
          SC_VERSION="v0.11.0"
          SC_SHA256="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          SC_URL="https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz"
          curl -sL "${SC_URL}" -o /tmp/sc.tar.xz
          echo "${SC_SHA256}  /tmp/sc.tar.xz" | sha256sum -c
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo mv "/tmp/shellcheck-${SC_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep -F "version: 0.11.0"

      - name: Validate bash scripts with shellcheck-strict
        # Per ADR-033 § Del 1: shellcheck-strict-grindvakt (0/0/0/0).
        # --severity=style aktiverar style-domän (default skip:as);
        # --enable=all aktiverar optional checks (SC2250, SC2312,
        # SC2310, SC2311 m.fl. som är default-disabled).
        # Scope per ADR-033 § Del 3: scripts/*.sh + .githooks/* +
        # 2 sourced-config-filer (.checklist-policy.conf +
        # .frontmatter-policy.conf).
        # Pre-aktiverings-state (post-K3.2 commit d86d846): 0/0/0/0.
        run: |
          shellcheck \
            --severity=style \
            --enable=all \
            scripts/*.sh \
            .githooks/* \
            .checklist-policy.conf \
            .frontmatter-policy.conf

  # Job 3: Tung testsvit — anropar den reusable ci-suite.yml (EN KÄLLA,
  # delad med nightly.yml; task-36.2 / ADR-077). Villkorat på changed-
  # detection: HELA svit-anropet skippas på doc-only-commits
  # (should_skip_tests) → aggregatorn ser 'suite: skipped' (tolererat).
  # secrets: inherit → staging-secrets når inner-jobben (bevisat via spike
  # 2026-07-23, run 30036119790). Dependabot-hanteringen bor INNE i
  # ci-suite.yml (per-jobb) — test-fast måste köra även för dependabot.
  suite:
    name: Test suite
    needs: changed
    # Skippas vid docs-only (should_skip_tests) ELLER merge-dedup-träff
    # (dedup_hit, task-36.4): main-push vars träd redan bevisats grönt kör inte
    # om tunga jobb. Paraply-checken (ci-passed, always()) blir grön ändå —
    # skipped tolereras (AC#3). Fail-closad dedup ⇒ full svit vid varje tvivel.
    if: ${{ needs.changed.outputs.should_skip_tests != 'true' && needs.changed.outputs.dedup_hit != 'true' }}
    # Permissions-taket för det anropade ci-suite.yml. Ett anropat workflow kan
    # bara BEHÅLLA eller MINSKA anroparens token-permissions, aldrig eskalera
    # (GitHub Docs: "Permissions can only be maintained or reduced—not
    # elevated—throughout the chain"). ci.yml:s topp-nivå är permissions: {}
    # (least-privilege default, ADR-029 §4) — utan detta grant ärver suite-
    # jobbet {} och ci-suite:s jobb (contents: read för checkout) blir en
    # eskalering ⇒ startup_failure. Empiriskt fångat S79 (run 30037333924);
    # spike 30036119790 var grön just för att dess reusable-jobb bar {}.
    permissions:
      contents: read
    uses: ./.github/workflows/ci-suite.yml
    # run_staging: false vid D1 (ren UI-ändring) → ci-suite skippar purge +
    # staging (ingen mutex) men kör pure/build + a11y. Default i ci-suite är
    # true, så nightly.yml (som ej skickar inputen) kör alltid full svit.
    with:
      run_staging: ${{ needs.changed.outputs.ui_low_risk != 'true' }}
    secrets: inherit

  # Job 4: Markdown link validation. Conditional på docs-changes.
  # Per ADR-029 §1d. Ny kvalitets-check som inte fanns innan ("höjer kvaliten").
  docs:
    name: Docs link check
    needs: changed
    if: needs.changed.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 = FULL historik (ADR-054, 2026-06-17) för
          # scripts/check-frontmatter.sh Check 2 (git log -1 --format=%cs -- <fil>).
          # Finit djup var anti-mönstret (1→50→100→250 brast 4 ggr när orörda
          # governing-docs passerade boundaryn). Konsistent med changed-jobbet;
          # invarianten (ADR-039) hålls enhetlig över alla 5 bärare.
          fetch-depth: 0

      - name: Restore lychee cache
        id: restore-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-v2-${{ github.sha }}
          restore-keys: cache-lychee-v2-

      - name: Run lychee link check
        # SHA-pin per ADR-029 §6.
        # lychee-action v2.8.0 verifierad 2026-05-13 (K1.C Block 2), Rust-baserad.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          # Scope efter Marcus' Gate 2 anti-genväg-review + Commit 4a scope-konsistens:
          # INKLUDERAR: aktiva docs + aktiva tasks-dok + AKTIVA sessionsdok
          #             (tasks/sessions/*.md, Session 17 K7 — stänger L91/L97-
          #             felklassen; grind A-mätt 0-skuld) + repo-root .md
          # UTELÄMNAR: tasks/sessions/archive/** (frozen ADR-023) — K1.D §0 utelämning #1
          #            docs/archive/** (frozen ADR-023-mall, normaliserad i Commit 4a 2026-05-14)
          #            docs/reference/pocock/** (vendorerat externt Pocock-material, S47 Steg 0 —
          #            samma rationale som archive/: extern korpus, ej vår prosa)
          #            backlog/** (medvetet utanför — verktygsägd yta, L226; S48 Del 2 gren C)
          # --cache-exclude-status '429': transient rate-limit ska ALDRIG cachas som fel
          #   (klass-fix efter förgiftad cache på gitlab-429, röd run 28601497591). Cache-
          #   nyckel bumpad cache-lychee- → cache-lychee-v2- nedan = deterministisk kallstart.
          args: >-
            --cache
            --max-cache-age 1d
            --cache-exclude-status '429'
            --no-progress
            --verbose
            --header "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
            --exclude-path docs/archive
            --exclude-path docs/reference/pocock
            './docs/**/*.md'
            './tasks/*.md'
            './tasks/sessions/*.md'
            './tasks/threads/*.md'
            './*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save lychee cache
        uses: actions/cache/save@v6.1.0
        if: always()
        with:
          path: .lycheecache
          key: cache-lychee-v2-${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check markdown hygiene (markdownlint-cli2)
        # Per ADR-030 § Del 1.1: markdownlint-cli2 som docs-grindvakt efter
        # Lychee. Config: .markdownlint-cli2.jsonc. Scope definierad i
        # config-filens "globs"-fält (docs + tasks + repo-root .md).
        # Sessionsdok-archive + docs/archive exkluderade.
        # Ingen pre-commit-hook — CI-only-grindvakt per Marcus' direktiv K4.
        run: npx markdownlint-cli2

      - name: Install Vale
        # Per ADR-030 § Del 1.3: Vale-binary-install via curl + tar (analog
        # till actionlint per ADR-029 § Utelämning #3). vale-action är
        # underhåll-osäker (~17 mån gammal); binary minimerar Actions-
        # supply-chain-yta.
        run: |
          VALE_VERSION="3.14.1"
          curl -sL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o /tmp/vale.tar.gz
          tar -xzf /tmp/vale.tar.gz -C /tmp
          sudo mv /tmp/vale /usr/local/bin/vale
          vale --version

      - name: Check prose with Vale
        # Per ADR-030 § Del 1.3 (post-K6.1+K6.2): Vale.Spelling AV (F.1'
        # engelsk-hunspell-mismatch), Vale.Repetition + Miranon-stilguide
        # (VueToReact + Brand + Undvik) + Vocab-genererad Vale.Terms.
        # Vale.Terms + Miranon.VueToReact deferade till Session 6.6.6 via
        # per-fil rad-1-disable (Alt F per K6.2 Steg 7).
        # Single-source: samma definition som lokalt `npm run lint:prose`
        # (package.json). Vale-binary installerad i föregående step; npm finns
        # via setup-node ovan. Session 7 K0.S2.
        run: npm run lint:prose

      - name: Validate Vale L_X.2 regression-test-suite
        # Per ADR-032 § Regression-skydd: 3-test AssertFlip-suite för
        # L_X.2-upstream-bug lift-trigger. T1 inverterad assertion
        # (PASS = bug bekräftad fortfarande); FAIL = lift-protokoll
        # aktiveras. T2 helfil-disable suppression. T3 Brand-rule
        # ej maskerad. Vale-binary redan installerad i föregående step.
        # Etablerad: Session 6.6.6 K3.6 (2026-05-20).
        run: bash scripts/test-vale-regression.sh

  # Job 5: Aggregator — REQUIRED CHECK för main-rulesetet (ADR-076).
  # Per ADR-029 §1e + S77-incidenten (PR #101): jobbet KÖR ALLTID och
  # rapporterar success ELLER failure — ALDRIG skipped. Gamla formen
  # (if-villkor som skippade jobbet vid failure i needs) var FAIL-OPEN
  # som required check: GitHub räknar en skipped check som uppfylld →
  # auto-merge mergade en RÖD PR (docs-jobb failure, aggregator skipped;
  # run 30023934304 → main-rött 30024005788). Detta är dual-signal-
  # behovet som ADR-029 utelämning #5 förutsåg ("explicit failure-signal
  # överflödig utan automation som läser den") — rulesetet ÄR den
  # automationen; signalen aktiverad här. Cancelled-gotchan (Commit 1.5:
  # per-job-cancellation osynlig för cancelled()) täcks av samma
  # needs-läsning: cancelled ⇒ explicit fail.
  # Fail-grenens gate-proof: gate-proof.yml (task-36.1, levererad S78) —
  # bevis-skulden BETALD (tvåsidigt: run 30032296699 grön + self-test
  # 30032299223 röd). Kör gate-proof.yml efter varje ci.yml-ändring (T85).
  ci-passed:
    name: CI Passed or Skipped
    if: ${{ always() }}
    needs: [changed, lint, docs, suite]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Verifiera needs-resultaten (fail-closed)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "${NEEDS}" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")] | length')
          if [ "${bad}" -ne 0 ]; then
            echo "❌ ${bad} jobb med failure/cancelled — aggregatorn FAILAR explicit (aldrig skipped; required-check-hålet stängt S77)."
            exit 1
          fi
          echo "✅ CI Passed or Skipped — alla jobb success eller skipped-by-design."
