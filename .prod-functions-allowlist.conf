# Räckviddsbytet (TASK-338.4, PR #2103, mergad 2026-08-29 16:10 UTC):
# `update-attachment-scope` ändrar en delad bilagas räckvidd i efterhand
# (ADR-125 § Beslut 1:s tre axlar) — Lottas "Ändra räckvidd" i räckviddsläget.
# Samma gateway-första-försvar (requireUser) + field-allowlist som repots
# övriga skriv-EF:er, se supabase/functions/update-attachment-scope/index.ts.
#
# VARFÖR RADEN BEHÖVDES SOM EGEN LANDNING: `#2103` levererade funktionen men
# rörde aldrig denna fil. Skriptets asymmetri är avsiktlig men lätt att läsa
# fel, så den står här mätt (deploy-prod-functions.sh, radnummer per 2026-08-29):
#
#   - En ALLOWLISTAD funktion utan katalog på disk FÄLLER — `missing_from_disk`
#     ger exit 1 och "Avbryter — fail-closed (ingen deploy)" (:215-221).
#   - En KATALOG utan allowlist-rad fäller ALDRIG. Den listas som
#     `[EXKLUDERAD]` (:204-211) och deployen fortsätter utan den.
#
# Utskriften sker i ALLA lägen — `:204` ligger FÖRE lägesgrenen `:223` — så
# raden syns även under `--deploya`. Den är alltså inte tyst; den är
# icke-fällande. Skillnaden spelar roll: en ny EF som saknas här ger en deploy
# som ser lyckad ut, rullar sina ~10 minuter, och lämnar funktionen odeployad
# medan utdatan nämnde det i förbigående mitt i 45 andra rader.
#
# Därav regeln: kör `bash scripts/deploy-prod-functions.sh --list` FÖRE varje
# prod-deploy som följer på en PR med en NY Edge Function, och läs
# Exkluderade-blocket. Det var så denna rad upptäcktes — list-läget visade
# `[EXKLUDERAD]  update-attachment-scope` innan deployen kördes.
#
# (En tidigare version av detta stycke påstod att grenen var "TYST". Det var
# falskt och fångades i granskningen av PR #2117 — ADR-083-klassen: prosa som
# påstår mekanism ska mätas, inte antas.)
update-attachment-scope

