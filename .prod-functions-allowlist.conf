# FAIL-CLOSED allowlist: Supabase Edge Functions som FÅR deployas till PROD.
# Läses av scripts/deploy-prod-functions.sh. En funktion under
# supabase/functions/ som INTE står i denna lista deployas ALDRIG till prod
# (t.ex. test-auth). Ny prod-funktion = lägg MEDVETET till en rad här.
#
# Skälet (ADR-050 steg 2 / Fas 7-skuld, tasks/lessons.md L115): en blocklista
# av test-funktioner skulle tyst släppa en framtida test-bakdörr till prod om
# någon glömde blocklista den. En allowlist vänder default till säker riktning.
#
# Format: en funktion per rad. # inleder kommentar. Blanksteg ignoreras.
# test-auth saknas MEDVETET — den är test-only och får aldrig nå prod.

