# shellcheck shell=bash
# shellcheck disable=SC2034
# Variables in this file are sourced and consumed by external
# scripts (.githooks/pre-commit). shellcheck cannot trace cross-file
# variable usage, so SC2034 ("appears unused") triggers as false
# positive. Disable is file-level and intentional — same convention
# as .frontmatter-policy.conf.

# .staging-preflight-hook-policy.conf
#
# Trigger-config för .githooks/pre-commit § "Staging-preflightens wiring"
# (T119 (d) item 4 — carry ur tasks/sessions/archive/2026-08/2026-08-04-session-97.md).
# Hookens LOGIK är universell (prefix-match mot en lista); VÄRDENA — vilka
# staged sökvägar som ska trigga vakten — är projekt-specifika och hör hemma
# här (Lesson #6, CLAUDE.md § "Custom CI-grindvakts-logik ... alltid
# config-driven").
#
# scripts/check-staging-preflight-wiring.mjs (TASK-91) sveper på egen hand:
# hela scripts/-katalogen (dess "sjätte yta"-upptäcktsnät,
# .staging-preflight-wiring-policy.json § nodeSkriptUpptäckt.kataloger),
# playwright.config.ts, och de tre setup-filerna under tests/
# (tests/api/, tests/e2e/, tests/preview/ — se CONTRIBUTING.md
# § "Staging-preflighten" tabellen). Listan nedan är samma yta uttryckt som
# staged-path-prefix, så hooken kan avgöra UTAN att köra Node — de allra
# flesta commits (src/, docs/, styling …) rör aldrig någon av dem och
# betalar noll.
#
# Entries som slutar på "/" är katalog-prefix (matchar ALLT under
# katalogen, inkl. raderade filer — vakten TASK-91 grindar är uttryckligen
# en deletion-vakt). Övriga entries är exakt path-match.
STAGING_WIRING_TRIGGER_PATHS=(
    "playwright.config.ts"
    ".staging-preflight-wiring-policy.json"
    "scripts/"
    "tests/"
)
