# shellcheck shell=bash
# shellcheck disable=SC2034
# Variabeln här sourcas av scripts/test-lint-inert-extensions.sh och läses
# (via .listparitet-policy.conf:s par `lint-inert-ext`) mot ci.yml:s
# `changed-lint-inert-ext`-steg. Skriptets LOGIK är universell (kan
# dupliceras till andra spokes utan refactor); värdena här är
# PROJEKT-SPECIFIKA. Samma hub-spoke-portabilitet som
# .grind-tillganglighet-policy.conf, .backlog-closure-policy.conf m.fl.
# (Lesson #6, UNIVERSAL).
#
# .lint-inert-policy.conf
#
# ═══ VARFÖR DENNA FIL FINNS (TASK-464.1 runda 3, review runda 2, risk hög,
# fynd 1, 2026-09-19) ═══
#
# Runda 1:s F2 (scripts/lib motsvarande fix) gav `lint`-jobbet ett ANDRA
# `if:`-villkor byggt på en NEKANDE lista (kända kod-ändelser: js/ts/html/…).
# En NEKANDE lista är ett fail-OPEN-mönster: en ändelse som INTE står i den
# (json, css, …) klassas tyst som "ingen kod", trots att Biome (lint-jobbets
# `npx @biomejs/biome check .`) BEVISLIGEN lintar båda — se
# scripts/test-lint-inert-extensions.sh § (a) för det körda beläget
# (`echo '{"a":1,"a":2}' > x.json && biome check x.json` faller; samma för
# trasig CSS). En diff som BARA ändrar t.ex.
# `docs/reference/review-utlatande.schema.json` hade landat helt ogranskad
# av lint — exakt den regressionsklass Marcus villkorade GO uttryckligen
# förbjöd ("inget verkligt skydd försvinner").
#
# ORKESTRERARENS BESLUT: vänd formen till FAIL-CLOSED. `lint` hoppas över
# ENDAST när diffen är D0-klassad OCH VARJE ändrad fil har en ändelse i
# DENNA positiva lista över BEVISAT lint-inerta ändelser. En okänd ändelse,
# ingen ändelse alls, eller minsta osäkerhet i klassningssteget ⇒ `lint`
# KÖR (se ci.yml:s `Derive requires_lint_by_extension`-steg för
# fail-closed-formen på fel/timeout).
#
# ═══ VAD "BEVISAT INERT" BETYDER — TRE BELÄGG PER ÄNDELSE ═══
#
# scripts/test-lint-inert-extensions.sh kör, per ändelse i listan nedan, mot
# en provfil med AVSIKTLIGT TRASIGT innehåll för den filtypen:
#   (a) Biome — `biome check <provfil>` ska svara "No files were processed"
#       (biome KÄNNER INTE IGEN ändelsen alls; den prövas aldrig, oavsett
#       innehåll — starkare belägg än "0 fel på DENNA provfil").
#   (b) Typkontrollens `include` — ingen av repots tsconfig*.json:s
#       `include`-listor pekar på docs/**, tasks/** eller ett glob för
#       ändelsen.
#   (c) shellcheck-strict-uppräkningen (ci.yml, steget "Validate bash
#       scripts with shellcheck-strict") — en FAST uppräkning av .sh-filer
#       + namngivna .conf-filer; kan strukturellt aldrig bära en fil med
#       någon av ändelserna nedan.
# En ändelse som INTE klarar alla tre STRYKS ur listan — testet fäller på
# den innan den hinner bli en tyst regression. `svg` PRÖVADES och STRÖKS:
# Biome har en HTML/SVG-parser (`lint/a11y/noSvgWithoutTitle` träffade en
# trasig `docs/**/*.svg`-provfil skarpt, 2026-09-19) — samma
# `biome.json`-overrides-block som stänger av regeln för `public/**/*.svg`
# är själva beviset att Biome behandlar SVG som lintbar HTML/XML.
#
# ═══ HUR LISTAN VAKTAS ═══
#
# Paret `lint-inert-ext` i .listparitet-policy.conf (riktning `bada`) kräver
# att GLOBEN nedan är BYTE-IDENTISK med ci.yml:s `changed-lint-inert-ext`-
# stegs `with.files`-block. Glider de isär fäller check-listparitet.sh —
# annars hade en agent kunnat lägga till en ändelse här (i "beläggs"-listan)
# utan att den någonsin syns av CI, eller tvärtom.
#
# ═══ UNDERHÅLL — EN NY ÄNDELSE FÖRESLÅS ═══
#
# Lägg INTE till en ändelse förrän scripts/test-lint-inert-extensions.sh
# visar alla tre beläggen gröna för den. Lägg sedan till SAMMA rad på två
# ställen i SAMMA ändring: denna array OCH ci.yml:s `changed-lint-inert-ext`
# -steg (paritetsvakten fäller annars).
#
# paritet:start lint-inert-ext
LINT_INERT_GLOBAR=(
  "**/*.md"
  "**/*.jsonl"
  "**/*.txt"
  "**/*.pdf"
  "**/*.png"
  "**/*.jpg"
  "**/*.jpeg"
  "**/*.gif"
  "**/*.webp"
  "**/*.csv"
)
# paritet:slut lint-inert-ext
