# .supabase-cli-policy.conf
#
# Per-projekt config för scripts/lib/supabase-cli.sh. Skriptets LOGIK är
# universell (kan dupliceras till andra spokes utan refactor); VÄRDET här —
# den faktiska pinnade CLI-versionen — är projektspecifikt data.
#
# === Duplicera till nytt spoke (2 steg) ===
# 1. cp scripts/lib/supabase-cli.sh + denna fil till nytt repo
# 2. Sätt SUPABASE_CLI_VERSION till den version det nya repot vill pinna
#
# === VARFÖR FILEN FINNS — felet, mätt (S108, 2026-08-24) ===
#
# En prod-deploy av bilagespåret avbröts efter 18 AV 45 funktioner:
#
#   → supabase functions deploy generate-event-attachment --project-ref <prod>
#   Uploading asset (generate-event-attachment):
#     supabase/functions/_shared/mallar/kvitto.css.ts
#   failed to read file: open /*\n * Kvitto-mallens EGNA CSS …: invalid
#   argument
#
# CLI:t försökte öppna INNEHÅLLET i kvitto.css.ts (25 kB enkelrads-
# strängmodul, autogenererad) som en sökväg.
#
# Differentialmätning — samma funktion, samma mål (STAGING
# pqtshyierkdgwdnxuirz), samma träd:
#
#   supabase       2.75.0  (global, /usr/local/bin/supabase)  → FAIL
#                                        (identiskt fel, reproducerat)
#   npx supabase  2.115.0                                     → EXIT 0
#
# Grundorsak: scripts/deploy-prod-functions.sh kallade den GLOBALA binären
# medan anroparen scripts/fas4-prod-deploy.sh genomgående kör `npx
# supabase`. Samma deploy-väg körde alltså TVÅ olika CLI-versioner — och
# INGEN av dem var versionspinnad (CLI:t var, före denna fil, verifierat
# frånvarande ur BÅDE package.json och package-lock.json; raden "supabase"
# i package.json var bara ett npm-keyword, ingen dependency).
#
# Sju anropsställen bar var sin form (bar `supabase`, `npx supabase` utan
# pin, kommentarer som lärde ut den felande bara formen) innan denna fil +
# scripts/lib/supabase-cli.sh konsoliderade dem till EN pinnad väg.
#
# === VARFÖR VERSIONEN INTE PINNAS I package.json ===
#
# Förstapartskällan (github.com/supabase/cli README) rekommenderar
# `npm install -D supabase` — den vägen MÄTTES och FÖRKASTADES på KOSTNAD,
# inte princip:
#
#   @supabase/cli-linux-x64    (CI:s plattform)  159 079 541 B ≈ 159 MB
#     unpacked (npm view @supabase/cli-linux-x64 dist.unpackedSize,
#     2026-08-24)
#   @supabase/cli-darwin-arm64 (Marcus maskin)    113 915 186 B ≈ 114 MB
#     unpacked (npm view @supabase/cli-darwin-arm64 dist.unpackedSize,
#     2026-08-24)
#
# CLI:t anropas ALDRIG i CI — verifierat: noll träffar på CLI-underkommandon
# (functions/secrets/link/projects/db) i .github/workflows/*.yml. Deploys är
# manuella per scripts/deny-prod-ref.sh (prod-refen måste stå i Bash-
# kommandosträngen, vilket bara Marcus egen `!`-prefixade terminal bär).
# 159 MB i varje CI-jobbs node_modules för ett verktyg INGET CI-jobb anropar
# är spekulativ kostnad ovanför golvet — precis vad den dubbelriktade
# över-engineering-vakten (~/.claude/CLAUDE.md § Instruktioner) skär bort.
#
# npm-versioner är immutabla (en publicerad version kan aldrig ändra
# innehåll under samma versionssträng), så `npx supabase@<exakt version>`
# ger i PRAKTIKEN samma byte-determinism som en package.json-pin — utan
# att betala 114–159 MB i varje agents/CI-jobbs node_modules för ett
# verktyg som aldrig körs där.
#
# === VAD AVSTEGET FAKTISKT VÄXLAR BORT (TASK-309.15-skörden, 2026-08-24) ===
#
# Stycket ovan bär BYTE-axeln och den håller. Men ett avsteg från ett
# förstapartsmönster ska namnge vilken GARANTI som växlades bort, inte bara
# vad den kostade — annars läser nästa person motiveringen som "ingen
# skillnad", och det är inte sant. Den axel som INTE är samma:
#
#   package.json-pin:   binären slås upp i FILSYSTEMET (node_modules/.bin/),
#                       låst av package-lock.json med integritets-hash.
#   npx supabase@X.Y.Z: PAKETNAMNET löses mot npm-registret vid VARJE
#                       körning. Versionen är exakt och innehållet
#                       immutabelt — men uppslaget av namnet är det inte.
#
# Skillnaden är supply-chain, inte determinism: en filsystemsväg kan inte
# lösas om, ett registeruppslag kan. Fällan är i praktiken stängd här
# (paketnamnet `supabase` är officiellt, binärnamnet är detsamma, versionen
# exakt pinnad, och `scripts/lib/supabase-cli.sh` verifierar den faktiska
# versionen efter uppslaget) — men garantin är svagare, och den svagheten
# hör skriven här snarare än upptäckt av nästa läsare.
#
# Öppen spänning, medvetet bokförd: L430 avråder generellt från `npx` i
# CI-vägar av just detta skäl. Här väger 159 MB per jobb för ett verktyg
# CI aldrig anropar tyngre. Ändras den kalkylen — börjar CI faktiskt köra
# CLI:t — ska valet göras om, inte ärvas.
#
# === HUR MAN UPPGRADERAR ===
#
# 1. Bumpa SUPABASE_CLI_VERSION nedan till den nya versionen (EXAKT, ingen
#    ^/~ — samma "stoppa hellre än gissa"-doktrin som .prod-ref-policy.conf).
# 2. Kör testsviterna: bash scripts/test-supabase-cli-policy.sh +
#    bash scripts/test-deploy-prod-functions.sh + bash scripts/test-fas4-
#    prod-deploy.sh.
# 3. Deploya mot STAGING först (bash scripts/fas4-prod-deploy.sh
#    --kontrollera <staging-ref> för read-only-läsning; en riktig
#    stagingdeploy sker via samma vägar appen redan använder för staging)
#    och verifiera att `npx supabase@<ny version> --version` faktiskt ger
#    den nya strängen tillbaka innan prod rörs.
#
# Källa: PR som stängde felet ovan (superseder den ursprungliga, smalare
# fixen som bara rättade anropsställe A1) · scripts/lib/supabase-cli.sh.

SUPABASE_CLI_VERSION="2.115.0"
