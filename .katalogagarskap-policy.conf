# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/deny-frammande-huvudkatalog.sh
# och scripts/katalogagarskap-markor.sh. Verktyget kan inte följa
# cross-file-användning, så SC2034 ("appears unused") slår som falskt positiv.
# Disable är fil-nivå och avsiktlig — samma form som .mail-lock-policy.conf,
# .heartbeat-svep-policy.conf, .ci-wait-policy.conf, .staging-semaphore-policy.conf,
# .checklist-policy.conf, .frontmatter-policy.conf och .lesson-policy.conf
# (Lesson #6, UNIVERSAL).

# .katalogagarskap-policy.conf
#
# Per-projekt config för katalogägarskaps-hooken (S97, T119 arbetslista (a),
# vidareutvecklad T120 samma dag). Skriptens LOGIK är universell (kan
# dupliceras till andra spokes utan refactor); VÄRDENA här — vilka
# git-underkommandon som räknas som skrivande, hur CLI-processen känns igen,
# och hur gammal en ägarlapp i äldre form (utan pid) får bli innan den
# fälls — är projekt-/arbetsflödesspecifika.
#
# === VAD MEKANISMEN GÖR ===
# ADR-090 beslut 2 (ägarskaps-regeln) säger: "Den senare startande sessionen
# tar worktreen; den först startade behåller sin plats i huvudträdet." Regeln
# fanns bara i prosa och bröts tre gånger i ETT pass (S96 Del 8: två
# `ff-merge` och en gren skapad i huvudkatalogen medan S93 ägde den). Ingen
# skada den gången — rena träd, rena fast-forwards — men fel form, och
# `check-lifecycle.sh` var grön hela tiden eftersom den prövar form, inte
# sanning.
#
# Mekanismen är en ägarlapp i den DELADE git-katalogen, samma idé som Vims
# .swp-fil — vilket ADR-090 § Precedent redan sanktionerar ("Vim … samma
# familj: detektera OCH mänskligt val, aldrig tyst").
#
# === VARFÖR LAPPEN BOR I --git-common-dir ===
# Mätt 2026-08-04 i detta repo:
#     från huvudkatalogen:      --git-common-dir = <repo>/.git
#                               --git-dir        = <repo>/.git
#     från en worktree:         --git-common-dir = <repo>/.git        (SAMMA)
#                               --git-dir        = <repo>/.git/worktrees/<namn>
# Två konsekvenser faller ut gratis: (1) .git/ är per definition delad mellan
# huvudträdet och alla worktrees, så lappen syns överallt utan att
# versionshanteras och utan att skräpa i repot; (2) "är jag i huvudkatalogen?"
# blir en exakt strängjämförelse `--git-dir == --git-common-dir`, ingen
# path-heuristik.

# === Lappens filnamn (relativt --git-common-dir) ===
KATALOG_MARKOR_FILNAMN="katalogagarskap-agare.json"

# === Hur många nivåer uppåt i förfaderkedjan letas Claude Code-CLI:ns egen
#     process (T120-rotorsaken: ingen PID exponeras i hook-input) ===
# $$ i katalogagarskap-markor.sh är hookens EGNA process, aldrig CLI:n själv —
# sökningen börjar en nivå ovanför. Mätt live 2026-08-04 i detta projekts
# egen VS Code-integrerade-terminal-uppsättning: CLI-processens `comm` var
# bara strängen "Claude", TVÅ nivåer upp från skalet som körde hooken (VS
# Code → Code Helper → zsh → "Claude" → zsh → hook-skriptet). Taket ger
# riklig marginal utan att kunna springa iväg i en trasig processtabell.
KATALOG_MAX_FORFADER_NIVAER=6

# === Processnamn som identifierar CLI:n, case-insensitiv delsträngsmatchning
#     mot `ps -o comm=` ===
# En träff ⇒ den processens PID + starttid (`ps -o lstart=`) skrivs i lappen
# som agare_pid / agare_pid_starttid. INGEN träff inom taket ⇒ fälten skrivs
# tomma (null) — lappen fungerar då EXAKT som före denna ändring (fail-open,
# se katalogagarskap-markor.sh § PID-LIVENESS).
KATALOG_CLI_PROCESSNAMN=(
    "claude"
)

# === Stale-tröskel i timmar — SISTA UTVÄG, inte primärt försvar ===
# Primärt försvar sedan T120 (S97, 2026-08-04) är PID-LIVENESS: lappen bär
# ägarprocessens PID + starttid, och deny-frammande-huvudkatalog.sh kör
# `kill -0` + jämför starttiden (PID-återanvändningsgard) innan den nekar.
# En bevisligen övergiven lapp (processen död, eller PID återanvänd av en
# ANNAN process) släpps TYST och blockerar aldrig en levande session — det
# var precis det 12-timmarsvärdet INTE kunde göra (skarpt fall 2026-08-04:
# en lapp blockerade nästa session tre minuter efter att dess ägarsession
# redan var död).
#
# Denna tröskel gäller BARA de fall PID-liveness strukturellt inte kan
# avgöra: en lapp i äldre form utan agare_pid, eller `ps`/`kill` otillgängligt
# på maskinen som prövar lappen (t.ex. ägaren satt lappen på en ANNAN
# maskin — ett känt, accepterat gap, se deny-frammande-huvudkatalog.sh
# § LIVENESS-PRÖVNING, stycket "OSÄKER", för varför det inte går att stänga
# med enbart PID).
# 12 h var kalibrerat mot ingenting mätbart (samma anmärkning som redan stod
# här). 1 h är fortfarande generöst för en ensam utvecklares arbetspass och
# krymper skadefönstret för just de kvarvarande fallen kraftigt jämfört med
# 12 h, utan att vara så kort att en lunchrast felklassas som stale.
KATALOG_STALE_TIMMAR=1

# === FÖRKASTAT: tidsbaserat övertagande av en LEVANDE men TYST ägare ===
# Ett tredje designtillägg (S97, samma dag) prövade ett `KATALOG_TYSTNAD_MINUTER`
# — en levande ägare som varit tyst länge nog skulle ge vika för en session
# som faktiskt ville skriva. Marcus FÄLLDE förslaget innan det landade, med
# ett konkret scenario (verbatim): "det kan ju bara vara så att jag behöver
# gå och bajsa, och när jag kommer tillbaka så har vi ingen katalog att stå
# på då?" Rotorsaken i det förkastade tänkandet: TID användes som proxy för
# "ingen arbetar här", men ett arbetsträd med OCOMMITTADE ändringar är
# upptaget oavsett hur länge ägaren varit tyst — session B hade kunnat skriva
# (checkout/commit/merge) rätt ovanpå session A:s ocommittade arbete medan
# A bara var borta från tangentbordet. Se ADR-090 § Update för hela
# resonemanget. Enda giltiga övertagande-villkoret är därför BEVISAD DÖD
# process (§ PID-LIVENESS) — aldrig tystnad. Byggs detta någon gång i
# framtiden ska det ske MED mätning bakom sig (fällnings-loggen), inte som
# en gissning — dubbelriktad över-engineering-vakt: ingen spekulativ
# mekanism utan en faktisk, mätt nuvarande användare.

# === Git-underkommandon som räknas som SKRIVANDE ===
# Urvalsregeln: allt som ändrar arbetsträdet, HEAD, grenar, index eller
# stash i det träd kommandot riktas mot.
#
# MEDVETET INTE MED, med skäl:
#   fetch          — additiv på refs, ändrar inte arbetsträd/HEAD; två
#                    sessioner kan fetcha samtidigt utan att störa varandra.
#   status/log/    — rena läsningar.
#   diff/show/
#   rev-parse/
#   worktree list
#   config --get   — läsning. (`config --set` fångas inte heller; den rör
#                    inte arbetsträdet och är utanför den felbild ADR-090
#                    beskriver. Öppet noterat, inte ett förbiseende.)
#
# S96:s tre faktiska överträdelser var `merge` (×2) och `switch -c` — båda
# står i listan.
KATALOG_GIT_SKRIVKOMMANDON=(
    "merge"
    "switch"
    "checkout"
    "commit"
    "rebase"
    "reset"
    "push"
    "pull"
    "cherry-pick"
    "revert"
    "stash"
    "am"
    "apply"
    "restore"
    "branch"
    "tag"
    "clean"
    "gc"
    "prune"
    "add"
    "rm"
    "mv"
)

# === Underkommandon till `git worktree` som räknas som skrivande ===
# `git worktree list` är en läsning och ska INTE fällas; add/remove/prune/move
# ändrar delat tillstånd i .git/worktrees och räknas därför.
#
# NOTERA att skrivande INTE är samma sak som fällt: sedan TASK-322 avgör
# MÅLKATALOGEN om en skrivning fälls. `git worktree remove <egen worktree>`
# kört från den egna worktreen har den worktreen som mål och släpps därför —
# se deny-frammande-huvudkatalog.sh § WORKTREE-OPERATIONER för
# ställningstagandet och dess motiv.
KATALOG_WORKTREE_SKRIVKOMMANDON=(
    "add"
    "remove"
    "prune"
    "move"
    "lock"
    "unlock"
)

# ═══ FLAGG-MEDVETEN LÄS/SKRIV-KLASSNING (TASK-322) ═══════════════════════
#
# PROBLEMET SOM LAGADES: listan ovan fångade bara underkommandots NAMN.
# `branch` står i KATALOG_GIT_SKRIVKOMMANDON eftersom `git branch -d` raderar
# en gren — men `git branch --merged` är en ren LÄSNING och fälldes med samma
# väg. Mätt live 2026-08-26 (kortets egen reproduktion) och igen 2026-08-28
# i TASK-322:s repro-rigg: `--list`, `--merged`, `--show-current` och `-a`
# nekades alla, liksom `tag --list` och `stash list`.
#
# MODELLEN: för ett FLAGGSTYRT underkommando avgör argumenten, i denna
# ordning (se deny-frammande-huvudkatalog.sh `_klassa_flaggstyrd`):
#   1. en SKRIVFLAGGA nedan            ⇒ SKRIVNING (starkast, vinner alltid)
#   2. en ABSOLUT LÄSFLAGGA nedan      ⇒ LÄSNING
#   3. ett POSITIONELLT argument       ⇒ SKRIVNING (`git branch <nytt-namn>`)
#   4. inget av ovanstående            ⇒ LÄSNING (`git branch` listar)
# Läsflaggor som TAR ETT VÄRDE listas separat så att värdet inte felläses som
# ett positionellt argument (`git branch --merged main` är en läsning).
#
# OKÄNDA FLAGGOR IGNORERAS MEDVETET (fail-open, samma linje som skriptets
# § FAIL-OPEN-VALET). Skälet är asymmetrin i skada: de FARLIGA operationerna
# (merge, reset, checkout, commit, rebase, push) står i den OVILLKORLIGA
# listan ovan och rörs inte alls av flagg-logiken — bara `branch` och `tag`
# är flaggstyrda, och en missad grenradering är återställbar via reflog.
# En okänd flagga som fälldes hade däremot brutit AC #2 ("läskommandon fälls
# aldrig") för varje flagga vi råkat glömma här.
KATALOG_GIT_FLAGGSTYRDA=(
    "branch"
    "tag"
)

# Flaggor som gör det flaggstyrda underkommandot till en SKRIVNING.
# Format: "<underkommando>:<flagga>".
KATALOG_GIT_SKRIVFLAGGOR=(
    "branch:-d" "branch:-D" "branch:--delete"
    "branch:-m" "branch:-M" "branch:--move"
    "branch:-c" "branch:-C" "branch:--copy"
    "branch:-f" "branch:--force"
    "branch:-u" "branch:--set-upstream-to" "branch:--unset-upstream"
    "branch:--edit-description"
    "tag:-d" "tag:--delete"
    "tag:-f" "tag:--force"
    "tag:-a" "tag:--annotate"
    "tag:-s" "tag:--sign"
    "tag:-m" "tag:--message"
    "tag:-F" "tag:--file"
)

# Flaggor som gör underkommandot till en LÄSNING oavsett positionella
# argument. `git tag -l 'v*'` och `git branch --list 'feat/*'` bär ett
# mönster-argument som annars hade lästs som "skapa gren/tagg".
KATALOG_GIT_LASFLAGGOR_ABSOLUTA=(
    "branch:-l" "branch:--list"
    "tag:-l" "tag:--list"
    "tag:-n"
)

# Läsflaggor som TAR ETT VÄRDE — värdet hoppas över så det inte felläses som
# ett positionellt argument. Format: "<underkommando>:<flagga>".
KATALOG_GIT_LASFLAGGOR_MED_VARDE=(
    "branch:--merged" "branch:--no-merged"
    "branch:--contains" "branch:--no-contains"
    "branch:--points-at" "branch:--sort" "branch:--format"
    "tag:--merged" "tag:--no-merged"
    "tag:--contains" "tag:--no-contains"
    "tag:--points-at" "tag:--sort" "tag:--format"
)

# === Underkommandon till `git stash` som är LÄSNINGAR ===
# OMVÄND default mot `worktree` ovan, och det är avsiktligt: `git stash` UTAN
# argument är `git stash push` — alltså en skrivning. Bara de uttryckligen
# listade formerna nedan är läsningar.
KATALOG_STASH_LASKOMMANDON=(
    "list"
    "show"
)
