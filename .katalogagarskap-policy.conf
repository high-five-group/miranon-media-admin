# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/deny-frammande-huvudkatalog.sh
# och scripts/katalogagarskap-markor.sh. Verktyget kan inte följa
# cross-file-användning, så SC2034 ("appears unused") slår som falskt positiv.
# Disable är fil-nivå och avsiktlig — samma form som .mail-lock-policy.conf,
# .heartbeat-svep-policy.conf, .ci-wait-policy.conf, .staging-semaphore-policy.conf,
# .checklist-policy.conf, .frontmatter-policy.conf och .lesson-policy.conf
# (Lesson #6, UNIVERSAL).

# .katalogagarskap-policy.conf
#
# Per-projekt config för katalogägarskaps-hooken (S97, T119 arbetslista (a),
# Marcus-GO 2026-08-04). Skriptens LOGIK är universell (kan dupliceras till
# andra spokes utan refactor); VÄRDENA här — vilka git-underkommandon som
# räknas som skrivande, och hur gammal en ägarlapp får bli — är
# projekt-/arbetsflödesspecifika.
#
# === VAD MEKANISMEN GÖR ===
# ADR-090 beslut 2 (ägarskaps-regeln) säger: "Den senare startande sessionen
# tar worktreen; den först startade behåller sin plats i huvudträdet." Regeln
# fanns bara i prosa och bröts tre gånger i ETT pass (S96 Del 8: två
# `ff-merge` och en gren skapad i huvudkatalogen medan S93 ägde den). Ingen
# skada den gången — rena träd, rena fast-forwards — men fel form, och
# `check-lifecycle.sh` var grön hela tiden eftersom den prövar form, inte
# sanning.
#
# Mekanismen är en ägarlapp i den DELADE git-katalogen, samma idé som Vims
# .swp-fil — vilket ADR-090 § Precedent redan sanktionerar ("Vim … samma
# familj: detektera OCH mänskligt val, aldrig tyst").
#
# === VARFÖR LAPPEN BOR I --git-common-dir ===
# Mätt 2026-08-04 i detta repo:
#     från huvudkatalogen:      --git-common-dir = <repo>/.git
#                               --git-dir        = <repo>/.git
#     från en worktree:         --git-common-dir = <repo>/.git        (SAMMA)
#                               --git-dir        = <repo>/.git/worktrees/<namn>
# Två konsekvenser faller ut gratis: (1) .git/ är per definition delad mellan
# huvudträdet och alla worktrees, så lappen syns överallt utan att
# versionshanteras och utan att skräpa i repot; (2) "är jag i huvudkatalogen?"
# blir en exakt strängjämförelse `--git-dir == --git-common-dir`, ingen
# path-heuristik.

# === Lappens filnamn (relativt --git-common-dir) ===
KATALOG_MARKOR_FILNAMN="katalogagarskap-agare.json"

# === Stale-tröskel i timmar ===
# En lapp äldre än detta betraktas som SANNOLIKT stale (sessionen dog utan att
# städa). Den blockerar fortfarande — men skälet som modellen ser säger att
# den är gammal och skriver ut rensningskommandot. ADR-090 beslut 5 sanktionerar
# hållningen: "Detektionen behöver INTE vara perfekt — en människa skiljer sant
# från stale." Fail-closed mot tyst övertagande, med en synlig utväg.
KATALOG_STALE_TIMMAR=12

# === Git-underkommandon som räknas som SKRIVANDE ===
# Urvalsregeln: allt som ändrar arbetsträdet, HEAD, grenar, index eller
# stash i det träd kommandot riktas mot.
#
# MEDVETET INTE MED, med skäl:
#   fetch          — additiv på refs, ändrar inte arbetsträd/HEAD; två
#                    sessioner kan fetcha samtidigt utan att störa varandra.
#   status/log/    — rena läsningar.
#   diff/show/
#   rev-parse/
#   worktree list
#   config --get   — läsning. (`config --set` fångas inte heller; den rör
#                    inte arbetsträdet och är utanför den felbild ADR-090
#                    beskriver. Öppet noterat, inte ett förbiseende.)
#
# S96:s tre faktiska överträdelser var `merge` (×2) och `switch -c` — båda
# står i listan.
KATALOG_GIT_SKRIVKOMMANDON=(
    "merge"
    "switch"
    "checkout"
    "commit"
    "rebase"
    "reset"
    "push"
    "pull"
    "cherry-pick"
    "revert"
    "stash"
    "am"
    "apply"
    "restore"
    "branch"
    "tag"
    "clean"
    "gc"
    "prune"
    "add"
    "rm"
    "mv"
)

# === Underkommandon till `git worktree` som räknas som skrivande ===
# `git worktree list` är en läsning och ska INTE fällas; add/remove/prune/move
# ändrar delat tillstånd i .git/worktrees och räknas därför.
KATALOG_WORKTREE_SKRIVKOMMANDON=(
    "add"
    "remove"
    "prune"
    "move"
    "lock"
    "unlock"
)
