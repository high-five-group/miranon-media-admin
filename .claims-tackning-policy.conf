# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/check-claims-tackning.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 slår som falskt
# positiv. Disable är fil-nivå och avsiktlig (Lesson #6, UNIVERSAL).

# .claims-tackning-policy.conf
#
# Per-projekt config för scripts/check-claims-tackning.sh (TASK-139).
# Skriptets LOGIK är universell (kan dupliceras till andra spokes utan
# refactor); värdena här — REGISTRET av horisontella delade ytor — är
# PROJEKT-SPECIFIKA. Samma hub-spoke-portabilitet som
# .staging-semaphore-policy.conf + scripts/staging-semaphore.sh och
# .permissions-claims-policy.conf + scripts/check-permissions-claims.sh
# (Lesson #6, UNIVERSAL: config-driven, ingen repo-specifik path i skriptet).
#
# === Duplicera till nytt spoke (3 steg) ===
# 1. cp scripts/check-claims-tackning.sh + denna fil till nytt repo
# 2. Byt ut SHARED_SURFACE_NAMES + SHARED_SURFACE_GLOBS mot det nya repots
#    egna horisontella delade ytor
# 3. Orkestratorn författar claims-manifestet per batch-avfyrning (se
#    skriptets header för manifest-formatet) — ingen ytterligare wiring krävs
#
# === Varför grinden finns (S75-gap-klassen) ===
# ADR-073 (docs/decisions/ADR-073-parallella-batch-pipelines.md) Amendering 3
# punkt 1 (Session 75, 2026-07-21): kollisions-check ≠ täcknings-check.
# Beslut 1:s claims-intersektion fångar overlap mellan kort men INTE
# inkompletta claims. S75-premiären (samtliga 21 återstående kort i den
# batchen): 15/21 verdicts GAP — en registerpost som varken var tillåten
# eller förbjuden yta för något kort. Täcknings-passet mekaniserar
# orkestrator-vaksamhet (~9 %-klassen, ADR-053-grunden) i stället för att
# förlita sig på den.
#
# Registret nedan är MIGRERAT ur ADR-073 Amendering 3 punkt 2 (verbatim-källa,
# citerad — inte flyttad; ADR:n rörs inte av detta kort):
#
#   "Horisontella ytor som VARJE partition måste tilldela explicit (fasat
#   schema eller en ägare — aldrig onämnd): (1) src/domain/schemas/** +
#   src/domain/models/** + paritetsfilen
#   src/domain/__tests__/schemas.assignable.ts · (2)
#   supabase/functions/_shared/** (field-allowlists.ts = allowlist-SSOT) ·
#   (3) src/styles/tokens/** · (4) primitiv-standard-klustret (barreln +
#   tests/a11y/primitives.spec.ts + src/routes/dev/primitives.tsx +
#   docs/specs/DESIGN-SYSTEM-SPEC.md) · (5) src/data/** (adapter-lagret) ·
#   (6) src/queries/** · (7) manifestet (package.json/lockfilen) · (8)
#   genererade src/routeTree.gen.ts samt config-ytorna."

# --- Registrets namn (parallell array, index-matchad mot GLOBS nedan) -------
#
# Detta är nycklarna som claims-manifestets "dispositions"-fält per pipeline
# måste kunna referera till. Skriptets logik itererar denna lista — INTE
# globs-listan — för täckningskontrollen; globs är dokumentation av VILKEN
# yta posten faktiskt täcker (för människor och framtida verktyg, t.ex. en
# senare claims-kvitto-grind), inte indata till täcknings-logiken.
SHARED_SURFACE_NAMES=(
  "domain-schemas"
  "shared-functions"
  "style-tokens"
  "primitiv-kluster"
  "data-adapter"
  "queries"
  "manifest"
  "genererat-config"
)

# --- Registrets ytor (samma index som NAMES ovan) ---------------------------
#
# Varje post är en space-separerad sträng av glob-mönster (bash-array-inuti-
# array stöds inte portabelt — samma platta-sträng-konvention som andra
# multi-värdes-poster i huset, t.ex. GRIND_UNDANTAG-mönstren i
# .grind-exitkod-policy.conf).
SHARED_SURFACE_GLOBS=(
  "src/domain/schemas/** src/domain/models/** src/domain/__tests__/schemas.assignable.ts"
  "supabase/functions/_shared/**"
  "src/styles/tokens/**"
  "src/components/primitives/index.ts tests/a11y/primitives.spec.ts src/routes/dev/primitives.tsx docs/specs/DESIGN-SYSTEM-SPEC.md"
  "src/data/**"
  "src/queries/**"
  "package.json package-lock.json"
  "src/routeTree.gen.ts vite.config.ts tsconfig*.json tsr.config.json"
)
