# shellcheck shell=bash
# shellcheck disable=SC2034
# Variables in this file are sourced and consumed by external
# scripts (scripts/check-*.sh). shellcheck cannot trace cross-file
# variable usage, so SC2034 ("appears unused") triggers as false
# positive. Disable is file-level and intentional.

# .thread-index-policy.conf
#
# Per-projekt config för scripts/check-thread-index.sh.
# Skriptets LOGIK är universell (kan dupliceras till andra spokes utan
# refactor); värden här är PROJEKT-SPECIFIKA. Samma hub-spoke-portabilitet
# som .lesson-policy.conf och .frontmatter-policy.conf (Lesson #6, UNIVERSAL).
#
# === Duplicera till nytt spoke (3 steg) ===
# 1. cp scripts/check-thread-index.sh + denna fil till nytt repo
# 2. Anpassa THREAD_INDEX + THREAD_CARD_GLOB + THREAD_ID_PREFIX nedan
# 3. Lägg run_gate-raden i scripts/check-docs.sh (samma anrop-signatur)
#
# Källa: docs/decisions/ADR-053-trad-arkitektur-forensisk-lasbarhet-triage.md
#        TASK-108 (integritetskontrollen som avtäckte täcknings-luckan)

# === Indexfilen ===
# Registrets tabell bor HÄR. Path relativt repo-root.
THREAD_INDEX="tasks/threads/README.md"

# === Trådfilernas glob ===
# Filer som bär en tråds eget narrativ. Indexfilen själv ligger medvetet
# utanför globben (README.md är indexet, inte en trådfil).
THREAD_CARD_GLOB="tasks/threads/T*.md"

# === Tråd-ID:ts prefix ===
# En trådrad känns igen på `<prefix><siffror>` i backticks i kolumn 1.
THREAD_ID_PREFIX="T"

# === Giltiga tillstånd ===
# Samma enum som sessioner (ADR-052). Ordningen är utan betydelse.
THREAD_VALID_STATES=(
    "active"
    "paused"
    "closed"
)

# === Antal kolumner i tabellen ===
# Tråd-ID | Titel | Tillstånd | Ingång  →  4 kolumner, 5 pipe-tecken.
# Grinden fäller på avvikelse eftersom en extra pipe i titeln förskjuter
# tillstånds-kolumnen och gör den oläsbar för varje maskinell läsare.
THREAD_COLUMN_COUNT=4

# === Kolumnindex för tillståndet ===
# 1-baserat räknat på innehålls-kolumner (Tråd-ID=1, Titel=2, Tillstånd=3).
THREAD_STATE_COLUMN=3

# === Besläktad-nyckelordet (SYMMETRISK relation, ADR-095 beslut 2–3) ===
# Ordet som föregår en `besläktad`-deklaration i valfri innehålls-kolumn
# (Titel eller Ingång, båda formerna finns i registret). Skriptets LOGIK är
# språkoberoende — bracket-klassen för båda skiftlägena ("besläktad"/
# "Besläktad") härleds vid körning ur detta enda ord (Lesson #6 UNIVERSAL:
# bara ORDET är projekt-specifikt, inte mekaniken). Nyckelordet ANVÄNDS
# alltid inuti ett annat ord för "obesläktad" (motsatsen) — det hanteras av
# skriptet, inte av denna config.
THREAD_RELATED_KEYWORD="besläktad"

# === Barn-manifestet (ASYMMETRISK relation, ADR-095 beslut 2 + 4) ===
# `barn` deklareras i EN riktning — tråden pekar på sina egna backlog-kort
# och/eller barn-trådar. "Vem är förälder till X" härleds mekaniskt av den
# som frågar (grep i manifestet); ingen spegelpost krävs eller skrivs i
# barnets egen rad/kort. Det är den avgörande skillnaden mot
# THREAD_RELATED_KEYWORD ovan (symmetrisk — en deklaration per PAR).
#
# Manifestet är en SEPARAT fil (Option C, T119): additivt och glest, rör
# ingen av de 124+ befintliga trådraderna eller pipe-antals-invarianten.
# Path relativt repo-root. Filen får SAKNAS helt (opt-in, tomt startläge) —
# grinden behandlar det som grönt, inte som fel.
THREAD_CHILDREN_MANIFEST="tasks/threads/barn.md"

# Prefixet ett backlog-kort-ID bär i manifestets Barn-kolumn (README:s egen
# konvention: kort skrivs alltid ut med sitt TASK--prefix). Skiljer ett
# kort-ID från ett tråd-ID (THREAD_ID_PREFIX ovan) utan kollisionsrisk —
# "TASK-49" matchar aldrig mönstret <THREAD_ID_PREFIX><siffror> eftersom
# bokstaven efter "T" är "A", inte en siffra.
THREAD_CHILDREN_CARD_PREFIX="TASK-"

# Katalogen backlog-kortens filer bor i. Filnamnet är gemener
# ("task-49 - <slug>.md") medan manifestet skriver ID:t versalt ("TASK-49")
# — grinden gemenifierar PREFIXET vid uppslag (Bash 3.2-golvet, macOS,
# tillåter ingen ${var,,}; se scripts/deny-frammande-huvudkatalog.sh rad 341
# för samma husregel).
THREAD_CHILDREN_CARD_DIR="backlog/tasks"
