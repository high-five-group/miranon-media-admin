# shellcheck shell=bash
# shellcheck disable=SC2034
# Variables in this file are sourced and consumed by external
# scripts (scripts/check-*.sh). shellcheck cannot trace cross-file
# variable usage, so SC2034 ("appears unused") triggers as false
# positive. Disable is file-level and intentional.

# .thread-index-policy.conf
#
# Per-projekt config för scripts/check-thread-index.sh.
# Skriptets LOGIK är universell (kan dupliceras till andra spokes utan
# refactor); värden här är PROJEKT-SPECIFIKA. Samma hub-spoke-portabilitet
# som .lesson-policy.conf och .frontmatter-policy.conf (Lesson #6, UNIVERSAL).
#
# === Duplicera till nytt spoke (3 steg) ===
# 1. cp scripts/check-thread-index.sh + denna fil till nytt repo
# 2. Anpassa THREAD_INDEX + THREAD_CARD_GLOB + THREAD_ID_PREFIX nedan
# 3. Lägg run_gate-raden i scripts/check-docs.sh (samma anrop-signatur)
#
# Källa: docs/decisions/ADR-053-trad-arkitektur-forensisk-lasbarhet-triage.md
#        TASK-108 (integritetskontrollen som avtäckte täcknings-luckan)

# === Indexfilen ===
# Registrets tabell bor HÄR. Path relativt repo-root.
THREAD_INDEX="tasks/threads/README.md"

# === Trådfilernas glob ===
# Filer som bär en tråds eget narrativ. Indexfilen själv ligger medvetet
# utanför globben (README.md är indexet, inte en trådfil).
THREAD_CARD_GLOB="tasks/threads/T*.md"

# === Tråd-ID:ts prefix ===
# En trådrad känns igen på `<prefix><siffror>` i backticks i kolumn 1.
THREAD_ID_PREFIX="T"

# === Giltiga tillstånd ===
# Samma enum som sessioner (ADR-052). Ordningen är utan betydelse.
THREAD_VALID_STATES=(
    "active"
    "paused"
    "closed"
)

# === Antal kolumner i tabellen ===
# Tråd-ID | Titel | Tillstånd | Ingång  →  4 kolumner, 5 pipe-tecken.
# Grinden fäller på avvikelse eftersom en extra pipe i titeln förskjuter
# tillstånds-kolumnen och gör den oläsbar för varje maskinell läsare.
THREAD_COLUMN_COUNT=4

# === Kolumnindex för tillståndet ===
# 1-baserat räknat på innehålls-kolumner (Tråd-ID=1, Titel=2, Tillstånd=3).
THREAD_STATE_COLUMN=3
