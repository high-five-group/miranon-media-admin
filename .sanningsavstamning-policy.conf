# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/check-pausade-sessioner.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears unused")
# slår som falskt positiv. Disable är fil-nivå och avsiktlig — samma form som
# .mail-lock-policy.conf, .katalogagarskap-policy.conf, .heartbeat-svep-policy.conf
# m.fl. (Lesson #6, UNIVERSAL).

# .sanningsavstamning-policy.conf
#
# Per-projekt config för natt-lagrets SANNINGS-avstämningar (S97, T119
# arbetslista (b), Marcus-GO 2026-08-04).
#
# === VARFÖR ETT EGET LAGER ===
# Tre-lagers-doktrinen (docs/research/processregler-mekanisering-branschpraxis-
# 2026-08-04.md): (1) en icke-kringgåbar exekveringspunkt som prövar FORM
# billigt vid handlingen, (2) en periodisk avstämning som prövar SANNING mot
# verkligt tillstånd, oberoende av om lager 1 kringgicks, (3) en öppet
# deklarerad gräns för det omekaniserbara.
#
# Repot är tungt på lager 1 och tunt på lager 2. `check-lifecycle.sh` är det
# tydligaste exemplet: den prövar att `lifecycle: paused` och
# `## PAUSLÄGE`-rubriken är ett giltigt PAR — två strängar i samma filversion.
# Den gör ingen git-operation och har ingen tidsdimension, så den kan inte se
# att sessionen faktiskt ARBETAR. S96 Del 8: sessionen stod `paused` medan
# fem [S96]-taggade PR:er landade i den, och grinden var grön hela tiden.
# Fångades av Marcus, inte av mekanismen.
#
# Gatekeepers formulering av samma sak (citerad i research-doket): admission
# prövar den inkommande skrivningen; `audit` skannar periodiskt allt
# existerande tillstånd på nytt, oavsett hur det kom dit.
#
# === VARFÖR I NATTEN OCH INTE I PR-GRINDEN ===
# Samma skäl som backlog-stängningsgrinden (nightly.yml § backlog-closure):
# detta är en INAKTUELLT-TILLSTÅND-kontroll. En paus-landning följs normalt av
# en kort svans (kadensrad, Vale-rättelser) — att fälla den i PR-grinden hade
# fällt varje korrekt paus-landning. Felet är inte att svansen finns; felet är
# att ARBETE fortsätter medan dokumentet påstår paus.
#
# === SKILJELINJEN ÄR VAD COMMITEN RÖR, INTE HUR SENT DEN KOM ===
# Mätt 2026-08-04 mot repots egen historik, och en ren tidskarens FÖLL på
# mätningen:
#   - S92:s legitima paus-svans kom +16 h efter paus-commiten.
#   - S96:s FEM verkliga arbets-PR:er kom 10-14 h efter paus-commiten.
# En 24-timmarskarens hade alltså tystat bruset OCH missat det verkliga felet.
# Vad som däremot skiljer dem rent:
#   - S92:s svans rörde ENBART tasks/todo.md.
#   - S96:s arbete rörde src/components/dev/PrototypeSwitcher.tsx,
#     tasks/threads/README.md, backlog/tasks/* och docs/specs/URL-STATE-SPEC.md.
# Därav invarianten nedan: en pausad session får röra sitt EGET sessionsdok och
# den delade kadensytan. Rör den något annat är det arbete, och arbete
# motsäger pausen.

# === Filer en PAUSAD session legitimt får röra (glob-mönster) ===
# `%s` i det första mönstret ersätts med sessionsdokets egen sökväg — en
# pausad session får skriva i SITT dok, inte i någon annans.
# Utöver dessa: merge-commits räknas aldrig (paus-PR:ens egen merge-commit
# kommer per konstruktion EFTER den dok-commit den innehåller, och skulle
# annars fälla varje korrekt paus-landning — mätt på S93 och S96 2026-08-04).
PAUS_SVANS_TILLATNA=(
    "%s"
    "tasks/todo.md"
)

# === Karens i timmar innan en avvikelse rapporteras ===
# Skyddar mot att grinden fäller på en landning som pågår just nu (en PR som
# rör kod kan ligga i kön när natten kör). Sätt till 0 för att stänga av.
# Detta är INTE den primära skiljelinjen — se blocket ovan om varför tid är
# fel axel — utan enbart ett anti-brus-filter mot pågående landningar.
PAUS_KARENS_TIMMAR=2

# === Sökväg till sessionsdoken ===
PAUS_SESSIONSDOK_GLOB="tasks/sessions/*.md"

# === Kräv att paus-commiten är NÅBAR innan ett svar ges ===
# FAIL-CLOSED-KRAVET: utan tillräcklig historik svarar `git log <paus>..HEAD`
# tomt, och grinden skulle rapportera GRÖNT ur en mätning den inte kunde göra.
# Det är samma fail-open-familj som fällde en CI-vakt vid S97:s paus-landning
# ("ALLA KLARA" beräknat ur en tom lista) och som check-thread-index.sh avstod
# färskhets-prövning för att undvika: "En grind vars utfall beror på klon-djup
# är en falsk-röd-fabrik."
#
# KRITERIET ÄR NÅBARHET, INTE `is-shallow-repository`. Mätt 2026-08-04: detta
# repo rapporterar shallow: true men bär 2866 commits tillbaka till
# init-commiten. Ett globalt shallow-förbud hade alltså fällt ett träd med all
# historik grinden behöver — precis den falsk-röd den finns för att undvika.
# Eftersom shallow trunkerar från roten och aldrig mitt i en kedja gäller: är
# paus-commiten en förfader till HEAD är intervallet komplett.
#
# 1 = kräv nåbarhet (exit 2 utan den). 0 = mät ändå, på egen risk.
PAUS_KRAV_FULL_HISTORIK=1

# ═══════════════════════════════════════════════════════════════════════
# KLASS 2 — OBESVARADE LARM-ÄRENDEN (T119 arbetslista (b), post-merge-vägen)
# ═══════════════════════════════════════════════════════════════════════
#
# Konsumeras av scripts/check-obesvarade-larm.sh.
#
# === VAD HÅLET ÄR, MÄTT ===
# post-merge.yml skapar vid rött ett tilldelat GitHub-ärende med etikett
# `ci-post-merge` och revert-förslag. Filen är MEDVETET aldrig en required
# check ("hela poängen med det här lagret är att stå utanför den"), så den
# blockerar strukturellt ingenting — den skapar ett ärende EFTER att trädet
# redan ligger på main. Det är rätt design.
#
# Hålet är att INGENTING pollar de ärendena. Heartbeat-svepet bevakar main-SHA,
# röda check-rollups, DIRTY-mängd och armerings-kandidater — alltså
# PR-landningsläge, inte redan skapade ärenden på redan mergade träd
# (verifierat: noll träffar på "post-merge" i skriptet och dess policyfil).
#
# BELÄGGET (mätt mot GitHub 2026-08-04, samtliga sex ci-post-merge-ärenden
# som någonsin skapats): #616 och #619 öppnades 2026-08-02 16:08/16:19 UTC för
# en äkta regression. Fix-commiten 06a387ac landade 2026-08-03 10:31 UTC —
# ~18 h senare. Ärendena förblev öppna ytterligare ~23,5 h EFTER fixen och
# stängdes först 2026-08-04 10:07, INOM 18 SEKUNDER av varandra och
# tillsammans med det orelaterade #656 (skapat ett dygn senare, annan orsak).
# Tre ärenden med olika orsaker och skapelsetider stängda inom 18 sekunder är
# retrospektiv batch-sanering, inte en reaktion på larmet. Det är T108-klassen:
# ett tillstånd med en skapad signal men ingen bevakare.
#
# === VARFÖR EN NATT-GRIND OCH INTE EN UTÖKNING AV HEARTBEAT-SVEPET ===
# Heartbeat-svepet är en process som en agent startar INUTI sin session. Det
# forskningsdoket kallar (b1) och förkastar: "En /loop-variant bor inuti
# aktören. När aktören slutar arbeta slutar loopen också — och felet vi vill
# fånga är exakt 'aktören slutade'. Detektorn dör i samma ögonblick den
# behövs." Lager 2 måste vara oberoende av den övervakade aktören, alltså
# schemalagd i CI. Att ÄVEN ge svepet en fjärde väg är rimligt senare, men det
# ersätter inte natt-lagret — det kompletterar det.
#
# === TRÖSKLARNA ===
# Format: "<etikett>:<timmar>". Ett ärende som är öppet längre än sin tröskel
# rapporteras. Tröskeln ska vara längre än en normal åtgärdscykel — den mäter
# "ingen har reagerat", inte "ingen har hunnit klart".
#   ci-post-merge — rött på main efter landning. 24 h: mätningen ovan visar
#                   att ett verkligt fall stod ~41,5 h utan att stängas, och
#                   att ~18 h till fix är den observerade normalcykeln.
#
# TVÅ ETIKETTER ÄR MEDVETET UTELÄMNADE, båda med skäl:
#
#   lankrota — ett STÅENDE ärende per konstruktion. ADR-082 gav länkrötan en
#     egen, mildare kanal just för att en extern värds dåliga dag inte ska
#     devalvera den tilldelade signalen. Att larma om att ett avsiktligt
#     stående ärende är gammalt vore att larma om designen.
#
#   ci-natt — SJÄLVFÖRSTÄRKANDE LOOP. Grinden körs i natten och rapporterar
#     till nattens egen larmkedja. Bevakade den `ci-natt` skulle utfallet bli:
#     grinden röd ⇒ alarm fyrar ⇒ nytt ci-natt-ärende skapas ⇒ det ärendet
#     passerar sin tröskel ⇒ grinden röd igen ⇒ ännu ett ärende. Tröskeln
#     dämpar takten men bryter inte cykeln; en obevakad vecka ger en
#     ärendehög som är svårare att läsa än tystnaden den ersatte, och som
#     devalverar exakt den kanal ADR-082 skyddade.
#     `ci-natt` har dessutom REDAN en oberoende bevakare:
#     .github/workflows/nightly-watchdog.yml (12:00) kontrollerar att
#     nightly faktiskt kört och att larmärende-statusen är konsistent med
#     körningens utfall — "vaktens vakt", utanför den kedja den bevakar.
#     Det är rätt arkitektur för den etiketten; denna grind fyller hålet för
#     ci-post-merge, som saknar bevakare helt.
#
# En grind får aldrig mata den kanal den mäter. Det är samma princip som
# forskningsdoket uttrycker för lager 2: detektorn måste stå utanför det den
# övervakar.
LARM_ARENDE_TROSKLAR=(
    "ci-post-merge:24"
)

# Repo att fråga. Tomt ⇒ härled ur `gh repo view` i det aktuella trädet.
LARM_ARENDE_REPO=""
