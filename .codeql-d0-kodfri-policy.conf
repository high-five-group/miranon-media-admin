# .codeql-d0-kodfri-policy.conf
#
# Per-projekt config för scripts/check-codeql-d0-kodfri.sh.
# TASK-464.2, review runda 1 fynd 1 (warning): CodeQL:s D0-undantag
# (.github/workflows/codeql.yml) återanvänder ci.yml:s D0-allowlist på
# premissen att sökvägarna är kodfria. Stickprov (orkestreraren,
# 2026-09-19, `git ls-files 'tasks/**' 'docs/**' '.claude/**' | grep -E
# '\.(m?js|cjs|ts|tsx|jsx)$'`) fann åtta spårade filer som falsifierar
# premissen rakt av; review runda 2 utökade grindens § ANALYSERBARHET mot
# CodeQL:s egen extraktor-dokumentation och fann en NIONDE (en HTML-fil med
# ett äkta `<script>`-block, se posten nedan). Denna fil bär de VERIFIERADE
# undantagen — filer som är kod till formen men vars körning/deploy aldrig
# sker via npm, en workflow eller vår servade app, alltså säkra att låta
# CodeQL hoppa.
#
# DELAD MELLAN TVÅ KONSUMENTER SEDAN TASK-471 — samma premiss, "D0 =
# kodfritt", visade sig lika obevakad för ci.yml:s EGEN klassning (den lista
# som faktiskt styr `should_skip_tests`/`requires_lint_by_extension`) som
# för CodeQL:s speglade kopia. check-codeql-d0-kodfri.sh körs nu TVÅ gånger
# i ci.yml:s `lint`-jobb — en gång mot codeql.yml (som förut), en gång
# DIREKT mot ci.yml:s egen `klassning-d0`-region — och läser BÅDA gångerna
# DENNA fil. Eftersom de två regionerna hålls byte-identiska av
# scripts/check-listparitet.sh:s par `klassning-codeql-positiv` bär filen
# alltså EN lista med undantag, inte två: samtliga poster nedan gäller för
# BÅDA konsumenterna utan ändring. Ingen ny post behövdes vid TASK-471:s
# landning — samma 13 filer, samma skäl, mätt oberoende mot båda
# regionerna (check-codeql-d0-kodfri.sh, körd mot vardera default- och
# ci.yml-läge, gav identiskt "13 analyserbara … 13 deklarerade … 0
# odeklarerade").
#
# review runda 4 fynd 1 (warning) TOG BORT grindens HTML-innehållsfilter
# helt (fyra bevisade bypasser mot filtret — entitet-/hex-kodning, saknat
# semikolon, `data:text/html;base64,…` — ett innehållsfilter är en
# kapprustning en dokumentvakt inte ska föra). Konsekvens: VARJE
# `.html`/`.htm`/`.xhtml`-fil under en D0-sökväg kräver nu ett deklarerat
# undantag, oavsett innehåll — fyra filer som tidigare passerade TYST (inget
# `<script>`, ingen handler) fick därför sina första poster här samma dag,
# se § DE FYRA BILAGE-MALLARNA nedan.
#
# ═══════════════════════════════════════════════════════════════════════════
# FORMEN
# ═══════════════════════════════════════════════════════════════════════════
#
# En rad per fil, TVÅ fält, separator `:::`
#
#   <sökväg, exakt som git ls-files skriver den>:::<skäl>
#
# Skälet ska vara VERIFIERAT, inte antaget. Körs filen av ett npm-skript
# eller en workflow hör den INTE hemma i en dokumentkatalog — flytta den
# i stället för att undanta den (grinden fäller ändå tills den flyttas).
#
# ═══════════════════════════════════════════════════════════════════════════
# DE ÅTTA POSTERNA, VAR OCH EN VERIFIERAD 2026-09-19
# ═══════════════════════════════════════════════════════════════════════════
#
# Verifieringsmetod, samma för samtliga åtta:
#   grep -n "<filnamn-utan-ändelse>" package.json           → 0 träffar
#   grep -rln "<filnamn-utan-ändelse>" .github/workflows/    → 0 träffar
#   plus filens egen källkodskommentar, läst för kontext.
#
# docs/backfill/segment-export/{export,segments,skool-partition}.mjs
#   S60 Steg 4 (2026-07-09) — engångs-backfill/CSV-export mot prod-basen
#   (app8uGPrVCVOm6LfD) via AIRTABLE_API_KEY i miljön, körd EN gång för
#   hand av Marcus/agent. Ingen npm-post, ingen workflow-referens. Nämns i
#   tasks/sessions/archive/2026-07/2026-07-08-session-60.md,
#   tasks/threads/T171-personuppgifter-i-publikt-repo.md och
#   docs/BUILD-LOG.md — enbart som historisk narrativ, inte
#   exekveringsinstruktion.
#
# docs/reference/automation-scripts/a1-eventmatchning-vakt.js
#   Frusen kopia av Airtable-automationens skriptkod (TASK-284.2,
#   ADR-122). Filens EGEN källkodskommentar säger det rakt ut: "Körs i
#   Airtable som ett customScript-steg i automation wflDCKPAv2P6Yu9U6" —
#   exekveringsmiljön är Airtables automationsmotor, aldrig detta repos
#   CI eller npm. Samma klass som docs/reference/schema_reference.md:s
#   A1–A11-skriptkod (CLAUDE.md § Prod-basens UI-/automations-lager).
#
# tasks/sessions/bilagor/s121-bekraftelsesteget-konvergens/riggen-proto-shot.mjs
#   Fristående Playwright-skärmdumpsrigg, körd manuellt via
#   `node proto-shot.mjs <utkatalog> <namn>=<sökväg>...` under en enskild
#   sessions konvergens-pass (S121). Sessionsbilaga — arkiverat
#   engångsverktyg, ingen npm/workflow-referens.
#
# tasks/sessions/bilagor/s122-pushback-bank/{bygg-bank,extrahera-pushbacks,steg3-klassificering}.mjs
#   Manuell, programmatisk pushback-extraktionspipeline (S122) — tre
#   skript som importerar varandra (bygg-bank.mjs importerar
#   steg3-klassificering.mjs) men körs som en ren Node-pipeline för hand,
#   aldrig via npm eller CI. Sessionsbilaga, samma klass som ovan.
#
# Alla åtta ligger under `tasks/sessions/bilagor/**`, `docs/backfill/**`
# eller `docs/reference/automation-scripts/**` — arkivkataloger, inte
# källkodskataloger. Ingen av dem importeras av något i `src/`,
# `scripts/` eller `supabase/functions/` (verifierat: `grep -rln` på
# respektive filnamn över de tre katalogerna gav noll träffar).
