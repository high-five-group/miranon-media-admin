# ═══════════════════════════════════════════════════════════════════════════
# DEN NIONDE POSTEN — TILLAGD review runda 2 fynd 1, 2026-09-19
# ═══════════════════════════════════════════════════════════════════════════
#
# docs/design/farg-atlas.html — hittad av grindens utökade § ANALYSERBARHET
# (skriptets eget filhuvud): filen bär ett äkta `<script>`-block (4 rader,
# en temaväxlare som läser `?theme=`-querysträngen). Till skillnad från de
# åtta ovan är den INTE ett engångsskript — den REGENERERAS av `npm run
# atlas` (`scripts/build-farg-atlas.mjs`), och en separat verifieringsscript
# (`scripts/verifiera-farg-atlas.mjs`) läser dess TEXT (inte dess körning)
# för att pröva kontrastformler. Undantags-kriteriet är därför inte
# "körs aldrig av npm" (den GENERERAS av ett npm-skript) utan review runda
# 2:s uttryckliga alternativa kriterium: DEPLOYAS/SERVERAS den aldrig?
# Verifierat mot disk, 2026-09-19:
#   - vercel.json: `"outputDirectory": "dist"` — bara Vites byggutdata
#     deployas, `docs/` ingår inte.
#   - vite.config.ts: ingen `publicDir`-override, ingen referens till
#     `docs/` eller `farg-atlas` någonstans i filen.
#   - public/: filens innehåll listat, inga docs/design-filer eller
#     symlänkar dit.
#   - `.github/workflows/*.yml`: `grep -n "atlas\|farg-atlas"` → 0 träffar
#     — `npm run atlas` körs ALDRIG automatiskt, bara manuellt av en
#     designer som regenererar paletten.
# Filen är alltså en ren lokal referensartefakt (öppnas i en webbläsare för
# hand), aldrig servad över nätet av vår app. `<script>`-blocket har därför
# aldrig ett attack-ytesammanhang att verka i.
#
# ═══════════════════════════════════════════════════════════════════════════
# DE FYRA BILAGE-MALLARNA — TILLAGDA review runda 4 fynd 1, 2026-09-19
# ═══════════════════════════════════════════════════════════════════════════
#
# docs/mallar/bilagor/{bekraftelsebilaga,deltagarinformation,forsattsblad,kvitto}.html
#   PDF-bilagemallar (`docs/mallar/bilagor/README.md`) — ren statisk HTML/
#   CSS, INGET `<script>`-block eller handler-attribut i någon av de fyra
#   (verifierat: `grep -lE '<script|on[a-zA-Z]+='` → 0 träffar, samma
#   kommando review runda 2 använde för att friskriva dem TYST — precis den
#   TYSTA vägen review runda 4 fynd 1 stänger). De behövde alltså INGEN
#   post innan filtret togs bort; nu kräver ändelsen `.html` en, oavsett.
#
#   Skälet "serveras/deployas den?" — VERIFIERAT, inte antaget: dessa FYRA
#   käll-filer är INTE själva deployade (ingen `vite.config.ts`/`public/`/
#   `vercel.json`-koppling, samma mönster som farg-atlas.html ovan), men
#   deras INNEHÅLL synkas BYTE-IDENTISKT (JSON.stringify-escapat) till
#   `supabase/functions/_shared/mallar/<namn>.html.ts` av
#   `scripts/synka-bilagemallar.mjs` — och DEN destinationen ÄR deployad
#   (Edge Function `generate-event-attachment`, som renderar mallarna till
#   PDF via DocRaptor). `supabase/functions/**` står INTE i D0-listan, så
#   `.html.ts`-destinationen skannas av CodeQL på VARJE PR/push, oavsett om
#   `docs/`-källan rörs. Synken är dessutom en TVÅVÄGS-vakt, inte ett
#   löfte: `scripts/check-mallparitet.sh` (CI-wirad, `.github/workflows/
#   ci.yml` rad ~1018) kör `synka-bilagemallar.mjs --check` och FÄLLER om
#   källa och destination glider isär. En ändring i `docs/`-källan syns
#   alltså garanterat i den skannade destinationen — undantaget här skapar
#   inget blint fält, det undviker bara att samma innehåll flaggas två
#   gånger under två sökvägar.
