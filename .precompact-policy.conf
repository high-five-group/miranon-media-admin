# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/deny-precompact.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears
# unused") slår som falskt positiv. Disable är fil-nivå och avsiktlig — samma
# form som .mail-lock-policy.conf, .grind-exitkod-policy.conf,
# .subagent-vantan-policy.conf, .heartbeat-svep-policy.conf,
# .ci-wait-policy.conf, .staging-semaphore-policy.conf, .checklist-policy.conf,
# .frontmatter-policy.conf, .arbetsform-push-policy.conf och
# .lesson-policy.conf (Lesson #6, UNIVERSAL).

# .precompact-policy.conf
#
# Per-projekt config för scripts/deny-precompact.sh (TASK-160.2, ADR-101
# § Beslut 5, kedjans steg 3). Skriptets LOGIK är universell (kan dupliceras
# till andra spokes utan refactor); VÄRDENA här — markörfilens namn och
# färskhetsfönstrets längd — är den delen som är öppen för framtida
# justering utan att skriptet rörs.
#
# VARFÖR FILEN FINNS: ADR-101 mekaniserar "kontrollerad kontra okontrollerad
# kompaktering" som en PreCompact-hook som läser en otrackad, per-arbetsträd
# markörfil. `trigger: "auto"` nekas ALLTID (det nekade auto-compact-försöket
# ÄR zonlarmet, § Beslut 2); `trigger: "manual"` nekas om markören saknas
# eller är äldre än färskhetsfönstret — motsatt riktning mot
# .arbetsform-push-policy.conf:s frånvaro-släpper-regel, eftersom markören
# här är ett AKTIVT bevis (läget är säkrat i fil) snarare än ett FÖRBUD-läge.
# Se docs/decisions/ADR-101-compact-formen-kontrollerad-kompaktering-smal-nisch.md
# § Beslut 4 för hela markör-kontraktets resonemang.

# === Markörfilens filnamn, relativt arbetsträdets rot ===
# Samma katalogfamilj som .claude/arbetsform-tillstand.json — otrackad,
# per-arbetsträd, samma motivering (se .gitignore). Satt ENDAST av
# pre-compact-skillen (TASK-160.3, hub-pluginet), läst HÄR, och rensad av
# post-compact-igenkänningen (TASK-160.4) som en engångsbiljett — den
# överlever aldrig till nästa kompaktering (ADR-101 § Beslut 4).
#
# JSON-FORMEN, konsumerad av TASK-160.3 (sättare) och denna hook (läsare) —
# EN sanning för båda sidor, samma disciplin som arbetsform-tillstand.json:
#   {
#     "fokus_instruktion": "<fri text — nästa mål, öppna PR-nummer,
#                            numrerings-snapshot, monitor-/task-läge för
#                            omstart — konkreta svaret på Pocock-citatets
#                            'ange då uttryckligen nästa mål'>",
#     "satt_vid":  "<UTC ISO 8601, t.ex. 2026-08-07T21:04:00Z — LOAD-BEARING:
#                    denna hook beräknar markörens ålder mot detta fält>",
#     "sattare":   "<vem/vad satte markören, t.ex. 'pre-compact-skill'>"
#   }
#
# Denna hooks korrupt-gräns (fail-closed) kräver att filen tolkas som ett
# JSON-objekt MED ett icke-tomt `satt_vid`-fält (freshness-beräkningen är
# omöjlig utan det). `fokus_instruktion`/`sattare` läses för
# nekelse-meddelandets kontext men gate:ar inte separat — en markör som
# saknar dem men bär en färsk `satt_vid` släpps ändå igenom; det är
# pre-compact-skillens (TASK-160.3) kontrakt att alltid skriva alla tre, inte
# denna hooks jobb att kompensera för en skill som inte gör det.
PRECOMPACT_MARKOR_FILNAMN=".claude/precompact-markor.json"

# === Färskhetsfönstret, i MINUTER ===
# ADR-101 § Beslut 4 + PRD § Implementationsbeslut: "~15 min". En markör
# äldre än detta har sannolikt beskrivit ett läge som redan hunnit ändras
# (nya commits, ny PR-kö-status) — samma logik som en gammal
# arbetsform-tillståndsfil, fast i motsatt gate-riktning (ÅLDER här förbjuder
# ISTÄLLET FÖR frånvaro).
PRECOMPACT_FARSKHETSFONSTER_MINUTER=15
