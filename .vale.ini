StylesPath = .vale/styles
MinAlertLevel = suggestion

Vocab = Miranon, AriaAttrs

# backlog/ medvetet utanför prose-scopet (lint:prose-kataloglistan i package.json) — verktygsägd yta (L226; S48 Del 2 gren C)

# .claude/ INNANFÖR prose-scopet sedan S91 (TASK-71): agentdefinitionerna är
# prosa som styr agenternas arbete och låg tidigare utanför samtliga docs-grindar.
# lint:prose bär därför också --glob='!.claude/worktrees/**'. Skälet står inte i
# package.json eftersom JSON saknar kommentarer: .claude/worktrees/ är Claude
# Code:s agent-worktrees, alltså kompletta checkouts av repot på andra grenar.
# Vale läser inte .gitignore. Mätt 2026-07-28 mot en simulerad worktree med två
# .md-filer: `vale .claude` läste 4 filer utan globben och 2 med den — en verklig
# worktree hade dragit in hela sin .md-massa i grinden. Globben är en ren
# negation och snävar inte in de övriga sökvägarna: oförändrat scope gav 435
# filer både med och utan den (samma körning).

[*.md]
BasedOnStyles = Vale, Miranon
Vale.Spelling = NO
Vale.Repetition = YES
TokenIgnores = (React[\s\-]Aria[\w\-]*|@react-aria/[\w\-]+|react-aria-components|@axe-core/playwright)

[tasks/sessions/**/*.md]
BasedOnStyles =
Vale.Repetition = NO

[CHANGELOG.md]
BasedOnStyles = Vale
Vale.Spelling = NO

[docs/archive/**]
BasedOnStyles =

[docs/reference/pocock/**]
BasedOnStyles =
Vale.Repetition = NO

# Rå-transkript, vendoriserat 2026-07-25 (S87). Endast KÄLLFILEN — destillatet i
# samma katalog är vår egen prosa och grindas normalt (snävare än
# pocock-precedenten med avsikt: exkludera råmaterial, inte hyllan).
# BÅDA raderna krävs: tom BasedOnStyles ärver annars Repetition från [*.md].
[docs/reference/miranon-arkitektur/miranon-arkitektur-konversation-*.md]
BasedOnStyles =
Vale.Repetition = NO

[docs/research/datamodell-research/**]
BasedOnStyles =

[docs/research/vue-project-analysis.md]
BasedOnStyles =
