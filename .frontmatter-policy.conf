# shellcheck shell=bash
# shellcheck disable=SC2034
# Variables in this file are sourced and consumed by external
# scripts (scripts/check-*.sh). shellcheck cannot trace cross-file
# variable usage, so SC2034 ("appears unused") triggers as false
# positive. Disable is file-level and intentional.

# .frontmatter-policy.conf
#
# Per-projekt config för scripts/check-frontmatter.sh + .githooks/pre-commit.
# Skriptens LOGIK är universell (kan duplicera till andra spokes utan
# refactor); värden här är PROJEKT-SPECIFIKA.
#
# Hubliftad-design: vid Session 6.7 lyfts skripten till
# ~/Repon/marcus-system/ (eller claude-skills/). Denna config-fil
# förblir per-spoke. Spokes refererar då hub-skripten via symlink/PATH.
#
# === Duplicera till nytt spoke (4 steg) ===
# 1. cp scripts/check-frontmatter.sh + .githooks/pre-commit + denna fil
#    till nytt repo
# 2. Anpassa FRONTMATTER_GOVERNING_DOCS nedan till nytt repos styrande docs
# 3. Lägg till `postinstall` i package.json:
#    "postinstall": "git config core.hooksPath .githooks"
# 4. Lägg till CI-step i .github/workflows/ci.yml efter scripted-checklist:
#    - name: Validate frontmatter on governing docs
#      run: bash scripts/check-frontmatter.sh
#
# Källa: docs/decisions/ADR-030-docs-grindvakter-frontmatter-policy.md
#        Etablerad: Session 6.6 K7 (2026-05-14)
#        K7 Lesson #6 (UNIVERSAL): hub-spoke-portabilitet är default

# === Styrande docs (ADR-030 § Del 2) ===
# Exakt-path-match, INTE glob. Path relativt repo-root.
FRONTMATTER_GOVERNING_DOCS=(
    "CLAUDE.md"
    "docs/byggplan.md"
    "docs/specs/BYGGPLAN-LÄTTLÄST-v3.md"
    "docs/specs/KVALITETSDEFINITIONER-11-REACT.md"
    "docs/specs/SECURITY-SPEC.md"
    "docs/reference/hur-systemet-funkar.md"
    "docs/reference/data-model.md"
    "tasks/lessons.md"
    "docs/decisions/README.md"
)

# === Frontmatter-enum-värden (ADR-030 § Del 3) ===
# Enum-värden är troligen samma över alla spokes per ADR-030, men
# definieras här för full per-projekt-flexibilitet.
FRONTMATTER_VALID_OWNER="marcus803"
FRONTMATTER_VALID_STATUS=("draft" "stable" "deprecated")

# === Shallow-clone-detection threshold (ADR-033 K4 + ADR-030 § Del 3) ===
# Minimal commit-historik-djup för Check 2 (updated-match mot git log)
# ska vara tillförlitlig. Värdet matchar ADR-030 § Del 3 "fetch-depth: 50"-
# konvention. Per-spoke kan justeras om annan threshold används.
# Default fallback i scripts: 50 om unset.
#
# Detection-logik (scripts/check-frontmatter.sh K4.1.1):
#   IS_SHALLOW = `git rev-parse --is-shallow-repository`
#   COMMIT_DEPTH = `git rev-list --count HEAD`
#   Hard-fail om: IS_SHALLOW=true AND COMMIT_DEPTH < MIN_DEPTH
#
# Truth-table (empiriskt verifierad K4.1.1):
#   depth=1   shallow=true:  TRIGGAS (unsafe per L8)
#   depth=50  shallow=true:  IGNORERAS (safe-shallow per ADR-030)
#   full      shallow=false: IGNORERAS (full clone)
#   nytt-repo shallow=false: IGNORERAS (depth<50 men full clone)
FRONTMATTER_MIN_HISTORY_DEPTH=50
