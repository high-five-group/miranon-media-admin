# shellcheck shell=bash
# shellcheck disable=SC2034
# Variables in this file are sourced and consumed by external
# scripts (scripts/check-*.sh). shellcheck cannot trace cross-file
# variable usage, so SC2034 ("appears unused") triggers as false
# positive. Disable is file-level and intentional.

# .lesson-policy.conf
#
# Per-projekt config för scripts/check-lesson-numbers.sh.
# Skriptets LOGIK är universell (kan dupliceras till andra spokes utan
# refactor); värden här är PROJEKT-SPECIFIKA. Samma hub-spoke-portabilitet
# som .checklist-policy.conf och .frontmatter-policy.conf (Lesson #6,
# UNIVERSAL).
#
# === Duplicera till nytt spoke (3 steg) ===
# 1. cp scripts/check-lesson-numbers.sh + denna fil till nytt repo
# 2. Anpassa LESSON_FILE + LESSON_FRAGMENT_DIR nedan
# 3. Lägg run_gate-raden i scripts/check-docs.sh (samma anrop-signatur)
#
# Källa: docs/decisions/ADR-081-nummer-tilldelas-vid-landning.md
#        Mekaniseringens punkt 6 (sessionsdok S91 Del 4)

# === Den konsoliderade lesson-filen ===
# Numrerade poster bor HÄR och ingen annanstans. Path relativt repo-root.
LESSON_FILE="tasks/lessons.md"

# === Rubrik-mönstret för en numrerad post ===
# Grinden räknar dubbletter på detta mönster. Prefixet är projektets
# lesson-bokstav; ändra bara om spoket använder en annan serie.
LESSON_HEADING_PREFIX="L"

# === Fragment-katalogen ===
# Nummerlösa kandidater bor här tills de konsolideras. Grinden fäller om
# ett fragment bär en numrerad rubrik — numret tilldelas vid landning,
# aldrig vid skrivning (towncrier-mönstret).
LESSON_FRAGMENT_DIR="tasks/lessons.d"

# === Filer som är UNDANTAGNA dubblett-kontrollen ===
# Fragment-katalogens egen README dokumenterar formen och citerar därför
# rubrik-exempel som annars skulle läsas som poster.
LESSON_EXCLUDE_BASENAMES=(
    "README.md"
)
