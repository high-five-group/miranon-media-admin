# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av nightly-watchdog.yml:s jobb
# "Kom natten igång?". Verktyget kan inte följa cross-file-användning, så
# SC2034 ("appears unused") slår som falskt positiv. Disable är fil-nivå och
# avsiktlig — samma form som .nattvakt-dedup-policy.conf,
# .sanningsavstamning-policy.conf m.fl. (Lesson #6, UNIVERSAL).

# .nattvakt-kanal-policy.conf
#
# Config för nattvaktens KANALAVGRÄNSNING (TASK-450.1 runda 2, 2026-09-18).
#
# === VARFÖR DEN HÄR FILEN FINNS ===
# Nattvakten larmar när nattkörningens conclusion inte är success men inget
# öppet `ci-natt`-ärende finns — alltså "larm-jobbet kan självt ha uteblivit".
# För att inte larma om nätter där larm-jobbet KORREKT skippades måste den
# veta vilka jobb som faktiskt bär produktkanalen.
#
# Fram till 2026-09-18 gjorde den det med en EXKLUDERINGS-regex
# (`test("Länkkontroll|Länkröta") | not`) — en denylist som var korrekt så
# länge ETT jobb låg utanför alarm-jobbets trigger. Efter kanaldelningen
# (TASK-450.1) ligger FEM nattgrindar utanför den: nightly-audit,
# backlog-closure, pausade-sessioner, obesvarade-larm och sessionsdok-fonster,
# plus de två nya kanaljobben. En denylist som inte känner dem hade gjort
# vakten till en falsklarmsmaskin: en natt där bara bokföringsgrindarna är
# röda ger `alarm` SKIPPED (korrekt) men körningens conclusion `failure`, och
# vakten hade skapat ett TILLDELAT, OÅTGÄRDBART ci-natt-ärende. Det är exakt
# felklassen i ärende #469 (2026-07-30, 123 h öppet), en gång redan fixad för
# länkkontrollen. Mätt: PR #2521:s egen körning 35334331604 visar kedjans
# första två led, och bokföringsgrindarna var röda 5 av 6 nätter
# 2026-09-13…09-18 — vakten hade alltså larmat nästan varje natt.
#
# Listan nedan är därför en ALLOWLIST, inte en denylist. Fail-safe-riktningen
# är omvänd och det är avsiktligt: ett NYTT nattjobb hamnar nu som default
# UTANFÖR produktkanalen och kan alltså tystas av misstag, medan den gamla
# formen som default hade larmat. Valet följer vaktens egen husregel — "ett
# falsklarm är värre än ingen vakt" (nightly-watchdog.yml § BEVIS-LÄGE) — och
# husregeln att vakten ska vakta EXAKT det `alarm` ansvarar för, varken mer
# eller mindre. Ett jobb som hör till en annan kanal är inte vaktens sak.
#
# === INVARIANT SOM MÅSTE HÅLLAS FÖR HAND ===
# Listan MÅSTE vara lika med `alarm`-jobbets trigger i nightly.yml
# (`if:`-uttryckets uppräkning av needs.<jobb>.result). Ingen mekanism vaktar
# det i dag — kravet står som PROSA, här och i nightly.yml. Vakten för att de
# tre kanalernas triggerlistor plus DENNA lista tillsammans är lika med
# `needs`-listan byggs som EGEN följdskiva efter N2 (granskningens fynd 3,
# Marcus beslut 3A 2026-09-18). Säg aldrig att invarianten är mekaniserad
# förrän den skivan landat (ADR-083).
#
# === VARFÖR LARM-JOBBET SJÄLVT INTE STÅR I LISTAN ===
# Det ser ut som ett hål och är det inte. `alarm` KÖR bara när minst ett av de
# tre jobben nedan är failure/cancelled (dess egen `if`). Faller `alarm` på
# gh-I/O måste alltså ett av dem redan ha varit rött, och listan fångar
# körningen ändå. Att lägga till "Larm vid röd natt" vore redundant, inte
# säkrare.
#
# === VÄRDENA ===
# NATTVAKT_PRODUKTKANAL_JOBBPREFIX — jobbnamn i produktkanalen, matchade som
# PREFIX mot `.jobs[].name` i `gh run view --json jobs`.
#
# PREFIX, inte exakt likhet, av ett mätt skäl: `suite` är ett `uses:`-anrop av
# ci-suite.yml, och dess jobb dyker upp i körnings-API:t som barn med
# förälderprefix — "Nattlig fullsvit / Pure + Build", "Nattlig fullsvit /
# Staging (API + E2E)" osv. Något jobb som bara heter "Nattlig fullsvit" finns
# ALDRIG i listan (verifierat mot körningarna 35311984679 och 35334514452). En
# exakt-matchning hade därmed missat hela nattsviten — tyst.
#
# Namnen är jobbens `name:`-fält i nightly.yml, inte deras jobb-id.
NATTVAKT_PRODUKTKANAL_JOBBPREFIX=(
    "Nattlig fullsvit"
    "CI-mätning (siffror, ej känsla)"
    "Kontraktsvakt (fixtur mot skarp staging)"
)
