# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av nightly-watchdog.yml:s jobb
# "Kom natten igång?". Verktyget kan inte följa cross-file-användning, så
# SC2034 ("appears unused") slår som falskt positiv. Disable är fil-nivå och
# avsiktlig — samma form som .nattvakt-dedup-policy.conf,
# .sanningsavstamning-policy.conf m.fl. (Lesson #6, UNIVERSAL).

# .nattvakt-kanal-policy.conf
#
# Config för nattvaktens KANALAVGRÄNSNING (TASK-450.1 runda 2, 2026-09-18).
#
# ÖPPEN SKULD, bokförd här för att den som wirar listan ska se den: denna fil
# står per 2026-09-18 INTE i ci.yml:s shellcheck-strict-uppräkning av sourcade
# config-filer (ADR-033 § Del 3), till skillnad från repots ~29 övriga
# `.*-policy.conf`. Skälet är att ci.yml ägdes av parallella skivor när filen
# skapades; åtgärden är EN rad i den uppräkningen och är hänskjuten till
# 3A-följdskivan. Lokalt är filen ren: `shellcheck -x` exit 0. Wirar du listan
# — ta med denna fil och stryk detta stycke.
#
# === VARFÖR DEN HÄR FILEN FINNS ===
# Nattvakten larmar när nattkörningens conclusion inte är success men inget
# öppet `ci-natt`-ärende finns — alltså "larm-jobbet kan självt ha uteblivit".
# För att inte larma om nätter där larm-jobbet KORREKT skippades måste den
# veta vilka jobb som faktiskt bär produktkanalen.
#
# Fram till 2026-09-18 gjorde den det med en EXKLUDERINGS-regex
# (`test("Länkkontroll|Länkröta") | not`) — en denylist som var korrekt så
# länge ETT jobb låg utanför alarm-jobbets trigger. Efter kanaldelningen
# (TASK-450.1) ligger FEM nattgrindar utanför den: nightly-audit,
# backlog-closure, pausade-sessioner, obesvarade-larm och sessionsdok-fonster,
# plus de två nya kanaljobben. En denylist som inte känner dem hade gjort
# vakten till en falsklarmsmaskin: en natt där bara bokföringsgrindarna är
# röda ger `alarm` SKIPPED (korrekt) men körningens conclusion `failure`, och
# vakten hade skapat ett TILLDELAT, OÅTGÄRDBART ci-natt-ärende. Det är exakt
# felklassen i ärende #469 (2026-07-30, 123 h öppet), en gång redan fixad för
# länkkontrollen. Mätt: PR #2521:s egen körning 35334331604 visar kedjans
# första två led, och bokföringsgrindarna var röda 5 av 6 nätter
# 2026-09-13…09-18 — vakten hade alltså larmat nästan varje natt.
#
# Listan nedan är därför en ALLOWLIST, inte en denylist. Fail-safe-riktningen
# är omvänd och det är avsiktligt: ett NYTT nattjobb hamnar nu som default
# UTANFÖR produktkanalen och kan alltså tystas av misstag, medan den gamla
# formen som default hade larmat. Valet följer vaktens egen husregel — "ett
# falsklarm är värre än ingen vakt" (nightly-watchdog.yml § BEVIS-LÄGE) — och
# husregeln att vakten ska vakta EXAKT det `alarm` ansvarar för, varken mer
# eller mindre. Ett jobb som hör till en annan kanal är inte vaktens sak.
#
# === INVARIANTEN SOM MÅSTE HÅLLAS FÖR HAND — DEN ÄR TVÅDIMENSIONELL ===
# Formuleringen "listan ska vara lika med alarm-triggern" är för grov, och en
# följdvakt byggd på den blir för smal (granskningens fynd 2, runda 3). De två
# sidorna lever nämligen i OLIKA NAMNRYMDER: `alarm`-triggern och `needs`-listan
# i nightly.yml är jobb-ID:n (`suite`, `nightly-metrics`, `kontraktsvakt`),
# medan listan nedan är jobb-NAMNPREFIX. Kravet har därför TVÅ led, och båda
# måste hålla:
#
#   (i)  ID-LEDET — de tre kanalernas triggerlistor partitionerar `needs`-listan
#        i nightly.yml: varje jobb i `needs` utlöser exakt en kanal, inget jobb
#        utlöser två och inget faller utanför.
#   (ii) NAMN-LEDET — varje jobb-ID i `alarm`-triggern mappar till ett `name:`
#        som något prefix i listan nedan FAKTISKT matchar. Prefix-formen gör
#        detta led känsligt åt båda håll: "Nattlig fullsvit" måste förbli ett
#        PREFIX till nattsvitens barnjobb, och byter någon `name:` på
#        suite/nightly-metrics/kontraktsvakt slutar prefixet matcha.
#
# Bryts (ii) ensamt är följden att vakten TYSTNAR för hela produktkanalen —
# medan en ren ID-mängdjämförelse står grön. Det är exakt den tysta klassen
# vakten finns för att stänga.
#
# Ingen mekanism vaktar något av leden i dag — kravet står som PROSA, här och i
# nightly.yml. Följdskivan 3A (Marcus beslut 2026-09-18) ska vakta BÅDA leden,
# inte bara (i). Säg aldrig att invarianten är mekaniserad förrän den skivan
# landat (ADR-083).
#
# === VARFÖR LARM-JOBBET SJÄLVT INTE STÅR I LISTAN ===
# Det ser ut som ett hål och är det inte — men skälet är ett ANNAT än det som
# stod här fram till runda 3, och det gamla skälet var falskt.
#
# FALSKT SKÄL (struket): "alarm kör bara när ett av de tre jobben är
# failure/cancelled, så listan fångar körningen ändå." Premissen jämförde två
# olika domäner. `alarm`-triggern läser `needs.<jobb>.result` (fyra värden),
# medan vakten läser `.jobs[].conclusion` (nio). Ett produktjobb som slår i
# timeout har `result: failure` men `conclusion: timed_out` — alarm fyrade,
# vakten såg inget rött jobb, och föll alarm då självt teg vakten helt.
#
# SANT SKÄL (gäller sedan runda 3): vaktens rödhets-villkor är numera en
# NEGATION av NATTVAKT_OFARLIGA_CONCLUSIONS nedan, och varje conclusion som ger
# `result` failure eller cancelled ligger utanför den mängden. Vakten fångar
# därmed VARJE körning där alarm alls kunde ha fyrat, utan att behöva
# alarm-jobbets eget utfall som bärare. Att ändå lägga "Larm vid röd natt" i
# listan hade fixat ett smalare fall med STÖRRE yta: listan hade slutat vara
# lika med alarm-triggern, alltså brutit led (i) ovan.
#
# === VÄRDENA ===
# NATTVAKT_PRODUKTKANAL_JOBBPREFIX — jobbnamn i produktkanalen, matchade som
# PREFIX mot `.jobs[].name` i `gh run view --json jobs`.
#
# PREFIX, inte exakt likhet, av ett mätt skäl: `suite` är ett `uses:`-anrop av
# ci-suite.yml, och dess jobb dyker upp i körnings-API:t som barn med
# förälderprefix — "Nattlig fullsvit / Pure + Build", "Nattlig fullsvit /
# Staging (API + E2E)" osv. Något jobb som bara heter "Nattlig fullsvit" finns
# ALDRIG i listan (verifierat mot körningarna 35311984679 och 35334514452). En
# exakt-matchning hade därmed missat hela nattsviten — tyst.
#
# Namnen är jobbens `name:`-fält i nightly.yml, inte deras jobb-id.
NATTVAKT_PRODUKTKANAL_JOBBPREFIX=(
    "Nattlig fullsvit"
    "CI-mätning (siffror, ej känsla)"
    "Kontraktsvakt (fixtur mot skarp staging)"
)

# NATTVAKT_OFARLIGA_CONCLUSIONS — de `.jobs[].conclusion`-värden som INTE räknas
# som rött. Vakten uttrycker rödhet som en NEGATION av denna lista, aldrig som
# en uppräkning av röda värden (TASK-450.1 runda 3, granskningens fynd 1).
#
# VARFÖR NEGATION: `.jobs[].conclusion` har nio värden (success, failure,
# neutral, cancelled, skipped, timed_out, action_required, stale, null) medan
# `needs.<jobb>.result` — som alarm-triggern läser — har fyra (success, failure,
# cancelled, skipped). En uppräkning av röda värden måste hållas synkad med en
# domän vi inte äger; en negation gör varje nytt eller okänt värde rött som
# default. Fail-loud i den riktning som betyder något.
#
# VALET AV OFARLIGA, var och en med skäl:
#   success — grönt.
#   skipped — jobbet kördes aldrig. `result` blir `skipped`, som inte fyrar
#             alarm; att larma vore ett falsklarm, och husregeln är att ett
#             falsklarm är värre än ingen vakt.
#   neutral — "avslutat utan att lyckas eller misslyckas". GitHubs egen
#             aggregering räknar det som icke-fällande; vi följer plattformen i
#             stället för att uppfinna en strängare regel än den.
# `null` (jobbet PÅGÅR) hanteras separat i jq-uttrycket och står därför inte
# här: det är inte ett "ofarligt utfall" utan frånvaro av utfall, och ett
# rött-påstående om ett oavslutat jobb vore ett faktapåstående utan fakta
# (L322-klassen).
#
# Allt annat — failure, cancelled, timed_out, action_required, stale och varje
# framtida värde — räknas som rött.
NATTVAKT_OFARLIGA_CONCLUSIONS=(
    "success"
    "skipped"
    "neutral"
)
