# .mutation-hemvist-policy.conf
#
# FAIL-CLOSED allowlist för tests/api/mutation-hemvist-vakt.test.ts
# (TASK-201.15). Grinden fäller varje `useMutation`-anrop under src/ som
# INTE bor i src/data/mutations/ (mutationskatalogens hemvist) OCH INTE står
# i denna fil. Skriptets/testets LOGIK är universell (kan duplicera till
# andra spokes utan refactor); VÄRDENA här — vilka fil-sökvägar som
# legitimt får ha en komponent-lokal `useMutation` — är projektspecifika.
# Samma hub-spoke-portabilitet + config-driven-princip som
# .prod-functions-allowlist.conf, .heartbeat-svep-policy.conf m.fl.
# (Lesson #6, UNIVERSAL).
#
# ROTORSAKEN (TASK-201.15, Marcus GO 2026-08-14, S105 Del 9): TASK-201.13:s
# mekaniska invariant ("varje exporterad mutationshook loggar", mätt 15/15)
# var MAPP-SCOPAD — den räknade `src/data/mutations/*.ts` och kunde per
# konstruktion inte se en useMutation som aldrig flyttat dit. Tre skrivande
# hooks (createEvent, sendEmail, saveSegment) bodde komponent-lokalt och var
# därför osynliga för den räkningen. Denna grind stänger HEMVISTSLUCKAN
# mekaniskt: en ny komponent-lokal skrivande useMutation kan inte längre
# undgå upptäckt genom att aldrig nämnas i mutationskatalogen.
#
# Format: en fil-sökväg per rad, repo-relativ (från repo-roten, med
# `src/`-prefix). # inleder kommentar (inline-kommentarer efter sökvägen
# stripplas av testets parser — skälet skrivs ändå ut här, för människan som
# läser filen). Blankrader ignoreras.
#
# FAIL-CLOSED, INTE FAIL-OPEN: en fil här är INTE ett frikort för framtida
# ändringar i den filen — allowlistningen gäller EXAKT den nuvarande
# useMutation-användningen, motiverad nedan. Läggs en NY skrivande mutation
# till i en redan allowlistad fil (t.ex. en riktig write i en prototyp) ska
# den extraheras till katalogen precis som alla andra — allowlistningen
# undantar INTE filen från framtida granskning, den dokumenterar bara varför
# den står här NU.

# LISTAN ÄR TOM — OCH DET ÄR DET STRÄNGASTE LÄGET, INTE ETT TRASIGT.
#
# Fram till TASK-249.6 (2026-08-17) stod exakt två poster här:
#
#   src/components/segment/SegmentBuilder.tsx        — den gamla segment-
#     byggaren; efter TASK-201.15s extraktion av saveSegment kvarstod EN
#     lokal useMutation, `computeSegment` (on-demand mottagar-RÄKNING). Ren
#     beräkning, ingen datamutation.
#   src/components/segment/prototyp/VariantA.tsx     — kastbar divergens-
#     prototyp med samma read-only `computeSegment`-mutation.
#
# BÅDA FILERNA ÄR RIVNA (TASK-249.6, ADR-103: segment-promoveringens
# mekaniska rivning — varianterna a/b/c och den gamla byggaren dog när
# variant d blev den skarpa ytan i TASK-249.5). Posterna togs bort i samma
# commit som filerna: en allowlist-post som pekar på en icke-existerande fil
# är skräp som tyst vidgar grinden den dagen sökvägen återuppstår.
#
# Att listan är tom betyder att INGEN komponent-lokal `useMutation` är
# tillåten någonstans under src/ — grinden är alltså maximalt sträng, inte
# avstängd. `VariantD.tsx`, den promoverade segment-ytan, bär noll
