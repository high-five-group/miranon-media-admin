# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/staging-semaphore.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears
# unused") slår som falskt positiv. Disable är fil-nivå och avsiktlig —
# samma form som .ci-wait-policy.conf. (Raden ovan är en riktig direktiv-rad;
# ordet får därför inte inleda någon annan kommentarsrad i filen — då tolkas
# den som en trasig direktiv och SC1072/SC1073 fäller.)

# .staging-semaphore-policy.conf
#
# Per-projekt config för scripts/staging-semaphore.sh (subkommandot
# `preflight`). Skriptets LOGIK är universell (kan dupliceras till andra
# spokes utan refactor); VÄRDENA här är projekt-specifika. Samma hub-spoke-
# portabilitet som .ci-wait-policy.conf, .checklist-policy.conf,
# .frontmatter-policy.conf och .lesson-policy.conf (Lesson #6, UNIVERSAL).
#
# === Duplicera till nytt spoke (2 steg) ===
# 1. cp scripts/staging-semaphore.sh + denna fil till nytt repo
# 2. Sätt de två listorna nedan till repots egna workflow-filer och jobbnamn
#
# Källa: TASK-77 (mutexen staging-tests binder bara CI — lokala staging-script
# gick förbi den mot samma bas).

# === Workflow-FILER som kan bära ett staging-rörande jobb ===
# Filnamn, inte `name:`-fältet: filnamnet är stabilt över omdöpningar och är
# vad `gh run list --workflow` matchar mest entydigt.
#
# VARFÖR EXAKT DESSA TVÅ, mätt 2026-07-29 och inte antaget: sedan TASK-70.3
# skickar ci.yml `run_staging: false` VILLKORSLÖST (ci.yml rad 829), så
# PR-grinden instansierar varken `Staging (API + E2E)` eller `Staging sentinel
# purge` och tar därmed inte mutexen alls. Bärarna i dag är post-merge-lagret
# och natten. LIFT-VILLKOR: skulle ci.yml någon gång åter skicka
# `run_staging: true` måste `ci.yml` läggas till här — annars blir preflighten
# tyst blind för PR-ytan.
STAGING_CI_WORKFLOWS=(
    "post-merge.yml"
    "nightly.yml"
)

# === Jobbnamn som betyder "staging är upptaget eller strax upptaget" ===
# Matchas mot jobbets `name` i körnings-API:t, både exakt och i den nästlade
# formen "<anropande jobb> / <anropat jobb>" som GitHub ger reusable
# workflows (verifierat mot run 30442315955, 2026-07-29).
#
# De tre första RÖR basen. De två sista är ANROPAR-raderna för ci-suite.yml:
# innan det anropade jobbet expanderats finns bara anropar-raden i listan, och
# att läsa den frånvaron som "fritt" vore att bygga ett faktapåstående på
# avsaknad av data (L322-klassen). Anropar-raden räknas därför som hållare
# ända tills den är `completed` — och en docs-landning där `klassning` ärvde D0
# ger just `completed`/`skipped` på den raden, vilket korrekt INTE fäller
# (verifierat mot run 30440662509).
#
# `A11y (axe-runner)`, `Pure + Build` och `Acceptance (hermetisk)` står
# MEDVETET INTE här: de rör inte staging-basen, och att fälla på dem hade
# gjort mekanismen till den ständiga broms AC#3 varnar för.
STAGING_CI_JOBS=(
    "Staging (API + E2E)"
    "Staging sentinel purge"
    "Kontraktsvakt (fixtur mot skarp staging)"
    "Verifierande svit på det mergade trädet"
    "Nattlig fullsvit"
)

# === Hur många senaste körningar per workflow som prövas ===
# Sonden filtrerar på `status != completed`, så talet behöver bara vara större
# än antalet samtidigt pågående körningar av EN workflow. Post-merge kör en
# körning per landat träd (concurrency post-merge-<sha>) och natten en per
# dygn; 20 är rikligt med marginal.
STAGING_CI_RUN_LIMIT=20
