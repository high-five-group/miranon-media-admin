# shellcheck shell=bash
# shellcheck disable=SC2034
# Variabeln här sourcas och konsumeras av scripts/kontrollera-hemlighets-namn.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears
# unused") slår som falskt positiv. Disable är fil-nivå och avsiktlig —
# samma form som .prod-ref-policy.conf, .hemlighet-utskrift-policy.conf,
# .supabase-cli-policy.conf m.fl. (Lesson #6, UNIVERSAL).

# .hemlighets-namn-policy.conf
#
# Per-projekt config för scripts/kontrollera-hemlighets-namn.sh (TASK-359).
# Skriptets LOGIK är universell (kan duplicera till andra spokes utan
# refactor); VÄRDET här — VILKA hemlighets-NAMN som måste finnas i ett
# Supabase-projekts secrets, inte deras värden — är projektspecifik data.
#
# VARFÖR FILEN FINNS: `INVITE_REDIRECT_URL` saknades i BÅDA Supabase-
# projekten sedan de skapades (prod 2026-03-30, staging 2026-06-13) fram
# till 2026-09-02. `fas4-prod-deploy.sh --kontrollera` skrev redan en
# PROSA-notis om exakt denna hemlighet ("LÄS DETTA I UTDATAN OVAN") — mätt
# TRE gånger (S107, S108, S113) att en människa som läste `secrets list`s
# rå namn+digest-utdata INTE fångade avsaknaden som åtgärdbart. Se
# docs/reference/atkomst-och-nycklar.md § "Bifynd, bokfört" för hela
# incidenthistoriken och TASK-270 för den ursprungliga mätningen
# (2026-08-17, Marcus egen `--kontrollera`-körning mot prod).
#
# VARFÖR EN UPPRÄKNAD MÄNGD, INTE "ALLA HEMLIGHETER SOM NÅGON FUNKTION
# LÄSER": en uttömmande lista av VARJE `Deno.env.get(...)`-anrop i
# supabase/functions/** vore skörare — varje ny funktion som läser en ny
# miljövariabel skulle kräva en samtidig policy-uppdatering, annars
# tyst URholkning av kontrollen. Den uppräknade mängden nedan är i stället
# den delmängd vars AVSAKNAD ger ett TYST, SVÅRUPPTÄCKT fel i skarpt läge
# (funktionen deployas och KÖR, men beter sig fel) snarare än ett omedelbart
# 500 — plattformsinjicerade variabler (SUPABASE_URL, SUPABASE_ANON_KEY,
# SUPABASE_SERVICE_ROLE_KEY) står redan UTANFÖR `secrets list` helt (de
# injiceras av plattformen, se docs/reference/prod-driftsattning-runbook.md
# rad ~293) och hör därför inte hemma i denna lista.
#
# Varje namn nedan är verifierat (2026-09-02, TASK-359-bygget) mot en
# faktisk `Deno.env.get('<NAMN>')`-läsning i supabase/functions/**:
#
#   INVITE_REDIRECT_URL         supabase/functions/invite-user/index.ts:260
#                                — se § VARFÖR FILEN FINNS ovan.
#   CORS_ALLOWED_ORIGINS         supabase/functions/_shared/cors.ts:30 —
#                                saknas den ser HELA appen död ut för
#                                användaren (preflight avvisas överallt),
#                                och deploy-verifieringens curl-test
#                                upptäcker INTE detta (curl skickar ingen
#                                Origin-header) — se fas4-prod-deploy.sh:s
#                                egen "LÄS DETTA"-notis.
#   DOCRAPTOR_API_KEY             supabase/functions/generera-*
#                                (PDF-mallmotorn, 4 filer) — saknas den
#                                fallerar varje kvitto-/bilage-generering.
#   JOBBMOTOR_DELAD_HEMLIGHET     supabase/functions/jobb-konsument/index.ts:138,
#                                supabase/functions/koa-kvitton/index.ts:93 —
#                                den delade hemligheten mellan cron-tick och
#                                jobbkonsumenten (jobbmotorn, TASK-337-familjen).
#   RESEND_API_KEY                6 filer (mail-avsändning via Resend).
#   RESEND_FROM                   6 filer (samma mail-avsändningsväg).
#   ADMIN_EMAILS                  3 filer — mottagarlistan för adminmail.
#   AIRTABLE_TOKEN                supabase/functions/_shared/airtable-client.ts
#                                (4 anropsställen) — datakällans autentisering.
#   AIRTABLE_BASE_ID               supabase/functions/_shared/airtable-client.ts:51
#                                — datakällans mål-bas.
#   ENVIRONMENT                    9 filer — miljö-medveten grening i flera
#                                Edge Functions.
#
# MEDVETET UTANFÖR (namngivna men EJ krävda här): `RESEND_REPLY_TO`,
# `SUPABASE_DB_URL`, `SUPABASE_JWKS`, `SUPABASE_PUBLISHABLE_KEYS`,
# `SUPABASE_SECRET_KEYS`, `VITE_SENTRY_DSN` förekom i TASK-270:s fulla
# 16-post-avläsning av prod-secrets men konsumeras inte via
# `Deno.env.get(...)` i supabase/functions/** på samma sätt (frontend-/
# plattforms-klass, inte en EF-runtime-läsning) — att kräva dem här hade
# brutit § "VARFÖR EN UPPRÄKNAD MÄNGD"-principen ovan (varje namn måste vara
# BELAGT med en faktisk konsument, inte bara "finns i prod idag").
KRAVDA_HEMLIGHETER=(
    "INVITE_REDIRECT_URL"
    "CORS_ALLOWED_ORIGINS"
    "DOCRAPTOR_API_KEY"
    "JOBBMOTOR_DELAD_HEMLIGHET"
    "RESEND_API_KEY"
    "RESEND_FROM"
    "ADMIN_EMAILS"
    "AIRTABLE_TOKEN"
    "AIRTABLE_BASE_ID"
    "ENVIRONMENT"
)
