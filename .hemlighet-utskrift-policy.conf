# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/deny-hemlighet-utskrift.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears
# unused") slår som falskt positiv. Disable är fil-nivå och avsiktlig —
# samma form som .mail-lock-policy.conf, .heartbeat-svep-policy.conf m.fl.
# (Lesson #6, UNIVERSAL).

# .hemlighet-utskrift-policy.conf
#
# Per-projekt config för scripts/deny-hemlighet-utskrift.sh (TASK-203).
# Skriptets LOGIK är universell (kan duplicera till andra spokes utan
# refactor); VÄRDENA här — vilka kommandon som skriver ut en hemlighets
# VÄRDE snarare än dess existens/digest — är verktygs-/plattformsspecifika
# (Supabase CLI, macOS `security`, `gh` CLI).
#
# VARFÖR FILEN FINNS: Marcus-order 2026-08-12, verbatim: "Fixa skiten för
# gott, så det aldrig händer varken staging eller prod. Gör det PROFFSIGT!"
# — efter att `npx supabase projects api-keys --project-ref pqtshyierkdgwdnxuirz
# -o json` skrev ut en fullständig legacy service_role-JWT i klartext, UTAN
# --reveal, i ett agent-transkript. Fullt incidentresonemang: TASK-203-kortet
# + scripts/deny-hemlighet-utskrift.sh:s eget header.
#
# === Duplicera till nytt spoke (2 steg) ===
# 1. cp scripts/deny-hemlighet-utskrift.sh + denna fil till nytt repo.
# 2. Verifiera att mönstren nedan fortfarande matchar den faktiska CLI-
#    versionen (Supabase/gh/security-flaggor kan ändras mellan versioner —
#    se TASK-203-kortets premiss-pass: `supabase secrets list --reveal`
#    avvisades REDAN av CLI 2.113.0 den 2026-08-12, men mönstret hålls kvar
#    defensivt).
#
# Matchning: fri substräng/ERE mot HELA Bash-kommandosträngen, skiftläges-
# okänslig (samma enkla form som .mail-lock-policy.conf, TASK-137 — inte
# position-ankrad, se skriptets § SCOPE-GRÄNS för den medvetna avvägningen).

# === BLOCKERAS — skriver ut ett VÄRDE, inte existens/digest ===
#
# supabase projects api-keys — MED OCH UTAN --reveal. `--help` (2026-08-12,
# CLI 2.113.0) dokumenterar --reveal som "Reveal the secret API keys in
# full" — vilket antyder att UTAN flaggan är nycklarna dolda. Incidenten
# 2026-08-12 motbevisade det: kommandot skrev ut den fullständiga legacy
# service_role-JWT:n UTAN --reveal. Blockeras därför OAVSETT flagga —
# dokumentationens löfte visade sig inte hålla i praktiken.
#
# supabase secrets list --reveal — defensivt mönster. PREMISS-DIVERGENS,
# källmärkt: CLI 2.113.0 (`npx supabase secrets list --reveal`, körd
# 2026-08-12) avvisar flaggan rakt av: {"_tag":"Error","error":{"code":
# "UnrecognizedOption","message":"Unrecognized flag: --reveal in command
# supabase secrets list"}}. `supabase secrets list` har ingen --reveal i
# denna CLI-version — kommandot skulle redan fela innan något skrevs ut.
# Mönstret behålls ändå (billigt, framtidssäkert mot en CLI-version där
# flaggan återinförs eller mot en annan subcommand-väg) men är i dag INERT.
#
# security find-generic-password ... -w — "Display the password(only) for
# the item found" (man security, läst 2026-08-12). Rent värde, ingen metadata.
#
# security find-generic-password ... -g — "Display the password for the
# item found" (samma man-sida) — värde + attribut i samma utskrift.
#
# security dump-keychain ... -d (eller kombinerad flagga som innehåller d,
# t.ex. -ad/-dr) — "-d Dump (decrypted) data of items" (man security).
# Dumpar VARJE hemlighet i HELA nyckelringen dekrypterad, inte en enskild
# post — den bredaste möjliga läckan i denna lista.
#
# gh auth token — "This command outputs the authentication token for an
# account on a given GitHub host." (gh auth token --help, läst 2026-08-12).
# Skriver ut det aktiva PAT:et rakt av, ingen legitim agent-användning.
#
# gh auth status ... -t / --show-token — "-t, --show-token  Display the
# auth token" (gh auth status --help). Blockeras BARA med flaggan — utan
# den är kommandot redan legitimt bruk (används i
# docs/reference/atkomst-och-nycklar.md § Register).
HEMLIGHET_KOMMANDO_MONSTER=(
    "supabase[[:space:]]+projects[[:space:]]+api-keys"
    "supabase[[:space:]]+secrets[[:space:]]+list[^|;&]*--reveal"
    "security[[:space:]]+find-generic-password[^|;&]*[[:space:]]-w([[:space:]]|$)"
    "security[[:space:]]+find-generic-password[^|;&]*[[:space:]]-g([[:space:]]|$)"
    "security[[:space:]]+dump-keychain[^|;&]*[[:space:]]-[adhir]*d[adhir]*([[:space:]]|$)"
    "gh[[:space:]]+auth[[:space:]]+token"
    "gh[[:space:]]+auth[[:space:]]+status[^|;&]*(-t([[:space:]]|$)|--show-token)"
)

# === MEDVETET INTE MED (se TASK-203-kortets § Gränsfallsmotivering) ===
#
# - security find-generic-password -s <tjänst> UTAN -w/-g — existens-check,
#   redan legitimt bruk i scripts/atkomst-diagnos.sh rad 221 (output till
#   /dev/null, bara exit-koden läses).
# - gh secret list — GitHubs API returnerar ALDRIG ett secret-värde, oavsett
#   flagga. Inget att blockera.
# - supabase secrets list UTAN --reveal — namn + digest, redan legitimt bruk
#   i docs/reference/atkomst-och-nycklar.md § Register.
# - security dump-keychain UTAN -d/kombinerad d-flagga — metadata only,
#   redan legitimt bruk i samma dokument (verifierade tjänste-/kontonamn +
#   cdat-attribut för Supabase CLI-posten).
# - gh auth status UTAN -t — redan legitimt bruk i samma dokument.
# - .env*-filläsning (cat/grep mot lokala env-filer) — ANNAN riskklass: en
#   statisk lokal fil, inte en live-hämtning från ett valv. Att blockera
#   den skulle bryta etablerade flöden (`ls -1 .env*` i atkomst-diagnos.sh,
#   CONTRIBUTING.md:s egna env-instruktioner). Incidenten var specifikt en
#   CLI som HÄMTAR OCH SKRIVER UT en levande hemlighet — det är den klassen
#   detta lås stänger, inte lokal filläsning.

# === Kort-ID för deny-meddelandet ===
HEMLIGHET_TASK_ID="TASK-203"
