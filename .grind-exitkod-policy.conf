# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/deny-grind-genom-pipe.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 slår som falskt
# positiv. Disable är fil-nivå och avsiktlig (Lesson #6, UNIVERSAL).

# .grind-exitkod-policy.conf
#
# Per-projekt config för scripts/deny-grind-genom-pipe.sh (S97, T119 (d)
# item 5, Marcus-GO 2026-08-04).
#
# === VARFÖR MEKANISMEN FINNS ===
# L440: "grind | tail returnerar tail:s exit, inte grindens; grind ; echo $?
# && nästa kedjar på echo:t. Båda formerna gör en röd grind grön för skalet."
#
# L441 säger varför prosan inte räckte: "En regel mekaniserad för en roll-yta
# lämnar de andra ytorna oskyddade." L440 stod ordagrant i bygg-agent-
# kontraktet och bröts ändå av ORKESTRERAREN dagen efter mintningen — ingen
# bärare band den ytan. En PreToolUse-hook binder ALLA ytor, inklusive
# orkestrerarens.
#
# INSTANSFREKVENSEN ÄR DEN HÖGSTA I HELA T119-INVENTERINGEN — minst sju
# dokumenterade fall över fyra sessioner:
#   S91  markdownlint-cli2 | tail -1 svalde exit 1 -> commit + push + armering
#        på en röd grind; fångades först av CI (#584-kedjan)
#   S91  rättelsekommandot kedjade && på echo "exit=$?" och committade rött
#   S94  check:docs | tail -> PR armerad trots röd grind (L441:s empiri)
#   S93  PR #662 MD012: pipe:ad grind svalde exitkoden
#   S96  kortnot överskriven via kedjat kommando
#   S97  git switch failade exit 1, blocket fortsatte — räddades av tur
#   S97  PIPESTATUS efter en pipe gav tom sträng vid en push-verifiering
# Klassen slog till under SJÄLVA utredningsdagen. Det är inte ett historiskt
# problem.
#
# === VAD SOM MEDVETET INTE FÄLLS ===
# Omdirigering (`grind > fil`) är HELT OK och fälls aldrig — exitkoden
# överlever en omdirigering, till skillnad från en pipe. Det är den form
# denna session använde genomgående, och den ska förbli friktionsfri.
# `if grind; then ... fi` fälls inte heller: exitkoden ÄR villkoret där.
# Nämns PIPESTATUS i kommandot fälls det inte — skribenten är bevisligen
# medveten om problemet.

# === Kommandon vars EXITKOD är leveransen ===
# ERE-mönster, matchas mot kommandosträngen. Listan är avsiktligt smal: det
# är grindar och testsviter, inte alla program. En bred lista hade gjort
# hooken till en falsklarmsmaskin, och husregeln är att ett falsklarm är
# värre än ingen vakt.
GRIND_MONSTER=(
    "scripts/check-[a-z-]+\.(sh|mjs)"
    "scripts/test-[a-z-]+\.sh"
    "markdownlint(-cli2)?"
    "(^|[[:space:]/])vale([[:space:]]|$)"
    "(^|[[:space:]/])shellcheck([[:space:]]|$)"
    "(^|[[:space:]/])actionlint([[:space:]]|$)"
    "(^|[[:space:]/])yamllint([[:space:]]|$)"
    "biome +check"
    "npm +run +(test|typecheck|build|check)"
    "audit-ci"
    "(^|[[:space:]/])tsc([[:space:]]|$)"
)

# === Undantag: nämns något av dessa är skribenten medveten ===
# `pipefail` tillkom 2026-08-04 (S97): med `set -o pipefail` returnerar pipen
# FÖRSTA icke-nollan, inte sista ledets kod — exitkoden överlever alltså, och
# det är POSIX-världens standardsvar på precis den fälla L440 beskriver. Att
# fälla den formen hade varit att neka den korrekta lösningen.
GRIND_UNDANTAG=(
    "PIPESTATUS"
    "\|\| *KOD="
    "; *KOD=\$\?"
    "pipefail"
)
