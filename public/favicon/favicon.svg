<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!--
    Miranon Media favicon — Roger & Lottas RIKTIGA M (vågformen) i vit cirkel.

    ERSATTE (S107, 2026-08-19, Marcus order): den tidigare fyra-parallellogram-
    formen ur public/miranon-logo.svg. Den var Marcus eget experiment, inte
    Roger & Lottas märke. Vågformen är utplockad ur ordmärket och bär
    ORIGINALFÄRGERNA — härledningen står i
    public/miranon-media-ordmarke-original.svg.

    Den streckade linjen ur ordmärket är UTELÄMNAD med avsikt: vid 32 px blir
    den en grumlig strimma tvärs över märket.

    GEOMETRIN, räknad — inte ögonmått:
      M:ets bbox (getBBox i Chrome): 123.814 x 118.882, centrum (75.000, 59.439)
      käll-hörnradie = hypot(bredd/2, höjd/2) = 85.82
      vald kvot 0.95 mot cirkelradien 200 ger skala 2.2138

    VARFÖR 0.95 OCH INTE 0,885 som den gamla: 0,885 ärvdes från maskable-
    ikonens safe-zone-krav (Session 16 K5c), men denna favicon är INTE
    maskable — den är en rund platta utan beskärningsrisk. Vågformen har
    tunnare linjer än den gamla parallellogram-formen och tjänar på att
    fylla cirkeln mer. Uppmätt i storlekarna 16/24/32/48 px mot 0,885 och
    1,02; 0.95 gav bäst balans mellan fyllnad och luft.

    KÄND AVVÄGNING: vågformen är tunnare än den form den ersätter och tappar
    därför mer vid 16 px. Det är en medveten kostnad för att bära det RIKTIGA
    märket i stället för ett experiment. Ändras detta — mät i 16 px först.
  -->
  <circle cx="200" cy="200" r="200" fill="#ffffff"/>
  <defs><style>.cls-1{fill:#FF0000;}.cls-1,.cls-3{stroke-width:0px;}.cls-3{fill:#548235;}</style></defs>
