<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Helt rund platta med vit bakgrund (Marcus-beslut Session 16 K5d,
       som miranon.se). Logotyp-skala 0.70: käll-hörnradie 252,96 × 0,70
       = 177,1 ≤ 0,9 × cirkelradien 200 (kvot 0,885) — samma
       cirkelgeometri-krav som maskable-ikonen (K5c). -->
  <circle cx="200" cy="200" r="200" fill="#ffffff"/>

  <!-- Miranon Media Logo — skalad till 70 % och centrerad -->
  <g transform="translate(200,200) scale(0.70) translate(-200,-200)">
    <polygon points="103,10 155,10 85,390 33,390" fill="#636b5b"/>
    <polygon points="189,10 241,10 171,390 119,390" fill="#984f2b"/>
    <polygon points="245,10 297,10 367,390 315,390" fill="#984f2b"/>
    <polygon points="159,10 211,10 281,390 229,390" fill="#636b5b"/>
  </g>
</svg>
