<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Du är offline — Miranon Media Admin</title>
    <!--
      Offline-fallback (Fas 5, ADR-047 B2). Serveras av service workerns
      catch-handler vid cache-miss på dokument-requests. Helt fristående:
      inline-CSS, ingen JS, inga externa requests. Inga animationer
      (prefers-reduced-motion respekteras genom att inget rör sig alls).
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #242424;
        --text-muted: #525151;
        --accent: #d4960a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1a1a;
          --text: #f5f5f3;
          --text-muted: #c4c4c2;
        }
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        display: grid;
        min-height: 100vh;
        place-items: center;
      }
      main {
        max-width: 28rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      h1::before {
        content: '';
        display: block;
        width: 3rem;
        height: 0.25rem;
        background: var(--accent);
        border-radius: 0.125rem;
        margin: 0 auto 1.25rem;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Du är offline</h1>
      <p>
        Det går inte att nå internet just nu. Appen öppnas igen automatiskt
        när anslutningen är tillbaka — du behöver inte göra någonting.
      </p>
    </main>
  </body>
</html>
