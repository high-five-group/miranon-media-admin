# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/arkivera-sessionsdok.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears
# unused") slår som falskt positiv. Disable är fil-nivå och avsiktlig —
# samma form som .stada-grenar-policy.conf och .heartbeat-svep-policy.conf.

# .arkivera-sessionsdok-policy.conf
#
# Per-projekt config för scripts/arkivera-sessionsdok.sh (TASK-158.2,
# ADR-099). Skriptets LOGIK är universell (kan dupliceras till andra spokes
# utan refactor); VÄRDENA här är projekt-specifika. Samma hub-spoke-
# portabilitet som .stada-grenar-policy.conf, .heartbeat-svep-policy.conf,
# .ci-wait-policy.conf m.fl. (Lesson #6, UNIVERSAL).
#
# === Duplicera till nytt spoke (2 steg) ===
# 1. cp scripts/arkivera-sessionsdok.sh + denna fil till nytt repo
# 2. Sätt ARKIVERA_SESSIONSDOK_FONSTER till repots startvärde (se nedan)
#    och fyll ARKIVERA_SESSIONSDOK_SKYDDADE om repot har dok som aldrig
#    ska arkiveras oavsett lifecycle/ålder (tomt är ett giltigt default)
#
# Källa: ADR-099 (docs/decisions/ADR-099-…md) — rullande fönster ersätter
# fas-avslut-bindningen (ADR-041 beslut 6, riven öppet) som styrande regel
# för vad som får ligga i tasks/sessions/-roten.

# === Fönstertalet N (obligatoriskt — skriptet vägrar köra utan det) ===
#
# Roten behåller de N SENAST STÄNGDA sessionsdoken (sorterat fallande på
# sessionsnummer, extraherat ur filnamnet) plus SAMTLIGA lifecycle:
# active/paused-dok oavsett ålder. Äldre closed-dok arkiveras.
#
# STARTVÄRDE N ≈ 10 — den samsyn som grillades i S99 Del 5
# (tasks/sessions/archive/2026-08/2026-08-07-session-99.md § Del 5) och kodifierades i
# ADR-099 Beslut 2. Talet är ett startvärde, INTE en helig konstant: det
# omprövas mot uppmätt rotstorlek och faktisk sessionstakt utan att kräva
# en ny ADR — bara en ändring av denna rad.
ARKIVERA_SESSIONSDOK_FONSTER=10

# === Skyddslista — glob-mönster, ALDRIG arkiverade oavsett fönster-status ===
#
# Matchas mot dokumentets filnamn (basename) med bash-glob (case-mönster),
# INTE regex. Detta är EN av fyra oberoende skydd — de tre andra
# (lifecycle active/paused, oparsbar lifecycle, oparsbart filnamn) är
# hårdkodade i skriptet och INTE konfigurerbara härifrån (golvet skärs
# aldrig bort i enkelhetens namn). En tom lista här är ett giltigt, säkert
# default: den stänger av EXTRA skydd utöver golvet, den stänger inte av
# golvet.
#
# Tom eller odefinierad ⇒ dagens beteende (fail-open för DENNA lista
# specifikt): inga extra dok skyddas utöver de tre hårdkodade.
ARKIVERA_SESSIONSDOK_SKYDDADE=(
)
