# shellcheck shell=bash
# shellcheck disable=SC2034
# Denna fil sourcas INTE av något skript. Den är A-sidan i
# .listparitet-policy.conf:s par `grind-tillganglighet`, läst av
# scripts/check-listparitet.sh:s generiska markör-region-motor (grep -oE mot
# regionen nedan). Ingen ny grind-logik — värden i EN policy-fil, motorn
# återanvänd (CLAUDE.md § config-driven grindvakt, Lesson #6/UNIVERSAL).
#
# .grind-tillganglighet-policy.conf
#
# TABELL: grind → varje EGEN policy-/conf-fil den `source`:ar, utöver de
# .md-filer/skript-sökvägar den redan validerar via changed-docs-listan.
#
# ═══ VARFÖR DENNA FIL FINNS (TASK-464.1 F1, review runda 1, risk hög, fynd 1,
# 2026-09-19) ═══
#
# Fem av de sju grindar som flyttade till `docs`-jobbet i SE2
# (check-public-checklists.sh, check-frontmatter.sh, check-thread-index.sh,
# check-lesson-numbers.sh, check-permissions-claims.sh) styr sitt beteende
# via en EGEN rot-.conf-fil (`source .xxx-policy.conf`). Ingen av de fem
# conf-filerna var D0-klassad eller stod i ci.yml:s changed-docs-lista, vilket
# gjorde en ensam ändring av CONF-VÄRDENA (t.ex. ett nytt giltigt tillstånd i
# .thread-index-policy.conf, en ny styrande doc i .frontmatter-policy.conf:s
# FRONTMATTER_GOVERNING_DOCS) tyst ovaliderad: should_skip_tests==false körde
# `lint` (rot-.conf är inte D0), men grinden som läser filen bor inte längre
# där — och docs_changed==false (ingen .md rörd) körde aldrig `docs`-jobbet,
# där grinden faktiskt bor. Landningen hade prövat allt UTOM den ändrade
# raden. Exakt samma ADR-083-felklass check-permissions-claims.sh själv bar
# en gång, före TASK-98 (se ci.yml:s kommentar vid det steget).
#
# ═══ HUR TABELLEN VAKTAS ═══
#
# Paret `grind-tillganglighet` i .listparitet-policy.conf (riktning a-till-b)
# kräver att VARJE fil i regionen nedan finns, ORDAGRANT, som en egen rad i
# ci.yml:s `paritet:start klassning-docs`-region — HÄRLEDD direkt ur ci.yml,
# ingen kopia av den listan förs här. Saknas en post i ci.yml:s lista fäller
# grinden. B (ci.yml) får bära MER än A (andra docs-verktygs-configer, t.ex.
# .vale.ini) — det är a-till-b-riktningens hela poäng; den prövar bara att A
# är TÄCKT, inte att B är EXAKT A.
#
# ═══ UNDERHÅLL — EN NY GRIND FLYTTAR TILL `docs`-JOBBET ═══
#
# Lägg en rad här OM den nya grinden sourcar en egen conf-fil, och gör SAMMA
# tillägg på två andra ställen i SAMMA ändring:
#   1. Filnamnet i ci.yml:s `Get changed docs files`-steg (changed-docs-listan)
#   2. Ett B-sido-undantag i .listparitet-policy.conf:s LISTPARITET_UNDANTAG
#      för paret `klassning-docs-config` (annars fäller DET paret — B-sidan
#      bär då en post A/D0-sidan aldrig kan ha, med avsikt: rot-.conf ska
#      aldrig bli D0-klassad, se ci.yml:s kommentar vid steget).
# Glöms någon av de tre hälfterna fäller motsvarande grind (denna, eller
# `klassning-docs-config`) — det ÄR poängen: en tabell utan bevakning glider,
# en tabell MED bevakning fäller på sin egen ofullständighet.
#
# paritet:start grind-tillganglighet
GRIND_CONF_FILER=(
  ".checklist-policy.conf"           # check-public-checklists.sh
  ".frontmatter-policy.conf"         # check-frontmatter.sh
  ".thread-index-policy.conf"        # check-thread-index.sh
  ".lesson-policy.conf"              # check-lesson-numbers.sh
  ".permissions-claims-policy.conf"  # check-permissions-claims.sh
)
# paritet:slut grind-tillganglighet
#
# ═══ VARFÖR INTE ALLA TIO GRINDAR STÅR HÄR ═══
#
# check-lifecycle.sh och check-adr-count.sh läser ENDAST .md-filer/README.md/
# docs/decisions/*.md — redan D0 och redan changed-docs via **/*.md
# respektive docs/**. Ingen egen conf, ingen post behövs.
#
# De TRE "stannar i lint"-grindarna (check-fetch-depth-invariant.sh,
# check-listparitet.sh, check-facit.sh — ci.yml § "docs-grindar-ci", de tre
# som INTE flyttade) behöver heller ingen post: deras respektive conf-filer
# (.frontmatter-policy.conf — delad med check-frontmatter.sh, redan ovan;
# .listparitet-policy.conf; .facit-policy.conf) är samtliga redan INTE
# D0-klassade. should_skip_tests==false fångar därför en ensam ändring av
# DERAS EGEN conf redan i dag, eftersom deras PRIMÄRA instans stannar kvar i
# `lint` (körs på varje kodändring). De behöver docs-jobbets omärkta
# dubblett-täckning bara för sin DOKUMENT-triggrande sida (ADR-erratum,
# CONTRIBUTING.md-sentinel, facit-manifest under tasks/**) — redan hanterad,
# se respektive stegs egen kommentar i ci.yml.
