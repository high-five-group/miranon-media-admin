# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/deny-prod-airtable.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears
# unused") slår som falskt positiv. Disable är fil-nivå och avsiktlig —
# samma form som .prod-ref-policy.conf, .mail-lock-policy.conf m.fl.
# (Lesson #6, UNIVERSAL).

# .prod-airtable-policy.conf
#
# Per-projekt config för scripts/deny-prod-airtable.sh (TASK-419). Skriptets
# LOGIK är universell; VÄRDENA här — bas-ID:n och MCP-verktygsprefix — är
# projektspecifik data.
#
# VARFÖR FILEN FINNS: mätt 2026-09-06 (S123) — research-passet om
# förvärmning och review-agenten på PR #2400 anropade `mcp__airtable__`-
# verktyg mot prod-bas-ID:t (app8uGPrVCVOm6LfD) för fältdata staging bar
# identiskt (tasks/lessons.d/prod-basen-last-av-tva-agenter-ett-prosa-
# forbud-utan-mekanism-haller-inte-under-fleet.md). Doktrinen "prod är
# förbjuden" bars dittills enbart av prosa (agentkontrakten,
# .claude/agents/*.md) — samma felklass ADR-083 redan namngivit för andra
# ytor: en spärr som bara finns i prosa håller inte under fleet-drift.
# Detta är samma form och skäl som .prod-ref-policy.conf (TASK-203), fast
# för Airtable-MCP-ytan i stället för Supabase-CLI:t i Bash.
#
# === Bas-ID:n — källmärkta mot docs/reference/data-model.md ===
# Verifierat identiskt mot uppdragstextens värden i premiss-passet
# (TASK-419, 2026-09-07): `grep -rn "app8uGPrVCVOm6LfD\|apphjj8Q7lkXCMsL4"
# docs/reference/data-model.md` — förekommer på >20 rader vardera, bl.a.
# rad 75/486-487 (prod) och rad 486/793 (staging). Ingen divergens.
PROD_AIRTABLE_BASE_ID="app8uGPrVCVOm6LfD"

# STAGING_AIRTABLE_BASE_ID konsumeras INTE av matchningslogiken (ett anrop
# släpps redan när PROD_AIRTABLE_BASE_ID är FRÅNVARANDE ur tool_input — en
# ren substräng-frånvaro-kontroll, samma "medvetet bredare än en positiv
# allowlist"-motivering som .prod-ref-policy.conf § Matchning). Värdet
# dokumenteras ändå här för läsbarhet och för testsviten, som planterar det
# i A-fallen (måste SLÄPPAS igenom).
STAGING_AIRTABLE_BASE_ID="apphjj8Q7lkXCMsL4"

# === MCP-verktygsprefix — TVÅ FAMILJER MED OLIKA REGEL ===
#
# PROD_AIRTABLE_ALWAYS_PREFIXES — nekas OVILLKORLIGT, oavsett huvudsession
# eller subagent-kontext. `mcp__airtable__*` är PAT-servern: den är kvar i
# VARJE agents verktygspool (bygg-agent.md, review-agent.md,
# research-pass.md § "Kvar i din pool") för legitim fält-verifiering mot
# STAGING, och bär inget dokumenterat HITL-undantag för prod — CLAUDE.md-
# familjens "prod (app8uGPrVCVOm6LfD) är förbjuden" är en blank regel utan
# läs-undantag (samma hållning som Supabase-prod, se .prod-ref-policy.conf
# § Matchning sista punkten).
PROD_AIRTABLE_ALWAYS_PREFIXES=("mcp__airtable__")

# PROD_AIRTABLE_AGENT_ONLY_PREFIXES — nekas ENDAST i AGENT-KONTEXT (hook-
# indatans `agent_id` satt). `mcp__claude_ai_Airtable__*` är claude.ai-
# connectorn: Marcus egen interaktiva session använder den MEDVETET mot
# prod i HITL-läge (~/.claude/CLAUDE.md § Verktygsfakta, "Airtable-MCP:erna
# är TVÅ" — automations-/interface-introspektion som PAT-servern inte kan
# göra alls, se stycket för fullständig motivering). Denna familj är
# dessutom redan strukturellt borttagen ur bygg-agent/review-agent/
# research-pass tool-pooler via `disallowedTools` (se resp. agent-fils
# frontmatter) — hooken här är ett ANDRA LAGER för agenttyper som INTE har
# den exkluderingen (t.ex. `general-purpose`, `claude`-catchallen), på
# samma "dubbel botten"-princip som scripts/deny-resend-send.sh.
#
# AVGÖRANDET AV OM "agent-kontext" GÅR ATT SKILJA FRÅN HUVUDSESSION är
# PRÖVAT, inte antaget (TASK-419 premiss-pass): `agent_id` är ett bekräftat
# "common input field", satt endast i subagent-kontext — verifierat
# ORDAGRANT mot code.claude.com/docs/en/hooks.md (rå curl, ej WebFetch-
# sammanfattning) och mot samma fälts redan SKARPA användning i
# scripts/deny-subagent-vantan.sh (TASK-148.2, samma repo). Se
# scripts/deny-prod-airtable.sh för matchningslogiken.
PROD_AIRTABLE_AGENT_ONLY_PREFIXES=("mcp__claude_ai_Airtable__")

# === Kort-ID för deny-meddelandet ===
PROD_AIRTABLE_TASK_ID="TASK-419"
