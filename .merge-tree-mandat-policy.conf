# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/check-merge-tree.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 slår som falskt
# positiv. Disable är fil-nivå och avsiktlig (Lesson #6, UNIVERSAL).

# .merge-tree-mandat-policy.conf
#
# Per-projekt config för scripts/check-merge-tree.sh (TASK-139).
# Skriptets LOGIK är universell (kan dupliceras till andra spokes utan
# refactor); mönstren här — VILKA sökvägar merge-agenten får lösa mekaniskt
# på egen hand — är PROJEKT-SPECIFIKA. Samma hub-spoke-portabilitet som
# .staging-semaphore-policy.conf och .permissions-claims-policy.conf
# (Lesson #6, UNIVERSAL).
#
# === Duplicera till nytt spoke (3 steg) ===
# 1. cp scripts/check-merge-tree.sh + denna fil till nytt repo
# 2. Byt ut MANDAT_PATTERNS mot det nya repots egna genererade filer och
#    bokförings-md-kataloger
# 3. Orkestratorn anropar skriptet efter agentens push, före `gh pr create`
#    (se ADR-073 beslut 4 / work-batch/SKILL.md § "Parallell form" delta 4)
#
# === Källa (verbatim, citerad — ADR-073 rörs inte av detta kort) ===
# ADR-073 (docs/decisions/ADR-073-parallella-batch-pipelines.md) Amendering 3
# punkt 3 (Session 75, 2026-07-21):
#
#   "Konflikt-upplösnings-mandat för merge-agenten (bundet; halt-first orörd
#   för kod). Merge-tree-konflikt som ENBART rör (a) src/routeTree.gen.ts →
#   mekanisk regenerering i temp-worktree (router-cli finns som
#   devDependency; typecheck-verifierad före push) eller (b)
#   bokförings-md-ytor (backlog/tasks/**, docs/specs/**, docs/decisions/**)
#   → union-upplösning med BÅDA sidor bevarade, öppet bokförd i PR + kortets
#   notes. VARJE konflikt som rör annan kod = HALT."
#
# Skriptet LÖSER INGET automatiskt — det klassificerar varje konfliktande
# sökväg som "mandat-berättigad" (mekanisk lösningsväg finns, en människa
# eller merge-agenten utför den) eller "HALT" (rör annan kod, halt-first
# gäller oförändrat).

# --- Mandat-berättigade path-mönster (ERE, matchas mot git-relativ path) ----
#
# Bash [[ =~ ]] extended-regex-matchning mot varje konfliktande sökväg som
# git merge-tree --name-only rapporterar. Förankrad mot pathens BÖRJAN
# (^) så en yttre katalog med liknande namn inte råkar matcha.
MANDAT_PATTERNS=(
  "^src/routeTree\.gen\.ts$"
  "^backlog/tasks/"
  "^docs/specs/"
  "^docs/decisions/"
)
