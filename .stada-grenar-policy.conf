# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/stada-grenar.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears
# unused") slår som falskt positiv. Disable är fil-nivå och avsiktlig —
# samma form som .heartbeat-svep-policy.conf och .ci-wait-policy.conf.

# .stada-grenar-policy.conf
#
# Per-projekt config för scripts/stada-grenar.sh (TASK-152). Skriptets
# LOGIK är universell (kan dupliceras till andra spokes utan refactor);
# VÄRDENA här är projekt-specifika. Samma hub-spoke-portabilitet som
# .heartbeat-svep-policy.conf, .ci-wait-policy.conf,
# .staging-semaphore-policy.conf, .checklist-policy.conf,
# .frontmatter-policy.conf och .lesson-policy.conf (Lesson #6, UNIVERSAL).
#
# === Duplicera till nytt spoke (2 steg) ===
# 1. cp scripts/stada-grenar.sh + denna fil till nytt repo
# 2. Fyll STADA_GRENAR_SKYDDADE med repots egna skyddade gren-mönster
#    (tomt är ett giltigt, säkert default — se § Skyddslista nedan)
#
# Källa: TASK-152 — 271–272 av ~292–294 lokala grenar var redan mergade i
# main vid byggtillfället (talet rör sig, se scripts/stada-grenar.sh §
# PROBLEMET). Paus-svepets worktree-städning (marcus-hub-pluginets
# scripts/stada-worktrees.sh, TASK-94) städar bara de grenar som frigörs av
# EN worktree-borttagning i SAMMA körning — ingen generell sopning av
# repots samtliga mergade grenar existerade innan detta skript.

# === Bas-gren att mäta "mergad" mot (valfri) ===
# Tom sträng ⇒ auto-härledd kedja: origin/HEAD → origin/main → main (samma
# fallback som scripts/stada-worktrees.sh i marcus-hub-pluginet). Sätt
# explicit bara om repot avviker från den kedjan — detta repo gör det inte
# (CLAUDE.md § Landning: all landning går mot main via merge queue).
STADA_GRENAR_BAS=""

# === Skyddslista — glob-mönster, ALDRIG raderade oavsett mergad-status ===
#
# Matchas mot grenens kortnamn (git for-each-ref %(refname:short)) med
# bash-glob (case-mönster), INTE regex. Exempel: "release/*" skyddar alla
# grenar under release/, "docs/arkiv-*" skyddar en enskild prefix-familj.
#
# Detta är EN av fyra oberoende skydd — de tre andra (bas-grenen, aktuell
# gren, grenar uppcheckade i någon worktree) är hårdkodade i skriptet och
# INTE konfigurerbara härifrån (golvet skärs aldrig bort i enkelhetens
# namn). En tom lista här är därför ett giltigt, säkert default: den
# stänger av EXTRA skydd utöver golvet, den stänger inte av golvet.
#
# Tom eller odefinierad ⇒ dagens beteende (fail-open för DENNA lista
# specifikt): inga extra grenar skyddas utöver de hårdkodade fyra.
STADA_GRENAR_SKYDDADE=(
)
