# Supabase project configuration.
#
# Lever i git så att deploy-tid-konfig per funktion är versionerad.
# Per-funktion verify_jwt är gateway-första-försvar — appen lägger
# requireUser-helpern OVANPÅ för defense-in-depth (anon-key fångas
# där eftersom anon-key ÄR ett valid JWT som passerar gateway).
#
# test-*-funktioner får ALDRIG nå produktion (Fas 7-skuld, lessons.md L115).
# SPÄRR (ADR-050 steg 2, Session 19): prod-deploy går via
# scripts/deploy-prod-functions.sh som läser .prod-functions-allowlist.conf
# (fail-closed allowlist) — test-auth + nya funktioner är prod-exkluderade by
# default. Använd ALDRIG bare `supabase functions deploy` (deployar alla).
# När en CI-deploy-pipeline byggs ska den respektera samma allowlist.
# Ursprung: tasks/sessions/archive/2026-05/2026-05-04-security-hardening.md §F.

project_id = "miranon-media-admin"

# Test-only endpoint för isolerad requireUser-testning.
# verify_jwt = false så att testerna kan nå requireUser för alla
# auth-deny-paths (saknad header, ogiltig JWT, anon-key) direkt.
# Annars fångar gateway:n saknad/ogiltig JWT innan helpern körs.
# Inert i prod — test-auth deployas aldrig dit.
[functions.test-auth]
verify_jwt = false

# Datafunktioner: gateway-första-försvar aktivt. requireUser läggs
# OVANPÅ i koden för defense-in-depth (anon-key, user-id-loggning).
[functions.get-events]
verify_jwt = true

[functions.get-persons]
verify_jwt = true

[functions.get-leads]
verify_jwt = true

[functions.get-registrations]
verify_jwt = true

# Per-anmälan-detaljshapen (task-18.17): single-get som återanvänder
# get-registrations läs-kärna (_shared/registration-read.ts).
[functions.get-registration]
verify_jwt = true

[functions.update-record]
verify_jwt = true

# create-admin-user: caller-verifiering läggs i M6 (requireUser +
# admin-email-allowlist). Pre-M6 ger verify_jwt = true gateway-
# första-försvar — men anon-key passerar (anon-key ÄR valid JWT)
# vilket är hela poängen med M6.
[functions.create-admin-user]
verify_jwt = true

# Anteckningar-vertikalen (task-18.11, ADR-075): läs- + skriv-EF mot den additiva
# Anteckningar-tabellen. Gateway-första-försvar aktivt; requireUser läggs OVANPÅ i
# koden (defense-in-depth). create-event-note sätter dessutom författaren server-side
# ur den verifierade JWT:ns user_metadata.display_name (spoof-säker attribution).
[functions.get-event-notes]
verify_jwt = true

[functions.create-event-note]
verify_jwt = true

# Person-anteckningsströmmen (S103, T97-bygg-spåret; ADR-075-tabellen utökad
# med ett Person-länkfält). Speglar get-event-notes/create-event-note EXAKT —
# samma additiva tabell, samma gateway-försvar, samma server-side-attribution.
# MEDVETET UTELÄMNADE ur .prod-functions-allowlist.conf tills vidare — ingen
# UI-yta konsumerar dem ännu (orkestreraren monterar D-varianten separat), och
# prod-EF-deploy är alltid en separat Marcus-auktoriserad handling (ADR-050/
# ADR-063), samma ordning som create-event-note höll innan sin egen prod-våg.
[functions.get-person-notes]
verify_jwt = true

[functions.create-person-note]
verify_jwt = true

# create-attendance — check-in-dörrens BACKUP-vägen (TASK-214.1, PRD task-214):
# skapar en Deltaganden-rad atomärt/idempotent när en anmälan möter dörren utan
# förskapad rad. Gateway-första-försvar aktivt; requireUser läggs OVANPÅ i
# koden (defense-in-depth).
#
# ALLOWLISTAD 2026-08-17 (S102 resume 8, Marcus GO). Här stod tidigare att
# funktionen var "MEDVETET UTELÄMNAD ur .prod-functions-allowlist.conf tills
# vidare — ingen UI-yta konsumerar den ännu (dörrlistans mutations-koppling är
# en senare skiva i samma PRD, task-214.2)". Det skälet var sant när det
# skrevs och FÖLL när task-214.2 landade 2026-08-14/15 (PR #1301, merge
# aca14cff) — appen anropar EF:en skarpt i dag (AirtableAdapter.ts:262 m.fl.).
# Kommentaren stod kvar och blev därmed en yta som ljög: utan allowlist-rad
# deployades funktionen aldrig, och dörrens backup-väg gav 404 i prod.
# Forensiken: backlog/tasks/task-269.
#
# Prod-EF-deploy är alltjämt en separat Marcus-auktoriserad handling
# (ADR-050/ADR-063) — allowlist-raden gör funktionen deploybar, inte deployad.
[functions.create-attendance]
verify_jwt = true

# invite-user (TASK-127.5, ADR-092/ADR-093): utlöser en Användarinbjudan.
# Samma resonemang som create-admin-user — gateway-första-försvar aktivt,
# men anon-key (valid JWT) passerar gatewayn, så requireUser +
# ADMIN_EMAILS-allowlisten i koden är det som faktiskt grindar anropet.
[functions.invite-user]
verify_jwt = true

# test-invite-completion — STAGING-ONLY testharness-EF (Väg A,
# docs/research/auth-invite-e2e-service-role-branschprecedent-2026-08-05.md
# § Rekommendation, Marcus-kvitterad 2026-08-05). Samma gateway-försvar som
# invite-user — requireUser + ADMIN_EMAILS-allowlisten i koden grindar
# faktiskt anropet, plus en adress-allowlist (se EF:ens fil-header).
# MEDVETET UTELÄMNAD ur .prod-functions-allowlist.conf — test-auth-
# precedenten. Rör inte den filen för denna post.
[functions.test-invite-completion]
verify_jwt = true

# test-pdf-generation — STAGING-ONLY testharness-EF (TASK-146.1, "Runtime-
# beviset"). Samma gateway-försvar som ovan — requireUser grindar faktiskt
# anropet, funktionen rör ingen data. MEDVETET UTELÄMNAD ur
# .prod-functions-allowlist.conf — test-auth-precedenten. Rör inte den filen
# för denna post. Existerar för att stänga en lucka research-passet
# (docs/research/utskicks-bilage-arkitektur-2026-08-03.md § Delfråga 3) öppet
# lämnade: pdf-lib mättes under Node som proxy, aldrig mot den skarpa Deno-
# baserade Edge Runtime. Se funktionens filhuvud för fullt resonemang.
[functions.test-pdf-generation]
verify_jwt = true

# test-attachments-storage — STAGING-ONLY testharness-EF (TASK-146.3,
# "Skiva: Privat bucket, path-form per event och signerad åtkomst"). Samma
# gateway-försvar som ovan — requireUser grindar faktiskt anropet, funktionen
# rör bara syntetiska testobjekt i en reserverad ZZ-TEST-EVENT--namnrymd
# (aldrig persondata). Existerar för att bevisa AC #2/#3/#4 som BETEENDE
# (en riktig signerad hämtning, en riktig gräns-uppladdning) i stället för
# konfiguration — SUPABASE_SERVICE_ROLE_KEY finns inte i CI, men varje
# deployad Edge Function får den auto-injicerad, samma väg
# test-pdf-generation redan valde för sitt runtime-bevis. MEDVETET
# UTELÄMNAD ur .prod-functions-allowlist.conf — test-auth-precedenten. Rör
# inte den filen för denna post. Se funktionens filhuvud för fullt
# resonemang.
[functions.test-attachments-storage]
verify_jwt = true

# [TASK-309.4, RIVET] test-docraptor-render (S108 MARCUS-SEKVENS punkt 3,
# ADR-119 beslut 7 "minimaltestet") stod tidigare här. ADR-125 § Beslut 5:
# dess mätinstrument-roll är övertagen av generate-event-attachment/index.ts:s
# `preview: true`-gren, som nu anropar riktiga DocRaptor genom
# `_shared/mall-render.ts` — ingen fristående proxy-EF behövs längre.

# test-static-files — STAGING-ONLY testharness-EF (TASK-309.1, "Skiva 0:
# minimaltest — bundlade mallfiler i en Edge Function via staging-deploy").
# Samma gateway-försvar som ovan — requireUser grindar faktiskt anropet.
# Mätinstrumentet för ADR-125 § Beslut 4:s obelagda premiss: bundlar
# `static_files` faktiskt via CLI:ts API-bundlingsväg (maskinen saknar
# Docker)? Läser en HTML- och en TTF-fil ur `_shared/mallar/` via globen
# nedan och rapporterar bytes + facit. Rör ingen data, ingen Storage.
# MEDVETET UTELÄMNAD ur .prod-functions-allowlist.conf —
# test-auth-precedenten. Rör inte den filen för denna post. Se funktionens
# filhuvud för fullt resonemang.
[functions.test-static-files]
verify_jwt = true
static_files = ["./functions/_shared/mallar/*"]

# Bilage-uppladdningens PRODUKTIONS-EF:er (TASK-146.4, PRD task-146
# "Bilage-fundamentet", ADR-057 lager-oberoendet). Till skillnad mot
# test-attachments-storage ovan är dessa TRE ALLMÄNGILTIGA — inte
# staging-only testharnesses — men de är MEDVETET UTELÄMNADE ur
# .prod-functions-allowlist.conf i denna leverans (samma Fas 7-deploy-
# skuld-mönster som redan täcker flera BEFINTLIGA produktions-EF:er, t.ex.
# get-attendance/create-registration/update-event — se .prod-functions-
# allowlist.conf:s egen header). Prod kräver dessutom att Bilagor-tabellen
# (TASK-146.2) och bucketen "bilagor" (TASK-146.3) provisioneras där
# FÖRST, per samma miljö-ordning (fält/tabell FÖRE EF) som create-event-note.
#
# upload-attachment — mönster 1 (AC #3): bytesen i request-body, skrivs med
# service-role + en Bilagor-metadatarad i samma operation.
[functions.upload-attachment]
verify_jwt = true

# create-attachment-upload-ticket — mönster 2, steg 1 (AC #4): utfärdar ett
# tidsbegränsat, path-scopat uppladdningstillstånd. Bytesen passerar aldrig
# denna funktion.
[functions.create-attachment-upload-ticket]
verify_jwt = true

# finalize-attachment-upload — mönster 2, steg 2: verifierar att objektet
# faktiskt landade på den server-deriverade platsen och skriver Bilagor-
# metadataraden med lagringens FAKTISKA storlek.
[functions.finalize-attachment-upload]
verify_jwt = true

# generate-event-attachment — TASK-146.5 "Klass B — event-mallad generering
# ur systemmall" (PRD task-146, bilage-fundamentet). Till skillnad mot
# test-pdf-generation/test-attachments-storage ÄR detta INGEN test-only
# harness — den genererar en riktig "Deltagarinformation"-PDF ur en
# hårdkodad systemmall och skriver den som en riktig Bilagor-rad (samma
# fältform som en uppladdad bilaga, se index.ts § AC #4). requireUser
# grindar faktiskt anropet — samma nivå som create-event-note/create-event
# (ingen extra ADMIN_EMAILS-gate, ingen kontohantering). MEDVETET
# UTELÄMNAD ur .prod-functions-allowlist.conf tills vidare: ingen UI-yta
# anropar den ännu (Åtgärds-sidan/bilageväljaren är PRD:ns kort 3) —
# fail-closed default (samma resonemang som .prod-functions-allowlist.conf
# § header) tills en verklig konsument finns. Se funktionens filhuvud för
# fullt resonemang, inklusive samtidighets-noten om TASK-146.4.
[functions.generate-event-attachment]
verify_jwt = true

# send-action-email — TASK-147.1 "Sändvägs-EF:n" (PRD task-147, Åtgärds-
# sidan), ADR-067-revisionen. Repots SJUNDE write-vertikal, TREDJE mail-
# vertikal. [RÄTTAT, TASK-147.5] Denna posten saknades sedan 147.1s
# landning — funktionen har körts mot staging (verifierad 401-svarande,
# se PR-historiken/kortets notes) utan en config.toml-post, vilket är en
# dokumentations-/audit-lucka, inte ett funktionsfel (Supabase-plattformens
# egen default är verify_jwt=true, samma värde denna posten sätter
# explicit). Fylld i här eftersom TASK-147.5 rör funktionen tungt (den
# bilage-bärande grenen) — samma "cheap-to-fix, adjacent"-motiv som andra
# småfixar i denna landning. requireUser grindar OVANPÅ, samma
# defense-in-depth-nivå som send-registration-confirmation/send-email.
[functions.send-action-email]
verify_jwt = true

# get-event-attachments — TASK-147.5 "Bilage-bärande sändvägen + bilage-
# väljaren skarp" (PRD task-147). LÄSER bara: eventets Bilagor-rader via
# den omvända länken (SAMMA form som get-event-notes). Gateway-första-
# försvar aktivt; requireUser läggs OVANPÅ i koden (defense-in-depth).
# MEDVETET UTELÄMNAD ur .prod-functions-allowlist.conf tills vidare —
# samma "ingen UI-yta i prod ännu"-resonemang som generate-event-attachment
# ovan: hela TASK-147-arket (send-action-email inkluderat) körs mot
# staging, ingen del av det är prod-deployad.
[functions.get-event-attachments]
verify_jwt = true

# send-receipt-email — TASK-147.7 "Kvittogenereringen med nummerserien"
# (PRD task-147, ADR-109). Repots ÅTTONDE write-vertikal, FJÄRDE mail-
# vertikal. EN mottagare, EN betalning per anrop — allokerar kvittonumret
# server-side (samtidighetssäkert, `_shared/receipt-numbering.ts`), bygger
# PDF:en (pdf-lib) och sänder via Resends singel-endpoint (samma mekanik
# som send-action-email/index.ts § makeRealSingleSender, TASK-147.5).
# requireUser grindar anropet, samma nivå som send-action-email.
# MEDVETET UTELÄMNAD ur .prod-functions-allowlist.conf tills vidare —
# samma "ingen UI-yta i prod ännu"-resonemang som generate-event-attachment/
# send-action-email ovan: hela TASK-147-arket körs mot staging.
[functions.send-receipt-email]
verify_jwt = true

# log-activity — aktivitetsloggens skrivväg (TASK-201.3, ADR-110/ADR-111).
# requireUser grindar anropet (samma nivå som send-receipt-email); skriver
# via service_role till Supabase Postgres `activity_log`, HELT UTANFÖR
# Airtable (aktivitetsloggen har aldrig legat där — ADR-110). Deploy: BARA
# denna funktion (`supabase functions deploy log-activity`), aldrig en full
# allowlist-deploy medan andra agenter kan arbeta mot samma projekt.
[functions.log-activity]
verify_jwt = true

# get-activity-log — Aktivitetsloggens läsväg (TASK-201.5, PRD TASK-201,
# ADR-110/ADR-111). LÄSER bara, direkt ur Postgres-tabellen `activity_log`
# (INGEN Airtable-interaktion) via `service_role` — samma gateway-första-
# försvar som övriga läs-EF:er; requireUser läggs OVANPÅ i koden. STÅR i
# .prod-functions-allowlist.conf (rad ~56, TASK-201.9, Marcus GO "GO! Kör
# bara!" 2026-08-13) — raden ovan (t.o.m. S105, 2026-08-14) sa MEDVETET
# UTELÄMNAD, vilket motsade den filen rakt av. Prod-driftsättningen var
# TASK-201.9s egna, separata skiva (samma "ingen UI-yta i prod ännu"-
# resonemang som send-receipt-email/generate-event-attachment ovan) — den
# skivan är nu genomförd, och allowlisten är sanningen.
[functions.get-activity-log]
verify_jwt = true

# delete-attachment — TASK-147.11 "Äkta ersätt och radera för bilagor" (PRD
# task-147, uppföljning av task-147.6:s fynd 3: adaptern saknade delete/
# replace helt). Repots ANDRA delete-operation (LedgerRemover,
# `_shared/receipt-numbering.ts`, TASK-147.7, var den FÖRSTA). Gateway-
# första-försvar aktivt; requireUser + en ägarskaps-guard (bilagans Event-
# länk måste matcha det angivna eventId:t) läggs OVANPÅ i koden. STÅR i
# .prod-functions-allowlist.conf (TASK-147.11, 2026-08-16, Marcus-GO) —
# allowlist-posten är bokföring inför en KOMMANDE Marcus-auktoriserad
# prod-deploy (kortets AC #4), ingen prod-operation är utförd av denna rad.
[functions.delete-attachment]
verify_jwt = true

# ─────────────────────────────────────────────────────────────────────────
# AUTH — Användarinbjudan + auth-mail (T95 Spår B, TASK-127.4)
#
# Versionerar de delar av auth-mall-konfigurationen som plattformen faktiskt
# exponerar via config.toml + `supabase config push` — verifierat mot
# installerad CLI 2.111.0:s egen scaffold (`supabase init`) och
# `cli_v1_config.yaml`-specen (context7 /supabase/supabase, 2026-08-03).
# TRE saker är MEDVETET inte här:
#
#   1. SMTP-lösenordet (Resend API-nyckel) — secret, refereras via env(),
#      värdet lever ALDRIG i repot (CLAUDE.md: Chat rör ALDRIG secret).
#      Rekommendation: en EGEN Resend-nyckel för SMTP-relän, skild från
#      RESEND_API_KEY (bulk-mail-vägen, T55/Grind F) — PRD:n kräver att
#      auth-mail och bulk-mail aldrig blandas ihop; samma princip bör gälla
#      credentials, inte bara kod-vägen.
#   2. DNS-poster (MX/SPF/DKIM för send.miranon.dev, DMARC på miranon.dev)
#      — lever i GoDaddy, utanför Supabase/repo-domänen helt. Exakt form:
#      T46-kartans Grind 0-checklista.
#   3. ✅ LÖST (TASK-127.7): återställnings-sidans route är `/nytt-losenord`
#      (begär-sidan är `/glomt-losenord`, kräver ingen egen redirect-URL —
#      Supabase navigerar dit aldrig, bara TILL den efter mail-länken).
#      Tillagd i additional_redirect_urls nedan. `supabase config push`
#      krävs fortfarande innan värdet är skarpt på staging/prod — se
#      slutrapporten för denna skiva.
#
# ✅ AVGJORD 2026-08-05 (S96) — frågan nedan stod öppen tills en skarp push
# kördes. Den är nu körd, och hypotesen BEKRÄFTADES: `supabase config push` ÄR
# deklarativ, och fält som inte står här nollställs till CLI-scaffoldens
# default. Första pushen mot staging ändrade 22 av 242 fält; SEX var
# oavsiktliga regressioner (se [auth]-blockets varning nedan för listan).
# Det finns fortfarande inget `config pull` och ingen `--dry-run` — MEN CLI:t
# skriver ut en fullständig diff före bekräftelsen, och den är den enda
# förhandsgranskning som existerar. LÄS DEN VARJE GÅNG.
#
# Exekveringsordningen ur T46-kartan gäller alltjämt och bevisade sitt värde:
# STAGING FÖRST, förebild TAGEN FÖRE, diff mot den EFTER. Förebilden hämtas
# bäst ur Management API (`GET /v1/projects/<ref>/config/auth`, 242 fält)
# snarare än som skärmdumpar — då blir efterkontrollen en maskinell diff i
# stället för en ögonjämförelse.
#
# För ETT ELLER TVÅ enskilda fält är en riktad `PATCH` mot samma endpoint
# säkrare än en full push: prod-ändringen 2026-08-05 (site_url + signup) rörde
# 3 fält av 242, med samtliga känsliga fält verifierat oförändrade.
# ─────────────────────────────────────────────────────────────────────────

[auth]
# VARNING — `supabase config push` ÄR DEKLARATIV. Varje fält som INTE står i
# denna fil skrivs till CLI-scaffoldens defaultvärde på fjärrprojektet, oavsett
# vad som är satt i dashboarden. Det är inte en teoretisk risk: den första
# skarpa pushen mot staging (2026-08-05, S96) ändrade 22 av 242 fält, varav
# SJU var oavsiktliga regressioner — MFA/TOTP stängdes av, e-postbekräftelsen
# stängdes av, OTP-längden kortades 8→6 och mail-frekvensspärren gick 60s→1s.
# Fälten nedan är därför INTE "extra konfiguration" — de är LÅS mot regression.
# Lägg aldrig till ett värde i dashboarden utan att också låsa det här.
# Mätunderlag: T46 § Grind 0 punkt 6:s säkerhetsnot (som denna mätning belade).

# Redirect-målet för Användarinbjudans accept-sida (`/valkommen`, ADR-092)
# samt glömt-lösenord-flödets landningssida (`/nytt-losenord`, TASK-127.7) —
# dit `resetPasswordForEmail`s `redirectTo` pekar klientsidan
# (src/routes/glomt-losenord.tsx). Utan denna post faller Supabase tyst
# tillbaka på bar `site_url` (ingen path), och länken i mailet hade landat
# fel — GoTrue ger inget fel, den ignorerar bara redirectTo (verifierat mot
# Supabase-dokumentationen, se den routens filhuvud).
additional_redirect_urls = [
  "https://admin.miranon.dev/valkommen",
  "https://admin.miranon.dev/nytt-losenord",
]

# STAGING BÄR ETT TREDJE VÄRDE SOM MEDVETET INTE STÅR HÄR:
# `http://localhost:5173/**`, satt 2026-08-05 (S96) via riktad PATCH mot
# Management API (1 fält av 242 ändrat, maskinellt diffat; prod omläst och
# verifierat ORÖRD i samma pass).
#
# Varför det inte kan låsas i denna fil: `config.toml` är EN fil för BÅDA
# projekten, och `config push` är deklarativ. En localhost-post här hade
# hamnat i PRODUKTIONENS redirect-allowlist vid nästa push mot prod — en
# öppning som inte har där att göra. Fältet är alltså per definition
# miljöspecifikt, och CLI:t har ingen miljöskillnads-mekanism.
#
# Konsekvensen, öppet: en framtida `supabase config push` mot STAGING
# NOLLSTÄLLER localhost-posten (deklarativ push, se varningen ovan), och
# `TASK-127.9`:s rundturs-e2e slutar då fungera tyst — GoTrue ger inget fel,
# den ignorerar bara `redirectTo`. Sätt tillbaka den med samma riktade PATCH.
# Samma ej-låsbara klass som `password_hibp_enabled` nedan.
#
# Vad posten är till för: `chromium-authenticated`-projektet
# (playwright.config.ts rad 407) kör staging-e2e mot en lokal dev-server på
# port 5173 — samma rigg som elva redan gröna `tests/e2e/*.staging.test.ts`.
# Utan ett redirect-mål som matchar den servern kan inbjudningslänken inte
# följas tillbaka in i appen. Wildcard-formen `/**` är Supabases egen
# dokumenterade konvention för just detta (deras config-as-code-exempel visar
# `http://localhost:3000/*/*` sida vid sida med en Vercel-preview-wildcard).

# Default-adressen Supabase Auth sätter i ALLA mail som saknar explicit
# redirect. CLI-defaulten är `http://127.0.0.1:3000` och både staging och prod
# stod på `http://localhost:3000` — en utvecklingsadress som aldrig ändrades
# sedan projekten skapades. En inbjudningslänk med det värdet pekar på
# MOTTAGARENS egen dator och är därmed död för varje användare. Domänen är
# fixerad av ADR-091 (`admin.miranon.dev`).
site_url = "https://admin.miranon.dev"

# LÅS. Självregistrering STÄNGD — konton skapas enbart via Användarinbjudan
# (ADR-092), som beskriver ett naivt signup-flöde som "en öppen
# account-takeover-väg". Stod `true` i BÅDA miljöerna som en kvarglömd
# CLI-/plattformsdefault, aldrig som ett val; stängd i prod 2026-08-05 på
# Marcus beslut (S96). CLI-defaulten är `true`, så utan denna rad öppnar nästa
# `config push` registreringen igen — tyst.
enable_signup = false

# LÅS. Lösenordsgolvet. Både staging och prod stod på CLI-defaulten `6` medan
# appens egen kontroll kräver 8 (`src/routes/nytt-losenord.tsx` rad 177, med
# ASVS 6.2.1 som referens i filhuvudet). Servern var alltså SVAGARE än UI:t —
# klient-side-kontroller kan kringgås, så det verkliga golvet var 6.
# Höjt till 8 i båda miljöerna 2026-08-05 (S96) via riktad PATCH mot
# Management API; denna rad är låset som hindrar nästa `config push` från att
# ta ner det till 6 igen.
minimum_password_length = 8

# KÄND KANT — HIBP GÅR INTE ATT LÅSA HÄR. `password_hibp_enabled` (kontroll
# mot läckta lösenord via haveibeenpwned) är satt `true` i BÅDA miljöerna
# 2026-08-05 (S96), men CLI 2.75.0:s config-scaffold saknar fältet helt
# (verifierat med `supabase init` i en tom katalog: noll träffar på "hibp").
# Det kan därför varken låsas eller versionshanteras här. Innan nästa
# `config push` MÅSTE CLI:ts diff läsas för att se om pushen rör fältet —
# diffen är enda förhandsgranskningen som finns.

[auth.mfa.totp]
# LÅS. Båda stod `true` på staging före första pushen; CLI-defaulten är
# `false` för båda, så en push utan dessa rader STÄNGER AV TOTP-baserad
# tvåfaktor. Auth-faktor-strategin ägs av ADR-093 — en tyst avstängning här
# river ett fattat beslut utan att någon ser det.
enroll_enabled = true
verify_enabled = true

[auth.email]
# 24 timmar — plattformens verifierade TAK (inte ett önskat värde). Detta
# ÄR dashboardens "Email OTP Expiration" — EN global inställning för ALLA
# e-postlänkar (invite, recovery, magic link m.fl.), verifierat mot
# supabase.com/docs/guides/auth/auth-email-passwordless och matchande
# CLI-defaultens dokumenterade betydelse (3600s = "1 timme" = samma
# semantik som dashboardens defaultvärde). Se ADR-092 § Kontext + S95 Del 2
# beslut 7.
otp_expiry = 86400

# LÅS (samtliga tre) — stod så här på staging före första pushen, och
# CLI-defaulten är svagare på var och en. Utan dessa rader nollställs de.
#
# enable_confirmations: CLI-default `false` ⇒ e-postbekräftelse stängs AV och
#   användare kan logga in utan att ha bevisat att adressen är deras. Mätt:
#   `mailer_autoconfirm` gick False → True vid första pushen.
# max_frequency: CLI-default `"1s"` mot fjärrprojektets 60s — spärren mot
#   upprepade utskick till samma adress. 1s är i praktiken ingen spärr alls,
#   och gör invite-/reset-flödet till ett bekvämt spam-verktyg.
# otp_length: CLI-default `6` mot fjärrprojektets 8. Kortare engångskod =
#   mindre sökrymd att gissa i. Roger granskar auth-ytan som fd.
#   cybersäkerhetsexpert; en tyst nedgradering hör inte hemma här.
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

# Custom SMTP mot Resend, sändande subdomän send.miranon.dev (S95 Del 2
# beslut 3+4; T46-kartans Grind 0-paket punkt 6). Endast lösenordet är
# hemligt — host/port/avsändare är offentlig konfiguration (mottagaren ser
# dem ändå i mailhuvudet) och versioneras här. Kräver att send.miranon.dev
# är verifierad i Resend FÖRST (Grind 0-paketets punkt 4) — Resend
# avvisar leverans utan verifierad domän oavsett SMTP-uppgifter.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(AUTH_SMTP_PASS)"
admin_email = "konto@send.miranon.dev"
sender_name = "Miranon Media"

# Användarinbjudan (ORDLISTA.md § Användarinbjudan — "invite" undviks
# medvetet i UI-/mailtext). Copy + tillgänglighets-/färgmotivering:
# supabase/templates/invite.html.
[auth.email.template.invite]
subject = "Ditt konto hos Miranon Media"
content_path = "./supabase/templates/invite.html"

# Glömt lösenord / återställning. TASK-127.7 bygger själva flödet men
# mallen hör till repo-sidan och AC#1 omfattar den uttryckligen — förbereds
# här. Copy: supabase/templates/recovery.html.
[auth.email.template.recovery]
subject = "Återställ ditt lösenord — Miranon Media"
content_path = "./supabase/templates/recovery.html"

# LÅS, VERIFIERAD (TASK-144, 2026-08-05). Prod saknade båda mallarna helt
# fram till denna skiva — Supabase-defaults på engelska ('You have been
# invited' / 'Reset Your Password'). En riktad PATCH mot Management API
# (aldrig `config push` — se varningen i [auth]-blocket ovan) deployade
# invite+recovery-mallens subject+content_path hit: 4 fält av 242 ändrade på
# prod, maskinellt diffat före/efter, noll oavsiktliga träffar. Staging bar
# sedan tidigare invite-mallens FÖRE-TASK-143-läge (utan
# {{ .Data.display_name }}/{{ .Data.inviter_name }}) — uppdaterad i samma
# svep till filens aktuella innehåll (1 fält av 242 på staging).
#
# LÅSNINGEN ÄR BEVISAD, INTE ANTAGEN: `supabase config push` kört mot
# staging (indata "n" pipead, ALDRIG bekräftad — se AC#3-utredningen i
# TASK-144:s slutrapport) svarade "Remote Auth config is up to date" efter
# ovanstående sync, dvs NOLL diff mellan detta config.toml och det levande
# projektet. En efterkontroll mot Management API bekräftade dessutom att
# ingen av de 242 fälten rörde sig av push-anropet. Det bevisar att
# [auth.email.template.invite]/[recovery] verkligen ÄR mekanismen som håller
# mallarna låsta mot nästa push — inte bara en dokumentationstext utan effekt.
#
# ENDAST DESSA TVÅ AV 13 MAILER-MALLTYPER ÄR LÅSTA HÄR, MEDVETET. Åter-
# stående mailer_subjects_*/mailer_templates_*-par (confirmation,
# email_change, magic_link, sju notification-mallar, reauthentication) är
# INTE varumärkta eller svenska på NÅGON miljö — de skiljer sig mellan
# staging och prod bara i VILKEN engelsk default-text-ögonblicksbild som
# frusit historiskt (Management API:s `mailer_*_custom_contents`-flaggor
# visar samtliga 13 som "custom"/fryst på prod, men bara invite+recovery
# som custom på staging — resten är plattformens NUVARANDE, ospärrade
# default där). Att kopiera stagings version av de 11 in i prod hade bytt
# en engelsk formulering mot en annan OCH låst fast dem i en godtycklig
# ögonblicksbild, utan Roger/Lotta-värde och utanför detta korts mandat.
# Mätt 2026-08-05 mot Management API (242 fält, båda miljöerna).
