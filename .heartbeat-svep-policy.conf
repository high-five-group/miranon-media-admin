# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/heartbeat-svep.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears
# unused") slår som falskt positiv. Disable är fil-nivå och avsiktlig —
# samma form som .ci-wait-policy.conf och .staging-semaphore-policy.conf.

# .heartbeat-svep-policy.conf
#
# Per-projekt config för scripts/heartbeat-svep.sh (TASK-119). Skriptets
# LOGIK är universell (kan dupliceras till andra spokes utan refactor);
# VÄRDENA här är projekt-specifika. Samma hub-spoke-portabilitet som
# .ci-wait-policy.conf, .staging-semaphore-policy.conf,
# .checklist-policy.conf, .frontmatter-policy.conf och .lesson-policy.conf
# (Lesson #6, UNIVERSAL).
#
# === Duplicera till nytt spoke (2 steg) ===
# 1. cp scripts/heartbeat-svep.sh + denna fil till nytt repo
# 2. Sätt HEARTBEAT_REPO till "ägare/reponamn" för det nya repot
#
# Källa: TASK-119 (heartbeaten var en hand-startad bakgrunds-bash utan
# mekanik eller config — se scripts/heartbeat-svep.sh § VARFÖR SKRIPTET FINNS)

# === Repot heartbeaten bevakar ===
# "ägare/namn" — krävs av `gh pr list --repo` / `gh api graphql`, som INTE
# har någon `{owner}/{repo}`-auto-upplösning för denna typ av anrop (den
# platshållaren finns bara för `gh api`-URL-sökvägar, inte för GraphQL-
# variabler). Fail-closed utan värdet: skriptet vägrar hellre än att gissa
# repo ur cwd.
HEARTBEAT_REPO="high-five-group/miranon-media-admin"

# === Bas-grenen landningarna går mot ===
# Rör CLAUDE.md § Landning: all landning går mot main via merge queue.
HEARTBEAT_BRANCH="main"

# === Pollintervall i loop-läget (sekunder) ===
# CLAUDE.md § Landning, "Svep vid varje väckning": "en persistent
# heartbeat-monitor pollar PR-läget (~90 s)". Branschprecedent (GitHubs
# egen self-hosted-runner: 15–60 s backoff; Buildkite/CircleCI: polling utan
# angivet intervall) och rate-limit-mätning (0,8 % av 5000/h-budgeten vid
# 90 s, mätt 2026-08-02) ligger båda i
# docs/research/orkestrerar-vackning-polling-vs-event-driven-2026-08-02.md.
HEARTBEAT_INTERVAL=90

# === Total löptid för loop-läget i sekunder ===
# 0 = obegränsat — den avsedda formen när skriptet körs som en persistent
# bakgrunds-monitor (startas i en Code-sessions bakgrunds-bash, monteras med
# Monitor-verktyget). Ett positivt tal används av testsviten och av den som
# vill bounda en enskild körning.
HEARTBEAT_TIMEOUT=0

# === Tak för antal öppna PR:ar hämtade per svep ===
# Teknisk säkerhetsgräns, inte ett projekt-specifikt värde i sig — men
# konfigurerbar av samma skäl som STAGING_CI_RUN_LIMIT i
# .staging-semaphore-policy.conf: repots faktiska kö-djup är litet (sällan
# mer än en handfull samtidiga PR:ar), 100 ger bred marginal utan att
# hårdkoda antagandet i skriptet.
HEARTBEAT_PR_LIMIT=100

# === PR-författare vars öppna PR:ar ALDRIG larmar som ARMERINGS-KANDIDAT ===
#
# VARFÖR: fyra Dependabot-PR:ar (#632–#635) väntar medvetet på Marcus
# beslut om att bjudas in (S97 sessionsdok § "Ej i scope"). De ÄR
# tekniskt CLEAN utan aktiv auto-merge-begäran — precis kandidat-villkoret
# — och larmade därför VARJE svep (level-triggered per L443, alltså var
# 90:e sekund så länge de stod öppna). Svepet har rätt i sak men kan inte
# ur ett statiskt API-svar skilja "medvetet parkerad" från "glömd eller
# utsparkad" utan hjälp utifrån.
#
# FORMVAL: FÖRFATTAR-baserad (author.login), INTE etikett-baserad.
# Etikett var förstahandsvalet men FALSIFIERADES mot .github/dependabot.yml
# (läst före detta val gjordes): npm-ekosystemet sätter etiketten
# "dependencies" (raden med `labels:` under den npm-posten), men
# github-actions-ekosystemet sätter "ci" (samma fält, den andra posten) —
# SAMMA bot, TVÅ olika etiketter beroende på vilken dependabot.yml-post som
# skapade PR:en. En ren etikett-lista hade antingen (a) missat
# github-actions-PR:ar helt, eller (b) behövt inkludera "ci" också — vilket
# öppnar en läcka: en människas PR taggad "ci" av andra skäl hade tystats
# felaktigt. Kravet "en genuint glömd PR från en människa MÅSTE fortfarande
# larma" utesluter (b); (a) är i sig en stale-lista-risk kortet ber oss
# undvika.
#
# author.login är stabilt över BÅDA ekosystemen utan extra bokföring —
# Dependabot-PR:ar bär samma bot-identitet oavsett vilken dependabot.yml-
# post som skapade dem, så en ny Dependabot-PR (nästa vecka, nästa
# ekosystem) kräver INGEN ändring här. Verifierat LIVE 2026-08-04 mot
# high-five-group/miranon-media-admin: `gh api graphql` med
# `author { login __typename }` på PR #632 gav
# {"login":"dependabot","__typename":"Bot"} — exakt samma GraphQL-fråga
# skriptet kör. (OBS: REST-yta `gh pr list --json author` normaliserar
# samma bot till "app/dependabot" — de två API:erna skiljer sig. Skriptet
# använder uteslutande GraphQL, så "dependabot" är rätt värde HÄR; en
# framtida REST-baserad omskrivning måste räkna om detta.)
#
# GRÄNS: undantaget gäller ENDAST armerings-kandidat-vägen. En
# Dependabot-PR som genuint går RÖD (trasig CI) eller DIRTY (konflikt)
# larmar OFÖRÄNDRAT — författar-undantaget tystar bara "ingen aktiv
# auto-merge-begäran", aldrig ett verkligt trädfel.
#
# SESSIONSLÄGE (`--session <ID>`, TASK-462, review runda 1 fynd 2,
# Marcus-beslut 2026-09-19): "larmar OFÖRÄNDRAT" ovan gäller ORDAGRANT utan
# --session (dagens beteende, se § "Sätt 0..." nedan) och MED --alla — men i
# sessionsläge går en undantagen författares RÖTT/DIRTY via en ANNAN,
# INFORMATIV kanal (dependabot_status_notis_om_dags(), taktad av
# HEARTBEAT_OMARKERAD_INTERVALL nedan), inte det vanliga larmet: den bär
# ALDRIG en bitmask-bit i DENNA sessions verdikt (Dependabot-PR:ar ägs inte
# av den som råkar köra svepet), men blir heller aldrig helt tyst. Fram till
# review runda 1 blev den TYST i sessionsläge — den genuina bugg fyndet
# fångade.
#
# PER SESSION SEDAN REVIEW RUNDA 3 (Marcus-beslut 2026-09-19): "blir heller
# aldrig helt tyst" ovan höll bara INOM en session fram till denna runda —
# funktionens statsfil var MASKIN-GLOBAL (delad /tmp/mm-heartbeat-svep),
# så en session VARS SVEP kom EFTER en annan sessions redan kunde hitta
# fönstret konsumerat och stå tyst under HELA sin egen körning, aldrig se
# notisen ens en gång (samma bugg-klass som TIPS-raden, se
# scripts/heartbeat-svep.sh § SESSIONSMEDVETET SVEP "KÄND BEGRÄNSNING").
# Fixat: statsfilen bär nu sessionens saniterade ID när --session är givet
# (session_id_sanitize(), scripts/heartbeat-svep.sh) — eftersom denna
# funktion ALDRIG kör utan sessionslage=1, är den ALLTID sessions-scopad
# när den faktiskt avfyrar. "Blir heller aldrig helt tyst" är alltså nu
# sant BÅDE inom och mellan sessioner.
#
# SYNLIGHET: en undantagen PR skrivs som en RUTIN-rad (dämpas av --quiet,
# precis som resten av "N granskade"-sammanfattningen) — INTE som ett
# larm. Skälet är att göra båda felen omöjliga samtidigt: ett bitmask-larm
# var 90:e sekund för samma fyra medvetet parkerade PR:ar hade återinfört
# exakt den brus-klass detta fynd finns för att åtgärda, men fullständig
# tystnad hade gjort en parkerad PR till ett omärkt T108-tillstånd (ett
# tillstånd utan bevakare) om den glöms bort för alltid. En rutin-rad ger
# synlighet vid varje ointressant (--quiet av) körning utan att tvinga
# fram återkommande åtgärd i en obevakad bakgrundsloop.
#
# Tom eller odefinierad ⇒ dagens beteende (fail-open): ingen PR tystas.
HEARTBEAT_EXEMPT_AUTHORS=(
    "dependabot"
)

# === Gles gren-städning: hur ofta, i sekunder (TASK-323) ===
#
# 0 eller osatt ⇒ AV. Skriptet bär samma default (fail-CLOSED, till skillnad
# från HEARTBEAT_EXEMPT_AUTHORS ovan som är fail-open) — en spoke-kopia av
# heartbeat-svep.sh utan denna rad raderar aldrig någon gren. Skälet till att
# just denna mekanism vänder riktningen: ett osatt undantag tystar ett larm,
# ett osatt intervall skulle RADERA GRENAR ingen bett om.
#
# VAD DEN GÖR: var N:e sekund (som mest) anropar svepet
# scripts/stada-grenar.sh --utfor, som raderar LOKALA grenar mergade i
# bas-grenen — aldrig med -D, bakom sina fyra egna skydd (bas-gren, aktuell
# gren, uppcheckad i någon worktree, skyddslista). Se det skriptets huvud.
#
# VARFÖR 1800 (30 min):
#   ÅTERVÄXTEN är ~49 grenar/dygn ≈ 2/timme under fleet-drift
#   (docs/research/backlog-kortskapandets-flaskhals-2026-08-26.md
#   § Återväxten). Ett 30-minutersfönster håller populationen nära
#   noll-tillväxt utan att köra oftare än skulden byggs.
#   KOSTNADEN är mätt, inte gissad: 2026-08-28 tog en torrkörning över 193
#   grenar 23,4 s i denna klon. Vid 90 s (svepets eget intervall) hade det
#   ätit ~26 % av varje cykel och fördröjt larm; vid 1800 s är det ~1 %, och
#   sjunker snabbt eftersom kostnaden följer grenantalet — som städningen
#   själv håller nere.
#   BACKLOG-KOLLISIONEN (Backlog.md retryar två gånger och kastar först på
#   tredje störda laddningen) blir försumbar vid det tidsförhållandet, och
#   en ID-kollision är strukturellt omöjlig: bara MERGADE grenar rörs, och
#   deras kort ligger redan i backlog/tasks/ på main. Fullt resonemang i
#   scripts/heartbeat-svep.sh § FEMTE VÄGEN.
#
# Sätt 0 för att stänga av städningen utan att röra svepets övriga vägar.
HEARTBEAT_STADA_GRENAR_INTERVALL=1800

# === Per-session-statsfilernas max-ålder, i DAGAR (review runda 4 fynd 2,
#     Marcus-beslut 2026-09-19) ===
#
# STATE_DIR växer med EN fil per unikt session-ID sedan review runda 3
# (scripts/heartbeat-svep.sh SESSION_STATE_SUFFIX) — utan denna rad hade den
# vuxit obegränsat. PIGGYBACKAR på gren-städningens klocka OVAN
# (HEARTBEAT_STADA_GRENAR_INTERVALL/STADA_STATE_FILE) — INGEN egen klocka,
# se scripts/heartbeat-svep.sh stada_grenar_om_dags(). Raderar
# omarkerad/dependabot-notisernas per-session-statsfiler äldre än detta
# antal DAGAR (inte sekunder — ett annat kriterium än gren-städningens
# merge-status, därför ett eget tal i en annan enhet).
#
# Skiljer sig från HEARTBEAT_STADA_GRENAR_INTERVALL: 0 stänger av DENNA
# rensning specifikt (gren-städningen fortsätter oförändrad om den är på),
# inte hela klockan. Fail-safe-mot-SYNLIGHET-riktningen spelar ingen roll
# här — en state-fil som blir kvar en extra period kostar disk, aldrig ett
# missat larm (RÖTT/DIRTY/ARMERINGS-KANDIDAT rörs aldrig av detta).
#
# 30 DAGAR: samma ordning som HEARTBEAT_STADA_GRENAR_INTERVALLs eget
# 30-MINUTERS-resonemang skalat till en långsammare skuld — en sessions
# state-fil är irrelevant så fort sessionen är slut, men "slut" har ingen
# egen signal svepet ser, så ett generöst fönster (en typisk sessions
# livslängd är timmar, inte veckor) håller disk-avtrycket nära noll utan
# att riskera att radera en fil en fortfarande pågående, ovanligt långlivad
# session ännu använder.
HEARTBEAT_SESSION_STATE_MAX_DAGAR=30

# === Sessionsmedvetet svep: hur ofta de stämplade ALLTID-PÅ-notiserna får
#     upprepas, i sekunder (TASK-462) ===
#
# Gäller bara i sessionsläge (`--session <ID>` — se
# scripts/heartbeat-svep.sh § SESSIONSMEDVETET SVEP), MED ETT UNDANTAG:
# tips_notis_om_dags() (review runda 1 fynd 1) återanvänder SAMMA värde för
# sitt eget, oberoende taktade tips (egen state-fil) — det gäller alltså
# ÄVEN när varken --session eller --alla ges, eftersom det är exakt det
# läget tipset finns för att upptäcka. Tre notiser delar i dag denna
# EN config-ratt, var och en med sin egen state-fil (oberoende stämplar,
# och sedan review runda 3 dessutom PER SESSION för de två första — se
# scripts/heartbeat-svep.sh § SESSIONSMEDVETET SVEP "KÄND BEGRÄNSNING" för
# varför den tredje inte kan bli det):
#   1. omarkerad_notis_om_dags()        — en PR utan sessionsmarkör alls
#   2. dependabot_status_notis_om_dags() — en HEARTBEAT_EXEMPT_AUTHORS-
#      författares RÖTT/DIRTY (review runda 1 fynd 2)
#   3. tips_notis_om_dags()             — se ovan; ALLTID global (kör bara
#      när SESSION saknas, så det finns inget ID att skopa mot)
# En öppen PR utan NÅGON sessionsmarkör alls (bygg-agenten glömde flaggan,
# eller PR:en är äldre än TASK-462) får aldrig bli tyst (AC #3) — men larmar
# heller inte var 90:e sekund. Skriptets EGNA default (satt FÖRE denna fil
# läses) är redan 1800, så denna rad är en dokumenterad KOPIA av det värdet,
# inte ett annat val — repot har ingen anledning (ännu) att avvika från
# skriptets egen default. Skälet till att default är PÅ (till skillnad från
# HEARTBEAT_STADA_GRENAR_INTERVALL ovan, som defaultar AV): en ny
# säkerhetsrelevant SIGNAL ska vara synlig som default, en ny DESTRUKTIV
# handling ska vara av som default — motsatta risker, motsatt riktning.
#
# Sätt 0 för att göra ALLA TRE notiserna så täta som svepets eget intervall
# (90s) — INTE för att stänga av dem; AC #3 tillåter ingen "av"-position.
HEARTBEAT_OMARKERAD_INTERVALL=1800

# === Öppna ci-post-merge-/nattärenden: tak per gh issue list-fråga
#     (TASK-479.2, SE16) ===
#
# Teknisk säkerhetsgräns, samma motivering som HEARTBEAT_PR_LIMIT ovan — inte
# ett projekt-specifikt värde i sig. 50 matchar `post-merge.yml`s EGEN
# --limit för samma etikett (§ Dedup i den filen); repots faktiska
# öppna-ärende-djup är litet (mätt 2026-09-19: 4 öppna ci-post-merge-ärenden
# + 1 öppet bokforingsdrift-ärende), 50 ger bred marginal.
HEARTBEAT_ARENDE_LIMIT=50

# === Öppna ci-post-merge-/nattärenden: hur ofta en PÅMINNELSE får upprepas
#     medan läget kvarstår rött, i sekunder (TASK-479.2, SE16) ===
#
# VARFÖR EN EGEN RATT, INTE en återanvändning av HEARTBEAT_OMARKERAD_
# INTERVALL ovan (som redan delas av tre andra notiser): de tre delar en
# ratt eftersom de alla är PR-/sessions-bundna signaler av samma karaktär.
# Denna väg är en ANNAN sak — huvudgrenens ÄRENDEREGISTER (GitHub Issues),
# inte en PR-egenskap — och kan därför behöva tunas oberoende (t.ex. ett
# LÄNGRE fönster om ärendena redan har sin egen ägare och tidsregel i
# CONTRIBUTING.md § Tidsregel och ägare, eller ett KORTARE om ett känt läge
# visar sig glömmas ändå).
#
# ÖVERGÅNGEN (grön→röd, kallstart→röd, röd→grön) rapporteras ALLTID
# OMEDELBART, oavsett detta värde — se scripts/heartbeat-svep.sh
# rapportera_arende_lage(). Denna ratt gäller ENDAST påminnelsen medan rött
# KVARSTÅR: ett känt, redan-rapporterat läge ska inte larma var 90:e sekund
# (mätt problem 2026-09-19, se TASK-473-noten i kortets faktarad).
#
# 1800 (30 min): samma fail-safe-mot-SYNLIGHET-default som
# HEARTBEAT_OMARKERAD_INTERVALL ovan (en ny säkerhetsrelevant SIGNAL ska
# vara synlig som default) — och samma tal, eftersom repot ännu inte har
# skäl att avvika. Skriptets EGNA in-koden-default (satt FÖRE denna fil
# läses) är likaledes 1800, så denna rad är en dokumenterad KOPIA, inte ett
# annat val.
HEARTBEAT_ARENDE_PAMINNELSE_INTERVALL=1800

# === Öppna ci-post-merge-/nattärenden: etikett/söksträng (TASK-479.2,
#     review runda 2 fynd 1, Marcus-beslut 2026-09-19) ===
#
# VARFÖR: runda 1 hårdkodade dessa två litteraler i
# scripts/heartbeat-svep.sh sweep_once() — mot repots egen konvention
# (~/.claude/CLAUDE.md § Instruktioner, "Custom CI-grindvakts-logik i
# spokes är alltid config-driven": skriptets LOGIK ska vara universell —
# kan dupliceras till andra spokes utan refactor — VÄRDENA här är
# projekt-specifika). Samma separation som HEARTBEAT_EXEMPT_AUTHORS ovan
# redan följer i DENNA fil.
#
# HEARTBEAT_ARENDE_LABEL_POSTMERGE: etiketten `gh issue list --label`
# frågar mot för post-merge-bucketen. Default matchar den etikett
# `post-merge.yml` § Dedup redan skapar sina ärenden med — ett spoke som
# döper sin egen etikett annorlunda sätter bara detta värde, ingen
# skriptändring.
HEARTBEAT_ARENDE_LABEL_POSTMERGE="ci-post-merge"

# HEARTBEAT_ARENDE_SEARCH_NATT: HELA `gh issue list --search`-frågan för
# nattbucketen (inte bara etikett-listan — se scripts/heartbeat-svep.sh
# rapportera_arende_lage() § VAD för varför just DENNA bucket kräver
# `--search` med `label:`-OR-syntax i stället för plain `--label`).
# Formatet ÄR search-syntaxen rakt av: byt HELA strängen, inte bara
# etikettdelen, om ett spoke namnger sina nattkanaler annorlunda.
HEARTBEAT_ARENDE_SEARCH_NATT="label:ci-natt,bokforingsdrift,beroendevarning,lankrota is:open"
