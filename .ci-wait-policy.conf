# shellcheck shell=bash
# shellcheck disable=SC2034
# Variables in this file are sourced and consumed by external
# scripts (scripts/ci-wait.sh). shellcheck cannot trace cross-file
# variable usage, so SC2034 ("appears unused") triggers as false
# positive. Disable is file-level and intentional.

# .ci-wait-policy.conf
#
# Per-projekt config för scripts/ci-wait.sh.
# Skriptets LOGIK är universell (kan dupliceras till andra spokes utan
# refactor); värdet här är PROJEKT-SPECIFIKT. Samma hub-spoke-portabilitet
# som .checklist-policy.conf, .frontmatter-policy.conf och .lesson-policy.conf
# (Lesson #6, UNIVERSAL).
#
# === Duplicera till nytt spoke (2 steg) ===
# 1. cp scripts/ci-wait.sh + denna fil till nytt repo
# 2. Sätt CI_WAIT_WORKFLOW till workflow-namnet som bär repots required check
#
# Källa: TASK-72 (vakten kunde följa fel workflow och rapportera grönt)

# === Workflowen vars körning är CI-beviset ===
# EXAKT `name:`-fältet i workflow-filen — inte filnamnet, inte jobbnamnet.
# Här: `name: CI` i .github/workflows/ci.yml, workflowen som bär
# required-checken "CI Passed or Skipped" (ruleset main-skydd).
#
# VARFÖR VÄRDET MÅSTE FINNAS: `gh run list --commit <sha> --limit 1` utan
# `--workflow` returnerar senaste körningen för commiten OAVSETT workflow.
# Detta repo kör TRE workflows per push till main — CI, CodeQL och Post-merge
# — och bara CI bär required-checken. Mätt 2026-07-28 på commit 03d18888:
# den okvalificerade formen valde Post-merge (30398517485), inte CI
# (30398517346). Utan detta värde vägrar vakten köra i lägena
# --pr/--commit/--branch i stället för att följa en godtycklig körning.
#
# Endast namnet på den workflow som bär required-checken hör hemma här.
# CodeQL och Post-merge är AVSIKTLIGT utanför: de blockerar inte merge, och
# att fälla på dem vore falskt rött på repots sista kontroll före armering
# (empiri: Post-merge-körning 30395621766 failade 2026-07-28 utan att blockera).
CI_WAIT_WORKFLOW="CI"
