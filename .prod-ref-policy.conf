PROD_REF_PROD="lvjsfnphlauldxqlncpl"

# === Matchning ===
# ENKEL substräng-närvaro av PROD_REF_PROD i HELA Bash-kommandosträngen —
# INTE villkorad på ett specifikt subkommando (link/db push/functions
# deploy/secrets set). Detta är ett MEDVETET BREDARE val än uppdragets
# egen exempel-lista ("och motsvarande"):
#   - Refen är en 20-tecken CID, praktiskt taget omöjlig att råka nämna av
#     misstag i ett agent-kommando.
#   - En subkommando-specifik lista måste hållas i synk med varje ny
#     Supabase CLI-subkommando som kan skriva till ett projekt (db reset,
#     migration up/repair, branches create/delete, storage rm/mv/cp, ...)
#     — en enda glömd rad återöppnar hela hålet. En ren ref-match har inget
#     sådant underhållsbehov.
#   - Täcker ÄVEN kommandoformer uppdragets exempel-lista inte nämner:
#     rå curl/wget mot Supabase Management/REST-API med refen i
#     URL-värden, samt scripts/deploy-prod-functions.sh (vars EGNA interna
#     `supabase functions deploy ... --project-ref <ref>`-anrop aldrig
#     syns i Bash-tool_input-texten — bara wrapper-anropet gör, och det
#     BÄR refen som argument).
#   - Doktrin-konsekvent: CLAUDE.md behandlar Airtables prod-bas som
#     "förbjuden" utan läs-undantag (app8uGPrVCVOm6LfD). Samma hållning
#     tillämpad på Supabase prod, inte en svagare variant.
#
# KONSEKVENS, ÖPPET BOKFÖRD (TASK-203-kortets § Öppen skuld): agent-drivna
# prod-EF-deployer via scripts/deploy-prod-functions.sh (tidigare körda
# under Marcus verbala GO i chatten, se tasks/todo.md S84/S102-historik)
# kan INTE längre köras av en agent. Vägen förbi: Marcus egen terminal
# (utanför Claude Code — se skriptets § MEDVETEN VÄG FÖRBI) eller den
# designade bypass-mekanismen nedan.

# === Medveten väg förbi — typa-för-att-bekräfta ===
# Miljövariabel-PREFIX på SAMMA Bash-kommandorad (Claude Codes Bash-tool
# startar en FÄRSK shell per anrop — "shell state does not persist" — så en
# tidigare `export` i en annan Bash-tool-körning når ALDRIG hit; prefixet
# måste stå inline på det faktiska anropet som ska släppas igenom).
#
# Krävt värde = PROD_REF_PROD SJÄLV, inte "true"/"yes"/ett lösenord.
# Samma typa-för-att-bekräfta-mönster som GitHubs repo-radering (skriv
# repots namn) och Herokus `pg:reset --confirm APP_NAME`: ett kort,
# generiskt "ja" kan kopieras/klistras av vana; att skriva ut hela
# project-refen kräver att någon (Marcus, i klartext) faktiskt avsett just
# DETTA projekt. En agent konstruerar inte denna prefix-form av vana — den
# står inte i något normalt arbetsflöde och kräver att den dikteras
# uttryckligen.
#
# Detta är INTE bevisat ogenomträngligt för en agent som läser skriptets
# egen källkod (den är synlig i repot) — se scripts/deny-prod-ref.sh §
# MEDVETEN VÄG FÖRBI för den öppna avvägningen. Varje användning loggas
# SYNLIGT till stderr (aldrig tyst) som en extra observerbarhets-spärr.
PROD_REF_BYPASS_VAR="PROD_REF_GODKAND_AV_MARCUS"

# === Kort-ID för deny-meddelandet ===
PROD_REF_TASK_ID="TASK-203"
