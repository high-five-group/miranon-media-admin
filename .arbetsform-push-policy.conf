# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/deny-arbetsform-push.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears
# unused") slår som falskt positiv. Disable är fil-nivå och avsiktlig — samma
# form som .mail-lock-policy.conf, .grind-exitkod-policy.conf,
# .subagent-vantan-policy.conf, .heartbeat-svep-policy.conf,
# .ci-wait-policy.conf, .staging-semaphore-policy.conf, .checklist-policy.conf,
# .frontmatter-policy.conf och .lesson-policy.conf (Lesson #6, UNIVERSAL).

# .arbetsform-push-policy.conf
#
# Per-projekt config för scripts/deny-arbetsform-push.sh (TASK-149.3,
# ADR-097 § Beslut del 2 — "(a) Spärr vid handlingen"). Skriptets LOGIK är
# universell (kan duplicera till andra spokes utan refactor); VÄRDENA här —
# tillståndsfilens filnamn och VILKA arbetsformer som förbjuder push — är
# den delen som är öppen för framtida justering utan att skriptet rörs.
# TASK-149.4 (hub-integrationen) och TASK-149.6 (inventeringen) förväntas
# lägga till fler arbetsformer i listan nedan utan att röra hooken.
#
# VARFÖR FILEN FINNS: ADR-097 mekaniserar arbetsformens regler som TILLSTÅND
# en mekanism läser, i stället för prosa i en startdörr (`prototype`-skillen
# § 5) som `T126` mätte att en resume-väg hoppar över. En PreToolUse-hook på
# `git push` läser en otrackad per-arbetsträd-tillståndsfil och nekar
# push medan en push-förbjudande arbetsform är aktiv — level-triggered och
# väg-oberoende, oavsett vilken dörr sessionen kom in genom.
#
# Se docs/decisions/ADR-097-arbetsformens-tillstandsbarare.md § Beslut del 2
# för hela resonemanget och tasks/threads/T126-arbetsformens-leveransvag.md
# för den mätta rotorsaken.

# === Tillståndsfilens filnamn, relativt arbetsträdets rot (§ .claude/) ===
# Samma katalog som .claude/hook-fallningar.jsonl och
# .claude/agent-spawn-log.jsonl — lokal, otrackad, per-arbetsträd
# observerbarhets-/tillståndsdata, samma motivering som de två (se
# .gitignore). ETT värde, inte en array: ett arbetsträd har ETT
# arbetsform-läge åt gången.
ARBETSFORM_TILLSTAND_FILNAMN=".claude/arbetsform-tillstand.json"

# === Arbetsformer vars NÄRVARO i tillståndsfilen förbjuder push ===
# En arbetsform i tillståndsfilen som INTE står i denna lista förbjuder
# INTE push (t.ex. en framtida "granskning"-arbetsform TASK-149.6 kan
# hitta) — bara FRÅNVARO av fil OCH en icke-listad arbetsform släpper
# igenom. "iteration" är prototype-skillens § 5 divergens-/
# konvergensvarv (T66, T116, T126) — den enda arbetsform denna skiva har
# ett konkret, mätt fall för. TASK-149.4 sätter detta värde när
# iterationsläget inleds.
ARBETSFORM_PUSH_FORBJUDNA=(
    "iteration"
)
