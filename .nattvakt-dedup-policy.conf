# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/check-nattvakt-dedup.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears unused")
# slår som falskt positiv. Disable är fil-nivå och avsiktlig — samma form som
# .mail-lock-policy.conf, .katalogagarskap-policy.conf,
# .sanningsavstamning-policy.conf m.fl. (Lesson #6, UNIVERSAL).

# .nattvakt-dedup-policy.conf
#
# Config för scripts/check-nattvakt-dedup.sh — dedup-beslutet i
# nightly-watchdog.yml:s jobb "Kom natten igång?" (TASK-180, 2026-08-10).
#
# === VARFÖR DEN HÄR FILEN FINNS ===
# Instansen är skarp (issue #1042, 2026-08-09): nightly.yml:s eget larm-jobb
# skapade #1028 kl 03:12 för en röd natt. Marcus stängde det 07:19 MED en
# skriven rotorsaksmotivering. Vaktens nästa körning (run 31308855918, kl
# 10:39) frågade GitHub bara efter ÖPPNA ci-natt-ärenden — hittade inget,
# eftersom #1028 redan var stängt — och skapade #1042: ett falsklarm. Checken
# skilde inte "obesvarat" (inget ärende alls, eller stängt UTAN motivering)
# från "stängt MED motivering" (#1028:s faktiska tillstånd).
#
# === VÄRDENA ===
# NATTVAKT_DEDUP_ETIKETT — vilken issue-etikett dedup-beslutet läser.
NATTVAKT_DEDUP_ETIKETT="ci-natt"

# NATTVAKT_DEDUP_FONSTER_TIMMAR — hur många timmar bakåt (räknat från NU, vid
# skriptets körning) ett STÄNGT ärende med minst en kommentar (= skriven
# motivering, CONTRIBUTING.md § Nattnätet stängningsregel) räknas som
# "redan besvarat" och alltså dedupar bort ett nytt larm. Ett ÖPPET ärende
# dedupar alltid, oavsett ålder (oförändrat beteende sedan vakten byggdes).
#
# Samma värde (26 h) som workflowens egen window_hours för "senaste körning
# för gammal" (nightly-watchdog.yml, uppmätt schema-eftersläp ~3 h + marginal).
# Natt-cykeln är ~24 h: ett snävare fönster hade riskerat att missa en sen
# stängning från GÅRDAGENS natt (#1028 stängdes 4 h 7 min efter det skapades,
# och vaktens nästa körning kom 3 h 20 min EFTER stängningen — 7 h 27 min
# efter skapelsen), och ett mycket bredare fönster hade riskerat att en
# flera dagar gammal stängning tystar en GENUINT NY natts problem. Detta är
# samma avvägning som staleness-fönstret redan gör, återanvänd — inte en ny
# gissning.
NATTVAKT_DEDUP_FONSTER_TIMMAR=26
