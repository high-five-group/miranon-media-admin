# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/check-listparitet.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears unused")
# är falskt positiv. Disable är fil-nivå och avsiktlig — samma form som
# .backlog-closure-policy.conf och .ci-wait-policy.conf.
#
# RADEN OVAN BÖRJAR MED "Verktyget", INTE med verktygets namn: en kommentarsrad
# vars FÖRSTA ord är verktygsnamnet tolkas som ett direktiv och fäller
# SC1072/SC1073. .backlog-closure-policy.conf gjorde precis det fram till
# TASK-90.

# .listparitet-policy.conf
#
# Per-projekt config för scripts/check-listparitet.sh.
# Skriptets LOGIK är universell (kan dupliceras till andra spokes utan
# refactor); värdena här är PROJEKT-SPECIFIKA. Samma hub-spoke-portabilitet som
# .backlog-closure-policy.conf, .ci-wait-policy.conf, .checklist-policy.conf,
# .frontmatter-policy.conf och .lesson-policy.conf (Lesson #6, UNIVERSAL).
#
# === Duplicera till nytt spoke (3 steg) ===
# 1. cp scripts/check-listparitet.sh + denna fil till nytt repo
# 2. Sätt `# paritet:start <namn>` / `# paritet:slut <namn>` runt de listor som
#    ska paras i det repots filer
# 3. Skriv en LISTPARITET_PAR-post per par nedan
#
# ═══════════════════════════════════════════════════════════════════════════
# HUR PAREN HÄRLEDDES (AC#1) — metod, inte tycke
# ═══════════════════════════════════════════════════════════════════════════
#
# Kortet levererades med `PARITY_PATHS` OHÄRLEDD. Metoden som användes
# 2026-07-30 var att söka repots grind-yta (.github/, scripts/, CONTRIBUTING.md,
# CLAUDE.md, verktygs-configarna, package.json, playwright.config.ts) efter den
# PROSA SOM SJÄLV DEKLARERAR en manuell synk-plikt:
#
#   IDENTISK · speglar · PARAD ÄNDRING · glida isär · måste ALLTID finnas ·
#   synkas manuellt · i BÅDA listorna · de två listorna · samma lista
#
# Sökningen gav 50 rader över 19 filer (räknat 2026-07-30). Merparten var
# formuleringar om annat än listpar — mätdata som säger att två körningar hade
# identiskt innehåll, en färg-atlas vars ankare speglar en tidigare palett, en
# testfixtur som härmar produktionens katalogstruktur. Raderna löste upp sig i
# TIO distinkta synk-plikter, och var och en prövades mot TVÅ villkor. Ett par
# tas in bara om båda håller:
#
#   (i)  finns det två FAKTISKA listor på två ställen (inte en principtext)?
#   (ii) saknas en mekanism som håller dem synkade?
#
# En andra ingång fångar par vars plikt aldrig skrevs ut men vars DRIFT är MÄTT.
# Den vägen bidrog med tre kandidater som sökningen inte kunde hitta — de bär ju
# per definition ingen prosa om saken: sentinel-markörerna (par 5 nedan),
# markdownlint-globbarna och check-docs.sh:s gate-lista. De två sista förkastades.
#
# SUMMA: 13 kandidater prövade, 5 intagna, 8 förkastade.
#
# UTFALLET, VARJE KANDIDAT REDOVISAD:
#
# INTAGNA (5 par, se posterna längre ned)
#   ci.yml:125-128 "PARAD ÄNDRING (obligatorisk) … ingen grind håller dem
#     synkade — paret hålls för hand"      → par `klassning-docs-config`
#   ci.yml:232     "listorna ska vara IDENTISKA post för post"  (samma par)
#   ci.yml:262     "Exkluderingarna är IDENTISKA med should_skip_tests-stegets"
#                                          → par `klassning-exkl-d1`
#   ci.yml:326     "Exkluderingarna nedan är IDENTISKA med D0:s och D1:s"
#                                          → par `klassning-exkl-acceptance`
#   ci.yml:1051 + check-docs.sh:92,110 "speglar detta block i sak … får inte
#     glida isär"                          → par `lychee-scope`
#   CONTRIBUTING.md rad 75-78 mot .purge-staging-policy.json — plikten är INTE
#     utskriven, men driften är mätt: listan namngav 2 av 4 sentinel-markörer,
#     två omissioner ackumulerade (`ZZ-note-test+`, `app-segment-test+`).
#                                          → par `sentinel-markorer`
#
# FÖRKASTADE, var och en med sitt skäl
#   ci.yml:19 "Check-NAMNET måste vara identiskt på båda ytorna" — motparten är
#     GitHubs ruleset, inte en fil i repot. Villkor (i) faller: det finns ingen
#     andra lista att läsa. En grind hade behövt `gh api`, alltså nät i en
#     textgrind.
#   ci.yml:569 + check-fetch-depth-invariant.sh — de 6 fetch-depth-bärarna HAR
#     redan en grind. Villkor (ii) faller.
#   classify-post-merge.sh — ÄRVER ci.yml:s klassning i stället för att kopiera
#     den (ingen andra lista), och kopplingen vaktas av
#     test-classify-post-merge.sh. Båda villkoren faller.
#   check-staging-preflight-wiring.mjs:66 "speglar PRODUKTIONENS LAYOUT" — TASK-91
#     byggde grinden. Villkor (ii) faller.
#   test-ci-wait.sh:31, test-staging-semaphore.sh:32 "LAYOUTEN SPEGLAR
#     PRODUKTIONEN" — en testfixtur som härmar en katalogstruktur, inte två
#     listor. Villkor (i) faller.
#   nightly.yml:94 — säger uttryckligen att scopen är AVSIKTLIGT INTE identiska.
#     Att grinda dem hade fällt på ett beslut.
#   .markdownlint-cli2.jsonc `globs` mot lychee-arg-blocket — de SJU globbarna är
#     i dag identiska (modulo `./`-prefix), men INGEN fil deklarerar att de måste
#     vara det. Verktygen gör olika saker (länkkontroll respektive
#     markdown-hygien) och deras scope kan legitimt gå isär. Att para dem vore
#     ett NYTT arkitektur-krav, inte mekanisering av ett befintligt — och den
#     sortens beslut fattas inte i en config-fil. Registrerat, ej byggt.
#   check-docs.sh:34-46 (gate-listan) mot ci.yml:s lint-jobb — HÄR FINNS FAKTISK
#     DRIFT: check-docs.sh räknar upp `scripts/check-permissions-claims.sh` som
#     grind nr 10 under rubriken "ci.yml lint-jobbet", och ci.yml kör den inte
#     (verifierat 2026-07-30: enda träffen på `permissions-claims` i
#     .github/workflows/ är TEST-sviten på rad 623 plus shellcheck-scopet).
#     Paret togs INTE in i denna landning, eftersom grönt kräver att någon
#     antingen wirar grinden i CI eller skriver om check-docs.sh:s påstående —
#     båda är scope-beslut med CI-verkan, och sådana fattas inte av bygg-agenten.
#     Eskalerat i slutrapporten.
#
# ═══════════════════════════════════════════════════════════════════════════
# FORMEN
# ═══════════════════════════════════════════════════════════════════════════
#
# En rad per par, tio fält, separator `:::`
#
#   <namn>:::<riktning>:::<A-fil>:::<A-start>:::<A-slut>:::<A-uttryck>
#          :::<B-fil>:::<B-start>:::<B-slut>:::<B-uttryck>
#
#   riktning  `bada`     — mängderna måste vara LIKA
#             `a-till-b` — varje post i A måste finnas i B; B får bära mer
#   A/B-start Markör-TEXT (delsträngsmatchning på raden). TOM = hela filen,
#   A/B-slut  vilket är enda vägen för format utan kommentarer, t.ex. JSON.
#   uttryck   ERE till `grep -oE`. Blanksteg och ett matchande par citattecken
#             eller bakåtfnuttar skalas av efteråt.
#
# De tre uttryck som återkommer:
#   POSITIVA glob-rader i ett `files: |`-block  ^[[:space:]]+[^!#[:space:]][^[:space:]]*$
#   NEGERADE glob-rader (`!`-exkluderingar)     ^[[:space:]]+![^[:space:]]+$
# Båda är helrads-ankrade, vilket är det som gör att `files: |` och
# markör-raderna inte plockas upp: de bär blanksteg inne i raden.

# CITAT-TECKNEN I STRÄNGEN: variabeln är DUBBELCITERAD, eftersom uttrycken
# innehåller enkelcitat (`'[^']+'`) och en enkelciterad sträng inte kan bära
# dem. Priset är att `$` och backtick måste escapas — `\$` för radslutsankaret
# och `\`` för sentinel-parets uttryck. Utan escapningen hade backticken startat
# kommandosubstitution när filen sourcas.
LISTPARITET_PAR="
klassning-exkl-d1:::bada:::.github/workflows/ci.yml:::# paritet:start klassning-d0:::# paritet:slut klassning-d0:::^[[:space:]]+![^[:space:]]+\$:::.github/workflows/ci.yml:::# paritet:start klassning-d1:::# paritet:slut klassning-d1:::^[[:space:]]+![^[:space:]]+\$
klassning-exkl-acceptance:::bada:::.github/workflows/ci.yml:::# paritet:start klassning-d0:::# paritet:slut klassning-d0:::^[[:space:]]+![^[:space:]]+\$:::.github/workflows/ci.yml:::# paritet:start klassning-acceptance:::# paritet:slut klassning-acceptance:::^[[:space:]]+![^[:space:]]+\$
klassning-docs-config:::bada:::.github/workflows/ci.yml:::# paritet:start klassning-d0:::# paritet:slut klassning-d0:::^[[:space:]]+[^!#[:space:]][^[:space:]]*\$:::.github/workflows/ci.yml:::# paritet:start klassning-docs:::# paritet:slut klassning-docs:::^[[:space:]]+[^!#[:space:]][^[:space:]]*\$
lychee-scope:::bada:::.github/workflows/ci.yml:::# paritet:start lychee-ci:::# paritet:slut lychee-ci:::--exclude-path [^[:space:]']+|--[a-z][a-z-]*|'[^']*':::scripts/check-docs.sh:::# paritet:start lychee-lokal:::# paritet:slut lychee-lokal:::--exclude-path [^[:space:]']+|--[a-z][a-z-]*|'[^']*'
sentinel-markorer:::a-till-b:::.purge-staging-policy.json:::::::::'[^']+':::CONTRIBUTING.md:::::::::\`[^\`]+\`
"

# ═══════════════════════════════════════════════════════════════════════════
# PAREN, ETT OCH ETT
# ═══════════════════════════════════════════════════════════════════════════
#
# `klassning-exkl-d1` och `klassning-exkl-acceptance`
#   D0:s (should_skip_tests), D1:s (changed-ui) och acceptance-klassens
#   `!`-exkluderingar. Alla tre stegen är ALLOWLISTS, och exkluderingarna är
#   allowlist-golvet: CI-workflow, paketmanifest, låsfil och byggkonfig kan
#   ALDRIG klassas som låg risk. Driftar en av listorna kan en byggkonfig-ändring
#   klassas som D1 i ett steg och full svit i ett annat — samma commit, två
#   svar. MÄTT 2026-07-30: 12 poster, byte-identiska över alla tre.
#
# `klassning-docs-config`
#   De positiva posterna i D0 mot changed-docs. ci.yml:s egen kommentar skriver
#   ut felläget: en fil som står i D0 men inte i changed-docs blir vid en
#   ensam-ändring BÅDE testsvit-skippad och docs-skippad, alltså tyst ovaliderad
#   (fail-open, L322-klassen). Nio asymmetrier är avsiktliga och deklarerade
#   nedan; allt annat fäller.
#
# `lychee-scope`
#   ci.yml:s lychee-arg-block mot check-docs.sh:s lokala anrop. Glider de isär
#   får den lokala körningen ett annat länk-scope än grinden som blockerar PR:en
#   — och check-docs.sh finns just för att den lokala körningen ska vara
#   sanningsenlig om vad CI kommer att säga.
#
# `sentinel-markorer`
#   Markörerna i .purge-staging-policy.json mot CONTRIBUTING.md. Riktningen är
#   `a-till-b`: CONTRIBUTING får självklart nämna annat, men VARJE markör som
#   purgen faktiskt raderar måste stå namngiven i den prosa som beskriver
#   städningen. Uttrycket på A-sidan plockar de enkelcitat-omslutna literalerna
#   i Airtable-formlerna, vilket är de enda enkelcitaten i filen (JSON använder
#   dubbelcitat) — därför behövs inga markörer där, vilket är tur, eftersom JSON
#   inte har kommentarer.

# ═══════════════════════════════════════════════════════════════════════════
# UNDANTAG — avsiktliga asymmetrier, var och en med skrivet skäl
# ═══════════════════════════════════════════════════════════════════════════
#
# Fyra fält: <par>:::<sida A|B>:::<post>:::<skäl>
#
# Ett undantag som INTE LÄNGRE BEHÖVS fäller också. Skälet är att ett
# kvarliggande undantag maskerar nästa drift på samma post — alltså återinför
# precis den tysta lucka grinden finns för att stänga, via grindens egen config.
#
# De åtta A-undantagen i `klassning-docs-config` följer alla samma prövning:
# posten står i D0 därför att en ändring av filen inte kan påverka testsviten,
# och den behöver INTE stå i changed-docs därför att ingen docs-grind läser
# filen. Ingen grind kan alltså bli tyst skippad. Verifierat 2026-07-30 mot de
# tre docs-grindarnas faktiska scope: lychee-arg-blocket i ci.yml,
# .markdownlint-cli2.jsonc `globs`, och `lint:prose` i package.json.

LISTPARITET_UNDANTAG="
klassning-docs-config:::A:::LICENSE:::Saknar .md-ändelse. Ingen av de tre docs-grindarnas scope når filen, så en ensam-ändring kan inte göra någon docs-grind tyst skippad.
klassning-docs-config:::A:::docs/**:::Katalogens .md-filer fångas av **/*.md i changed-docs. Posten här är bredare (bilder, JSON, atlas-data); den ytan grindas av biome check . i det alltid-på lint-jobbet, aldrig av docs-jobbet.
klassning-docs-config:::A:::tasks/**:::Samma skäl som docs/** — .md-halvan täcks av **/*.md, resten rörs inte av någon docs-grind.
klassning-docs-config:::A:::.github/ISSUE_TEMPLATE/**:::Ligger under dot-katalog och nås därför inte av **/*.md (micromatch utan dot: true). Men ingen docs-grind läser .github/ heller — varken lychee, markdownlint eller Vale har katalogen i sitt scope. Ingen grind att skippa.
klassning-docs-config:::A:::.github/PULL_REQUEST_TEMPLATE.md:::Samma skäl som ISSUE_TEMPLATE — .md men utanför samtliga docs-grindars scope.
klassning-docs-config:::A:::.github/CODEOWNERS:::Ingen ändelse, ingen docs-grind läser filen.
klassning-docs-config:::A:::.vscode/extensions.json:::JSON. Grindas av biome check . i det alltid-på lint-jobbet, som saknar både if- och needs-villkor och därför aldrig skippas.
klassning-docs-config:::A:::.editorconfig:::Läses av inget docs-verktyg. Editorernas egen fil.
klassning-docs-config:::B:::.github/workflows/ci.yml:::Medvetet ENDAST i changed-docs. En ci.yml-ändring ska re-validera docs-link-check (lychee-configen bor i filen), men får aldrig göra testsviten skippbar — D0 utesluter den explicit med !.github/workflows/**. Väg ii-a, Session 11.
lychee-scope:::A:::--verbose:::Utskriftsnivå i CI-loggen, ingen scope-effekt. Lokalt går lychees utdata till terminalen ändå, så flaggan skulle inte tillföra något i check-docs.sh.
"
