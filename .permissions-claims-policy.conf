# shellcheck shell=bash
# shellcheck disable=SC2034
# Variables in this file are sourced and consumed by external
# scripts (scripts/check-*.sh). shellcheck cannot trace cross-file
# variable usage, so SC2034 ("appears unused") triggers as false
# positive. Disable is file-level and intentional.

# .permissions-claims-policy.conf
#
# Per-projekt config för scripts/check-permissions-claims.sh.
# Skriptets LOGIK är universell (kan dupliceras till andra spokes utan
# refactor); värden här är PROJEKT-SPECIFIKA. Samma hub-spoke-portabilitet
# som .lesson-policy.conf och .frontmatter-policy.conf (Lesson #6, UNIVERSAL).
#
# === Duplicera till nytt spoke (3 steg) ===
# 1. cp scripts/check-permissions-claims.sh + denna fil till nytt repo
# 2. Anpassa GOVERNING_FILES + SETTINGS_FILES nedan
# 3. Lägg run_gate-raden i scripts/check-docs.sh (samma anrop-signatur)
#
# === Varför grinden finns ===
# S91 2026-07-29: hub-CLAUDE.md påstod på TVÅ ställen att regler var
# "mekaniserad som spärr — se settings.json permissions.deny". Det finns
# ingen deny-lista någonstans. Reglerna bröts aldrig — prosan fungerar —
# men ingen granskade dem på månader, eftersom filen sade att saken var löst.
#
# Grillningens A2:8 (S91 Del 28) drog regeln: synden är inte prosa. Synden är
# PROSA SOM PÅSTÅR SIG VARA MEKANISM. Marcus strök tre av fyra föreslagna
# spärrar och lät denna stå, med motiveringen att den "fyrar noll gånger när
# Code har rätt, och exakt en gång när Code inte har det".

# --- Styrande filer som granskas -------------------------------------------
#
# ENDAST filer som INSTRUERAR. Sessionsdok, research och lessons beskriver och
# styr inte — de måste kunna diskutera frånvaron av en mekanism utan att fällas.
# Det är hela skälet till att listan är explicit i stället för en glob.
GOVERNING_FILES=(
  "CLAUDE.md"
  "CONTRIBUTING.md"
  ".claude/agents/bygg-agent.md"
  ".claude/agents/research-pass.md"
)

# --- Settings-filer som utgör SANNINGEN -------------------------------------
#
# Grinden prövar påståenden i GOVERNING_FILES mot dessa. Saknas alla, är varje
# permissions-påstående per definition falskt.
#
# Hub-filen (~/.claude/CLAUDE.md, symlink till marcus-system) granskas INTE
# härifrån: den ligger utanför repot och finns inte i CI. Den bär sin egen
# kopia av grinden i hub-repot.
SETTINGS_FILES=(
  ".claude/settings.json"
  ".claude/settings.local.json"
)

# --- Nycklar som ett påstående kan åberopa ----------------------------------
#
# Nämner en styrande fil någon av dessa, MÅSTE motsvarande nyckel finnas och
# vara icke-tom i minst en SETTINGS_FILES-post.
CLAIMED_KEYS=(
  "permissions.deny"
  "permissions.ask"
)

# --- Påstående-markörer -----------------------------------------------------
#
# En nyckel som bara NÄMNS är inte ett påstående. Grinden fäller först när
# nyckeln står på samma rad som en markör som hävdar att mekanismen FINNS.
#
# Skälet är empiriskt, inte principiellt: grindens allra första skarpa körning
# 2026-07-30 fällde `CONTRIBUTING.md:921` — *"Läs den innan `permissions.deny`
# eller en tvingande hook övervägs"*. Det är en referens till en FRAMTIDA
# möjlig åtgärd och helt korrekt skrivet. Den bokstavliga läsningen av A2:8
# ("varje referens") fällde den; avsikten (fånga prosa som påstår sig vara
# mekanism) gör det inte. Vid divergens styr avsikten.
#
# Markörerna är avsiktligt få. En grind som försöker förstå varje sätt att
# hävda något på blir en grind som fäller fel.
CLAIM_MARKERS=(
  "mekaniserad"
  "mekaniseras som"
  "spärr"
  "är satt"
  "ligger i"
  "se \`settings"
)

# --- Fönster för markör-sökning ---------------------------------------------
#
# Antal rader före/efter nyckeln som genomsöks efter en markör. Prosa radbryts,
# och det verkliga felet grinden byggdes för är radbrutet: "mekaniserad som
# spärr — se `settings.json`" på en rad, `permissions.deny` på nästa. Ett
# fönster på 0 hade missat det — fångat av self-testens T2 före landning.
CLAIM_WINDOW=2
