# "godkand": null, och INGEN av de kvarvarande markörerna hör till den ytan.
# Utan detta tillägg hade invarianten varit global men skyddet ytspecifikt för
# NÅGON ANNAN yta: spärren hade vaktat hallplats-substratet medan det ogodkända
# passet var personlistans — alltså inte hindrat den förtidiga rivning den
# finns för att hindra.
#
# Valet av just den strängen, mätt: den är PROTO_VARIANTS-postens `label` i
# src/routes/_authenticated/personer/index.tsx och gav exakt EN träff-fil
# (`grep -rlF`). Den dör med PROTO_VARIANTS vid rivningen, vilket är precis vad
