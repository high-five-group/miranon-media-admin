# shellcheck shell=bash
# shellcheck disable=SC2034
# Variables in this file are sourced and consumed by external
# scripts (scripts/check-*.sh). shellcheck cannot trace cross-file
# variable usage, so SC2034 ("appears unused") triggers as false
# positive. Disable is file-level and intentional.

# .facit-policy.conf
#
# Per-projekt config för scripts/check-facit.sh OCH
# scripts/deny-facit-godkand-skrivning.sh (delad sedan TASK-167 — den
# senare läser redan FACIT_BILAGE_ROT/FACIT_MANIFEST_NAMN härifrån;
# TASK-168 lägger till FACIT_GODKANN_NPM_SCRIPT/FACIT_GODKANN_SKRIPT_NAMN,
# se § Stämplingsskriptets identitet nedan).
# Skriptens LOGIK är universell (kan dupliceras till andra spokes utan
# refactor); värden här är PROJEKT-SPECIFIKA. Samma hub-spoke-portabilitet
# som .lesson-policy.conf och .frontmatter-policy.conf (Lesson #6, UNIVERSAL).
#
# === Duplicera till nytt spoke (3 steg) ===
# 1. cp scripts/check-facit.sh + scripts/lib/facit-validera.mjs + denna fil
# 2. Anpassa FACIT_BILAGE_ROT + FACIT_PROTO_MARKORER nedan
# 3. Lägg run_gate-raden i scripts/check-docs.sh (samma anrop-signatur)
#
# Källa: docs/decisions/ADR-102-prototypen-ar-facit-skarpa-ska-vara-identisk.md
#        Beslut B1 (prototypen ÄR facit) + B3 (rivning först efter godkännande).

# === Bilage-roten ===
# Katalogen där prototyp-passens bilage-kataloger bor. Grinden letar
# facit-manifest (FACIT_MANIFEST_NAMN) i varje underkatalog. Path relativt
# repo-root.
FACIT_BILAGE_ROT="tasks/sessions/bilagor"

# === Manifestets filnamn ===
# Ett manifest per prototyp-pass, colokaliserat med bilderna det beskriver.
# Frånvaro av manifest i en bilage-katalog UTAN facit-bilder är grönt —
# manifestet krävs först när katalogen bär minst en facit-bild.
FACIT_MANIFEST_NAMN="facit.json"

# === Facit-bildernas namnmönster ===
# En bild som matchar detta mönster MÅSTE vara deklarerad i manifestet.
# Rotorsak R4 (ADR-102): en odeklarerad facit-bild är oskiljbar från en
# passerad iterationsbild för den som läser katalogen.
FACIT_BILD_GLOB="facit-*"

# === Prototyp-markörer (B3-spärren) ===
# Symboler som bär prototyp-substratet i koden. Så länge ett manifest har
# "godkand": null får ingen av dem försvinna ur FACIT_PROTO_SOKVAG —
# rivning före Marcus godkännande är exakt vad ADR-102 B3 förbjuder.
# Mätt underlag för listan: ADR-102 § R7 (sju filer, ~106 grenar).
#
# TASK-171.2 (2026-08-09): tre markörer tillagda för åtgärds-/
# granskningsytans promovering (manifestet
# tasks/sessions/bilagor/s93-atgardssida-promovering/facit.json,
# "godkand": null). Ytan har INGEN variant-gren att flippa (171.1:s mätta
# divergens: PROTO_VARIANTS bär en post, ingen av routerna/AtgardsSida.tsx
# läser variantParam) — de gamla markörerna (isHallplatsVariant, protoAktiv)
# hör till hallplats-prototypen och skyddar inte denna ytas substrat. De nya
# markörerna är [PROTOTYPE][S100]-docblockens unika textrader, en per
# källfil i manifestets "kallor" — verifierat unika med
# `grep -rn "<markör>" src/` innan tillägg (varje sträng gav exakt EN
# träff-fil). Försvinner en ur src/ innan godkännande fäller check-facit.sh.
#
# TASK-192 (2026-08-10, S103): TVÅ MARKÖRER BORTTAGNA, EN TILLAGD.
#
# Borttagna — "ÅTGÄRDS-SIDAN — konvergens-prototyp" och "Åtgärds-sidan MED
# event — konvergens-prototyp" gav 0 träffar i src/. De refererade kod som revs
# KORREKT efter åtgärdssidans godkännande 2026-08-09 (ADR-103 B2 steg 4 tar
# villkor och växlar); listan städades aldrig i samma andetag. Markörerna var
# därmed inte skyddande utan FÄLLANDE: nästa ogodkända manifest hade gjort
# grinden röd av ett skäl som inte rörde den yta som granskades.
#
# Varför luckan var osynlig: B3-spärren aktiveras bara när minst ett manifest
# har "godkand": null (check-facit.sh rad 136). Båda befintliga manifest var
# godkända, så spärren hoppades över helt och grinden var grön över de döda
# markörerna. Latent, inte harmlöst — och en grind vars fel bara syns när den
# faktiskt behövs är den sämsta sorten.
#
# Tillagd — "Personlistan - promoverad": personlistans promovering (S103,
# ADR-103 B2 steg 1) har manifestet
# tasks/sessions/bilagor/s90-personlistan-konvergens/facit.json med
# "godkand": null, och INGEN av de kvarvarande markörerna hör till den ytan.
# Utan detta tillägg hade invarianten varit global men skyddet ytspecifikt för
# NÅGON ANNAN yta: spärren hade vaktat hallplats-substratet medan det ogodkända
# passet var personlistans — alltså inte hindrat den förtidiga rivning den
# finns för att hindra.
#
# Valet av just den strängen, mätt: den är PROTO_VARIANTS-postens `label` i
# src/routes/_authenticated/personer/index.tsx och gav exakt EN träff-fil
# (`grep -rlF`). Den dör med PROTO_VARIANTS vid rivningen, vilket är precis vad
# en markör ska göra. Avvisade kandidater: `PROTO_VARIANTS` (finns i flera
# prototyp-routar — inte ytspecifik) och `PersonsListPrototyp` (fyra filer,
# bl.a. PersonDetailPrototyp.tsx och base.css — hade ÖVERLEVT personlistans
# rivning och gjort spärren slö).
# TASK-192, SAMMA LANDNING: "Personlistan - promoverad" är BORTA igen, och det
# är inte en ångrad ändring utan lärdomen tillämpad direkt. Markören lades till
# när personlistans manifest var ogodkänt; Marcus godkände samma dag och
# rivningen (ADR-103 B2 steg 4) tog PROTO_VARIANTS, vilket var markörens enda
# hemvist. Att lämna den kvar hade återskapat EXAKT den döda-markör-bugg detta
# kort lagade — en sträng med 0 träffar som ligger latent tills nästa ogodkända
# manifest fäller grinden av fel skäl. Regeln som följer av det: en markör
# städas i SAMMA landning som rivningen som gör den död, aldrig "sen".
FACIT_PROTO_MARKORER=(
    "isHallplatsVariant"
    "protoAktiv"
    "Åtgärds-sidan UTAN event — tomt läge"
)

# === Sökvägen prototyp-markörerna lever i ===
FACIT_PROTO_SOKVAG="src"

# === Stämplingsskriptets identitet (TASK-168) ===
# npm-scriptnamnet OCH modulens filnamn för Marcus egen godkännande-kanal
# (ADR-104 § Beslut 2). scripts/deny-facit-godkand-skrivning.sh Kanal A
# matchar ENDAST Bash-kommandon som FAKTISKT anropar dessa i
# kommando-POSITION (npm run <FACIT_GODKANN_NPM_SCRIPT>, node/direkt-exec
# av <FACIT_GODKANN_SKRIPT_NAMN>) — inte fri substräng över hela
# kommandotexten. Se hookens eget huvud för den mätta bakgrunden
# (TASK-167/168, fem falsk-positiva klasser).
FACIT_GODKANN_NPM_SCRIPT="facit:godkann"
FACIT_GODKANN_SKRIPT_NAMN="facit-godkann.mjs"
