# därmed inte skyddande utan FÄLLANDE: nästa ogodkända manifest hade gjort
# grinden röd av ett skäl som inte rörde den yta som granskades.
#
# Varför luckan var osynlig: B3-spärren aktiveras bara när minst ett manifest
