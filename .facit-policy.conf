#
# TASK-147.6 (2026-08-16, S102): "DOKUMENT-YTAN — Mer-ytan där bilagor
# förvaltas" tillagd. Dokument-ytans facit-lås (manifestet
# tasks/sessions/bilagor/s102-dokument-konvergens/facit.json, "godkand":
# null) väntar på Marcus stämpel, och INGEN av de befintliga markörerna hör
# till den ytan — utan tillägget hade B3-spärren varit global men skyddet
# ytspecifikt för NÅGON ANNAN yta, alltså inte hindrat den förtidiga rivning
