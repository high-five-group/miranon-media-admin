#
# FORM: SAMMA mönster som s93-atgardssida-promoverings tre ursprungliga
# markörer (TASK-171.2 ovan) — en rad plockad DIREKT ur filens egen
# `[PROTOTYPE] [S100]`-docblock (src/components/dokument/DokumentYta.tsx
