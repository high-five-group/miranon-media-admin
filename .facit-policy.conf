# INTE av 147.6 (uppdraget: "DEV-GRINDEN ... och [PROTOTYPE]-märkningen ovan
# RÖRS INTE av detta varv") — den försvinner FÖRST vid B3-rivningen (eget
# pass efter Marcus stämpel), vilket är exakt när markören ska dö.
# `grep -rlF "DOKUMENT-YTAN — Mer-ytan där bilagor förvaltas" src/` gav
# exakt EN träff-fil innan tillägget. Avvisad kandidat: `[PROTOTYPE] [S100]`
# själv — den prefixstämpeln återanvänds ordagrant i FLERA andra
# prototyp-filers docblock (samma konvention repo-brett), inte ytspecifik.
#
# BORTTAGEN SAMMA DAG (2026-08-16, task-164-rivningen): Marcus satte
# "godkand" (sha cc1d7c53, PR #1446) och B3-villkoret är därmed uppfyllt för
