# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/deny-resend-send.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears
# unused") slår som falskt positiv. Disable är fil-nivå och avsiktlig —
# samma form som .heartbeat-svep-policy.conf, .ci-wait-policy.conf,
# .staging-semaphore-policy.conf, .checklist-policy.conf,
# .frontmatter-policy.conf och .lesson-policy.conf (Lesson #6, UNIVERSAL).

# .mail-lock-policy.conf
#
# Per-projekt config för scripts/deny-resend-send.sh (TASK-137, MAIL-LÅSET,
# Marcus-GO 2026-08-04, S96 Del 10, PR #689). Skriptets LOGIK är universell
# (kan duplicera till andra spokes utan refactor); VÄRDENA här — vilka
# Resend-MCP-verktyg som räknas "sänd-klassade" och vilka HTTP/SMTP-
# endpoints som räknas "sänd-endpoints" — är projekt-/leverantörsspecifika.
#
# VARFÖR FILEN FINNS: Rogers krav (S96 Del 10) är att Code/agenter ALDRIG
# ska kunna skicka riktigt mail via Resend, mekaniskt — inte via prosa i
# CLAUDE.md. Låset har TVÅ oberoende lager (se scripts/deny-resend-send.sh
# § VARFÖR SKRIPTET FINNS för fulla resonemanget):
#   1. .claude/settings.json permissions.deny (garanterat fail-closed,
#      enligt Anthropics egen hooks-dokumentation).
#   2. Denna hook, som dubbel botten — fäller BÅDE Bash-kommandon mot
#      Resends sänd-endpoints OCH samma MCP-verktyg som lager 1.
#
# === Duplicera till nytt spoke (2 steg) ===
# 1. cp scripts/deny-resend-send.sh + denna fil till nytt repo
# 2. Verifiera att endpoints/verktygsnamn nedan fortfarande matchar den
#    faktiska resend-mcp-versionen som är installerad där (se § NAMNEN
#    NEDAN ÄR HYPOTES nedan — samma krav gäller varje duplicering).
#
# === NAMNEN NEDAN ÄR HYPOTES TILLS PLUGINET ÄR INSTALLERAT ===
# Detta kort (TASK-137) byggs AVSIKTLIGT innan `resend@claude-plugins-
# official` installeras (Marcus-GO: låset ska stå redo FÖRE aktivering).
# Verktygsnamnen är källmärkta mot github.com/resend/resend-mcp @
# 037c9b15f00ef4aafe3361ab3c7617ec900bd02a (src/tools/*.ts,
# registerTool(...)-anropen, alla 17 filer/~90 verktyg lästa i sin helhet)
# — men den faktiska namnrymden i EN LADDAD SESSION (särskilt plugin-
# prefixet, se nedan) är overifierad tills installationen sker. Den
# re-verifieringen ägs av orkestreraren + Marcus, INTE av bygg-kortet.

# === MCP-verktygsprefix — båda namnformerna ===
# Fristående server ("resend@modelcontextprotocol" el. motsvarande
# lokal/remote MCP-installation): mcp__resend__<tool>.
# Plugin-bunden ("resend@claude-plugins-official"): mönstret
# mcp__plugin_<pluginnamn>_<servernamn>__<tool> är belagt i DENNA
# repo-miljö för figma-pluginet (mcp__plugin_figma_figma__authenticate
# m.fl., sett i denna sessions egna deferred-tools-lista 2026-08-04).
# Antagandet — HYPOTES, ej verifierat — är att Resend-pluginet döper sin
# server "resend" precis som figma-pluginet döper sin "figma", vilket ger
# mcp__plugin_resend_resend__<tool>. Om den verkliga installationen döper
# servern annorlunda MÅSTE denna array uppdateras innan pluginet är
# aktiverat för skarpt bruk.
MAIL_LOCK_MCP_PREFIXES=(
    "mcp__resend__"
    "mcp__plugin_resend_resend__"
)

# === Sänd-klassade Resend-MCP-verktyg (utan prefix) ===
# Uttömmande enumererat mot src/tools/emails.ts, broadcasts.ts, events.ts
# i den källa som anges ovan — de FYRA verktyg vars namn börjar med
# "send-" är de enda i hela ytan (~90 verktyg, 17 filer) som orsakar att
# Resend faktiskt skickar/dispatchar något till en riktig mottagare:
#   send-email          — resend.emails.send() (src/tools/emails.ts)
#   send-batch-emails   — resend.batch.send() (src/tools/emails.ts)
#   send-broadcast      — dispatchar en broadcast till en audience
#                          (src/tools/broadcasts.ts)
#   send-event          — avfyrar ett event mot en kontakt som kan trigga
#                          en Automation — INDIREKT sändningsväg, men
#                          namnet matchar send-mönstret rakt av
#                          (src/tools/events.ts). Inkluderad medvetet,
#                          fail-closed-hållning.
#
# MEDVETET INTE MED (se kortets Description för fullt resonemang):
#   create-broadcast/update-broadcast/list-broadcasts/get-broadcast/
#   remove-broadcast/compose-broadcast (utkast, ingen dispatch),
#   cancel-email/update-email (kontrollerar ett REDAN schemalagt mail,
#   ingen ny sändningsväg), samt alla domän/DNS/kontakt/mall/segment/
#   webhook/logg/API-nyckel-läs- och adminverktyg.
MAIL_LOCK_SEND_TOOLS=(
    "send-email"
    "send-batch-emails"
    "send-broadcast"
    "send-event"
)

# === Bash-kommandonivå: textuella mönster för Resends sänd-endpoints ===
# ERE-mönster (bash [[ =~ ]], skiftlägesokänsligt via `shopt -s nocasematch`
# i skriptet) — matchar VARJE HTTP-metod mot dessa resursvägar, oavsett
# curl/wget/httpie/python-anrop, eftersom en tillförlitlig GET/POST-
# distinktion via textmönster INTE är robust (curl:s metod-flagga kan stå
# före eller efter URL:en, och default-metoden ändras av -d/--data utan
# -X). Uppdragets egen ordalydelse ("Bash-kommandon som träffar Resends
# sänd-endpoints") behandlar dessa vägar som sänd-endpoints rakt av —
# legitima LÄS-behov mot samma resurser går via MCP-läsverktygen
# (list-emails, get-email, list-broadcasts, ...), som INTE är nekade.
#   api.resend.com/emails      — täcker /emails, /emails/batch, /emails/{id}
#   api.resend.com/broadcasts  — täcker /broadcasts/{id}/send m.fl.
#   smtp.resend.com            — SMTP-relä, oavsett klient (curl/nc/telnet/
#                                 openssl s_client/python smtplib/mutt/...)
MAIL_LOCK_ENDPOINT_PATTERNS=(
    "api\.resend\.com/emails"
    "api\.resend\.com/broadcasts"
    "smtp\.resend\.com"
)

# === Kort-ID för deny-meddelandet ===
MAIL_LOCK_TASK_ID="TASK-137"
