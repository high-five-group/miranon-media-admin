# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/atkomst-diagnos.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears
# unused") triggar som falskt positiv. Disable är fil-nivå och avsiktlig —
# samma form som .heartbeat-svep-policy.conf och .frontmatter-policy.conf.

# .atkomst-diagnos-policy.conf
#
# Per-projekt config för scripts/atkomst-diagnos.sh (TASK-202). Skriptets
# LOGIK är universell (kan dupliceras till andra spokes utan refactor);
# LISTAN nedan är PROJEKT-SPECIFIK — vilka nyckelringsposter just detta
# projekts verktygskedja förväntar sig. Ett annat spoke har en annan
# verktygsstack och därmed en annan lista. Samma hub-spoke-portabilitet som
# .heartbeat-svep-policy.conf (Lesson #6, UNIVERSAL).
#
# === Duplicera till nytt spoke (2 steg) ===
# 1. cp scripts/atkomst-diagnos.sh + denna fil till nytt repo
# 2. Sätt ATKOMST_DIAGNOS_KEYCHAIN_SERVICES till det nya projektets
#    faktiska nyckelringsposter (`security dump-keychain | grep svce` för
#    att hitta dem — attribut, aldrig värden)
#
# Källa: docs/reference/atkomst-och-nycklar.md (registret denna config
# stödjer) — listan är verifierad mot faktisk nyckelring 2026-08-12
# (bygg-agenten, TASK-202, `security dump-keychain`, attribut-nivå).

# === Förväntade nyckelringsposter (tjänstenamn, "svce"-attributet) ===
# Skriptet kontrollerar bara EXISTENS ("security find-generic-password -s
# <namn>"), aldrig värdet.
ATKOMST_DIAGNOS_KEYCHAIN_SERVICES=(
    "Supabase CLI"
    "github-pat"
    "openai-api-key"
    "gh:github.com"
    "RESEND_SMTP_PASS"
    "RESEND_SMTP_PASS_PROD"
)

# === Bounded-timeout för de skarpa bevis-proven (sekunder) ===
# macOS saknar `timeout`/`gtimeout` som default (GNU coreutils, ej
# preinstallerat) — scriptet bygger sin egen bounded-runner (se
# run_bounded() i scripts/atkomst-diagnos.sh). Värdena är generösa nog för
# ett kallt nätverksanrop men korta nog att aldrig hänga en session.
ATKOMST_DIAGNOS_GH_TIMEOUT_SEC=15
ATKOMST_DIAGNOS_SUPABASE_TIMEOUT_SEC=20
