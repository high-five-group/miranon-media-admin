# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/check-backlog-closure.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears unused")
# är falskt positiv. Disable är fil-nivå och avsiktlig — samma form som
# .ci-wait-policy.conf.
#
# RADEN OVAN BÖRJAR MED "Verktyget", INTE med verktygets namn: en kommentarsrad
# vars FÖRSTA ord är verktygsnamnet tolkas som ett direktiv och fäller
# SC1072/SC1073 ("Expected '=' after directive key"). Filen gjorde precis det
# fram till TASK-90 — den är inte med i CI:s shellcheck-scope, så ingen såg det.

# .backlog-closure-policy.conf
#
# Per-projekt config för scripts/check-backlog-closure.sh.
# Skriptets LOGIK är universell (kan dupliceras till andra spokes utan
# refactor); värdena här är PROJEKT-SPECIFIKA. Samma hub-spoke-portabilitet
# som .ci-wait-policy.conf, .checklist-policy.conf, .frontmatter-policy.conf
# och .lesson-policy.conf (Lesson #6, UNIVERSAL).
#
# === Duplicera till nytt spoke (2 steg) ===
# 1. cp scripts/check-backlog-closure.sh + denna fil till nytt repo
# 2. Sätt värdena nedan till det repots faktiska statusnamn
#
# Källa: S91 femtonde resumen — TASK-77/78/82 landade gröna och stod kvar
#        som To Do tills Marcus frågade varför ingenting hände.

# === Statusen som betyder KLAR ===
# EXAKT som den står i CLI:ts `Status:`-rad, utan glyfen före.
#
# VARFÖR INGEN LISTA ÖVER "ÖPPNA" STATUSAR: en sådan lista blir en andra
# sanningskälla som driftar när verktyget får en ny status. Skriptet frågar
# därför bara "är detta Done?" — allt annat är per definition inte stängt.
# Ett första utkast bar listan `"To-Do To_Do Todo …"` och var osann direkt:
# repots faktiska status är `To Do` MED MELLANSLAG, som hade word-splittats
# till `To` + `Do` och matchat som delsträng nästan överallt.
BACKLOG_KLAR_STATUS="Done"

# === Statusar där "alla AC bockade" INTE implicerar att kortet ska stängas ===
# Blankstegsseparerad. Ett avbrutet kort kan mycket väl bära avbockade AC utan
# att någonsin bli Done — att fälla på det vore falskt rött.
# TOM ÄR ETT GILTIGT VÄRDE: detta repo har i dag inga sådana statusar, och en
# tom lista är då det ärliga värdet, inte en utelämnad rad.
BACKLOG_UNDANTAGNA_STATUSAR=""

# === Etiketten som deklarerar ett kort AVSIKTLIGT ÖPPET ===
# Ett föräldrakort kan stå öppet med flit sedan alla dess skivor är Done —
# TASK-54 och TASK-59 är båda dokumenterat avsiktliga. Utan en deklaration
# hade förälder/barn-invarianten fällt dem varje natt, och ett återkommande
# falskt larm devalverar nästa larm. Etiketten är kortets egen deklaration:
# den bor PÅ kortet, syns för den som läser det, och sätts med verktyget
# (`npx backlog task edit <id> --add-label <etikett>`).
#
# VARFÖR ETIKETT OCH INTE EN ID-LISTA HÄR: en lista över kort-ID:n i denna fil
# hade blivit en andra sanningskälla som driftar — exakt samma argument som
# står ovan för varför det inte finns någon lista över "öppna" statusar. Och
# deklarationen hade bott borta från kortet.
#
# VARFÖR OBLIGATORISK (`:?` i skriptet, inte `-` med tomt default): saknas
# värdet kan inget kort deklarera sig avsiktligt öppet, och varje avsiktligt
# öppen förälder blir ett falskt rött. Grinden fäller därför till exit 2 och
# säger vad som saknas, i stället för att gissa. Detta är den ENDA av de tre
# variablerna där tomt INTE är ett ärligt värde.
#
# NAMNVALET: engelsk kebab-case, som repots tre befintliga etiketter i
# backlog/config.yml (`ready-for-agent`, `ready-for-human`, `wontfix`).
# Matchningen i skriptet är exakt per token, aldrig delsträng — så
# `intentionally-open-tillfallig` undantar INTE ett kort.
BACKLOG_AVSIKTLIGT_OPPEN_ETIKETT="intentionally-open"

# === Karens: hur länge ett kort får ligga i det fällande tillståndet ===
# Antal TIMMAR sedan kortets senaste ändring (`Updated:`, med `Created:` som
# fallback för kort som aldrig redigerats) innan grinden får uttala sig om det.
#
# VARFÖR DEN BEHÖVS: invariant 1 fäller på "alla AC bockade + öppet status" —
# exakt det tillstånd varje bygg-agents kontrakt KRÄVER. Agenten bockar AC men
# får inte sätta Done, eftersom DoD kräver "CI grön per jobb" och den signalen
# saknas när agenten är klar. Utan karens fäller grinden på KORREKTA kort; under
# en niovåg på nio samtidigt. Lokalt är det en arbetslista, CI-wirat är det en
# falsk röd i en required check — och ett falskt larm devalverar nästa.
#
# TALET ÄR MÄTT, INTE BEDÖMT (TASK-102, 2026-07-31). Varje korts tillstånd
# rekonstruerades vid varje commit som rörde dess fil, ur git-historiken, och
# tiden från inträdet i det fällande tillståndet till stängningen mättes:
#
#   n = 91 korrekt stängda kort
#   min 0,03 h · median 0,73 h · p75 9,5 h · p90 29,6 h · max 117,7 h
#
#   svep: karens 12 h -> 20 av 91 hade fällts   (för snävt)
#         karens 19–28 h -> 11 av 91            (PLATÅ — samma utfall hela vägen)
#         karens 48 h -> 1 av 91                (grinden neutraliserad)
#
# De 11 som fälls vid 24 h är precis de två drift-händelserna i historiken
# (klumpstängningen 2026-07-23 och TASK-36.8).
#
# Marginalen räcker till BÅDA rimliga läsningar av var flygtiden slutar:
#   * största observation i nuvarande våg-regim: 9,55 h  -> 2,5× marginal
#   * största observation utanför klumpstängningarna: 14,73 h (TASK-48, stängd
#     ensam 2026-07-26)                                  -> 1,6× marginal
# Valet hänger alltså inte på vilken av gränserna man väljer, och 24 h ligger
# mitt på platån så att några timmars felskattning inte ändrar utfallet.
#
# VARFÖR INTE EN PERCENTIL: fördelningen blandar flygtid och drift. En percentil
# rakt av kalibrerar därför grinden mot precis det fel den finns för att fånga.
#
# ETT REPO UTAN TVÅSTEGSSTÄNGNING kan genuint vilja ha 0. Skriptet accepterar 0
# — men bara UTSKRIVET här, aldrig som utelämnad rad: saknas variabeln fäller
# grinden till exit 2, eftersom den farligaste konfigurationen annars hade varit
# den tysta.
#
# TIDSZON: backlog-CLI:t skriver tidsstämplarna i UTC (mätt över 12 kort
# 2026-07-31), och skriptet räknar brytpunkten med `date -u`. Karensen är därför
# exakt både lokalt och på en UTC-runner — ingen zon-skev att kompensera för.
BACKLOG_KARENS_TIMMAR="24"

# === CI-kontextens check_active_branches-avstängning (TASK-238) ===
# OPTIONELLA. Tomt/saknat = grinden beter sig precis som innan detta kort
# (ingen override, backlog/config.yml:s check_active_branches gäller rakt av).
#
# VARFÖR: backlog/config.yml har check_active_branches: true sedan TASK-93 —
# den flaggan skyddar `task create` mot ID-krockar mellan parallella
# agent-grenar och ska ALDRIG stängas av (den interaktiva kontexten rör
# grinden inte). Men grinden själv gör bara `task list` + `task <id>` och
# allokerar aldrig ett ID — flaggan skyddar ingenting där och kostar bara.
# Fem nätter i rad växte körtiden monotont (7m26s→10m15s) tills natt 08-16
# korsade timeout-minutes: 10 (cancelled).
#
# HUR: skriptet skriver en TILLFÄLLIG backlog.config.yml i projektroten
# (CLI:ts dokumenterade "ROOT_CONFIG" — se skriptets eget huvud för
# källbelägget) med check_active_branches: false, kör grinden mot den, och
# tar bort filen igen (trap … EXIT). Den riktiga backlog/config.yml rörs
# ALDRIG. Se skriptets kommentarblock vid BACKLOG_CI_STANG_AV_AKTIVA_GRENAR
# för den fullständiga research-loggen (varför inte `backlog config set`,
# varför inte en CLI-flagga).
BACKLOG_CI_STANG_AV_AKTIVA_GRENAR="true"
BACKLOG_CONFIG_YML_SOKVAG="backlog/config.yml"
