# shellcheck shell=bash
# shellcheck disable=SC2034
# Variablerna här sourcas och konsumeras av scripts/check-backlog-closure.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears unused")
# är falskt positiv. Disable är fil-nivå och avsiktlig — samma form som
# .ci-wait-policy.conf.
#
# RADEN OVAN BÖRJAR MED "Verktyget", INTE med verktygets namn: en kommentarsrad
# vars FÖRSTA ord är verktygsnamnet tolkas som ett direktiv och fäller
# SC1072/SC1073 ("Expected '=' after directive key"). Filen gjorde precis det
# fram till TASK-90 — den är inte med i CI:s shellcheck-scope, så ingen såg det.

# .backlog-closure-policy.conf
#
# Per-projekt config för scripts/check-backlog-closure.sh.
# Skriptets LOGIK är universell (kan dupliceras till andra spokes utan
# refactor); värdena här är PROJEKT-SPECIFIKA. Samma hub-spoke-portabilitet
# som .ci-wait-policy.conf, .checklist-policy.conf, .frontmatter-policy.conf
# och .lesson-policy.conf (Lesson #6, UNIVERSAL).
#
# === Duplicera till nytt spoke (2 steg) ===
# 1. cp scripts/check-backlog-closure.sh + denna fil till nytt repo
# 2. Sätt värdena nedan till det repots faktiska statusnamn
#
# Källa: S91 femtonde resumen — TASK-77/78/82 landade gröna och stod kvar
#        som To Do tills Marcus frågade varför ingenting hände.

# === Statusen som betyder KLAR ===
# EXAKT som den står i CLI:ts `Status:`-rad, utan glyfen före.
#
# VARFÖR INGEN LISTA ÖVER "ÖPPNA" STATUSAR: en sådan lista blir en andra
# sanningskälla som driftar när verktyget får en ny status. Skriptet frågar
# därför bara "är detta Done?" — allt annat är per definition inte stängt.
# Ett första utkast bar listan `"To-Do To_Do Todo …"` och var osann direkt:
# repots faktiska status är `To Do` MED MELLANSLAG, som hade word-splittats
# till `To` + `Do` och matchat som delsträng nästan överallt.
BACKLOG_KLAR_STATUS="Done"

# === Statusar där "alla AC bockade" INTE implicerar att kortet ska stängas ===
# Blankstegsseparerad. Ett avbrutet kort kan mycket väl bära avbockade AC utan
# att någonsin bli Done — att fälla på det vore falskt rött.
# TOM ÄR ETT GILTIGT VÄRDE: detta repo har i dag inga sådana statusar, och en
# tom lista är då det ärliga värdet, inte en utelämnad rad.
BACKLOG_UNDANTAGNA_STATUSAR=""

# === Etiketten som deklarerar ett kort AVSIKTLIGT ÖPPET ===
# Ett föräldrakort kan stå öppet med flit sedan alla dess skivor är Done —
# TASK-54 och TASK-59 är båda dokumenterat avsiktliga. Utan en deklaration
# hade förälder/barn-invarianten fällt dem varje natt, och ett återkommande
# falskt larm devalverar nästa larm. Etiketten är kortets egen deklaration:
# den bor PÅ kortet, syns för den som läser det, och sätts med verktyget
# (`npx backlog task edit <id> --add-label <etikett>`).
#
# VARFÖR ETIKETT OCH INTE EN ID-LISTA HÄR: en lista över kort-ID:n i denna fil
# hade blivit en andra sanningskälla som driftar — exakt samma argument som
# står ovan för varför det inte finns någon lista över "öppna" statusar. Och
# deklarationen hade bott borta från kortet.
#
# VARFÖR OBLIGATORISK (`:?` i skriptet, inte `-` med tomt default): saknas
# värdet kan inget kort deklarera sig avsiktligt öppet, och varje avsiktligt
# öppen förälder blir ett falskt rött. Grinden fäller därför till exit 2 och
# säger vad som saknas, i stället för att gissa. Detta är den ENDA av de tre
# variablerna där tomt INTE är ett ärligt värde.
#
# NAMNVALET: engelsk kebab-case, som repots tre befintliga etiketter i
# backlog/config.yml (`ready-for-agent`, `ready-for-human`, `wontfix`).
# Matchningen i skriptet är exakt per token, aldrig delsträng — så
# `intentionally-open-tillfallig` undantar INTE ett kort.
BACKLOG_AVSIKTLIGT_OPPEN_ETIKETT="intentionally-open"
