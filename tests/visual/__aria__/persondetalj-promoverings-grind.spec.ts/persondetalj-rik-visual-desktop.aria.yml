        - text: Lotta 14 juni 2026 11:20
        - paragraph: Ringde och undrade om det gick att dela upp betalningen — löste det med två delbetalningar.
    - listitem:
      - article:
        - text: Roger 2 maj 2026 18:45
        - paragraph: "Frågade om allergier inför övernattningen. Noterat: laktosintolerant."
  - text: Äldre anteckning - odaterad, ingen författare
  - paragraph: Ringde själv inför Skövde-eventet och erbjöd sig att hjälpa till med incheckningen. Har med sig två vänner som inte anmält sig ännu — stäm av platsantalet med Roger innan bekräftelsen går ut.
