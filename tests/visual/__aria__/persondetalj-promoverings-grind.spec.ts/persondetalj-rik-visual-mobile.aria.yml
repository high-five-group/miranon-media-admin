  - heading "Motiveringar" [level=2]
  - list:
    - listitem:
      - text: /Resor i medvetandet 3 \d+ september \d+ Skövde/
      - paragraph: Jag har haft egna upplevelser och läst många böcker som gjort mig förvissad om att vi alla är del av samma medvetande. Nu vill jag lära mig metoder för att ta mig till andra nivåer — och den här gången vill jag ta med mig två vänner som är nyfikna men försiktiga.
