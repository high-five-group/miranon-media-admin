# shellcheck shell=bash
# shellcheck disable=SC2034
# Variabeln här sourcas och konsumeras av scripts/lib/jq-guard.sh.
# Verktyget kan inte följa cross-file-användning, så SC2034 ("appears
# unused") slår som falskt positiv. Disable är fil-nivå och avsiktlig —
# samma form som .prod-ref-policy.conf, .supabase-cli-policy.conf m.fl.
# (Lesson #6, UNIVERSAL).

# .jq-version-policy.conf
#
# Per-projekt config för scripts/lib/jq-guard.sh. Skriptets LOGIK är
# universell (kan dupliceras till andra spokes utan refactor); VÄRDET här —
# den lägsta jq-version grind-/landningsvägen kräver — är projektspecifikt
# data. Samma konvention som .supabase-cli-policy.conf (TASK-312, S108-
# syskonfyndet i samma sveparkartläggning, 2026-08-24).
#
# === Duplicera till nytt spoke (2 steg) ===
# 1. cp scripts/lib/jq-guard.sh + denna fil till nytt repo
# 2. Sätt JQ_MIN_VERSION till den lägsta version det nya repot vill kräva
#
# === VARFÖR MINIMIVERSION OCH INTE EXAKT PIN (skillnad mot
# .supabase-cli-policy.conf) ===
#
# jq är, till skillnad från Supabase-CLI:t (npx-installerat, exakt
# pinningsbart), en SYSTEMBINÄR: Homebrew på Marcus maskin (jq-1.7.1-apple,
# verifierat `jq --version` 2026-08-24), ubuntu-latest-runnerns
# förinstallerade paket i CI — vi äger inte installationsvägen, till
# skillnad från shellcheck/actionlint/vale/lychee som CI laddar ner OCH
# SHA256-verifierar explicit (se ci.yml). Ett EXAKT-pin hade fällt varje
# miljö vars paketkälla ligger en patch-version före/efter utan att det
# faktiskt är ett problem. En MINIMIVERSION fångar den verkliga risken (en
# ANTIK jq som saknar flaggor/builtins skripten faktiskt använder) utan att
# bli en spränggrop för legitima patch-skillnader mellan Homebrew och apt.
#
# === VARFÖR 1.6 ===
#
# Grind-/landningsvägens ~25 jq-anropsställen (TASK-312-kartan) använder
# -c/-r/-n, --arg/--argjson/--slurpfile, select()/test()/tostring/
# to_entries/ltrimstr — samtliga stabila sedan jq 1.5/1.6
# (github.com/jqlang/jq, CHANGELOG). 1.6 (2018-06-14) är den äldsta
# versionen med korrekt --argjson-felhantering. Detta är en
# FUNKTIONSBASERAD floor, härledd ur vilka jq-features repot faktiskt
# använder — INTE en mätning av CI-runnerns faktiska jq-version (ingen
# CI-körning har gjorts för att fastställa den exakta siffran där), så
# talet vilar på jq:s egen dokumenterade bakåtkompatibilitet, inte på en
# mätning av vår specifika runner-image. Både Marcus maskin och den
# jq-version detta kort verifierade lokalt (1.7.1) ligger långt över
# floor.
#
# === HUR MAN UPPGRADERAR ===
#
# 1. Bumpa JQ_MIN_VERSION nedan.
# 2. Kör bash scripts/test-jq-guard.sh.
# 3. Verifiera att `jq --version` på Marcus maskin ligger på eller över det
#    nya talet innan push.

JQ_MIN_VERSION="1.6"
